<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meowtual Love - Cat Cafe + Rescue Charity</title>

    <link rel="stylesheet" type="text/css" href="css/global.css">
	<link rel="stylesheet" type="text/css" href="css/stories.css">
</head>

<body>
    <!-- Navigation -->
    <div id="navbar"></div>

    <!-- Stories Page Section -->
    <section class="stories-page" id="stories-page">
        <!-- Stories Hero -->
        <div class="stories-hero">
            <div class="stories-emoji">📖</div>
            <h1>Heartwarming <span class="highlight">Stories</span></h1>
            <p>Read about our rescue success stories, community impact, and the journeys of cats who found their forever homes.</p>
        </div>

        <!-- Featured Story -->
        <div class="featured-story-section">
            <div class="featured-story-container" id="featuredStory">
                <!-- Featured story injected here -->
            </div>
        </div>

        <!-- More Stories Grid -->
        <div class="more-stories-section">
            <div class="section-header">
                <h2 class="section-title">More <span class="highlight">Stories</span></h2>
            </div>
        
            <div class="stories-grid" id="storiesGrid">
                <!-- Story cards injected here -->
            </div>

            <div style="text-align: center; margin-top: 3rem;">
                <button class="btn-outline">Load More Stories</button>
            </div>
        </div>

        <!-- Share Story CTA -->
        <div class="share-story-section">
            <div class="share-emoji">✍️</div>
            <h2>Have a Story to Share?</h2>
            <p>If you've adopted from Meowtual Love or volunteered with us, we'd love to hear your story!</p>
            <button class="btn btn-primary" style="font-size: 1.1rem; padding: 1.2rem 2.5rem;">Share Your Story</button>
        </div>
    </section>


    <!-- Footer -->
    <div id="footer"></div>


    <script src="js/stories.js"></script>
    <script src="js/components.js"></script>
    <script>
    loadComponent("navbar", "navbar.html");    
    loadComponent("footer", "footer.html");
    </script>

</body>
</html>

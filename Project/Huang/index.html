<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Shuli Huang · Cardiac physiologist</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/navbar.css"/>
  <link rel="stylesheet" href="css/index.css"/>

</head>
<body>

  <!-- Navbar injected by JS -->

  <main>
    <!-- Hero -->
    <section class="hero">
      <div class="hero-grid"></div>
      <div class="hero-content">
        <div class="hero-eyebrow">Cardiac Physiology</div>
        <h1 class="hero-title" id="heroTitle"></h1>
        <div class="hero-divider"></div>
        <p class="hero-sub" id="heroSub"></p>
        <div class="hero-chips" id="heroChips"></div>
      </div>

    </section>

    <!-- Stats -->
    <div class="stats-bar">
      <div class="stats-inner" id="statsInner"></div>
    </div>

    <!-- News 
    <section class="content-section">
      <h2 class="section-title">Lab News</h2>
      <div class="news-list" id="newsList"></div>
    </section>
    -->

    <!-- Contact
    <section class="content-section">
      <h2 class="section-title">Contact &amp; Location</h2>
      <div class="contact-grid">
        <div class="contact-block" id="contactBlock"></div>
        <div class="map-box">
          <div class="map-inner">
            <span>🗺️</span>
            <p id="uniName"></p>
            <p style="font-size:0.85rem;opacity:0.6" id="deptName"></p>
          </div>
        </div>
      </div>
    </section>
    -->

  </main>

  <!-- Footer injected by JS -->

  <script src="data/lab.js"></script>
  <script src="js/utils.js"></script>
  <script>
    injectNavbar('about');
    injectFooter();

    // Hero
    const t = LAB.tagline;
    document.getElementById('heroTitle').innerHTML =
      t.replace('beating heart', '<em>beating heart</em>');
    document.getElementById('heroSub').textContent = LAB.mission;

    const chips = document.getElementById('heroChips');
    LAB.highlights.forEach(h => {
      const c = el('div', 'chip');
      c.innerHTML = `
      <a href="${h.link}" target="_blank">
      <span>${h.icon}</span>
      <span>${h.label}</span>`;
      chips.appendChild(c);
    });

    // News
    const nl = document.getElementById('newsList');
    LAB.news.forEach((item, i) => {
      const card = el('div', 'news-card');
      card.style.animationDelay = `${i * 0.07}s`;
      card.innerHTML = `
        <div class="news-date">${item.date}</div>
        <div>
          <div class="news-title">${item.title}</div>
          <div class="news-text">${item.body}</div>
        </div>`;
      nl.appendChild(card);
    });

    // Contact
    const cb = document.getElementById('contactBlock');
    const contacts = [
      { icon:'📍', html: LAB.address },
      { icon:'✉️', html: `<a href="mailto:${LAB.email}">${LAB.email}</a>` },
      { icon:'📞', html: LAB.phone }
    ];
    contacts.forEach(c => {
      const row = el('div', 'c-item');
      row.innerHTML = `<span class="c-icon">${c.icon}</span><span>${c.html}</span>`;
      cb.appendChild(row);
    });
    document.getElementById('uniName').textContent = LAB.university;
    document.getElementById('deptName').textContent = LAB.dept;


  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Opportunities · Ma Lab</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/navbar.css"/>
  <link rel="stylesheet" href="css/opportunity.css"/>
</head>
<body>

  <div class="page-header">
    <div class="page-header-inner">
      <h1 class="page-title">Join Us</h1>
      <p class="page-sub">Open positions &amp; how to apply.</p>
    </div>
  </div>

  <main>
    <section class="content-section">
      <p class="opp-intro" id="oppIntro"></p>

      <h2 class="section-title">Open Positions</h2>
      <div class="positions-list" id="positionsList"></div>

      <!-- Values -->
      <div class="values-section">
        <h2 class="section-title">Our Lab Values</h2>
        <div class="values-box" id="valuesBox"></div>
      </div>

      <!-- CTA -->
      <div class="cta-box">
        <div class="cta-title">Ready to make an impact?</div>
        <p class="cta-sub">Heart research saves lives. Come help us decode the language of the beating heart.</p>
        <a href="ym4@usf.edu" class="cta-email">✉️ Get in Touch</a>
      </div>
    </section>
  </main>

  <script src="data/lab.js"></script>
  <script src="js/utils.js"></script>
  <script>
    injectNavbar('opportunities');
    injectFooter();

    document.getElementById('oppIntro').textContent = LAB.oppIntro;

    // Positions
    const list = document.getElementById('positionsList');
    LAB.positions.forEach((pos, i) => {
      const card = el('div', pos.open ? 'pos-card' : 'pos-card closed');
      card.style.animationDelay = `${i * 0.08}s`;
      card.innerHTML = `
        <div class="pos-card-inner">
          <div class="pos-header">
            <span class="pos-icon">${pos.icon}</span>
            <div class="pos-title">${pos.type}</div>
            <span class="badge ${pos.open ? 'badge-green' : 'badge-muted'}">${pos.open ? 'Open' : 'Closed'}</span>
          </div>
          <p class="pos-desc">${pos.description}</p>
          ${pos.how ? `<div class="pos-how"><strong>How to apply:</strong> ${pos.how}</div>` : ''}
        </div>
        <div class="pos-bar"></div>`;
      list.appendChild(card);
    });

    // Values
    const icons = ['🔬','🤝','🌿','🎓','🌍'];
    const vbox = document.getElementById('valuesBox');
    LAB.values.forEach((v, i) => {
      const item = el('div', 'value-item');
      item.style.animationDelay = `${i * 0.07}s`;
      item.innerHTML = `<div class="value-icon">${icons[i] || '♥'}</div><span>${v}</span>`;
      vbox.appendChild(item);
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>People · Ma Lab</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/navbar.css"/>
  <link rel="stylesheet" href="css/people.css"/>
</head>
<body>

  <div class="page-header">
    <div class="page-header-inner">
      <h1 class="page-title">People</h1>
      <p class="page-sub">The minds behind the science</p>
    </div>
  </div>

  <main>
    <!-- PI -->
    <section class="content-section">
      <h2 class="section-title">Principal Investigator</h2>
      <div class="pi-card" id="piCard"></div>
    </section>

    <!-- Current Members -->
    <section class="content-section">
      <h2 class="section-title">Current Members</h2>
      <div class="people-grid" id="membersGrid"></div>
    </section>

    <!-- Alumni -->
    <section class="content-section">
      <h2 class="section-title">Alumni</h2>
      <div class="alumni-table" id="alumniTable"></div>
    </section>
  </main>

  <script src="data/lab.js"></script>
  <script src="js/utils.js"></script>
  <script>
    injectNavbar('people');
    injectFooter();

    // PI
    const pi = LAB.pi;
    const piCard = document.getElementById('piCard');
    const hasPhoto = pi.photo && pi.photo !== 'img/pi.jpg';
    piCard.innerHTML = `
      <div class="pi-avatar">${hasPhoto
        ? `<img src="${pi.photo}" alt="${pi.name}">`
        : initials(pi.name)}</div>
      <div>
        <div class="pi-name">${pi.name}</div>
        <div class="pi-role">${pi.title}</div>
        <p class="pi-bio">${pi.bio}</p>
        <div class="pi-links">
          <a href="${pi.scholar}" class="pi-link" target="_blank">ResearchGate</a>
          <a href="${pi.cv}" class="pi-link" target="_blank">CV</a>
        </div>
      </div>`;

    // Members
    const grid = document.getElementById('membersGrid');
    LAB.members.forEach((m, i) => {
      const card = el('div', 'person-card');
      card.style.animationDelay = `${i * 0.06}s`;
      const hasPhoto = m.photo && !m.photo.includes('placeholder');
      card.innerHTML = `
        <div class="person-avatar">${hasPhoto
          ? `<img src="${m.photo}" alt="${m.name}">`
          : initials(m.name)}</div>
        <div class="person-name">${m.name}</div>
        <div class="person-role">${m.role}</div>
        <div class="person-research">${m.research}</div>
        <div class="person-joined">Since ${m.joined}</div>`;
      grid.appendChild(card);
    });

    // Alumni
    const table = document.getElementById('alumniTable');
    LAB.alumni.forEach(a => {
      const row = el('div', 'alumni-row');
      row.innerHTML = `
        <div class="alumni-name">${a.name}</div>
        <div class="alumni-meta">
          <span class="tag">${a.role}</span>
          <span class="alumni-years">${a.years}</span>
        </div>
        <div class="alumni-now">${a.current}</div>`;
      table.appendChild(row);
    });
  </script>
</body>
</html>

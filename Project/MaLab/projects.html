<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Projects · Ma Lab</title>
  <link rel="stylesheet" href="css/style.css"/>
  <link rel="stylesheet" href="css/navbar.css"/>
  <link rel="stylesheet" href="css/projects.css"/>

</head>
<body>

  <div class="page-header">
    <div class="page-header-inner">
      <h1 class="page-title">Research Projects</h1>
      <p class="page-sub">Our current areas of investigation.</p>
    </div>
  </div>

  <main>
    <section class="content-section">
      <div class="projects-grid" id="projectsGrid"></div>
    </section>
  </main>

  <script src="data/lab.js"></script>
  <script src="js/utils.js"></script>
  <script>
    injectNavbar('projects');
    injectFooter();

    const grid = document.getElementById('projectsGrid');

    LAB.projects.forEach((proj, i) => {
      const card = el('div', 'project-card');
      card.style.animationDelay = `${i * 0.09}s`;
      card.innerHTML = `
        <div class="proj-stripe"></div>
        <div class="proj-body">
          <div class="proj-header">
            <div>
              <div class="proj-title">${proj.title}</div>
              <div class="proj-meta">
                <span class="badge ${proj.status === 'Active' ? 'badge-green' : 'badge-muted'}">${proj.status}</span>
                <span class="proj-funding">${proj.funding}</span>
              </div>
            </div>
          </div>
          <p class="proj-summary">${proj.summary}</p>
          <div class="proj-approaches" id="proj-acc-${i}">
            <div class="proj-approaches-toggle" onclick="toggleApproaches(${i})">
              Key Approaches
              <span class="toggle-arrow">▼</span>
            </div>
            <div class="approaches-body">
              <ul class="approaches-list">
                ${proj.approaches.map(a => `<li>${a}</li>`).join('')}
              </ul>
            </div>
          </div>
        </div>`;
      grid.appendChild(card);
    });

    function toggleApproaches(i) {
      const acc = document.getElementById(`proj-acc-${i}`);
      acc.classList.toggle('open');
    }
  </script>
</body>
</html>

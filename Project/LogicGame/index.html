  layer.appendChild(el); el.addEventListener("animationend", () => el.remove());
}
function dmPool(ev) {
  const ch = chapterById(playCh || save.chapter);
  return (DATA.danmaku[ev] || []).concat(((ch && ch.danmaku) || {})[ev] || []);
}
function dmEvent(ev, ctx = {}, tone = "", n = 1) {
  const list = dmPool(ev); if (!list.length) return;
  for (let i = 0; i < n; i++) setTimeout(() => dm(rnd(list).replace(/\{fallacy\}/g, ctx.fallacy || ""), tone), i * 380 + Math.random() * 250);
}
const startAmbient = () => { stopAmbient(); ambient = setInterval(() => { if (screen === "match" || screen === "boss") dmEvent("ambient"); }, 4200); };
const stopAmbient = () => { clearInterval(ambient); ambient = null; };

// ───────── 计时器（对辩的每回合 / Boss 的整场），支持暂停 ─────────
const Timer = { id: null, deadline: 0, total: 0, onEnd: null, urgent: 5000, lastTick: 99, left: 0 };
function tickTimer() {
  const box = $("#timer"); if (!box) return stopTimer();
  const left = Timer.deadline - Date.now();
  box.firstElementChild.style.width = Math.max(0, (left / Timer.total) * 100) + "%";
  box.classList.toggle("urgent", left <= Timer.urgent);
  const sec = Math.ceil(left / 1000);
  if (left <= Timer.urgent && sec !== Timer.lastTick) { Timer.lastTick = sec; Sfx.tick(); }
  if (left <= 0) { const f = Timer.onEnd; stopTimer(); if (f) f(); }
}
function startTimer(seconds, onEnd, urgentSec = 5) {
  stopTimer();
  Timer.total = seconds * 1000; Timer.deadline = Date.now() + Timer.total; Timer.onEnd = onEnd;
  Timer.urgent = urgentSec * 1000; Timer.lastTick = 99; Timer.id = setInterval(tickTimer, 100);
}
function stopTimer() { clearInterval(Timer.id); Timer.id = null; Timer.left = 0; const b = $("#timer"); if (b) b.classList.remove("urgent"); }
function pauseTimer() { if (!Timer.id) return; Timer.left = Timer.deadline - Date.now(); clearInterval(Timer.id); Timer.id = null; }
function resumeTimer() { if (Timer.id || !Timer.left) return; Timer.deadline = Date.now() + Timer.left; Timer.left = 0; Timer.id = setInterval(tickTimer, 100); }

// ───────── 破绽簿收录 + 解释卡片 ─────────
function capture(f) {
  if (!f || save.captured[f.id]) return false;
  save.captured[f.id] = Date.now(); newly.push(f.id); persist(); return true;
}
// mode: 'hit' 识破 | 'caught' 被对手识破 | 'wrong' 喊错；boss=true 时失误是“失去一颗心”而不是“对手得分”
function explain({ stmt, mode, ev, boss }) {
  return new Promise((res) => {
    const f = stmt.fallacy ? IDX.fal[stmt.fallacy] : null;
    const chosen = ev && ev.chosen ? IDX.fal[ev.chosen] : null;
    const altOk = mode === "hit" && f && chosen && chosen.id !== f.id;       // 选的是“也算对”的备选答案
    const isNew = (mode === "hit" || mode === "caught") && capture(altOk ? chosen : f);
    const penalty = boss ? "失去 1 颗 ❤️" : "对手 +1 分";
    const badges = [];
    let title, sub = "";
    if (mode === "hit") {
      title = "识破！"; badges.push(`<span class="chip gold">${boss ? "找到 1 处" : "+1 分"}</span>`);
      if (ev && ev.bonus) badges.push(`<span class="chip gold">连环破 +1 分</span>`);
      if (altOk) sub = `你选的「${esc(chosen.zh)}」也说得通：这句话同时有两个问题。最贴切的是「${esc(f.zh)}」。`;
    } else if (mode === "caught") { title = "你被识破了"; badges.push(`<span class="chip red">${penalty}</span>`); }
    else if (!f) { title = "这句话没有问题"; badges.push(`<span class="chip red">${penalty}</span>`); }
    else {
      title = "名字选错了"; badges.push(`<span class="chip red">${penalty}</span>`);
      sub = `你选的是「${esc(IDX.fal[ev.chosen].zh)}」，更贴切的是「${esc(f.zh)}」。`;
    }
    if (isNew) badges.push(`<span class="chip red">收进破绽簿</span>`);
    pauseTimer();
    showSheet(`<div class="explain">
      <div class="head"><div class="big">${f ? f.emoji : "👌"}</div>
        <div><h3>${title}</h3><div class="en">${f ? esc(fullName(f)) : "合理的论证"}</div></div></div>
      <div class="badges">${badges.join("")}</div>
      <blockquote>${esc(stmt.text)}</blockquote>
      ${sub ? `<p>${sub}</p>` : ""}
      <p>${esc(stmt.explain)}</p>
      ${mode === "hit" && stmt.quip ? `<p class="quip">「${esc(stmt.quip)}」</p>` : ""}
      ${f ? `<p class="tip">💡 ${esc(f.tip)}</p>` : ""}
      <button class="btn primary" data-act="continue">继续</button></div>`, { cls: "explain-sheet" });
    $("[data-act=continue]").addEventListener("click", () => { closeSheet(); resumeTimer(); res(); }, { once: true });
  });
}

/* ===== 40-scene.js ===== */
/* 40-scene.js · 剧情播放器：角色头像 + 对话框，逐字显示，轻点继续，可跳过。
 * 剧情数据格式（content/chapters/*）：[{ who: 角色id（不写=旁白）, mood: 表情, say: 台词 }, ...] */
function playScene(lines) {
  if (!lines || !lines.length) return Promise.resolve();
  return new Promise((resolve) => {
    const el = document.createElement("div");
    el.className = "scene-wrap";
    el.innerHTML = `<button class="scene-skip" data-scene="skip">跳过</button>
      <div class="scene-stage"></div>
      <div class="dialog"><div class="nm"></div><div class="tx"></div><div class="more">轻点继续 ▾</div></div>`;
    app.appendChild(el);
    const stage = $(".scene-stage", el), nm = $(".nm", el), tx = $(".tx", el), dialog = $(".dialog", el);
    let i = -1, typing = null, full = "", closed = false;

    const end = () => { if (closed) return; closed = true; clearTimeout(typing); el.remove(); resolve(); };
    function show(n) {
      const L = lines[n], who = L.who ? IDX.chars[L.who] : null;
      dialog.classList.toggle("narr", !who);
      stage.innerHTML = who ? `<div class="scene-av">${avatar(who, L.mood || "neutral")}</div>` : "";
      nm.textContent = who ? who.name : "";
      full = L.say; tx.textContent = ""; let k = 0;
      clearTimeout(typing);
      const step = () => { k++; tx.textContent = full.slice(0, k); typing = k < full.length ? setTimeout(step, 24) : null; };
      typing = setTimeout(step, 24);
      Sfx.page();
    }
    function advance() {
      if (typing) { clearTimeout(typing); typing = null; tx.textContent = full; return; }   // 正在逐字显示：先补全
      i++;
      if (i >= lines.length) return end();
      show(i);
    }
    el.addEventListener("click", (e) => { if (e.target.closest("[data-scene=skip]")) return end(); advance(); });
    advance();
  });
}

/* ===== 50-match.js ===== */
/* 50-match.js · 对辩流程：对手发言 → 你「且慢」或回应 → 对手可能识破你 → 下一回合。 */
const pips = (n) => Array.from({ length: curG.target_points }, (_, i) => `<span class="pip ${i < n ? "on" : ""}">🏮</span>`).join("");

// opt: { overrides: 本关规则, hints: 是否显示提示弹幕 }
function startMatch(topicId, sideChoice, diff, opt = {}) {
  lastSetup = { id: topicId, sideChoice, diff, opt };
  const side = sideChoice === "random" || sideChoice === "rand" ? (Math.random() < 0.5 ? "A" : "B") : sideChoice;
  curG = Object.assign({}, G0, opt.overrides || {});

  M = Engine.create(DATA, { topicId, mySide: side, difficulty: diff, overrides: opt.overrides });
  B = null; newly = []; busy = true; token++; screen = "match"; closeSheet();
  playCh = curLevel ? curLevel.chapter : M.topic.chapter;
  applyChapter(chapterById(playCh));
  const o = M.opponent;
  mount(`
    <div class="hud">
      <button class="iconbtn" data-act="leave" aria-label="退出对局">✕</button>
      <div class="score">
        <div class="side"><div class="pips" id="pipsMe"></div><span>你 · ${esc(M.topic.sides[M.mySide])}</span></div>
        <span class="vsmark">对</span>

      </div>

    </div>
    <div class="stage"><div class="avatar" id="avatar"></div>
      <div class="who"><b>${esc(o.name)}</b><small>${esc(o.title)}</small>
        <div class="meta">“${esc(o.catchphrase)}”</div>
        <div class="bar"><i id="barfill"></i></div>

    <div class="timer" id="timer"><i></i></div>
    <div class="dock lock" id="dock"></div>`, "match");
  setMood("neutral"); updateHUD(); startAmbient();

}
function updateHUD() {
  const S = M.state;
  $("#pipsMe").innerHTML = pips(S.me); $("#pipsOpp").innerHTML = pips(S.opp);
  const pct = Math.round(50 + S.bar / 2);
  $("#barfill").style.width = pct + "%"; $("#barpct").textContent = `现场观众 ${100 - pct} : ${pct}`;
}
function setMood(m, hit) {
  const a = $("#avatar"); const who = M ? M.opponent : B ? B.speaker : null; if (!a || !who) return;
  a.innerHTML = avatar(who, m);
  if (hit) { a.classList.remove("hit"); void a.offsetWidth; a.classList.add("hit"); }
}

// 聊天区
const chatEl = () => $("#chat");
const scrollChat = () => { const c = chatEl(); if (c) requestAnimationFrame(() => { c.scrollTop = c.scrollHeight; }); };
function push(html, cls) { const el = document.createElement("div"); el.className = cls; el.innerHTML = html; chatEl().appendChild(el); scrollChat(); return el; }
const replyText = (o) => (o.repeat ? "再强调一遍：" : "") + o.text;     // 合理发言用完后，重提自己说过的观点
const bubble = (who, st) => { const el = push(`<div class="bubble"><span class="txt">${esc(who === "me" ? replyText(st) : st.text)}</span></div>`, `msg ${who}`); Sfx.pop(); return el; };
const aside = (html) => push(html, "aside");
const chipOn = (el, html, cls = "red") => { const c = document.createElement("span"); c.className = "chip " + cls; c.innerHTML = html; el.appendChild(c); scrollChat(); };
const strike = (el) => el.querySelector(".bubble").classList.add("struck");
const say = (kind) => { const l = M.botLine(kind); if (l) aside(`<b>${esc(M.opponent.name)}</b>：${esc(l)}`); };
async function wait(ms) { const m = M; await sleep(ms); return M === m; }     // 等待期间如果退出了对局，返回 false

let curBubble = null, curOpts = [];
function showDock(opts) {
  const d = $("#dock");
  d.innerHTML = (opts.length
    ? opts.map((o, i) => `<button class="opt" data-act="reply" data-i="${i}"><span class="fire">${"🔥".repeat(Engine.punchOf(o))}</span><span>${esc(replyText(o))}</span></button>`).join("")
    : `<div class="empty">你已经没有可用的回应，只能指出对方的问题。</div>`) +
    `<button class="callbtn" data-act="call">${esc(TXT.call_button)}</button>`;
  d.classList.remove("lock");
}
const lockDock = () => { const d = $("#dock"); if (d) d.classList.add("lock"); };

async function nextRound() {
  const m = M, my = ++token, S = M.state;
  busy = true;
  const s = M.nextOpponent();
  if (!s) return finishMatch();
  updateHUD(); push(`第 ${S.round} 回合`, "roundmark");
  if (S.round === 1) { say("open"); if (!(await wait(500))) return; }
  const ty = push("<i></i><i></i><i></i>", "typing");
  if (!(await wait(650))) return; ty.remove();
  if (M !== m || my !== token) return;
  curBubble = bubble("opp", s);
  setMood(s.fallacy ? "smug" : "neutral");
  curOpts = M.options(); showDock(curOpts);
  busy = false; startTimer(curG.turn_seconds, onTimeout);
  if (hintsOn) {      // 提示弹幕：只透露“哪一类”，不直接给答案
    setTimeout(() => {
      if (M !== m || token !== my || busy) return;
      dmEvent(s.fallacy ? "opp_fallacy" : "opp_sound", { fallacy: s.fallacy ? FAMILY[IDX.fal[s.fallacy].family] : "" }, "gold");
    }, 3500);
  }
}
async function afterRound() {
  if (!M) return;
  updateHUD();
  if (M.state.over) return finishMatch();
  await nextRound();
}

async function doReply(i) {
  if (busy) return; busy = true; stopTimer(); lockDock();
  const m = M, stmt = curOpts[i], oppStmt = M.state.current, oppBubble = curBubble;
  const mine = bubble("me", stmt);
  const ev = M.playerReply(stmt); updateHUD();
  if (oppStmt.fallacy) { const f = IDX.fal[oppStmt.fallacy]; chipOn(oppBubble, `漏掉了：${f.emoji} ${f.zh}`, "red"); }
  if (!(await wait(800))) return;
  if (ev.botCalled && ev.botCorrect) {
    await objection(TXT.stamp_bot, "opp"); if (M !== m) return;
    strike(mine); const f = IDX.fal[stmt.fallacy]; chipOn(mine, `${f.emoji} ${f.zh}`, "gold");
    setMood("smug"); dmEvent("bot_hit", { fallacy: f.zh }, "red", 2);
    await explain({ stmt, mode: "caught", ev }); if (M !== m) return;
  } else if (ev.botCalled) {
    await objection(TXT.stamp_bot, "opp"); if (M !== m) return;
    aside(`<b>裁判</b>：这句话没有问题，对手误判了。你得 1 分。`);
    Sfx.good(); setMood("flustered", true); dmEvent("call_miss", {}, "jade", 2);
    if (!(await wait(900))) return;
  } else if (stmt.fallacy) {
    const f = IDX.fal[stmt.fallacy]; chipOn(mine, `蒙混过关：${f.emoji} ${f.zh}`, "gold");
    dmEvent("bot_miss", {}, "gold", 2); setMood("neutral");
    if (!(await wait(700))) return;
  } else {
    setMood("flustered", true); Sfx.good();

}

function openCall() {
  if (busy) return;

  showSheet(`<h3>这句话的问题是？</h3><div class="sub">选出最贴切的名称。选错，或者这句话没问题，对手得 1 分。</div>

    <button class="btn ghost" style="width:100%" data-act="closeSheet">再想想</button>`, { closeable: true });
}
async function doCall(fid) {
  if (busy) return; busy = true; stopTimer(); closeSheet(); lockDock();
  const m = M, s = M.state.current, bub = curBubble;
  const ev = M.playerCall(fid); updateHUD();
  if (ev.correct) {

    strike(bub); chipOn(bub, `${f.emoji} ${f.zh}`, "gold"); setMood("flustered", true); Sfx.good();
    say("caught"); dmEvent("call_hit", { fallacy: f.zh }, "jade", 3);

}
async function onTimeout() {
  if (busy || !M) return; busy = true; closeSheet(); lockDock();
  const m = M, s = M.state.current; M.timeout(); updateHUD();
  Sfx.bad(); aside("⏰ 时间到，你没来得及回应。"); setMood("smug");
  if (s.fallacy) { const f = IDX.fal[s.fallacy]; chipOn(curBubble, `漏掉了：${f.emoji} ${f.zh}`, "red"); }

// 对局结束：记录星级与印章 → 播放结束剧情 → 结算页
async function finishMatch() {
  stopTimer(); stopAmbient(); token++;
  const m = M, sum = M.summary(), lv = curLevel;

  const res = lv ? recordLevel(lv, sum.stars) : { stars: 0, firstClear: false, seal: null };
  persist();
  await sleep(500); if (M !== m) return;
  if (lv) { await playAfter(lv, sum.won, res.firstClear); if (M !== m) return; }
  resultScreen({
    won: sum.won, draw: sum.draw, level: lv, res, stars: sum.stars, who: m.opponent,
    scoreLine: `${sum.me} : ${sum.opp}`, review: sum.review, title: m.topic.title,
    quote: m.botLine(sum.won ? "lose" : "win"),

    callCount: sum.correctCalls,
  });
}

/* ===== 60-boss.js ===== */
/* 60-boss.js · Boss 关：对手一口气说完一段演讲，你在限时内点出有破绽的句子并选对名字。
 * 点错（名字不对，或这句其实没问题）失去一颗心；心用完或时间到就输。 */
let bossSel = -1;

const heartsHTML = () => { const left = B.hearts(), max = B.state.maxWrong; return "❤️".repeat(left) + "🖤".repeat(max - left); };
function updateBossHUD() {
  $("#hearts").innerHTML = heartsHTML();
  $("#found").textContent = `${B.state.found}/${B.state.total}`;
}

function startBoss(lv) {
  const sp = SPEECHES[lv.speech];
  B = Engine.createSpeech(DATA, sp.id, {});
  M = null; newly = []; busy = false; token++; screen = "boss"; closeSheet(); bossSel = -1;
  curG = G0; hintsOn = false;
  playCh = lv.chapter; applyChapter(chapterById(playCh));
  const o = B.speaker;
  mount(`
    <div class="hud">
      <button class="iconbtn" data-act="leave" aria-label="退出">✕</button>
      <div class="score">
        <div class="side"><div class="hearts" id="hearts"></div><span>你的容错</span></div>
        <span class="vsmark">破</span>
        <div class="side"><b class="foundn" id="found"></b><span>已找到破绽</span></div>
      </div>
      <button class="iconbtn" data-act="settings" aria-label="设置">⚙</button>
    </div>

      <div class="who"><b>${esc(o.name)}</b><small>${esc(o.title)}</small>
        <div class="meta">${esc(sp.title)}</div>

    <div class="dm-layer" id="dm"></div>
    <div class="timer" id="timer"><i></i></div>
    <div class="speech" id="speech">
      <div class="aside">${esc(sp.intro)}</div>
      ${B.sentences.map((s, i) => `<button class="sent" data-act="sent" data-i="${i}"><span class="no">${i + 1}</span><span class="body"><span class="tx">${esc(s.text)}</span><span class="tags"></span></span></button>`).join("")}
    </div>
    <div class="dock"><div class="empty">点击你觉得有问题的句子 · 点错会失去一颗心</div></div>`, "match boss");
  setMood("smug"); updateBossHUD(); startAmbient();
  startTimer(sp.time_limit, onBossTimeout, 10);
}

function openSentence(i) {
  if (busy || !B || B.state.over || B.state.solved[i]) return;
  bossSel = i;
  $$(".sent").forEach((c) => c.classList.toggle("sel", +c.dataset.i === i));
  const opts = B.callOptions(i);
  showSheet(`<h3>第 ${i + 1} 句的问题是？</h3><div class="sub">选出最贴切的名称。选错，或者这句其实没问题，会失去一颗心。</div>
    ${opts.map((id) => { const f = IDX.fal[id]; return `<button class="callopt" data-act="spick" data-f="${id}"><span class="em">${f.emoji}</span><span><b>${f.zh}</b><small>${esc(f.en)}</small></span></button>`; }).join("")}
    <button class="btn ghost" style="width:100%" data-act="closeSheet">再想想</button>`, { closeable: true });
}
function markSentence(i, kind) {
  const card = $(`.sent[data-i="${i}"]`); if (!card || card.dataset.done) return;
  card.dataset.done = "1"; card.classList.remove("sel"); card.classList.add(kind);
  const s = B.sentences[i], f = s.fallacy ? IDX.fal[s.fallacy] : null, tags = $(".tags", card);
  const chip = kind === "hit" ? `<span class="chip gold">${f.emoji} ${f.zh}</span>`
    : kind === "missed" ? `<span class="chip red">其实是：${f.emoji} ${f.zh}</span>`
    : `<span class="chip">✓ 这句没问题</span>`;
  tags.innerHTML = chip;
}

async function doGuess(fid) {
  if (busy || !B) return; busy = true; closeSheet(); pauseTimer();
  const b = B, i = bossSel, ev = b.guess(i, fid);
  if (!ev) { busy = false; resumeTimer(); return; }
  updateBossHUD();
  const s = ev.stmt, f = s.fallacy ? IDX.fal[s.fallacy] : null;
  if (ev.correct) {
    await objection(TXT.stamp_call); if (B !== b) return;
    markSentence(i, "hit"); setMood("flustered", true); Sfx.good(); dmEvent("call_hit", { fallacy: f.zh }, "jade", 3);
    await explain({ stmt: s, mode: "hit", ev, boss: true });
  } else {
    await objection(TXT.stamp_reject, "no"); if (B !== b) return;
    markSentence(i, f ? "missed" : "clean"); setMood("smug"); dmEvent("call_miss", {}, "red", 2);
    await explain({ stmt: s, mode: "wrong", ev, boss: true });
  }
  if (B !== b) return;
  busy = false;
  if (b.state.over) finishBoss(); else resumeTimer();
}
function onBossTimeout() {
  if (!B || B.state.over) return;
  closeSheet(); B.finish("time"); updateBossHUD(); finishBoss();
}

async function finishBoss() {
  stopTimer(); stopAmbient(); token++;
  const b = B, sum = b.summary(), lv = curLevel, sp = b.speech;
  b.sentences.forEach((s, i) => { if (b.state.solved[i] === "missed") markSentence(i, "missed"); });   // 揭晓没找到的
  save.matches++; if (sum.won) save.wins++;
  applyStats(sum.stats);
  const res = recordLevel(lv, sum.stars); persist();
  sum.won ? Sfx.good() : Sfx.bad();
  await sleep(1500); if (B !== b) return;
  await playAfter(lv, sum.won, res.firstClear); if (B !== b) return;
  const o = b.speaker, line = (o.lines && o.lines[sum.won ? "lose" : "win"]) || [];
  resultScreen({
    won: sum.won, level: lv, res, stars: sum.stars, who: o, boss: true,
    scoreLine: `${sum.found}/${sum.total}`, review: sum.review, title: sp.title,
    quote: line.length ? rnd(line) : "",
    facts: [{ n: sum.found, label: "找到破绽" }, { n: sum.mistakes, label: "失误" }, { n: b.hearts(), label: "剩余的心" }],
  });
}

  $$(".seg").forEach((seg) => $$("button", seg).forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.v === setup[seg.dataset.seg]))));
  const vs = $("#vs"); if (!vs) return;
  const t = IDX.topics[setup.id];
  if (setup.side === "rand") { vs.innerHTML = `<div class="meta" style="margin:0">立场和对手由抽签决定</div>`; return; }
  const o = IDX.chars[t.opponents[setup.side === "A" ? "B" : "A"]];
  vs.innerHTML = `<div class="av">${avatar(o, "smug")}</div><div><b>${esc(o.name)}</b><div class="meta" style="margin:0">${esc(o.title)}<br>“${esc(o.catchphrase)}”</div></div>`;
}
function openSetup(id) {
  const t = IDX.topics[id]; setup.id = id;
  showSheet(`<div class="setup"><h3>${esc(t.title)}</h3><div class="sub">${esc(t.scene)}</div>
    <div class="lbl">你的立场</div>
    <div class="seg" data-seg="side"><button data-v="A">${esc(t.sides.A)}</button><button data-v="B">${esc(t.sides.B)}</button><button data-v="rand">随机</button></div>
    <div class="lbl">对手的认真程度</div>
    <div class="seg" data-seg="diff">${CFG.bot.difficulty.map((d) => `<button data-v="${d.id}">${d.name}</button>`).join("")}</div>
    <div class="vs" id="vs"></div>
    <button class="btn primary big" style="width:100%;margin-top:16px" data-act="start">开始辩论</button></div>`, { closeable: true });
  syncSeg();
}

// ───────── 破绽簿 + 印章册 ─────────
let dexTab = "flaws";
function dex(tab) {
  if (tab) dexTab = tab;
  screen = "dex"; closeSheet(); applyChapter(curChapter());
  const total = DATA.fallacies.length, got = Object.keys(save.captured).length;
  const tabs = `<div class="tabs"><button data-act="dextab" data-v="flaws" aria-pressed="${dexTab === "flaws"}">破绽 ${got}/${total}</button>
    <button data-act="dextab" data-v="seals" aria-pressed="${dexTab === "seals"}">印章 ${sealsCount()}/${CHAPTERS.length + SOON.length}</button></div>`;
  let body;
  if (dexTab === "flaws") {
    const weakList = DATA.fallacies.map((f) => ({ f, s: save.stats[f.id] || { hit: 0, miss: 0 } }))
      .filter((x) => x.s.miss >= 2 && x.s.miss > x.s.hit).sort((a, b) => b.s.miss - b.s.hit - (a.s.miss - a.s.hit)).slice(0, 3);
    const weakIds = new Set(weakList.map((x) => x.f.id));
    body = `<p class="meta" style="padding:0 16px;margin:0 0 6px">在对局里识破一次（或被识破一次），就会收进破绽簿。点开任何一项都可以学习。</p>
      ${weakList.length ? `<div class="weak-block"><b>你的薄弱点</b>：${weakList.map((x) => `${x.f.emoji}${x.f.zh}（漏掉 ${x.s.miss} 次）`).join("、")}。</div>` : ""}
      ${Object.keys(FAMILY).map((k) => {
        const list = DATA.fallacies.filter((f) => f.family === k), g = list.filter((f) => save.captured[f.id]).length;
        return `<div class="dex-fam"><span>${FAMILY[k]}</span><small>${g}/${list.length}</small></div><div class="dex-grid">${
          list.map((f) => `<button class="tile ${save.captured[f.id] ? "got" : "locked"} ${weakIds.has(f.id) ? "weak" : ""}" data-act="fdetail" data-id="${f.id}"><span class="em">${f.emoji}</span><b>${f.zh}</b></button>`).join("")}</div>`;
      }).join("")}`;
  } else {
    body = `<p class="meta" style="padding:0 16px;margin:0 0 10px">通关每一章的 Boss 得到印章；该章所有关卡都达到 ★★，升级为金印。</p>
      <div class="seal-grid">${CHAPTERS.map((c) => `<button class="sealcell" data-act="sealinfo" data-id="${c.id}">${sealHTML(c.keepsake.glyph, save.seals[c.id])}<b>${esc(c.keepsake.name)}</b><small>第 ${c.order} 章 · ${esc(c.name)}</small></button>`).join("")}
        ${SOON.map((r) => `<button class="sealcell" data-act="soon" data-id="${r.id}">${sealHTML(r.glyph, null)}<b>？</b><small>第 ${r.order} 章 · ${esc(r.name)}</small></button>`).join("")}</div>`;
  }
  mount(`<div class="topbar"><button class="iconbtn" data-act="home" aria-label="返回">←</button><h2>破绽簿</h2></div>${tabs}
    <div class="scroll" style="flex:1;padding-bottom:28px">${body}</div>`);
}
function fdetail(id) {
  const f = IDX.fal[id], s = save.stats[id] || { hit: 0, miss: 0 };
  showSheet(`<div class="explain"><div class="head"><div class="big">${f.emoji}</div><div><h3>${f.zh}</h3><div class="en">${esc(fullName(f).replace(f.zh, "").replace(/^（|）$/g, ""))}</div></div></div>
    <div class="badges"><span class="chip">${FAMILY[f.family]}</span>${save.captured[id] ? `<span class="chip gold">已收录</span>` : `<span class="chip">未遇见</span>`}${s.hit + s.miss ? `<span class="chip">识破 ${s.hit} · 漏掉 ${s.miss}</span>` : ""}</div>
    <p>${esc(f.def)}</p><blockquote>${esc(f.example)}</blockquote>${f.example_reply ? `<p>👉 示范回应：${esc(f.example_reply)}</p>` : ""}<p class="tip">💡 ${esc(f.tip)}</p>
    <button class="btn primary" data-act="closeSheet">好的</button></div>`, { closeable: true });
}
function sealInfo(id) {
  const ch = chapterById(id), tier = save.seals[id];
  const status = tier === "gold" ? "金印 · 所有关卡都达到了 ★★" : tier === "red" ? "已获得。所有关卡达到 ★★ 可升级为金印" : "通关本章最后一关获得";
  showSheet(`<div class="explain seal-detail"><div class="bigseal">${sealHTML(ch.keepsake.glyph, tier)}</div>
    <h3>${esc(ch.keepsake.name)}</h3><div class="en">第 ${ch.order} 章 · ${esc(ch.name)}</div>
    <p>${tier ? esc(ch.keepsake.blurb) : "还没有获得这枚印章。"}</p><div class="badges" style="justify-content:center"><span class="chip ${tier ? "gold" : ""}">${status}</span></div>
    <button class="btn primary" data-act="closeSheet">好的</button></div>`, { closeable: true });
}
function sealRewardSheet(seal) {
  const k = seal.chapter.keepsake;
  showSheet(`<div class="explain seal-detail"><h3>${seal.upgraded ? "印章升级为金印！" : "获得印章！"}</h3>
    <div class="bigseal pop">${sealHTML(k.glyph, seal.tier)}</div><b>${esc(k.name)}</b>
    <p>${esc(k.blurb)}</p><button class="btn primary" data-act="closeSheet">收下</button></div>`, { cls: "seal-sheet" });
  Sfx.seal();
}

// ───────── 玩法与设置 ─────────
function help() {
  showSheet(`<div class="help"><h3>怎么玩</h3><ol>
    <li>故事分成章节，每章几关，最后一关是 Boss。通关一关才能玩下一关，通关 Boss 开启下一章。</li>
    <li><b>对辩：</b>对手每回合说一句话，它可能藏着破绽。觉得有问题，点「${esc(TXT.call_button)}」，选出破绽的名字，得 1 分；选错，或者这句话其实没问题，对手得 1 分。</li>
    <li>觉得没问题，就从三条回应里选一条。🔥 越多气势越强，但含破绽的话可能被对手识破。先拿到 ${G0.target_points} 分获胜，每回合限时 ${G0.turn_seconds} 秒。</li>
    <li><b>Boss：</b>对手说完一整段话，你在限时内点出有破绽的句子，选对名字。点错失去一颗心，心用完就输。</li>
    <li><b>星级：</b>赢了 ★，失误不超过 2 次 ★★，零失误 ★★★。每章所有关卡达到 ★★，印章升级为金印。</li>
    <li>遇到过的破绽，都会收进「破绽簿」，随时可以回去复习。</li></ol>
    <button class="btn primary" style="width:100%;margin-top:8px" data-act="closeSheet">明白了</button></div>`, { closeable: true });
}
function settings() {
  const t = (k, label) => `<div class="row"><span>${label}</span><button class="toggle" data-act="tog" data-k="${k}" aria-pressed="${save.settings[k]}" aria-label="${label}"></button></div>`;
  showSheet(`<h3>设置</h3>${t("sound", "音效")}${t("danmaku", "弹幕")}
    <div class="row"><span>清除所有进度</span><button class="btn" data-act="reset">清除</button></div>
    <button class="btn primary" style="width:100%;margin-top:10px" data-act="closeSheet">完成</button>`, { closeable: true });
}

// ───────── 结算页（对辩与 Boss 共用）─────────
let lastResult = null;
function nextAfter(lv) {            // 通关后“下一步”去哪里
  const ch = chapterById(lv.chapter);
  if (lv.index < ch.levels.length - 1) return { kind: "level", id: ch.levels[lv.index + 1].id };
  const ci = CHAPTERS.indexOf(ch);
  if (ci < CHAPTERS.length - 1) return { kind: "chapter", id: CHAPTERS[ci + 1].id, name: CHAPTERS[ci + 1].name };
  return { kind: "end" };
}
function resultScreen(info) {
  screen = "result"; closeSheet(); applyChapter(chapterById(playCh));
  lastResult = info;
  const W = info.won, lv = info.level, res = info.res || {};
  const outcome = { passed: "你没有指出", mislabeled: "你选错了名称", timeout: "你超时了", caught: "被对手识破", missed: "你没找到" };
  const seen = new Set(), items = [];
  info.review.forEach((r) => { if (!seen.has(r.stmt.text)) { seen.add(r.stmt.text); items.push(r); } });
  const rv = items.slice(0, 6).map((r) => {
    const f = IDX.fal[r.stmt.fallacy];
    return `<div class="review-item"><span class="chip red">${f.emoji} ${f.zh}</span> <span class="chip">${r.who === "me" ? "你说的" : info.boss ? "演讲里的" : "对手说的"} · ${outcome[r.outcome]}</span>
      <div class="q">${esc(r.stmt.text)}</div><div>${esc(r.stmt.explain)}</div></div>`;
  }).join("");
  let btns = "", note = "";
  if (lv) {
    if (W) {
      const nx = nextAfter(lv);
      const primary = nx.kind === "level" ? `<button class="btn primary" data-act="gonext" data-id="${nx.id}">下一关</button>`
        : nx.kind === "chapter" ? `<button class="btn primary" data-act="open" data-id="${nx.id}">前往下一章：${esc(nx.name)}</button>`
        : `<button class="btn primary" data-act="map">回到关卡</button>`;
      if (nx.kind === "end") note = `<div class="block"><b>故事暂告一段落。</b><div class="meta">${SOON.length ? "更多章节即将到来：" + SOON.map((r) => esc(r.name)).join("、") : "更多内容即将到来。"}</div></div>`;
      btns = `<div class="btns">${primary}</div><div class="btns"><button class="btn" data-act="retry">再战一次</button><button class="btn" data-act="map">返回关卡</button></div>`;
    } else {
      btns = `<div class="btns"><button class="btn primary" data-act="retry">再试一次</button><button class="btn" data-act="map">返回关卡</button></div>`;
    }
  } else {
    btns = `<div class="btns"><button class="btn primary" data-act="retry">再来一局</button><button class="btn" data-act="topics">换话题</button></div>
      <div class="btns"><button class="btn" data-act="share">复制战绩</button><button class="btn" data-act="home">回首页</button></div>`;
  }
  mount(`
    <div class="av">${avatar(info.who, W ? "defeated" : "smug")}</div>
    <h2 class="verdict ${W ? "win" : "lose"}">${W ? "通关！" : info.draw ? "平局" : "惜败"}</h2>
    ${lv ? `<div class="starrow">${[1, 2, 3].map((n) => `<span class="bigstar ${n <= info.stars ? "on" : ""}" style="animation-delay:${0.2 + n * 0.25}s">★</span>`).join("")}</div>` : ""}
    <div class="scoreline">${esc(info.scoreLine)}</div>
    ${info.quote ? `<div class="meta">${esc(info.who.name)}：“${esc(info.quote)}”</div>` : ""}
    <div class="facts">${info.facts.map((f) => `<div class="fact"><b>${f.n}</b><small>${f.label}</small></div>`).join("")}</div>
    ${newly.length ? `<div class="block"><h4>新收进破绽簿</h4><div class="newrow">${newly.map((id) => `<span class="chip gold">${IDX.fal[id].emoji} ${IDX.fal[id].zh}</span>`).join("")}</div></div>` : ""}
    ${items.length ? `<div class="block"><h4>这一局的漏网之鱼（${items.length}）</h4>${rv}${items.length > 6 ? `<div class="meta">其余 ${items.length - 6} 条略。</div>` : ""}</div>` : ""}
    ${note}${btns}`, "end");
  W ? Sfx.win() : Sfx.lose();
  if (res.seal) setTimeout(() => { if (screen === "result") sealRewardSheet(res.seal); }, 1100);
}
async function share() {
  if (!lastResult) return;
  const r = lastResult;
  const text = `我在《${TITLE}》里${r.won ? "战胜了" : "输给了"}${r.who.name}（${r.title}），识破 ${r.callCount || 0} 个破绽，破绽簿已收录 ${Object.keys(save.captured).length}/${DATA.fallacies.length}。`;
  try { await navigator.clipboard.writeText(text); toast("战绩已复制"); }
  catch (e) { showSheet(`<h3>复制这段话</h3><p>${esc(text)}</p><button class="btn primary" style="width:100%" data-act="closeSheet">好</button>`, { closeable: true }); }
}

function leaveMatch() { stopTimer(); stopAmbient(); token++; M = null; B = null; busy = false; closeSheet(); }

/* ===== 99-main.js ===== */
/* 99-main.js · 事件分发（每个按钮的 data-act 对应一个动作）与启动。 */
app.addEventListener("click", (e) => {
  const sb = e.target.closest(".seg button");
  if (sb) { setup[sb.parentElement.dataset.seg] = sb.dataset.v; syncSeg(); return; }
  const t = e.target.closest("[data-act]"); if (!t) return;
  const d = t.dataset;
  switch (d.act) {
    // 导航
    case "home": leaveMatch(); home(); break;
    case "open": leaveMatch(); openChapter(d.id); break;
    case "map": { const ch = chapterById(curLevel ? curLevel.chapter : save.chapter); leaveMatch(); mapScreen(ch); break; }
    case "chapter": {
      const ch = chapterById(d.id);
      if (!chapterUnlocked(ch)) toast("通关上一章后解锁");
      else { save.chapter = ch.id; persist(); home(); }
      break;
    }
    case "soon": soonSheet(d.id); break;
    case "dex": dex(); break;
    case "dextab": dex(d.v); break;
    case "topics": leaveMatch(); topics(); break;
    // 关卡
    case "level": levelSheet(d.id); break;
    case "startlevel": startLevel(d.id); break;
    case "gonext": leaveMatch(); startLevel(d.id); break;
    case "retry": if (curLevel) launchLevel(curLevel); else startMatch(lastSetup.id, lastSetup.sideChoice, lastSetup.diff, lastSetup.opt); break;
    // 自由对战
    case "setup": openSetup(d.id); break;
    case "start": curLevel = null; startMatch(setup.id, setup.side, setup.diff); break;
    // 对局中
    case "reply": doReply(+d.i); break;
    case "call": openCall(); break;
    case "pick": doCall(d.f); break;
    // Boss 中
    case "sent": openSentence(+d.i); break;
    case "spick": doGuess(d.f); break;
    // 面板与信息
    case "learn": learnSheet(chapterById(d.id)); break;
    case "fdetail": fdetail(d.id); break;
    case "sealinfo": sealInfo(d.id); break;
    case "help": help(); break;
    case "settings": settings(); break;
    case "closeSheet": closeSheet(); break;
    case "share": share(); break;
    case "leave":
      showSheet(`<h3>退出这一关？</h3><div class="sub">本局进度不会保存。</div>
        <button class="btn primary" style="width:100%;margin-bottom:8px" data-act="leaveYes">退出</button>
        <button class="btn ghost" style="width:100%" data-act="closeSheet">继续</button>`, { closeable: true });
      break;
    case "leaveYes": { const lv = curLevel; leaveMatch(); if (lv) mapScreen(chapterById(lv.chapter)); else topics(); break; }
    // 设置
    case "tog": save.settings[d.k] = !save.settings[d.k]; persist(); t.setAttribute("aria-pressed", String(save.settings[d.k])); break;
    case "reset":
      if (t.dataset.sure) { save = defaults(); save.chapter = CHAPTERS[0].id; persist(); closeSheet(); if (screen === "home") home(); toast("进度已清除"); }
      else { t.dataset.sure = "1"; t.textContent = "再点一次确认"; }
      break;
  }
});

// 启动：首页默认停在故事进行到的那一章
if (!save.chapter || !CHAPTERS.some((c) => c.id === save.chapter)) {
  const nl = nextLevel();
  save.chapter = (nl ? nl.ch : CHAPTERS[0]).id;
}
home();

})();</script>
</body>

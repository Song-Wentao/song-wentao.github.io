<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>且慢！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>/* ───────── 设计令牌：夜宴（深紫墨色 + 灯笼红 + 金）；亮色为宣纸灰白 ───────── */
:root {
  --bg: #f1ecec; --bg2: #e7dfdf; --surface: #ffffff; --surface2: #f6f0ef;
  --ink: #241a2b; --ink2: #6a5d74; --line: rgba(36, 26, 43, .14);
  --red: #c8302d; --red2: #9c211e; --gold: #b7791f; --gold-bg: #f6dfae; --jade: #16866a; --blue: #2b6ed8;
  --paper: #fbf1dc; --paper-ink: #2b1e19; --me: #c8302d;
  --glow: rgba(200, 48, 45, .10); --red-soft: rgba(200, 48, 45, .14); --shadow: 0 6px 18px rgba(36, 26, 43, .16);
  --brush: "Ma Shan Zheng", "STKaiti", "KaiTi", "Kaiti SC", "楷体", serif;
  --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #160f1e; --bg2: #1f1629; --surface: #2a1f38; --surface2: #34284a;
    --ink: #f5ecdd; --ink2: #b8abc6; --line: rgba(255, 255, 255, .13);
    --red: #ef4a3f; --red2: #b3231f; --gold: #f5b942; --gold-bg: #4a3512; --jade: #4cc9a4; --blue: #6aa2ff;
    --paper: #f3e3c6; --paper-ink: #2b1e19; --me: #d83a32;
    --glow: rgba(239, 74, 63, .24); --red-soft: rgba(239, 74, 63, .18); --shadow: 0 8px 24px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #160f1e; --bg2: #1f1629; --surface: #2a1f38; --surface2: #34284a;
  --ink: #f5ecdd; --ink2: #b8abc6; --line: rgba(255, 255, 255, .13);
  --red: #ef4a3f; --red2: #b3231f; --gold: #f5b942; --gold-bg: #4a3512; --jade: #4cc9a4; --blue: #6aa2ff;
  --paper: #f3e3c6; --paper-ink: #2b1e19; --me: #d83a32;
  --glow: rgba(239, 74, 63, .24); --red-soft: rgba(239, 74, 63, .18); --shadow: 0 8px 24px rgba(0, 0, 0, .45); color-scheme: dark;
}

*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  height: 100%; margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--sans); -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; overflow: hidden;
  background: radial-gradient(90% 38% at 50% 0%, var(--glow), transparent 70%), var(--bg); }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* ───────── 通用组件 ───────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 16px;
  border-radius: 12px; background: var(--surface2); border: 1.5px solid var(--line); font-weight: 600; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--red); border-color: transparent; color: #fff; box-shadow: 0 4px 0 var(--red2); }
.btn.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--red2); }
.btn.big { font-size: 20px; padding: 14px 24px; border-radius: 14px; letter-spacing: .12em; }
.btn.ghost { background: transparent; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1; padding: 4px 9px;
  border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); color: var(--ink2); white-space: nowrap; }
.chip.red { background: var(--red-soft); border-color: transparent; color: var(--red); font-weight: 600; }
.chip.gold { background: var(--gold-bg); border-color: transparent; color: var(--gold); font-weight: 600; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
.topbar h2 { margin: 0; font-size: 19px; flex: 1; }
.iconbtn { width: 38px; height: 38px; border-radius: 12px; background: var(--surface2); border: 1.5px solid var(--line);
  display: grid; place-items: center; font-size: 17px; }

/* ───────── 首页 ───────── */
.home { align-items: center; }
.lanterns { position: absolute; top: 0; left: 0; right: 0; height: 130px; pointer-events: none; }
.lantern { position: absolute; top: -6px; transform-origin: 50% 0; animation: sway 4.5s ease-in-out infinite; }
.lantern:nth-child(2) { animation-delay: -1.5s; } .lantern:nth-child(3) { animation-delay: -3s; }
@keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
.hero { margin-top: 92px; text-align: center; padding: 0 24px; position: relative; }
.title { font-family: var(--brush); font-size: 92px; line-height: 1.05; margin: 0; letter-spacing: .06em; color: var(--ink);
  text-shadow: 0 3px 0 var(--red2); }
.seal { position: absolute; right: 2px; top: -10px; font-family: var(--brush); font-size: 19px; line-height: 1.15;
  color: #fff; background: var(--red); padding: 8px 6px; writing-mode: vertical-rl; border-radius: 4px;
  transform: rotate(7deg); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .4); letter-spacing: .15em; }
.tagline { margin: 14px 0 0; color: var(--ink2); font-size: 15px; }
.family { display: flex; justify-content: center; margin-top: 26px; height: 92px; position: relative; }
.family .av { width: 84px; height: 84px; margin: 0 -9px; animation: bob 3s ease-in-out infinite; }
.family .av:nth-child(2n) { animation-delay: -1s; } .family .av:nth-child(3n) { animation-delay: -2s; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.ground { width: 92%; margin-top: -14px; position: relative; z-index: 1; flex: none; }
.ground-tablecloth { height: 30px; border-radius: 50%; background: linear-gradient(var(--red), var(--red2)); box-shadow: var(--shadow); }
.ground-desk { height: 26px; border-radius: 10px 10px 4px 4px; background: linear-gradient(#3b3150, #241c33); border-top: 3px solid var(--red);
  box-shadow: 0 -4px 16px var(--red-soft), var(--shadow); }
.ground-podium { height: 28px; border-radius: 6px; background: linear-gradient(#e8c36a, #b98a2e); box-shadow: var(--shadow); }
.progress { width: calc(100% - 40px); margin-top: 26px; padding: 14px 16px; border-radius: 16px; background: var(--surface);
  border: 1.5px solid var(--line); }
.progress .r1 { display: flex; align-items: baseline; gap: 10px; }
.progress .rname { font-family: var(--brush); font-size: 30px; color: var(--red); line-height: 1; }
.meter { height: 8px; border-radius: 4px; background: var(--line); margin: 10px 0 6px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--gold); border-radius: 4px; transition: width .6s; }
.progress small { color: var(--ink2); }
.home .cta { margin-top: 22px; width: calc(100% - 40px); }
.home .cta .btn.big { width: 100%; }
.home .row2 { display: flex; gap: 10px; margin-top: 14px; width: calc(100% - 40px); }
.home .row2 .btn { flex: 1; padding: 10px 6px; font-size: 14px; }

/* ───────── 选题 ───────── */
.topic { display: block; width: 100%; text-align: left; padding: 14px 14px 14px 18px; margin-bottom: 12px;
  background: var(--surface); border: 1.5px solid var(--line); border-left: 7px solid var(--red); border-radius: 6px 16px 16px 6px; }
.topic:active { transform: scale(.99); }
.topic h3 { margin: 0 0 4px; font-size: 18px; }
.topic p { margin: 0 0 10px; color: var(--ink2); font-size: 13.5px; }
.topic .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.topic .sides { display: flex; gap: 6px; flex-wrap: wrap; }
.topic .mini { display: flex; } .topic .mini .av { width: 44px; height: 44px; margin-left: -10px; }
.list { padding: 4px 16px 24px; }
.seg { display: flex; background: var(--surface2); border: 1.5px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; padding: 9px 4px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--red); color: #fff; }
.setup h3 { margin: 0 0 4px; font-size: 19px; }
.setup .lbl { margin: 14px 0 6px; font-size: 13px; color: var(--ink2); }
.vs { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-top: 12px; border-radius: 14px; background: var(--surface2); }
.vs .av { width: 56px; height: 56px; flex: none; }

/* ───────── 对局 ───────── */
.match { animation: none; }
.match.shake { animation: shake .42s; }
@keyframes shake { 10%, 90% { transform: translateX(-3px); } 30%, 70% { transform: translateX(6px); } 50% { transform: translateX(-6px); } }
.hud { display: flex; align-items: center; gap: 8px; padding: 10px 12px 4px; }
.score { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; }
.side { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 12px; color: var(--ink2); }
.pips { display: flex; gap: 1px; font-size: 17px; min-height: 22px; }
.pip { filter: grayscale(1) opacity(.28); transition: filter .3s, transform .3s; }
.pip.on { filter: none; transform: scale(1.12); }
.vsmark { font-family: var(--brush); font-size: 22px; color: var(--red); }
.stage { display: flex; align-items: center; gap: 10px; padding: 2px 14px 6px; }
.stage .avatar { width: 92px; height: 92px; flex: none; transition: transform .25s; }
.stage .avatar.hit { animation: hit .4s; }
@keyframes hit { 30% { transform: translateX(8px) rotate(4deg); } 60% { transform: translateX(-6px) rotate(-3deg); } }
.who { flex: 1; min-width: 0; }
.who b { font-size: 17px; } .who small { color: var(--ink2); margin-left: 6px; }
.meta { font-size: 12.5px; color: var(--ink2); margin: 2px 0 8px; }
.bar { position: relative; height: 14px; border-radius: 7px; background: var(--red2); overflow: hidden; border: 1.5px solid var(--line); }
.bar i { position: absolute; right: 0; top: 0; bottom: 0; width: 50%; background: linear-gradient(270deg, var(--gold), #ffd86b);
  border-radius: 7px 0 0 7px; transition: width .6s cubic-bezier(.2, .9, .3, 1.15); }
.bar::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(255, 255, 255, .5); }
.barlbl { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink2); margin-top: 3px; }
.dm-layer { position: absolute; left: 0; right: 0; top: 46px; height: 132px; overflow: hidden; pointer-events: none; z-index: 5; }
.dm { position: absolute; left: 0; white-space: nowrap; font-size: 14px; font-weight: 700; color: #fff;
  text-shadow: 0 1px 3px rgba(0, 0, 0, .85), 0 0 2px rgba(0, 0, 0, .8); animation: dm linear forwards; }
.dm.gold { color: #ffd86b; } .dm.red { color: #ff9c92; } .dm.jade { color: #7fe5c6; }
@keyframes dm { from { transform: translateX(var(--w)); } to { transform: translateX(-105%); } }

.chat { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 14px 10px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
.msg { max-width: 88%; display: flex; flex-direction: column; gap: 5px; animation: pop .28s cubic-bezier(.2, 1.2, .4, 1) both; }
.msg.opp { align-self: flex-start; } .msg.me { align-self: flex-end; align-items: flex-end; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.96); } }
.bubble { position: relative; padding: 10px 13px; font-size: 15px; line-height: 1.55; background: var(--paper); color: var(--paper-ink);
  border-radius: 5px 16px 16px 16px; box-shadow: 0 2px 0 rgba(0, 0, 0, .2); overflow: hidden; }
.msg.me .bubble { background: var(--me); color: #fff; border-radius: 16px 5px 16px 16px; }
.bubble.struck { filter: saturate(.4); opacity: .78; }
.bubble.struck .txt { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--red2); }
.bubble.struck::after { content: ""; position: absolute; inset: 0; pointer-events: none; animation: crack .35s ease-out both;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 40' preserveAspectRatio='none'><path vector-effect='non-scaling-stroke' d='M50 0 L45 9 L55 17 L43 26 L53 33 L48 40 M45 9 L28 13 M55 17 L74 15 M43 26 L26 31 M53 33 L70 36' stroke='%23b3231f' stroke-width='2' fill='none' stroke-linejoin='round'/></svg>") center/100% 100% no-repeat; }
@keyframes crack { from { opacity: 0; transform: scale(1.15); } }
.aside { align-self: center; text-align: center; font-size: 13px; color: var(--ink2); max-width: 94%; animation: pop .3s both; }
.aside b { color: var(--ink); font-weight: 600; }
.roundmark { align-self: stretch; display: flex; align-items: center; gap: 10px; color: var(--ink2); font-size: 12px; margin-top: 4px; }
.roundmark::before, .roundmark::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.typing { display: inline-flex; gap: 4px; padding: 12px 14px; background: var(--paper); border-radius: 5px 16px 16px 16px; align-self: flex-start; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: #9a8877; animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

.timer { height: 6px; background: var(--line); }
.timer i { display: block; height: 100%; width: 100%; background: var(--jade); transition: width .1s linear; }
.timer.urgent i { background: var(--red); animation: pulse .5s infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.dock { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--bg2); border-top: 1px solid var(--line); }
.dock.lock { pointer-events: none; opacity: .55; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; padding: 10px 12px; border-radius: 14px;
  background: var(--surface); border: 1.5px solid var(--line); font-size: 14.5px; line-height: 1.45; box-shadow: 0 3px 0 var(--line); }
.opt:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.opt .fire { flex: none; font-size: 11px; margin-top: 3px; letter-spacing: -2px; min-width: 32px; }
.callbtn { width: 100%; padding: 13px; border-radius: 14px; background: var(--red); color: #fff; font-weight: 700; font-size: 17px;
  letter-spacing: .1em; box-shadow: 0 4px 0 var(--red2); }
.callbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--red2); }
.dock .empty { text-align: center; color: var(--ink2); font-size: 13px; padding: 4px; }

/* ───────── 印章、连击、面板 ───────── */
.stamp-wrap { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; }
.flash { position: absolute; inset: 0; background: #fff; animation: flash .4s ease-out forwards; pointer-events: none; }
@keyframes flash { from { opacity: .75; } to { opacity: 0; } }
.stamp { font-family: var(--brush); font-size: 92px; line-height: 1.1; color: var(--red); border: 7px solid var(--red); border-radius: 12px;
  padding: 0 24px 4px; background: rgba(255, 250, 240, .93); transform: rotate(-8deg); animation: stamp .42s cubic-bezier(.2, 1.7, .4, 1) both;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .35); white-space: nowrap; }
.stamp.opp { color: var(--blue); border-color: var(--blue); }
.stamp.no { color: #6d6478; border-color: #6d6478; }
.stamp.sm { font-size: 60px; }
@keyframes stamp { from { opacity: 0; transform: rotate(-8deg) scale(3.2); } 60% { opacity: 1; } }
.combo { position: absolute; top: 30%; left: 0; right: 0; text-align: center; z-index: 45; pointer-events: none;
  font-family: var(--brush); font-size: 54px; color: #ffd86b; text-shadow: 0 3px 0 var(--red2), 0 0 18px rgba(255, 180, 60, .7); animation: combo 1.1s both; }
@keyframes combo { 0% { opacity: 0; transform: scale(.4); } 20% { opacity: 1; transform: scale(1.15); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-30px); } }

.sheet-back { position: absolute; inset: 0; z-index: 30; display: flex; align-items: flex-end; background: rgba(8, 4, 14, .58); animation: fade .2s both; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-height: 88%; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 18px 16px 18px;
  animation: up .3s cubic-bezier(.2, .9, .3, 1); box-shadow: 0 -10px 30px rgba(0, 0, 0, .3); }
@keyframes up { from { transform: translateY(40%); opacity: 0; } }
.sheet h3 { margin: 0; font-size: 19px; }
.sheet .sub { color: var(--ink2); font-size: 13px; margin: 2px 0 12px; }
.callopt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 12px; margin-bottom: 8px;
  border-radius: 14px; background: var(--surface2); border: 1.5px solid var(--line); }
.callopt:active { transform: scale(.99); }
.callopt .em { font-size: 28px; width: 36px; text-align: center; }
.callopt b { display: block; font-size: 16px; } .callopt small { color: var(--ink2); }
.explain .head { display: flex; gap: 12px; align-items: center; }
.explain .big { font-size: 46px; line-height: 1; animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) both; }
.explain .en { color: var(--ink2); font-size: 12.5px; }
.explain .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 4px; }
.explain blockquote { margin: 10px 0; padding: 8px 12px; border-left: 4px solid var(--line); background: var(--surface2); border-radius: 0 10px 10px 0;
  font-size: 14px; color: var(--ink2); }
.explain p { margin: 8px 0; }
.explain .quip { font-family: var(--brush); font-size: 22px; color: var(--red); }
.explain .tip { font-size: 13.5px; color: var(--ink2); }
.explain .btn { width: 100%; margin-top: 12px; }

/* ───────── 结算 ───────── */
.end { align-items: center; padding: 20px 18px; overflow-y: auto; }
.verdict { font-family: var(--brush); font-size: 72px; line-height: 1.1; margin: 14px 0 0; text-align: center; text-shadow: 0 3px 0 var(--red2); }
.verdict.win { color: #ffd86b; } .verdict.lose { color: var(--ink); }
.end .av { width: 110px; height: 110px; }
.scoreline { font-size: 20px; font-weight: 700; margin: 4px 0 12px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin: 8px 0; }
.fact { text-align: center; padding: 10px 4px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); }
.fact b { display: block; font-size: 22px; } .fact small { color: var(--ink2); }
.block { width: 100%; margin-top: 12px; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); }
.block h4 { margin: 0 0 8px; font-size: 15px; }
.newrow { display: flex; gap: 8px; flex-wrap: wrap; }
.review-item { padding: 8px 0; border-top: 1px dashed var(--line); font-size: 14px; }
.review-item:first-of-type { border-top: 0; }
.review-item .q { color: var(--ink2); margin: 3px 0; }
.end .btns { display: flex; gap: 10px; width: 100%; margin: 16px 0 8px; }
.end .btns .btn { flex: 1; }

/* ───────── 图鉴 ───────── */
.dexhead { padding: 0 16px 6px; }
.dex-fam { margin: 14px 16px 8px; font-weight: 700; font-size: 15px; display: flex; justify-content: space-between; }
.dex-fam small { color: var(--ink2); font-weight: 400; }
.dex-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 16px; }
.tile { position: relative; padding: 12px 4px 10px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); text-align: center; }
.tile .em { font-size: 34px; display: block; line-height: 1.2; }
.tile b { font-size: 13.5px; display: block; margin-top: 2px; }
.tile.locked .em { filter: grayscale(1) opacity(.35); }
.tile.locked b { color: var(--ink2); font-weight: 500; }
.tile.got { border-color: var(--gold); }
.tile.got::after { content: "✓"; position: absolute; top: 5px; right: 8px; color: var(--jade); font-weight: 800; font-size: 13px; }
.tile.weak { border-color: var(--red); }
.weak-block { margin: 6px 16px 0; padding: 12px 14px; border-radius: 14px; background: var(--red-soft); }
.weak-block b { color: var(--red); }

/* ───────── 其他 ───────── */
.help ol { margin: 8px 0 0; padding-left: 20px; } .help li { margin-bottom: 8px; }
.row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); }
.toggle { width: 50px; height: 30px; border-radius: 15px; background: var(--line); position: relative; transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.toggle[aria-pressed="true"] { background: var(--jade); }
.toggle[aria-pressed="true"]::after { transform: translateX(20px); }
.hidden { display: none !important; }

@media (max-height: 640px) {
  .stage .avatar { width: 68px; height: 68px; }
  .bubble { font-size: 14px; } .opt { font-size: 13.5px; padding: 8px 10px; }
  .title { font-size: 76px; } .hero { margin-top: 74px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .lantern, .family .av { animation: none !important; }
}

.av, .avatar { flex: none; }
.av svg, .avatar svg { width: 100%; height: 100%; display: block; }
.toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 60; padding: 9px 16px; border-radius: 999px;
  background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 600; animation: pop .3s both; white-space: nowrap; }

/* ───────── 章节 ───────── */
.chapters { display: flex; gap: 8px; width: 100%; margin-top: 20px; padding: 2px 20px 4px; overflow-x: auto; flex: none; scrollbar-width: none; }
.chapters::-webkit-scrollbar { display: none; }
.chap { flex: none; text-align: left; padding: 8px 14px; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); min-width: 104px; }
.chap b { display: block; font-size: 15px; } .chap small { color: var(--ink2); font-size: 12px; }
.chap[aria-pressed="true"] { border-color: var(--red); background: var(--red-soft); box-shadow: 0 3px 0 var(--red); }
.lanterns svg.scene { display: block; }
.home .hero { transition: none; }
.chapter-tag { font-size: 12.5px; color: var(--ink2); }

/* ───────── 且慢！新增：首页、关卡图、剧情、Boss、印章、星级 ───────── */
.gear { position: absolute; top: 10px; right: 12px; z-index: 6; }
.chap.locked { opacity: .55; }
.chap.soon { border-style: dashed; opacity: .85; }
.chap.soon small { color: var(--gold); }

.levelmap { padding: 6px 16px 28px; }
.mapnote { color: var(--ink2); font-size: 13.5px; margin: 0 0 14px; }
.lv { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 14px; position: relative;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; box-shadow: 0 3px 0 var(--line); }
.lv::before { content: ""; position: absolute; left: 32px; top: 100%; height: 14px; width: 3px; background: var(--line); }
.lv.last::before { display: none; }
.lv:active { transform: translateY(2px); }
.lv .num { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 17px;
  background: var(--surface2); border: 2px solid var(--line); }
.lv.done .num { background: #f5b942; color: #3a2800; border-color: transparent; }
.lv.boss .num { background: var(--red); color: #fff; border-color: transparent; font-size: 20px; }
.lv.next { border-color: var(--red); box-shadow: 0 3px 0 var(--red), 0 0 0 4px var(--red-soft); }
.lv.locked { opacity: .5; }
.lv .info { flex: 1; min-width: 0; }
.lv .info b { display: block; font-size: 16px; }
.lv .info small { display: block; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stars { font-size: 15px; letter-spacing: 1px; white-space: nowrap; }
.stars span, .starrow .bigstar { color: var(--line); }
.stars .on { color: #f5b942; }
.stars.inline { display: inline; }
.sealrow { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 12px 14px; margin-top: 8px;
  border-radius: 16px; background: var(--surface); border: 1.5px dashed var(--line); }
.sealrow small { display: block; color: var(--ink2); }
.sealrow .seal-stamp { width: 52px; height: 52px; font-size: 30px; flex: none; }
.grp { margin: 16px 0 8px; font-weight: 700; color: var(--ink2); font-size: 13px; }
.rules { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.learn-row { display: flex; gap: 12px; padding: 9px 0; border-top: 1px dashed var(--line); }
.learn-row .em { font-size: 26px; width: 34px; text-align: center; flex: none; }
.learn-row .def { color: var(--ink2); font-size: 13.5px; }

/* 剧情 */
.scene-wrap { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column;
  background: radial-gradient(90% 50% at 50% 18%, var(--glow), transparent 70%), var(--bg); animation: fade .25s both; }
.scene-skip { position: absolute; top: 12px; right: 12px; z-index: 2; padding: 6px 13px; border-radius: 999px; background: var(--surface2);
  border: 1px solid var(--line); font-size: 13px; color: var(--ink2); }
.scene-stage { flex: 1; min-height: 0; display: grid; place-items: center; }
.scene-av { width: min(58vw, 240px); height: min(58vw, 240px); animation: pop .3s cubic-bezier(.2, 1.2, .4, 1) both; }
.scene-av svg { width: 100%; height: 100%; display: block; }
.dialog { margin: 0 14px 20px; padding: 14px 16px 26px; border-radius: 18px; background: var(--surface); border: 1.5px solid var(--line);
  min-height: 132px; box-shadow: var(--shadow); position: relative; }
.dialog .nm { font-weight: 800; color: var(--red); margin-bottom: 4px; min-height: 1.5em; }
.dialog .tx { font-size: 16.5px; line-height: 1.7; }
.dialog .more { position: absolute; right: 14px; bottom: 8px; font-size: 12px; color: var(--ink2); animation: blink 1.4s infinite; }
.dialog.narr { background: transparent; border-style: dashed; box-shadow: none; text-align: center; }
.dialog.narr .tx { color: var(--ink2); font-style: italic; }

/* Boss 演讲 */
.hearts { font-size: 17px; letter-spacing: 1px; min-height: 22px; }
.foundn { font-size: 22px; color: var(--gold); line-height: 1.2; }
.speech { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 14px 10px; display: flex; flex-direction: column; gap: 9px; }
.sent { display: flex; gap: 10px; text-align: left; width: 100%; padding: 11px 12px; border-radius: 14px; font-size: 15px; line-height: 1.55;
  background: var(--paper); color: var(--paper-ink); box-shadow: 0 2px 0 rgba(0, 0, 0, .2); border-left: 6px solid transparent; }
.sent:active { transform: translateY(1px); }
.sent .no { flex: none; width: 22px; height: 22px; border-radius: 50%; background: rgba(0, 0, 0, .14); display: grid; place-items: center;
  font-size: 12px; font-weight: 700; margin-top: 2px; }
.sent .body { flex: 1; min-width: 0; }
.sent .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.sent .tags:not(:empty) { margin-top: 6px; }
.sent.sel { outline: 3px solid var(--gold); }
.sent.hit { filter: saturate(.55); opacity: .85; border-left-color: var(--jade); }
.sent.hit .tx { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--red2); }
.sent.missed { border-left-color: var(--red); opacity: .9; }
.sent.clean { border-left-color: var(--jade); opacity: .72; }
.match.boss .dock .empty { padding: 6px; }

/* 印章（收藏品） */
.seal-stamp { width: 76px; height: 76px; display: grid; place-items: center; position: relative; flex: none; transform: rotate(-5deg);
  font-family: var(--brush); font-size: 46px; line-height: 1; color: var(--red); border: 4px solid var(--red); border-radius: 10px;
  background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, .5), transparent 60%); }
.seal-stamp::after { content: ""; position: absolute; inset: 4px; border: 1.5px solid currentColor; border-radius: 6px; opacity: .5; }
.seal-stamp.gold { color: #7a4d00; border-color: #d9a400; background: linear-gradient(135deg, #ffeaa8, #f1c24a); box-shadow: 0 0 18px rgba(245, 185, 66, .55); }
.seal-stamp.locked { color: var(--ink2); border: 3px dashed var(--line); background: none; box-shadow: none; opacity: .75; }
.seal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 16px; }
.sealcell { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 4px 12px; border-radius: 16px;
  background: var(--surface); border: 1.5px solid var(--line); text-align: center; }
.sealcell b { font-size: 14px; } .sealcell small { color: var(--ink2); font-size: 11.5px; }
.bigseal { display: flex; justify-content: center; margin: 14px 0 12px; }
.bigseal .seal-stamp { width: 104px; height: 104px; font-size: 64px; }
.bigseal.pop .seal-stamp { animation: stamp .55s cubic-bezier(.2, 1.7, .4, 1) both; }
.seal-detail { text-align: center; } .seal-detail p { margin: 8px 0; }
.seal-mini .seal-stamp { width: 54px; height: 54px; font-size: 32px; }
.tabs { display: flex; gap: 8px; padding: 0 16px 10px; }
.tabs button { flex: 1; padding: 9px; border-radius: 12px; background: var(--surface2); border: 1.5px solid var(--line); font-weight: 600; }
.tabs button[aria-pressed="true"] { background: var(--red); color: #fff; border-color: transparent; }

/* 结算星级 */
.starrow { display: flex; gap: 8px; margin: 4px 0 0; }
.bigstar { font-size: 46px; line-height: 1.1; animation: starIn .55s cubic-bezier(.2, 1.6, .4, 1) both; }
.bigstar.on { color: #f5b942; text-shadow: 0 0 16px rgba(245, 185, 66, .75); }
@keyframes starIn { from { opacity: 0; transform: scale(.2) rotate(-90deg); } }
.verdict { margin-bottom: 0; }

@media (max-width: 360px) { .title { font-size: 76px; } .hero { padding: 0 16px; } }


/* ═══ 多语言 ═══ */
/* 设置里的语言切换 */
.langseg { display: flex; gap: 6px; }
.langseg button { padding: 7px 14px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--surface2); color: var(--ink); font-weight: 600; font-size: 14px; }
.langseg button[aria-pressed="true"] { background: var(--red); color: #fff; border-color: transparent; }
/* 英文排版：英文更长，而且“楷体”只有汉字，所以换一套拉丁字母的手写体，字号相应调小 */
.chip { white-space: normal; line-height: 1.25; text-align: left; }
html[lang="en"] { --brush: "Permanent Marker", "Segoe Print", "Marker Felt", "Comic Sans MS", cursive; }
html[lang="en"] .title { font-size: 58px; letter-spacing: 0; line-height: 1.12; }
html[lang="en"] .stamp { font-size: 52px; letter-spacing: 0; }
html[lang="en"] .stamp.sm { font-size: 36px; }
html[lang="en"] .verdict { font-size: 46px; }
html[lang="en"] .combo { font-size: 34px; }
html[lang="en"] .vsmark { font-size: 17px; }
html[lang="en"] .tagline { font-size: 14px; }
html[lang="en"] .callbtn { letter-spacing: .03em; }
html[lang="en"] .chap { min-width: 120px; }
html[lang="en"] .seal { writing-mode: horizontal-tb; font-size: 13px; padding: 5px 10px; letter-spacing: .02em; transform: rotate(5deg); }
html[lang="en"] .seal-stamp, html[lang="en"] .bigseal .seal-stamp { letter-spacing: 0; }

}},"jiaoshou":{"name":"Prof. Chen","title":"Philosophy professor","catchphrase":"Let us first define the concept.","lines":{"open":["Students, please clarify the concept first.","This question deserves serious discussion."],"caught":["Good, you caught the crux.","That inference really does have a hole."],"wrong_call":["Read it again. There's no problem here.","Please be more careful."],"win":["An argument needs structure.","Today's argument satisfies your professor."],"lose":["The young are formidable. Your teacher concedes.","Your argument was wonderful."]}},"xiaochen":{"name":"Captain Chen","title":"Debate team captain","catchphrase":"Opposing debater, please answer my question.","lines":{"open":["Thank you, Chair, and good day to the judges.","Opposing debater, our position is very clear."],"caught":["On this point, our side admits an oversight.","Opposing debater, you make a fair point."],"wrong_call":["Opposing debater, please don't swap concepts.","Our side has no problem on this one."],"win":["Thank you, judges. Our argument stands.","Our side won this one."],"lose":["Opposing debater, brilliant.","Our side concedes. Next time."]}},"xiaolin":{"name":"Lin","title":"Veteran debater","catchphrase":"Please present your evidence first.","lines":{"open":["Allow me to state our side's view first.","Opposing debater, look at the evidence first."],"caught":["Okay, I withdraw that point.","Hm, that argument really does have a problem."],"wrong_call":["Please read my exact words carefully.","There's no fallacy here."],"win":["Evidence speaks, and our side prevails.","Our side has this one in hand."],"lose":["The opposing debater won beautifully.","I'll go back and review it properly."]}},"xiaozhou":{"name":"Zhou","title":"First-year student","catchphrase":"I'm just here to learn","lines":{"open":["First time taking part, please bear with me!","Let me share my thoughts first."],"caught":["Ah, so there's a problem here!","Learned something, thank you!"],"wrong_call":["Huh, I think that line is fine?","Let me think again..."],"win":["Wow, I actually won!","Thanks, seniors, for going easy on me."],"lose":["As expected, the seniors are better.","I need to go back and practice more."]}},"zhubo":{"name":"Mei","title":"Livestream seller","catchphrase":"Fam, this price is only for today!","lines":{"open":["Fam, let's talk this question through today!","Come on, type it in the chat!"],"caught":["Oh no, I really didn't make that clear.","Fam, don't screenshot that..."],"wrong_call":["Look again, what I said is fine!","Don't jump to conclusions."],"win":["Thanks for the support, fam!","I won this round, hit follow!"],"lose":["Okay, you've got a point this time.","That's all for today's stream. See you next time."]}},"gangjing":{"name":"Comment Guy","title":"Resident contrarian","catchphrase":"You're right, but...","lines":{"open":["I just have one question.","Hold on, let me argue with that."],"caught":["Fine, you got that one.","I was just saying it casually..."],"wrong_call":["That's just picking a fight!","What's wrong with what I said?"],"win":["Ha, I said you can't out-argue me.","Won the argument today."],"lose":["...I got counter-trolled.","You win. Fair enough."]}},"dage":{"name":"Top Gifter","title":"Big-spender fan","catchphrase":"Sending a rocket to support you","lines":{"open":["Small matter, let me say a few words.","Fam, listen to your big brother."],"caught":["Oh, you caught me.","That... your big brother concedes."],"wrong_call":["Little brother, think again.","Could your big brother's words be wrong?"],"win":["Big brother wins. Rockets away.","This one's in the bag."],"lose":["Fine, I'll listen to you this time.","The young are formidable. Here's a rocket for you."]}},"chengxuyuan":{"name":"Jay","title":"AI engineer","catchphrase":"That's technically very simple","lines":{"open":["Let me say this from a technical point of view.","Let's look at the data first."],"caught":["I really did overlook that point.","You're right, let take back what I said.","This time, I didn't think it through."]}},"zongjian":{"name":"Director Wang","title":"Operations director","catchphrase":"This has to be seen from the big picture.","lines":{"open":["Everyone, let's widen our perspective first.","The key to this isn't who's right or wrong."],"caught":["That... I'll verify the details.","You're right, but the big picture comes first."],"wrong_call":["You're only seeing a part.","Please mind the setting you're speaking in."],"win":["See, big-picture thinking matters.","I won that vote."],"lose":["Fine, I'll concede this one.","I'll go make another version of the deck."]}},"caiwu":{"name":"Old Qian","title":"Finance","catchphrase":"Who exactly approved this money?","lines":{"open":["I only ask one thing: was this money well spent?","Accounts don't lie."],"caught":["That account... I got it wrong.","Okay, I'll recheck that item."],"wrong_call":["The numbers are right here. Look again.","Hold on, let me finish the calculation."],"win":["The books balance. I win.","This quarter closes this way."],"lose":["...I concede. That account was my oversight.","Next time I'll bring a calculator."]}},"jindaoshi":{"name":"Gold Mentor","title":"Mysterious life coach","catchphrase":"Three days to change your life.","lines":{"open":["Three days to change your life.","Your mindset decides your income."],"caught":["...That figure is from last year.","That framing was for teaching convenience."],"wrong_call":["You don't understand mindset.","That's part of the course."],"win":["Course sold out.","See, your mindset has opened up."],"lose":["...I'll change the title.","This lesson is on the house."]}}},"fallacies":{"ad_hominem":{"def":"Attacking the person making the argument instead of responding to the argument itself.","example":"You've never raised a child, so what do you know about education?","tip":"Ask: what does who this person is have to do with whether their argument holds?","example_reply":"Whether I've raised a child doesn't change whether the point is right."},"straw_man":{"def":"Twisting the other side's position into a weaker version, then attacking that version.","example":"You want to limit phones? So you want to cut the kid off from the world!","tip":"Restate their original words and point out what was changed.","example_reply":"I said limit screen time, not cut him off from the world."},"red_herring":{"def":"Throwing in a topic that seems related but isn't, to steer the discussion away.","example":"Enough about work. When are you getting married?","tip":"Point out it's a different question, and finish the current one first.","example_reply":"Marriage is a different matter. Let's finish talking about work."},"tu_quoque":{"def":"Dismissing a point because the speaker does the same thing.","example":"You stay up late every night, so who are you to tell me to sleep early?","tip":"Failing to practice it doesn't make it wrong. Whether a claim is true doesn't depend on who says it.","example_reply":"Whether I do it is one thing; whether sleeping early is good is another."},"appeal_to_authority":{"def":"Accepting a claim only because an “authority” said so, without looking at their reasons.","example":"The expert said so. What would an ordinary person know?","tip":"Is this person really an expert in this field? Is there evidence? Seniority or a title doesn't make someone right.","example_reply":"Which field is he an expert in? What's the evidence?"},"appeal_to_popularity":{"def":"Treating a claim as true because many people believe it or do it.","example":"Everyone does it, so it can't be wrong.","tip":"What most people choose isn't necessarily right.","example_reply":"Many people doing it doesn't make it right."},"appeal_to_emotion":{"def":"Using fear, pity or guilt in place of reasons to push a conclusion.","example":"How can you bear to watch the child cry?","tip":"Set the feelings aside: without them, what reasons are left?","example_reply":"I understand the sympathy. But whether to give it still depends on the reasons."},"appeal_to_tradition":{"def":"Treating something as right because “it has always been done” or “it's ancient”.","example":"It was handed down by our ancestors, so it must be right.","tip":"Being old only shows it has lasted, not that it's good."},"appeal_to_nature":{"def":"Assuming that what's “natural” is good or safe, and what's “man-made” is bad.","example":"It's all natural, so there can't be side effects.","tip":"Poisonous mushrooms and arsenic are natural too."},"appeal_to_accomplishment":{"def":"Dismissing someone's criticism or claim because they haven't achieved anything themselves.","example":"If you're so smart, you do it! Try it yourself.","tip":"Whether a criticism is valid doesn't depend on whether the critic could do it."},"genetic":{"def":"Judging a claim true or false merely by where it came from.","example":"You saw that on some website, so it must be fake.","tip":"A source can remind you to double-check, but it can't replace checking."},"guilt_by_association":{"def":"Rejecting a claim because it's connected to an unpopular person or group.","example":"Some villain also suggested this, so it must be wrong.","tip":"An idea stands or falls on its own reasons, not on who else said it."},"false_cause":{"def":"Concluding that one thing caused another just because they happened in sequence or together.","example":"He got sick right after moving, so the new house must have bad feng shui.","tip":"Could there be other causes? Is there a control?"},"hasty_generalization":{"def":"Drawing a conclusion about a whole group from too small a sample.","example":"Two people I know lost money starting a business, so every business loses money.","tip":"Is the sample big enough, and random enough?"},"anecdotal":{"def":"Using a personal experience or a story you heard in place of systematic evidence.","example":"My neighbor took this medicine and got better, so it definitely works.","tip":"A single case is vivid, but it can't replace statistics and controls.","example_reply":"One person getting better could be a coincidence. We'd need more controlled evidence."},"survivorship":{"def":"Looking only at the successes that survived, and ignoring the many failures that disappeared.","example":"So-and-so dropped out, started a company and became a billionaire, so school is pointless.","tip":"Where did the ones who failed go?"},"cherry_picking":{"def":"Picking only the evidence that favors you and ignoring the evidence against.","example":"Three articles say it works. The ones saying it doesn't don't count.","tip":"Is any opposing evidence being skipped?"},"slippery_slope":{"def":"Claiming one small step will set off an unstoppable chain of bad results, without showing each step actually follows.","example":"Let him play games today, and tomorrow he'll neglect his studies, and in the end he'll ruin his life.","tip":"Ask about each link: does this step really have to happen? How likely is it?","example_reply":"Is every step inevitable? How likely is each one?"},"false_analogy":{"def":"Comparing two fundamentally different things, then forcing one's conclusion onto the other.","example":"Raising a child is like growing a flower: skip the pruning and it grows crooked.","tip":"Are the two things really alike in the way that matters?"},"false_dilemma":{"def":"Presenting a complex issue as having only two options, ignoring the rest.","example":"Either do what I say, or don't come home.","tip":"Ask: are those really the only two possibilities?","example_reply":"Are those really the only two options?"},"circular":{"def":"The conclusion is already hidden in the premise, so the argument just proves itself.","example":"Everything he says is true, because he never lies.","tip":"Take the conclusion away. Does the premise still stand?","example_reply":"How do you know he never lies?"},"equivocation":{"def":"Letting the same word quietly change its meaning partway through an argument.","example":"Everyone has freedom of speech, so I can scream insults at a meeting if I want.","tip":"Does the word still mean the same thing in both sentences?"},"loaded_question":{"def":"A question with an unproven assumption built in, so any answer accepts it.","example":"Have you stopped slacking off yet?","tip":"First unpack the assumption hidden in the question, say you don't accept it, then decide how to answer.","example_reply":"I never slacked off in the first place."},"appeal_to_ignorance":{"def":"Concluding something is true because it hasn't been proven false (or the reverse).","example":"You can't prove ghosts don't exist, so they do.","tip":"No evidence for isn't evidence against."},"burden_of_proof":{"def":"Making a claim without evidence, then demanding that others disprove it.","example":"I say this remedy works. If you say it doesn't, bring evidence.","tip":"Whoever makes the claim has to back it up."},"middle_ground":{"def":"Assuming the compromise between two positions must be right.","example":"One side says one plus one is two, the other says four, so let's say three.","tip":"A compromise isn't automatically correct. Look at each side's reasons first."},"no_true_scotsman":{"def":"When faced with a counterexample, redefining the term as “a true X would never do that”, so the claim can never be wrong.","example":"If it didn't work for someone, it's because they didn't get the authentic version.","tip":"Ask: what evidence would make you admit you were wrong?"},"moving_goalposts":{"def":"Raising or changing the requirements after the other side has met your conditions.","example":"You gave me one study, so I wanted ten. You gave ten, so I said they weren't authoritative enough.","tip":"Agree up front: what counts as evidence?"},"personal_incredulity":{"def":"Deciding something can't be true because you can't understand it or can't imagine it.","example":"This is too complicated for me to follow, so it must be a scam.","tip":"Not understanding something doesn't make it wrong. You can try to understand it first."},"false_premise":{"def":"An argument that rests on a fact that is itself wrong or can't hold.","example":"Since we only use ten percent of our brains, we should develop the other ninety.","tip":"Before debating the reasoning, check that its starting point is actually true."},"sunk_cost":{"def":"Sticking with something because of the time or money already spent, even when continuing doesn't pay.","example":"We've watched for two hours already, so we have to finish even this terrible movie.","tip":"Ask only about the future: from now on, is continuing worth it?"},"gamblers_fallacy":{"def":"Believing independent random events will “make up for” earlier results.","example":"I've lost five rounds in a row, so the next one has to be a win.","tip":"Dice have no memory: each independent event's probability is unaffected by earlier results."},"base_rate":{"def":"Focusing on the specific information or raw numbers in front of you and ignoring how common the thing is overall.","example":"This test is 99% accurate and I tested positive, so I'm 99% likely to really be sick. (Ignoring that the illness is very rare.)","tip":"Ask: out of everyone, how common is this to begin with? What's the denominator?"},"special_pleading":{"def":"Making an “exception” for yourself (or your own side) without being able to say why it's an exception.","example":"Rules matter, but our company's situation is special, so they don't apply.","tip":"Ask: why does this rule apply to others but not to you?"},"appeal_to_consequences":{"def":"Deciding a conclusion isn't true (or is true) because its consequences would be too bad (or too good).","example":"If this tea really had a problem, the company would be finished, so it can't have a problem.","tip":"What the facts are and what consequences they bring are two separate questions. However bad the consequences, they can't make the facts disappear."},"texas_sharpshooter":{"def":"Spotting a pattern in the data first, then drawing the target around the bullet holes.","example":"We went through a hundred metrics and found blood pressure fell most for users with type A blood, so this tea works especially well for type A.","tip":"Set the hypothesis first, then look at the data. A pattern found after the fact must be re-verified with new data."},"composition_division":{"def":"Assuming that what's true of the whole is true of each part (or the reverse).","example":"Our company has a great reputation overall, so every one of our products is reliable.","tip":"The whole and its parts are two different things. Ask: is this property true of this specific one?"},"repetition":{"def":"Repeating the same claim often enough that it's treated as proven.","example":"Our product is safe, safe, truly safe.","tip":"However many times it's said, repetition isn't evidence. Ask: apart from repeating it, what's the reason?"}},"chapters":{"family":{"name":"Home for New Year","seal":"Home","tagline":"Every line at the New Year's Eve table\nmay hide a flaw.","keepsake":{"name":"Family Feast Seal","glyph":"F","blurb":"Second Uncle personally certifies it: this kid can't be out-argued."},"intro":["New Year's Eve. You drag your suitcase back to your hometown. A year on, your relatives' stock of “golden sayings” has only grown.","You're back! You've gotten thin! Here, forward this one first: “Lower Your Blood Pressure in 3 Days.” Your dad needs it!","(Something about that headline feels off, but I can't say what.)","I know that look: your gut says it's wrong, but you don't have a name for it. Here, my notebook from college.","Cousin Jane hands you an old notebook. The cover reads: Flaw Notebook.","When something doesn't hold up, don't just argue. First say “Hold on!”, then tell them what the flaw is called.","Youngsters, tonight Second Uncle teaches you how to be a person!","...Then, hold on!"],"outro":["The reunion dinner breaks up. Your Flaw Notebook already has a full page.","Not bad. There's a logic club at university that does exactly this. I'll recommend you.","Your phone lights up: Third Aunt's “Lower Your Blood Pressure in 3 Days” has now been forwarded to the 21st group.","...This isn't over."],"danmaku":{"ambient":["The reunion dinner is going cold and you're still arguing","Second Uncle's about to start again","Still no red envelopes","Every year, the same topic"],"win":["Congrats! You get to decide this year's reunion dinner"],"lose":["Second Uncle is thoroughly enjoying this"]}},"logic_club":{"name":"Logic Club","seal":"Logic","tagline":"Opposing debater,\nmind your argument.","keepsake":{"name":"Debate Seat Seal","glyph":"D","blurb":"Prof. Chen's comment: Argument, passable. (His highest praise yet.)"},"intro":["First week of term. With your Flaw Notebook on your back, you find the classroom at the corner of campus with the “Logic Club” sign.","Welcome. Here, “I feel like it” is not an argument, and neither is “everyone says so.”","Professor, what about “I just feel like it”?","That is your first practice problem.","Fellow student, please answer my question: have you eaten?","(Everyone in this club talks like they're defending a thesis.)"],"outro":["Congratulations on passing the club entrance test. By the way, a student showed me an article claiming you can lower blood pressure in three days.","(That article again...)","Professor, my second aunt forwarded that article too!","Family group chats across the country all seem to be forwarding the same article.","There's an opportunity this summer: a livestream company is hiring interns, and their new product happens to be called “Blood Pressure Tea.” Why not take a look?"],"danmaku":{"ambient":["The judges are taking notes","Nice opening case","Someone in the audience is applauding","Timekeeper: thirty seconds left"],"call_hit":["The judge nodded","That cross-examination was beautiful"],"call_miss":["The judge shook his head"],"win":["Unanimous vote from the judges"],"lose":["Judges: keep working at it"]}},"livestream":{"name":"Livestream","seal":"Live","tagline":"Every comment on screen\nmay be a flaw.","keepsake":{"name":"Livestream Seal","glyph":"L","blurb":"The first rocket gift from the Top Gifter, which you carved into a seal."},"intro":["Summer. With your internship letter in hand, you walk into the “HiShop Live” company. The neon sign at the door reads: Fam, today only!","New intern? Welcome! Your first task: run through the sales script with me.","This “Blood Pressure Tea”: results in three days, all natural, millions are drinking it!","...Three days, all natural, millions of people.","Three flaws in one sentence.","I'm tech. I don't do scripts. But I can tell you this: Comment Guy is coming tonight.","I just have one question: where's the evidence?","(He's the most clear-headed person in the whole company... even if he's here to pick fights.)"],"outro":["Where did you copy the tea's selling points from?","Just... that article Third Aunt sent me. I used it without checking.","Third Aunt?!","You pull out your phone: Third Aunt has already forwarded this livestream link into the 37th group.","Shares have passed a million. Technically it's simple: humans love to forward things.","Summer is over. But this, obviously, isn't."],"danmaku":{"ambient":["Fam, hit follow","Streamer, stop talking and drop the link","Front row, already screenshotted","666","Comment shields up","This streamer's got something"],"call_hit":["The streamer's stumped","That's a slap in the face","Screenshotted and sent to the group"],"call_miss":["Don't spam the chat"],"combo":["Top Gifter sent a rocket 🚀"],"win":["Top Gifter sent you a rocket 🚀"],"lose":["The streamer logged off"]}},"trending":{"name":"Trending","seal":"Trend","tagline":"Every comment on the trending list\nmay hide a flaw.","keepsake":{"name":"Trending Seal","glyph":"T","blurb":"The number-one spot on the trending list, replaced by one question: “What's the denominator?”"},"intro":["Week three of your summer internship. On the company's big screen, only two words are flashing: Trending.","Someone posted that their mom was hospitalized after drinking the tea! It's already number one on the trending list!","Number one? When did our tea get so famous?","Technically simple: humans repost bad news ten times faster than good news.","Everyone, I'm Old K, a million-follower influencer. I'm just asking a question (please repost).","I'm Reporter Su from the evening paper. I only care about one thing: what's the denominator?","(Tonight, the comment section is about to become a battlefield.)"],"outro":["The next day, the test results are out.","The tea itself is fine: it's mainly black tea with a bit of goji berries.","Then... what about “lower blood pressure in three days”?","There's no evidence at all.","So the problem isn't the tea, it's what I said?","Technically, yes.","The company calls an emergency meeting. A note is posted on the meeting-room door: Nobody leaves first."],"danmaku":{"ambient":["First!","Front row for the drama","This one's trending","Top comment: waiting for a reversal","The comments are in an uproar","Reposted, hope it spreads"],"call_hit":["Top comment: What's the denominator?","That's a reversal","Old K got stumped"],"call_miss":["Top comment deleted"],"bot_hit":["Trending guaranteed"],"combo":["Your comment got pushed to the top"],"win":["Your comment made top comment"],"lose":["Your comment got collapsed"]}},"crisis":{"name":"Crisis Meeting","seal":"Crisis","tagline":"Every “big picture” in the meeting room\nmay hide a flaw.","keepsake":{"name":"Meeting Seal","glyph":"M","blurb":"The last line of the minutes reads: Thanks to the intern for the “Hold on!”"},"intro":["Emergency meeting. The meeting-room door is shut, with a note posted outside: Nobody leaves first.","Everyone, there's only one item today: whose responsibility is this? (Meaning: not mine.)","This question has to be seen from the big picture. (Meaning: not mine.)","I only care about the money. (Meaning: not mine.)","I... I was just reading from the script. (Meaning: not mine either.)","Four pairs of eyes land at the same moment on the one person in the corner of the room.","Intern, what do you think about this?","(I'm only here for an internship...)","Everyone, hold on. I have something to say."],"outro":["By the time the meeting breaks up, it's late at night. Boss Zhou calls you over.","There's a press conference tomorrow. You'll read the apology statement.","Me? Read the statement?","Aren't you the best at “hold on”? Tomorrow, let the whole world hear it.","Intern, I'll lend you a jacket. It's cold at press conferences.","You take the apology draft back to your desk and find the first page titled: “Clarification on ‘Lower Blood Pressure in 3 Days’.”","The first line on page two reads: We have always maintained that our product is safe, safe, safe."],"danmaku":{"ambient":["This meeting has run three hours","Slide 37","Who takes the blame?","The meeting room AC is freezing","The pantry coffee has all been drunk"],"call_hit":["Minutes: that item struck out","The boss's face changed","Write that into the post-mortem"],"call_miss":["Minutes: that remark is void"],"bot_hit":["Intern, there's a problem with your draft"],"combo":["Dead silence in the room"],"win":["Minutes: the intern's view prevails"],"lose":["Minutes: the intern is responsible"]}},"launch":{"name":"Press Conference","seal":"Press","tagline":"The most polished spin\nhides the most subtle flaws.","keepsake":{"name":"Press Seal","glyph":"P","blurb":"In the last row of the press conference, someone holds up a sign: Go, intern!"},"intro":["Press conference day. The camera flashes feel like a small solar eclipse.","Intern, don't be nervous! You just read from the script...","The very first line on page one of the script is a flaw.","At a press conference, don't use the word “flaw.”","Reporter Su, evening paper. I'm in the front row.","Prof. Chen, invited guest. I'm here for one thing only: not to be used by you.","In the third row, someone is holding up a sign: “Go, intern!” It's Third Aunt.","Third Aunt's here to cheer you on! I forwarded that article to the 41st group!","(Today I'm not reading the script. I'm going to point out its flaws, one by one.)"],"outro":["The press conference is over. Boss Zhou announces on the spot: the product is pulled, all test data will be made public, and the company apologizes to consumers.","...The article Third Aunt forwarded probably needs a correction too.","I did some digging. The account that first posted “Lower Blood Pressure in 3 Days” is called “Gold Mentor.”","Gold Mentor?","Your phone screen lights up. That account has just posted a new update:","Course pre-sale: “Learn Logical Thinking in 3 Days,” originally 9,999, only 99 today. Limited to 100 spots.","...That title is itself a flaw.","(Learn in three days... here we go again.)","You close the Flaw Notebook. The next page is blank.","(The story continues.)"],"danmaku":{"ambient":["The camera flashes feel like a small solar eclipse","The front-row reporter is taking notes","Mic check: hello, hello","Livestream viewers online: 1.2 million","Someone is reposting this press conference"],"call_hit":["Every camera in the room turns to you","Reporters are scribbling fast","That line just made the headlines"],"call_miss":["The room goes quiet for a second"],"bot_hit":["The microphone gets turned down"],"combo":["The shutter clicks blur into one"],"win":["The whole room stands and applauds"],"lose":["The press conference goes on"]}}},"levels":{"family-1":{"name":"Course 1: The Phone Fight","before":["The first dish has just hit the table, and your eight-year-old nephew has already “borrowed” Cousin Ben's phone.","Kids should have phones! I saw an expert in a video say the earlier they start, the smarter they get!","Another “expert in a video”...","Comments will help you in this level. When you hear “something's off,” that's when to shout Hold on."],"win":["Wait, let me look up that expert... why can't I find this person?","You open your Flaw Notebook and write the first page: Appeal to authority."],"lose":["See? Experts in videos all say so.","It's okay. Flip through the Flaw Notebook and try again."]},"family-2":{"name":"Course 2: The Iron Rice Bowl","before":["Sit down. Let's talk about what you'll do after graduation.","Dad, I'm only a freshman.","It's always been this way. Plan ahead! Generations of our family have held secure state jobs, the iron rice bowl.","You quietly count: in those two sentences, at least one flaw is hiding."],"win":["...You're not entirely wrong.","Dad quietly puts his handwritten “Civil Service Exam Guide” back in his pocket."],"lose":["Listen to your dad. You can't go wrong.","Don't worry. You've already seen Dad's moves. Try again."]},"family-3":{"name":"Course 3: The Health Article","before":["Look at this one! Hundreds of people forwarded it. Lower your blood pressure in three days!","Hundreds of people forwarded it, so... it's true?","Would Third Aunt lie to you? It's all for your own good!","Remember that headline. I have a feeling it's going to come back."],"win":["Fine, fine, Third Aunt won't forward it...","That night, she forwards it to twenty other groups."],"lose":["See, Third Aunt was right after all.","(I have to take that article apart and see what's in it.)"]},"family-boss":{"name":"Second Uncle's Toast","before":["Everyone raises a glass. Second Uncle clears his throat and begins his annual “impromptu speech.”","Let me say a few words. Listen up, all of you!","He's alone this time, and every line could be flawed. Find them. Three mistakes and you lose."],"win":["I... drank too much. I speak without thinking...","The whole table applauds. Second Uncle claps twice before realizing they're applauding his being “exposed.”"],"lose":["Young people are still too green. Come on, drain this glass.","Don't be discouraged. You've already seen his tricks. Try again."]},"logic-1":{"name":"Rookie Warm-Up","before":["Warm-up round. Opponent: first-year student Zhou. Topic: white lies.","Nice to meet you! It's my first time here too! (so nervous he's holding the microphone backwards)"],"win":["So that line had a name... I learned something!","Very good. You both learned something. That's what the club is for."],"lose":["Losing is fine. Write down what you weren't sure about in your Flaw Notebook."]},"logic-2":{"name":"Lin's Challenge","before":["The trolley problem, a classic among classics. Opposing debater, please present your evidence first.","Opposing debater, please don't steal my lines.","Which side are you two actually on?","The side of the evidence."],"win":["That argument... I need to go back and review it.","She hugs her notebook tighter, as if guarding her last shred of dignity."],"lose":["Evidence speaks. Where's yours?"]},"logic-3":{"name":"The Professor's Extra Round","before":["You did well in the first two rounds. Now it's my turn.","The professor himself is stepping in! I'm going to buy sunflower seeds!","Let us first define the concept.","(Here it comes, his signature opening.)"],"win":["The young are formidable. Your teacher concedes.","The professor lost? I'm posting this to my feed today."],"lose":["Read the other side's words again. The answer is in the sentences."]},"logic-boss":{"name":"Lin's Closing Statement","before":["The club league final. Lin stands at the lectern and opens her closing statement.","The motion: the school should keep final exams. I'll say this only once.","Find the flaws in the closing statement. Three mistakes and you lose."],"win":["...Five flaws, not one missing.","Opposing debater, brilliant!"],"lose":["Evidence speaks. Go back and read it again."]},"live-1":{"name":"Rookie Training","before":["Training lesson one: how to answer doubters.","The standard answer: do you have evidence? If you can't say, that's your problem.","...I feel like I've seen that logic somewhere."],"win":["Maybe... the evidence should actually come from me?","She quietly takes down the “results in three days” poster."],"lose":["Fam, the newbie needs more practice."]},"live-2":{"name":"AI Art Livestream","before":["Tonight's stream is AI painting. You'll take the opposing side.","Can I choose to be in the audience?","No. You're already on the mic."],"win":["A closed loop of logic... and you poked a hole in it."],"lose":["Test passed!"]},"live-3":{"name":"Comment Guy Arrives","before":["You're right, but... I have three questions.","(I haven't even been asked the first question and I already want to mute the mic.)","Little brother, I'll send a rocket to support you. Go on."],"win":["...I got counter-trolled.","Rocket incoming! 🚀"],"lose":["I told you, you can't out-argue me."]},"live-boss":{"name":"The Golden Sales Script","before":["Eight p.m., and the stream passes a hundred thousand viewers. Mei takes a deep breath and opens her “golden sales script.”","Fam! Tonight's Blood Pressure Tea, I'll say it only once!","Tech tip: this level has no comments and no undo. Three mistakes and the stream goes black."],"win":["Fine... the tea's selling point was copied."],"lose":["Fam, have you placed your orders?"]},"trend-1":{"name":"Trending No. 1","before":["Everyone, this complaint has two hundred likes! What more evidence do you need?","Likes... don't seem like evidence.","Saying that means you're speaking up for the heartless merchants!","You take a deep breath. The first flaw has already shown up."],"win":["Wait, let me scroll the comments again... why are they all reposts from me?","He quietly changes “I'm just asking a question” to “I'm just passing by.”"],"lose":["Traffic doesn't lie.","Technically, traffic doesn't lie. But it doesn't explain causes either."]},"trend-2":{"name":"The Lucky Bag Storm","before":["Little brother, what's wrong with lucky bags? I pulled eleven in a row and didn't win. The twelfth is sure to!","...Are you sure?","I've paid a lot of tuition for this probability.","He doesn't know dice have no memory."],"win":["So dice have no memory... my rockets were wasted.","Big brother, your rockets were real."],"lose":["One more! I refuse to believe I won't win this time!"]},"trend-3":{"name":"The Reporter's Question","before":["Excuse me, when you say “very serious,” what's the denominator?","...Your question is sharper than all the arguments I prepared.","It's an occupational habit."],"win":["I need to go back and verify this argument.","Reporter Su got stumped too, huh..."],"lose":["Go check the denominator and come find me again."]},"trend-boss":{"name":"Old K's Expose Livestream","before":["Ten p.m. Old K starts a livestream called “Exposing the Blood Pressure Tea.” Viewers: three hundred thousand.","Fam, I'm just asking a question, it doesn't amount to any conclusion!","There's little time in this level. Some lines look like tricks but are actually fine, so don't tap them by mistake."],"win":["I... I'll go check the data again.","Old K's stream instantly loses fifty thousand viewers."],"lose":["Repost, repost, don't forget to repost."]},"crisis-1":{"name":"The Big Picture","before":["Let's open up our perspective first: whether to apologize isn't the point.","Then what's the point?","The point is... the big picture.","You notice the phrase “big picture” has been used eleven times."],"win":["I... I'll make another version of the deck.","His deck is already on version 37."],"lose":["See, big-picture thinking matters."]},"crisis-2":{"name":"Three Million","before":["We've already put three million into this product line. How can we stop?","The three million is already spent. Stopping or not doesn't change that it's spent.","...What you say sounds very reasonable, but I'm very unhappy."],"win":["...The three million is sunk, and so is my pride.","Pride doesn't count as a cost, Boss Zhou."],"lose":["Keep going! The three million can't go to waste!"]},"crisis-3":{"name":"The Moving Goalposts","before":["For this project, repurchase rate has to reach 30% to count as a success.","Okay, we hit 30%.","Then it has to be 50%.","You realize the goalposts are moving."],"win":["That account... I'll recalculate."],"lose":["Still not up to standard."]},"crisis-boss":{"name":"Boss Zhou's Closing Remarks","before":["The meeting is nearing its end. Boss Zhou stands up for his final remarks.","Let me say a few last words. Take note, this is going in the minutes.","(whispering) Every line is the big picture."],"win":["...Are there really that many problems in my remarks?","I deleted five lines for you in the minutes."],"lose":["Meeting adjourned! It's settled."]},"launch-1":{"name":"The Soul of the Data","before":["All the data? Of course we publish it. What we publish is... the conclusions.","Are conclusions data?","Conclusions are the soul of the data.","A very suspicious concept is quietly changing places."],"win":["...My soul has been stumped by you."],"lose":["The soul of the data has been published."]},"launch-2":{"name":"Helps, Helps, Helps","before":["“Helps lower blood pressure” doesn't mean treating illness, it means helping. Helping is just helping. Helping, helping, helping.","(Saying it three times doesn't make it evidence.)"],"win":["I'll go redo the label."],"lose":["Helping, helping, helping."]},"launch-3":{"name":"The Reporter's Denominator","before":["Tell me: how many subgroups did you analyze before you found the “effective” one?","(Even Reporter Su is asking about the denominator now.)"],"win":["Okay, I concede this round."],"lose":["Go check the number of subgroups and come back."]},"launch-boss":{"name":"Boss Zhou's Press Conference Speech","before":["The press conference moves to the opening remarks. Boss Zhou clears his throat and opens his script.","Everyone, our product is safe, safe...","Hold on. Please let me finish.","Intern, three mistakes and you'll be asked to leave."],"win":["...Who wrote this speech?","I'd guess the same person who wrote that article."],"lose":["Thank you all. This press conference is concluded."]}},"topics":{"phone":{"title":"Should We Buy the Kid a Phone?","scene":"Your eight-year-old nephew won't let go of the phone on the table, and the adults start arguing about it.","sides":{"A":"Yes, buy it","B":"No, don't"}},"job":{"title":"After Graduation, Should You Take the Civil Service Exam First?","scene":"Your cousin, fresh out of school, says he wants to go out and try his luck. Dad puts down his chopsticks.","sides":{"A":"Civil service first","B":"Go out and try first"}},"health":{"title":"Should You Trust Home Remedies Forwarded in Family Group Chats?","scene":"The group chat forwards yet another article, “Lower Your Blood Pressure in 3 Days,” and Third Aunt starts recommending it on the spot.","sides":{"A":"Worth a try","B":"Don't trust blindly"}},"lie":{"title":"Are White Lies Acceptable?","scene":"The final's topic has been drawn: if a lie is for the other person's good, is it still wrong?","sides":{"A":"Acceptable","B":"Not acceptable"}},"trolley":{"title":"The Trolley Problem: Should You Pull the Lever to Sacrifice One and Save Five?","scene":"The debate draw is in, and this round's motion is the most famous puzzle in ethics.","sides":{"A":"Pull the lever","B":"Don't pull the lever"}},"ai_art":{"title":"Should AI-Generated Works Get Copyright Protection?","scene":"The streamer paints a picture with AI live, and the fans immediately split into two camps.","sides":{"A":"Should be protected","B":"Should not be protected"}},"sales":{"title":"Should Livestream Sellers Be Liable for Product Quality?","scene":"In the livestream, a “100% natural” face mask draws fan complaints, and the comments erupt at once.","sides":{"A":"Should be liable","B":"Should not be liable"}},"blindbox":{"title":"Should Minors Be Restricted from Buying Blind Boxes and Lucky Bags in Livestreams?","scene":"The livestream lucky-bag draw is booming, and a middle schooler has spent a whole month's allowance.","sides":{"A":"Should be restricted","B":"No need to restrict"}},"takedown":{"title":"Someone Complained About the Tea on the Trending List. Should the Platform Take It Down First and Investigate Later?","scene":"A post saying “hospitalized after drinking the tea” shoots to number one on the trending list, and the comments erupt at once.","sides":{"A":"Take it down first, then investigate","B":"Investigate first, then decide"}},"apology":{"title":"When Something Goes Wrong, Should the Company Apologize Publicly Right Away?","scene":"Trending topics scroll across the meeting-room screen. Boss Zhou raps the table: apologize, or not?","sides":{"A":"Apologize immediately","B":"Investigate first"}},"product_line":{"title":"Should the Blood Pressure Tea Product Line Continue?","scene":"In the meeting room, Finance puts a loss chart up on the screen. Boss Zhou stares at it and says nothing for a long time.","sides":{"A":"Keep going","B":"Shut it down"}},"disclosure":{"title":"When a Company Has a Problem, Should It Publish All Its Test Data?","scene":"An hour before the press conference, the organizers put two documents in front of you: one is “all the data,” the other a “data summary.”","sides":{"A":"Publish everything","B":"Publish only conclusions"}},"labeling":{"title":"Should Claims Like “Helps Lower Blood Pressure” on Supplement Labels Be Banned?","scene":"From the audience, someone holds up an enlarged product label: “3 days, helps lower blood pressure.” The room goes quiet for a second.","sides":{"A":"Should be banned","B":"No need to ban"}}},"statements":{"ph_a01":["With a phone, parents can always reach the child, adding a layer of safety on the way home from school and when out.","The reason is concrete and directly tied to the conclusion: phones really do improve contact and safety. The trade-offs are still open to debate, but this argument itself has no fallacy."],"ph_a02":["The education blogger said the earlier a kid gets a phone, the smarter they get. He's an expert, so listening to experts can't be wrong.","It only invokes the “expert” title and gives no evidence. A title is not an argument.","Expert in what? Where's the research?"],"ph_a03":["Every kid in class has a phone except yours, so of course you should buy one.","Everyone having one doesn't mean they should. What most people do doesn't prove it's good for kids."],"ph_a04":["After the neighbor's kid got a phone, his grades went into the top ten, so phones raise grades.","The grades may have improved because he worked harder or got a new teacher. One thing following another doesn't mean one caused the other."],"ph_a05":["Without a phone, he'll be left behind by the times. Either buy it now, or regret it later.","It reduces the choices to two: buy now, or be left behind. It ignores introducing it gradually or learning digital skills in other ways."],"ph_a06":["You won't let us buy a phone because you want to lock the kid away from the world, with no freedom at all?","The other side only opposed buying a phone; they never said to isolate the child. This exaggerates and distorts their view, then attacks the distortion."],"ph_a07":["Give the child a phone with parental controls and agree on daily time. That builds self-management better than a flat ban.","It offers a concrete approach with a reason. “Builds better” is debatable, but this is a reasoned argument, not a fallacy."],"ph_a08":["Homework notices and study apps are mostly online. Without a phone, kids can easily miss information.","A practical reason related to the conclusion. It can be rebutted (a parent's phone could do the job), but the argument itself is sound."],"ph_a09":["You scroll your phone until midnight every night, so how can you keep your kid from using one?","It rejects the claim by pointing at the speaker's behavior. Whether you scroll at night has nothing to do with whether a child should have a phone.","Me not practicing it doesn't make the point wrong."],"ph_a10":["The child is crying that he wants a phone. How can you bear it? What hard-hearted parents!","It uses guilt and pity in place of reasons. The child wanting it doesn't mean he should get it."],"ph_a11":["Do you not love this child at all, to be unwilling to buy even a phone?","The question assumes “not buying a phone means not loving the child.” Any answer accepts that assumption."],"ph_a12":["Instead of banning it, teach the child to judge online information. He'll need that skill sooner or later.","It offers an alternative and a reason, without exaggerating or ignoring the other side's concerns."],"ph_a13":["The phone's already been bought. If we don't let the kid use it now, isn't the money wasted?","Money already spent can't be recovered and shouldn't decide whether the child should use it. What matters is whether, from now on, this is good for the child."],"ph_b01":["Long screen time is linked to nearsightedness and lack of sleep, so we should limit how long kids use screens.","The conclusion is “limit the time,” and the reason is relevant. It doesn't overstate this into “never touch it.” The argument itself has no fallacy."],"ph_b02":["Give him a phone today, he's addicted to games tomorrow, his studies fall apart the day after, and his whole life is ruined.","Every step is called inevitable without proof. A phone doesn't equal addiction, and addiction doesn't equal a ruined life.","Which step is inevitable?"],"ph_b03":["We grew up without phones and turned out fine. Kids don't need them.","“We managed without them” doesn't prove “they don't need them now.” The environment has changed, and so may the needs."],"ph_b04":["Three kids I know got phones and their grades dropped, so phones are simply bad for studying.","Three examples don't prove “phones are always harmful.” The sample is too small, and other causes weren't considered."],"ph_b05":["The principal said at the parents' meeting that phones have only downsides for kids. If the principal says so, what's left to argue?","It borrows only the principal's status, with no evidence. “Only downsides” itself needs proof."],"ph_b06":["You've never raised a child, so what do you know about phones!","It attacks the person's experience rather than the argument. Whether you've raised a child doesn't decide whether the point is right."],"ph_b07":["A child's self-control is still developing, and many apps are deliberately designed to be hard to put down. Young kids managing a phone alone isn't appropriate.","The reason is concrete, and it locates the problem in “young kids using it alone” rather than the phone itself. No obvious fallacy."],"ph_b08":["If it's just for staying in touch, a kids' watch that only makes calls is enough. No need for a smartphone.","It offers an alternative aimed at the other side's reason (contact and safety) and hits the point. No fallacy."],"ph_b09":["Why discuss phones now? Tell me first how much of your mortgage is left.","The mortgage has nothing to do with whether a child should have a phone. It steers the discussion elsewhere.","That's a different question. Phones first."],"ph_b10":["Kids should be running and jumping in nature. That's the natural way to grow up, and phones are bad man-made things.","It treats “natural” as good and “man-made” as bad. Outdoor activity really is beneficial, but that doesn't show phones are harmful."],"ph_b11":["Phones make kids dumber. You can tell from how he thinks less and less. And if he doesn't like thinking, of course the phone did it.","It explains “not liking to think” with “phones make people dumb,” then uses “not liking to think” to prove it. It's going in circles."],"ph_b12":["I suggest waiting until he's in middle school, then loosening up gradually based on his self-control, starting with set time limits.","It gives a clear time point and a gradual approach, without exaggerating or ignoring the other side's concerns."],"ph_b13":["After my cousin's phone was confiscated, his grades shot up, so controlling the phone controls grades.","It uses one person's experience in place of evidence. Grades can rise for

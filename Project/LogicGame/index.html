other reasons, so we need more controlled comparisons."],"ph_b14":["You say there's a parental mode, so I want you to prove the kid can't crack it. Proven, so now prove he won't switch devices.","Each time the other side meets one condition, a new one is added. That standard can never be met."],"job_a01":["Jobs in the civil system offer relatively stable pay and benefits, so the risk is lower for young people with mortgages or new families.","The reason is specific and relevant. “More stable” is debatable, but the argument itself has no fallacy."],"job_a02":["Our family has held secure state jobs for generations, always this way, so you should take this path too.","It treats “it's always been this way” as the reason. Family doing it doesn't show the path suits you."],"job_a03":["So many people across the country are fighting to take the civil service exam, and applicants rise every year. How can it be wrong?","Many applicants doesn't mean it suits everyone. Popular isn't the same as right."],"job_a04":["Two relatives of mine who started businesses both lost money, so starting a business never works.","Two examples don't prove “never works.” The sample is too small, and it doesn't say why they failed."],"job_a05":["Either join the system and live a stable life, or drift around suffering all your life. Your choice.","It reduces the options to two roads, ignoring getting a job first and changing later, working at a company, and other paths."],"job_a06":["Your mother has worried about you for so many years. Can't you take the civil service exam to put her at ease?","It replaces reasons with guilt. Putting your family at ease is a consideration, but it doesn't prove the exam is the best choice for you."],"job_a07":["You're just overambitious and unrealistic. Why would anyone listen to someone like that?","It attacks the speaker and doesn't address whether his ideas make sense."],"job_a08":["Promotion rules in the civil system are relatively clear, which suits people who aren't good at office politics.","It gives a specific reason. It can be rebutted, but there's no obvious logical fallacy."],"job_a09":["Join a stable organization first, build experience and savings, then consider switching careers or starting a business. That's lower risk than going straight out after graduation.","It proposes a staged approach and admits that starting a business is possible. A reasonable argument."],"job_a10":["I've eaten more salt than you've eaten rice. If I say the civil system is good, it's good.","It replaces reasons with seniority and age. Experience is worth hearing, but the conclusion still needs arguments.","Experience is a reference. Where's the reasoning?"],"job_a11":["Why talk about this now? Tell me when you're getting married first!","Marriage and career choice are two different things. It uses one to steer the conversation away."],"job_a12":["You can achieve things within the system too, and some posts involve you directly in public affairs. That sense of worth isn't necessarily lower than starting a business.","It answers the view that “the system has no value” with specific reasons. No fallacy."],"job_a13":["You studied for over a decade. If you don't take the exam, wasn't it all for nothing? All that investment wasted.","Time already spent can't be recovered and shouldn't decide your future choice. What matters is which path suits you from now on."],"job_a14":["You've never had a proper job. What gives you the right to judge whether the system is good or not?","Whether a judgment about the system is valid doesn't depend on whether the speaker has worked there. Look at whether his reasons hold."],"job_a15":["Nobody in our unit wants to quit and start a business. And if anyone did, they wouldn't be someone truly suited to the system.","Faced with a counterexample, it redefines the term as “someone truly suited would never do that,” so the claim can never be wrong."],"job_b01":["Career choices should consider interests and ability. Forcing yourself into a job that doesn't suit you lowers satisfaction and performance in the long run.","The argument is supported by reasons and doesn't overstate it into “the civil service is always bad.” No obvious fallacy."],"job_b02":["Look at the founders of the big companies. Didn't every one of them make it on their own? Going out on your own will succeed.","It sees only the successful ones, not the many more who tried and failed. Success stories aren't success rates."],"job_b03":["You want me to take the civil service exam just so I can coast through life and do nothing, right?","The other side stressed stability and never said “coast.” This distorts their meaning and then rebuts the distortion."],"job_b04":["A famous entrepreneur said the system has no future and young people should go out and hustle. Could he be wrong?","A successful entrepreneur doesn't necessarily have authority over everyone's career choices, and no specific basis is given."],"job_b05":["A few civil servants I know work overtime every day with no prospects, so joining the system is a waste of youth.","It concludes “joining the system is a waste of youth” from the experiences of a few people nearby. The sample is too small."],"job_b06":["As soon as he joined the system he became lifeless, so the system makes people mediocre.","One thing following another doesn't mean one caused the other. Maybe he was like that already, or something else caused it."],"job_b07":["When you have no family burdens, the cost of trying is low, and trying early helps you learn faster what suits you.","It gives a condition (no family burdens) and a reason. It's a qualified claim, not an absolute conclusion. No fallacy."],"job_b08":["There are limited posts and many applicants. If you bet only on the exam, failing could cost you two or three years, so you need a backup plan.","It points out the exam's own risk and a way to handle it, hitting the key point. No fallacy."],"job_b09":["When you were young, didn't you ignore your family's arrangements too? What gives you the right to make me listen?","It uses the other person's past behavior to dodge the question. Whether you listened back then doesn't affect whether the exam suits me."],"job_b10":["Either chase your dreams, or be mediocre all your life. Which do you choose?","It frames life as two choices: chasing dreams or mediocrity, ignoring that a stable job can also be meaningful."],"job_b11":["Young people today are all choosing freelance work. If everyone's choosing it, it's definitely a trend, and definitely right.","A trend isn't necessarily right. Many people choosing it doesn't prove it suits you."],"job_b12":["If you only want stability but find the work meaningless, the long-term psychological drain is also a cost, and should be factored into the decision.","It raises an overlooked cost and doesn't dismiss stability entirely. No fallacy."],"job_b13":["Give up your dreams for stability today, give up freedom for the mortgage tomorrow, and in the end you become the person you hate most.","It presents a chain of consequences as inevitable without proving each step will happen."],"job_b14":["One side says you must take the exam, the other says you must start a business, so compromise: do both at once. That must be best.","A compromise isn't automatically right. Doing both may shortchange both; we need reasons."],"hl_a01":["Home remedies like ginger-and-brown-sugar water are cheap and low-risk. A cup to warm you up when you have a cold can't hurt.","The claim is very limited (“can't hurt”), based on low cost and low risk, without exaggerating effects. No obvious fallacy."],"hl_a02":["My knees hurt for years. I drank the herbal liquor my relative recommended and a month later they were better. Isn't that proof?","It uses a personal experience in place of evidence. It might have been natural recovery or something else; we'd need a control to judge."],"hl_a03":["These remedies are all natural herbs, unlike Western medicine with all its chemicals, so they surely have no side effects.","“Natural” doesn't mean “safe.” Poisonous mushrooms and aristolochic acid both come from natural plants."],"hl_a04":["These recipes have been passed down for thousands of years, so they must have merit and are more reliable than modern drugs.","Being old only shows it lasted, not that it works. Among recipes handed down, some work and some don't."],"hl_a05":["You say this remedy is useless, but can you prove it does nothing at all? If you can't, it might work.","No proof that it fails doesn't mean it works. Whoever claims it works should provide the proof."],"hl_a06":["This article was written by a professor. He's a professor, so how could it be false?","It looks only at the title. Is the professor's field relevant? Does the article have data and sources? Those are the key questions."],"hl_a07":["Hundreds of people in the family chat forwarded it. With so many believing it, it can't be fake.","Many forwards only show it spread widely, not that it's true. Rumors can be forwarded in huge numbers too."],"hl_a08":["For illnesses the hospital can't cure, what else can you do but try home remedies? Wait to die?","It reduces the choices to “home remedies” or “waiting to die.” There's also palliative care, clinical trials, second opinions, and more."],"hl_a09":["If the remedy didn't work, it's because you didn't find the authentic one. The authentic recipe definitely works.","Facing a counterexample, it redefines the term as “only the authentic counts,” so the claim can never be proven wrong."],"hl_a10":["If the condition isn't serious and the remedy itself is harmless, trying it as a supplement without delaying proper treatment keeps the risk under control.","It states clear preconditions (not serious, harmless, no delay in treatment). It's a qualified, reasonable claim. No fallacy."],"hl_a11":["Many families' health habits are really life experience, like eating light and sleeping and waking early. Even without medicinal effect, they have real benefits.","It limits the topic to lifestyle habits and admits “no medicinal effect,” neither overstating nor dodging. No fallacy."],"hl_a12":["Some people use remedies for psychological comfort. As long as it doesn't delay treatment, respecting an elder's choice is also a form of consideration.","It admits the remedy's limits while offering a respectful stance. It has conditions and no fallacy."],"hl_a13":["I searched online. Three articles say turmeric fights cancer. The rest that say it's useless must be pharma companies smearing it.","It accepts only the articles that favor it and dismisses the opposing evidence outright."],"hl_a14":["You say home remedies don't work? Then you do it! Cure my dad's illness and show me!","Criticizing something doesn't require doing it first. Whether the remedy works has nothing to do with whether the critic can cure disease."],"hl_a15":["Randomized controlled trials? I don't understand a word of it, so it must be nonsense.","Not understanding something doesn't make it invalid. You can start by figuring out what it says."],"hl_a16":["I've been drinking this herbal liquor for over half a year. If I say I don't believe in it now, wasn't all that for nothing?","Time and money already spent can't be recovered and can't be used to prove it works. What counts is evidence, not what you've invested."],"hl_b01":["Judging whether a remedy works takes controlled trial evidence. A few people saying it worked proves nothing.","It explains what evidence is needed to judge effectiveness, a reason directly tied to the conclusion. No fallacy."],"hl_b02":["Some remedies are themselves toxic or clash with medicine you're already taking. If treatment is delayed, no one can bear the cost.","It points out a specific risk without lumping all remedies together. No fallacy."],"hl_b03":["Anyone who forwards this stuff is an uneducated old person who forwards everything. Their words aren't worth hearing.","It attacks the people forwarding and doesn't address whether the content holds up. Whether the article is right depends on the article itself."],"hl_b04":["That medical blogger online said all home remedies are scams, and his word is final.","It treats one blogger's statement as the conclusion. A claim like “all” also needs evidence, not just a speaker."],"hl_b05":["Believing in home remedies is like believing in fortune-telling. They're both superstition, same thing.","Some ingredients in remedies can be tested, and some even have real pharmacological effects, while fortune-telling can't be tested. That key difference is erased."],"hl_b06":["I've seen three news stories about remedies hurting people, so all home remedies are scams.","Three stories can't establish “all remedies.” The sample is too small and unfair."],"hl_b07":["Trust one home remedy today, stop your blood pressure pills tomorrow, and you're in life-threatening danger the day after.","It links “trusting a remedy” straight to “stopping medication” and “mortal danger,” with no proof for any step."],"hl_b08":["A patient delays treatment with a home remedy and the family will regret it so much! Don't you feel for them at all?","It replaces reasons with regret and sympathy. Risk must be shown with evidence, not emotional pressure."],"hl_b09":["You think modern medicine is useless and every illness should be treated with roots and bark, don't you?","The other side only said remedies are worth a try, not that modern medicine is useless. This distorts their view."],"hl_b10":["“All natural” doesn't mean safe. Poisonous mushrooms are all natural too. What matters is whether the ingredients and doses have been studied.","It answers “natural means safe” with a concrete counterexample and names the standard to judge by. No fallacy."],"hl_b11":["No need to reject it all: treat remedies as small daily habits, but for a real illness, proper medical care must come first.","It draws a clear boundary. This isn't a “compromise”; it's a reasoned position. No fallacy."],"hl_b12":["People forwarding remedies should hold their tongues. When are you paying me back that money you borrowed?","The borrowed money has nothing to do with whether the remedy is trustworthy. It's changing the subject."],"hl_b13":["Remedies have no scientific basis, so they can't be trusted. Why do you say no scientific basis? Because they're just remedies.","It explains “no basis” with “remedy,” then concludes “remedies can't be trusted” from “no basis.” The conclusion is hidden in the premise."],"hl_b14":["I saw this article in the family chat, so it must be fake.","It judges truth by source alone. What's forwarded in a group may be right or wrong; look at the evidence it gives."],"family_boss:0":["Dear relatives, everyone's worked hard this year, and being able to sit and eat together today is a rare blessing.","This is just a pleasantry. It makes no argument, so it has no fallacy."],"family_boss:1":["I've eaten more salt than you've eaten rice, so when I say studying is useless, it's useless.","It replaces reasons with seniority and age. Experience is worth considering, but the conclusion “studying is useless” still needs arguments."],"family_boss:2":["Our family back home has lived by farming for generations. Why should the kids study so much?","“It's always been this way” doesn't show it still fits now. Times and conditions have changed."],"family_boss:3":["Look at old Li in the next village. He hardly studied and still opened a factory, so studying has nothing to do with making money.","It draws a general conclusion from one example. The sample is too small, and it sees only the successful."],"family_boss:4":["Having said that, studying helps people understand things. I admit that.","This concedes a point to the other side. There's no fallacy."],"family_boss:5":["Young people today won't take advice from elders. Either listen to me, or don't come crying later!","It reduces the choices to two: listen to me, or regret. It ignores other possibilities."],"family_boss:6":["Anyone who disagrees with me is unfilial!","It pressures with the guilt of “unfilial” in place of reasons. Being dutiful and being right are two separate things."],"family_boss:7":["All right, enough talk. Let's all drain this glass!","This is just an invitation to toast. There's no argument, so no fallacy."],"lie_a01":["If the truth would only cause pointless harm, and a lie spares the other person pain without damaging his important interests, it may be the kinder choice.","It sets conditions (pointless harm, no damage to important interests) and doesn't say all lies are fine. No fallacy."],"lie_a02":["Everyone has told white lies. If everyone does it, how can it be wrong?","Many people doing it doesn't make it right."],"lie_a03":["Can you bear to tell a seriously ill old person such a cruel truth?","It uses reluctance in place of reasons. Whether to withhold it also depends on the old person's own rights and choices."],"lie_a04":["You lied to your mom that your grades were fine, so what gives you the right to say lies are unacceptable?","It rejects the claim using the other person's own behavior. That he did it doesn't make the thing right or wrong."],"lie_a05":["Either say a cheerful lie or say a hurtful truth. There's no other way to put it.","It reduces the choices to two, ignoring silence, tact, asking whether the other person wants to hear it, and more."],"lie_a06":["I was protected by white lies as a child and nothing bad happened, so white lies do no harm.","It uses one person's experience in place of evidence. Nothing happening to me doesn't mean nothing happened to others."],"lie_a07":["You oppose lying, so you want everyone to stab others with knife-sharp truths at all times!","Opposing lying doesn't mean advocating hurtful words. This exaggerates and distorts the other side's view."],"lie_a08":["Judging a white lie means looking at motive and consequences, such as whether it's really for the other person and whether it creates dependence. You can't generalize.","It offers criteria for judging without generalizing. No fallacy."],"lie_a09":["The Chinese have always valued harmony and saving face, so that tradition shows white lies are right.","Tradition can show a habit has lasted, but it can't prove it's morally right."],"lie_a10":["Sometimes telling the truth would harm innocent third parties, like hiding a victim's location in an emergency. Then the case for lying is stronger.","It limits the scope with a classic scenario. No fallacy."],"lie_a11":["Psychologists say moderate white lies help maintain relationships, so they're right.","It doesn't say which study. Even if there is one, “helps relationships” doesn't equal “morally right.”"],"lie_a12":["A white lie differs from malicious deception: the former aims at the other person's benefit, the latter at your own. That distinction matters.","It makes a meaningful distinction and explains its basis. No fallacy."],"lie_a13":["I gave three examples of white lies helping people. The ones that caused harm are special cases and don't count.","It accepts only the examples that favor it and dismisses the opposing ones outright."],"lie_a14":["One side says never lie, the other says lie whenever you like, so compromise: occasional lying is right.","A compromise isn't automatically right. Where the line for “occasional” falls needs a reason, not just being between the two."],"lie_a15":["I can't think how you'd keep relationships without lying, so lies must be necessary in human interaction.","Not being able to imagine another way doesn't mean there isn't one. Silence, tact and asking whether the person wants to know are all options."],"lie_a16":["I say white lies do no harm. Don't believe me? Then give me one example that does harm to prove it.","Whoever makes the claim should provide the proof. Giving no basis yourself while demanding that others prove the opposite turns the burden around."],"lie_b01":["A lie takes away the other person's chance to decide based on true information. Even with good intentions, it disrespects his autonomy.","It starts from autonomy, and the reason is directly tied to the conclusion. No fallacy."],"lie_b02":["Tell one white lie today, a bigger lie tomorrow, and in the end trust between people collapses.","It goes straight from one small lie to collapse of trust, with no proof for the steps in between."],"lie_b03":["After he was kept in the dark with a white lie, his illness worsened soon after, so the lie hurt him.","One thing following another doesn't mean one caused the other. His illness may have worsened on its own."],"lie_b04":["A great philosopher said lying is wrong in every circumstance, so white lies are out too.","It borrows a famous name with no reasons. Philosophers disagree on this too."],"lie_b05":["Con artists used the “it's for your own good” line back in the day, so the reasoning behind white lies can't be trusted.","It rejects the argument because it's associated with con artists. A view should be judged on its own reasons."],"lie_b06":["The honest people in history were all respected, so honesty always has good results.","It sees only the honest people who were remembered, not the many honest people who got nothing for it."],"lie_b07":["Once a lie is found out, the cost isn't just that one line. The other person doubts everything else you've said, and trust is hard to repair.","It explains the concrete cost once a lie is discovered. No fallacy."],"lie_b08":["Either be honest forever, or become someone full of lies. There's no middle ground.","It frames the choices as two extremes, ignoring the position of making exceptions in specific situations."],"lie_b09":["You can stay silent without lying: choosing silence, speaking tactfully, or first asking whether they want to know is often more workable than making things up.","It offers alternatives, answering the idea that “you can only lie.” No fallacy."],"lie_b10":["You give me one harmless lie, and I'll ask you for ten more. You give me ten, and I'll demand that all of them hold up under questioning.","Each time the other side meets a condition, the requirement is raised. That standard can never be met."],"lie_b11":["Have you ever felt the pain of being deceived by someone closest to you? How can you still say lying is acceptable?","It uses personal pain in place of reasons. Some people are hurt by being deceived, and others are hurt by the truth."],"lie_b12":["You mean that to make people happy, any lie is fine, right?","The other side's claim is “well-intentioned, conditional lies,” not “any lie is fine.”"],"lie_b13":["The human brain can detect lies by nature, so a white lie will always be seen through, and there's no point in telling it.","The premise itself doesn't hold: people's accuracy at detecting lies is not high. If the starting point is wrong, the conclusion can't stand."],"lie_b14":["Since you also admit lying damages trust, how do you plan to apologize to the people you've lied to?","The question hides two assumptions: that you admitted lying damages trust, and that you've deceived people. Any answer accepts them."],"tr_a01":["Five lives outnumber one life. All else being equal, saving more lives is the better choice.","It states a clear principle and condition (all else equal). This is the core utilitarian argument, with no fallacy."],"tr_a02":["Think of the children in those five people's homes. How can you stand by and watch them get run over?","It uses pity in place of reasons. The person sacrificed has a family too; emotion can't decide what's right."],"tr_a03":["Surveys show most people would pull the lever. With so many choosing it, it must be right.","What most people choose isn't necessarily the morally right choice."],"tr_a04":["Either pull the lever, or you're letting them die. There's no third option.","It reduces the choices to two, ignoring shouting a warning, trying to stop the trolley, and other possibilities."],"tr_a05":["A famous philosopher said utilitarianism is the correct view, so you should pull the lever.","It borrows a name without explaining reasons. Philosophers disagree on this question to begin with."],"tr_a06":["You oppose pulling the lever because you think five people's lives are worthless, right?","Opposing the lever doesn't mean thinking five lives are worth nothing. This distorts the other side's view."],"tr_a07":["Doing nothing is also a choice. Knowing you could save people and not doing so also makes you answerable for the result. You can't avoid that point.","It points out that inaction carries responsibility too, answering the other side's distinction. It can be debated further, but the argument itself is sound."],"tr_a08":["Anyone who opposes pulling the lever is a hypocrite who only wants clean hands and doesn't care who lives or dies.","It attacks the other side's character without addressing his arguments."],"tr_a09":["All five friends I asked chose to pull the lever, so every normal person would pull it.","Five friends can't stand for “everyone.” And “normal people” implicitly dismisses those who disagree."],"tr_a10":["Admitting that sacrificing one person is painful, choosing the lesser of two evils is still a reason that can be explained.","It acknowledges the cost and gives a reason for the trade-off. No fallacy."],"tr_a11":["No one can prove that pulling the lever is wrong, so pulling the lever is right.","Not proving it wrong doesn't make it right. The side saying “pull” also has to give reasons."],"tr_a12":["Don't just discuss whether to pull the lever. Tell me why the railway company doesn't install a safety system!","Railway safety is a different topic. This steers the discussion away."],"tr_a13":["In reality, emergency triage also has to make trade-offs with limited resources, which shows “comparing numbers” isn't totally unacceptable.","It uses a real example to show this way of thinking isn't unacceptable. It doesn't overstate, and the argument is sound."],"tr_a14":["The idea that “you must not actively harm” is left over from religion, so it doesn't deserve to be taken seriously.","It rejects an idea merely by its source. Whether a principle holds depends on its reasons."],"tr_a15":["This time I'll cite only the most recent survey, because its results are clearest. The earlier ones that disagreed are outdated.","It picks only the evidence that favors it and dismisses the unfavorable as “outdated.” Inconsistent results are themselves information that has to be faced."],"tr_b01":["Actively causing an innocent person's death and failing to prevent a death are not morally the same, and that difference deserves serious attention.","It raises the distinction between acting and omitting, an argument taken seriously in ethics. No fallacy."],"tr_b02":["Killing is wrong, pulling the lever causes a person's death, so pulling the lever is killing, and of course wrong.","It quietly swaps “causing a death” for “killing.” Whether the two are the same in intent and causation is exactly what's in dispute."],"tr_b03":["Sacrifice one for five today, and tomorrow you'll sacrifice two for ten, until human life is just a number.","It jumps from one trade-off to “life is just a number,” with the steps in between unproven."],"tr_b04":["Moral education has always taught us not to actively harm others. That's tradition and can't be violated.","Being traditional doesn't mean it holds in every case. Reasons are still needed."],"tr_b05":["Pulling the lever is immoral because we have a duty not to harm the innocent. Why do we have that duty? Because harming the innocent is immoral.","It explains “duty” with “immoral,” then proves “immoral” with “duty.” It's going in circles."],"tr_b06":["People who support pulling the lever are cold-blooded utilitarians who treat people as numbers.","It sticks a label on the other side without answering his argument."],"tr_b07":["People shouldn't be treated merely as tools to reach an end. Pulling the lever treats that one person as a means to save five, which needs special justification.","It states a clear moral principle and explains how it applies. No fallacy."],"tr_b08":["If deciding by headcount alone were valid, then a doctor killing one healthy person for organs to save five would be valid too. Most people reject that, which suggests “just count heads” may be flawed.","This is a reductio: it extends the other side's principle to another case to test whether it's acceptable. It has reasons and no fallacy."],"tr_b09":["You prove five lives outnumber one, and I'll ask you to prove each life has equal value. Prove that, and I'll ask you to prove something else.","Each time the other side meets a condition, a new one is added. That standard can never be met."],"tr_b10":["The person sacrificed has a family too. How would they accept their loved one being killed by your pulling the lever?","It uses guilt and pain in place of reasons. Both sides have families, so emotion alone can't decide what's right."],"tr_b11":["Either you must never actively harm anyone, or you've lost all morality.","It frames the choices as two extremes, ignoring the possibility of limited trade-offs in extreme situations."],"tr_b12":["In reality we often can't be sure of the outcome, or whether only one person would die after pulling the lever. The greater the uncertainty, the more cautious we should be.","It points out the gap between thought experiments and reality and gives a reason for caution. No fallacy."],"tr_b13":["My ethics teacher said you must not pull the lever. He's an expert, so you have to listen.","It invokes only the teacher's position. Experts disagree too; look at the reasons given."],"tr_b14":["I really can't understand how anyone could bring themselves to actively pull the lever, so pulling it can't be right.","Not being able to figure it out doesn't mean it doesn't hold. What's needed is an argument, not “I can't imagine it.”"],"logic_boss:0":["Thank you, Chair, and thanks to the judges. Our position today is very clear: final exams should be kept.","This is an opening statement that states the position. No fallacy."],"logic_boss:1":["The opposing debater says to abolish exams. Isn't that just wanting everyone to stop studying and coast through for credits?","The other side only argued to abolish exams, not to coast. This distorts their view and then rebuts the distortion."],"logic_boss:2":["Abolish final exams today, abolish regular homework tomorrow, and the day after that the school becomes a playground.","It links one thing straight to a chain of worse results, with no proof for any step."],"logic_boss:3":["Exams are the best way to measure learning, because there is no better way to measure learning than exams.","The conclusion “best way” is placed directly in the premise. It proves itself with itself."],"logic_boss:4":["The opposing side says exams are stressful, and that's true. But we can ease that by raising the weight of coursework, without abolishing exams.","It admits the other side's reason and offers a specific alternative. No fallacy."],"logic_boss:5":["What we want is fairness, and exams treat everyone the same, so exams are fair.","“Fairness” is quietly swapped for “treating everyone the same.” People in different conditions doing the same thing isn't necessarily fair."],"logic_boss:6":["Either keep all exams, or the school's teaching quality collapses completely. There's no third possibility.","It frames the choices as two extremes, ignoring middle options like reforming exam formats."],"logic_boss:7":["In conclusion, our side believes exams should be kept, but their format can be improved.","This is a closing summary with no new argument and no fallacy."],"ai_a01":["The user put in conception, repeated adjustment and selection, and that intellectual effort deserves some form of protection.","It starts from the user's effort, and the reason is relevant to the conclusion. No fallacy."],"ai_a02":["AI also “creates,” and what it creates is of course a work, and works deserve copyright.","The meaning of “create” quietly shifts: whether human creation and model-generated content are the same thing is exactly the point in dispute."],"ai_a03":["Millions of people are using AI to draw now. With so many users, it should of course be protected.","Many users doesn't mean it should be protected."],"ai_a04":["If AI works aren't protected today, no creator will have motivation tomorrow, and the whole cultural industry will be finished.","It inflates a policy judgment into a chain collapse, with no proof for any step."],"ai_a05":["A tech bigwig said AI works must have copyright. He's an industry leader, so listening to him can't be wrong.","Industry standing isn't legal or ethical correctness. Look at the reasons he gives."],"ai_a06":["You oppose protection because you want everyone who uses AI to labor in vain and earn not a penny?","The other side opposes “copyright protection,” not users earning money. This exaggerates the view and then rebuts it."],"ai_a07":["With no protection at all, commercial users will struggle to invest and creators' motivation will suffer, so clear rules are needed.","It explains the consequences of having no rules and argues for rules. A sound argument."],"ai_a08":["AI art is like photography. When cameras appeared, people said they weren't art either, and who says that now?","There are similarities, but a key difference is skipped: how much of the image the person controls. An analogy needs to explain why the key point is the same."],"ai_a09":["Those against protecting AI works are just illustrators jealous of being replaced.","It guesses the other side's motives instead of answering his arguments."],"ai_a10":["We could distinguish by how much the person contributes: a single-sentence prompt isn't protected, while heavily edited work can be.","It offers a workable criterion that answers the other side's concern. No fallacy."],"ai_a11":["A disabled young man found his confidence through AI art. Can you bear to leave his work unprotected?","It substitutes a touching individual story for an argument."],"ai_a12":["Either protect AI works or you're strangling tech innovation. There's no third path.","It frames the choices as two extremes, ignoring partial protection, registration systems and other options."],"ai_a13":["Copyright exists to encourage creation and distribution. As long as a person's choices and edits show individuality, protection is worth discussing.","It starts from copyright's purpose and adds a condition (showing individuality). No fallacy."],"ai_a14":["You say users have no originality, so please give evidence that they put in no intellectual labor.","The side claiming “should be protected” should first explain where the originality is, instead of demanding the other side prove “none.”"],"ai_a15":["The people who went viral with AI works all made money, so this kind of work deserves protection.","It sees only the ones who went viral, not the many works nobody noticed. Success stories don't show the whole picture."],"ai_a16":["People who oppose protecting AI works are in the same camp as the old guard who opposed cameras, so their words aren't worth hearing.","It rejects the view because of an association with the “old guard.” A view should be judged on its own reasons."],"ai_b01":["Copyright traditionally protects a human's original expression. AI-generated content lacks a human author, so the basis for protection isn't clear.","It points out the premise of copyright theory and says only that the basis is “unclear,” without overstating. No fallacy."],"ai_b02":["This image was generated by AI, so it has no artistic value at all.","It judges value by source alone. Whether a work is good depends on the work itself, not only on how it came about."],"ai_b03":["A few AI pictures I've seen show signs of plagiarism, so all AI works are copied.","A few pictures can't establish “all.” The sample is too small."],"ai_b04":["Protect AI works today, and tomorrow everyone mass-generates them, and the copyright system spirals out of control.","It links “protection” to “spiraling out of control” directly, with the steps in between unproven."],"ai_b05":["Art is an innate human expression of emotion. Machine-made things aren't natural and don't deserve protection.","It treats “natural” as a standard of value. Whether something deserves protection has nothing to do with whether it's “natural.”"],"ai_b06":["Copyright has only ever protected human authors. That's been the rule for centuries and shouldn't change.","That a rule has lasted doesn't mean it can't change with technology."],"ai_b07":["No one can prove AI works have originality, so they simply have none.","Not proven isn't the same as nonexistent. “Not shown to exist” doesn't give “definitely doesn't.”"],"ai_b08":["AI models were trained on huge amounts of other people's work. Settle the licensing of training data first, then talk about protecting outputs.","It points to a prior question and explains the order of handling. No fallacy."],"ai_b09":["People who support protection want machines to replace all human artists, don't they?","The other side only argued for protecting users, not replacing artists."],"ai_b10":["Besides copyright there are other ways, like labeling sources and industry self-regulation, so equal copyright protection may not be needed.","It offers an alternative. Whether it's enough can be discussed, but the argument itself is sound."],"ai_b11":["One side says full protection, the other says none, so compromise: protect for five years. That's fairest.","A compromise isn't automatically right. Where does “five years” come from? We need to see reasons, not just that it falls between the two."],"ai_b12":["Most illustrators oppose protecting AI works. With so many opposing it, there must be something to it.","Many opposing doesn't prove the opposition is right."],"ai_b13":["If a work can be generated from a single prompt, the person's original contribution is tiny, and granting exclusive rights isn't appropriate.","It limits the case (very small contribution) and explains why. No fallacy."],"ai_b14":["A true artist never uses AI. Anyone who uses AI isn't a real creator.","Faced with a counterexample, it redefines the term as “a real X wouldn't do that,” so the claim can never be wrong."],"ai_b15":["Since all AI works are just spliced and copied from training data, of course they have no originality.","“All works are spliced copies” is an absolute claim with no evidence. If the starting point isn't proven, the conclusion can't stand."],"sl_a01":["A streamer closes deals on the strength of their own credibility and earns a commission from it, so they should bear corresponding responsibility for what they recommend.","The reason is direct: whoever enjoys the benefit should bear corresponding responsibility. It's a debatable argument but contains no fallacy."],"sl_a02":["Those elderly people who bought fakes are so pitiful. Can you bear to make them just accept their bad luck?","It uses pity in place of reasons. The elderly being pitiable is true, but whether the streamer should be liable needs separate argument."],"sl_a03":["If streamers aren't liable today, everyone will dare sell fakes tomorrow, and all of e-commerce will collapse in the end.","It links “streamers not liable” straight to “e-commerce collapses,” with no proof for any step."],"sl_a04":["Both times I bought something from a livestream there was a problem, so all livestream selling is a scam.","Two experiences can't establish “all livestream selling.” The sample is too small."],"sl_a05":["Anyone defending the streamers is either a paid shill or a brainless fan.","It attacks the other side's motives and intelligence without answering his arguments."],"sl_a06":["The internet is full of angry voices saying the streamer should take responsibility. What else have you got to say?","Loud angry voices don't make a point valid. The majority's opinion can't replace an argument."],"sl_a07":["Streamers choose the products and know the supply chain better than consumers, so making them liable would push them to review carefully.","It points out the streamer's information advantage and explains what incentive liability creates. A sound argument."],"sl_a08":["There is precedent for ad endorsers being liable for false advertising. Streamers play a similar role, so it can serve as a reference.","It points out the similarity at the key point and says only that it “can serve as a reference,” without overstating. No fallacy."],"sl_a09":["Either the streamer is liable throughout, or consumers are left at the mercy of sellers. There's no other way.","It frames the choices as two extremes, ignoring platform oversight, merchant compensation, insurance and other methods."],"sl_a10":["You say they shouldn't be liable, which means streamers can lie freely and nothing happens, right?","The other side only opposed “full liability,” not said lying is fine. This distorts the other side's view."],"sl_a11":["A famous lawyer said on a show that streamers should be jointly liable. He's a lawyer, so could he be wrong?","It borrows only a professional title without giving specific legal grounds and reasons."],"sl_a12":["Those who oppose streamer liability are in the same camp as the merchants who sold fake medicine back then. Can their words be trusted?","It rejects a view because of its association with a disreputable group. A view should be judged on its own reasons."],"sl_a13":["Liability doesn't mean unlimited liability. It can be divided by whether they knew and whether they met their duty to review, protecting consumers without crushing streamers.","It offers a qualified plan and answers the other side's biggest worry. No fallacy."],"sl_a14":["You've never sold a single item. What gives you the right to say streamers shouldn't be liable?","Whether you've ever sold has nothing to do with whether streamers should be liable. Whether a criticism holds depends on reasons."],"sl_a15":["No one can prove this tea is harmless, so it must be harmful, and the streamer should be liable.","Not proven harmless doesn't mean proven harmful. What's needed is evidence that it's harmful."],"sl_b01":["Streamers neither make the products nor have testing facilities. Making them guarantee quality goes beyond their ability.","It points out that responsibility doesn't match capability, a reason related to the conclusion. No fallacy."],"sl_b02":["I say this face mask is safe and effective. You say it isn't, so please bring evidence to prove it.","Whoever makes the claim should provide the proof first. Giving no basis yourself while demanding others prove it wrong turns the burden around.","Whoever claims, proves."],"sl_b03":["The platform has already strictly inspected every product, so streamers don't need to worry about quality at all.","That premise may not hold: platform review isn't inspecting every single item. If the starting point is wrong, the conclusion can't stand."],"sl_b04":["Livestream selling has always been done this way. The industry norm is that streamers aren't liable, so why change it?","“It's always been this way” doesn't show it's reasonable. Norms can be flawed."],"sl_b05":["Our company's legal director said streamers don't have to be liable. He knows the law, so just listen to him.","It invokes only a job title without giving legal grounds. His position may also be tied to the company's interests."],"sl_b06":["Since calls for streamer liability grew louder, many small streamers have lost their jobs, so the liability demand wrecked the industry.","Two things happening in sequence doesn't mean one caused the other. Small streamers losing jobs may also be tied to competition and traffic."],"sl_b07":["You never read reviews yourself when you shop online, do you? Why blame only the streamer?","It dodges the question by pointing at the other person's behavior. Whether consumers read reviews is a separate matter from whether streamers should be liable."],"sl_b08":["Why discuss liability now? Go deal with those merchants who fake their sales first!","Fake sales volume is another problem. This changes the subject."],"sl_b09":["Consumers can claim compensation directly from merchants and platforms. There's already a remedy, so there's no need to add a layer of streamer liability.","It offers an existing alternative. It can be rebutted (merchants can be hard to hold accountable), but the argument itself is sound."],"sl_b10":["Either streamers have no liability at all, or the whole livestream industry shuts down. Which do you choose?","It frames the choices as two extremes, ignoring middle options like sharing liability by situation."],"sl_b11":["Streamers stay up late every night earning hard-earned money. You still want to make them take the blame. Can you live with that?","It uses sympathy in place of reasons. Working hard doesn't mean being free of responsibility."],"sl_b12":["All three streamers I know were cheated by merchants, so streamers are really all victims.","Three examples can't establish “all streamers.” The sample is too small."],"sl_b13":["Of course they're liable if they recommend a product they know is flawed. But for quality problems they couldn't know about, streamers shouldn't bear the same liability as merchants.","It distinguishes “knowing” from “not knowing” and offers a qualified claim. No fallacy."],"sl_b14":["A streamer who has checked the product's qualifications and test reports has already met a reasonable duty of care.","It gives a standard that can be judged. Whether the standard is enough can be debated, but the argument itself is sound."],"sl_b15":["Did a competitor pay you, to make you so insistent that streamers be liable?","The question assumes “a competitor paid you.” Whether the answer is yes or no, it accepts that premise."],"sl_b16":["One side says streamers are fully liable, the other says not at all, so compromise: bear half. That's fairest.","A compromise isn't automatically right. How is “half” calculated? We need reasons, not just that it sits between two extremes."],"sl_b17":["This doubt came out of a rumor-mill account, so ignore it.","It dismisses the content by its source alone. A source can remind you to check more, but it can't replace checking."],"live_boss:0":["Fam, welcome to the stream. Tonight I'm introducing a new product.","This is just an opening line. It makes no argument, so there's no fallacy."],"live_boss:1":["This tea lowers blood pressure. Don't believe it? Then show evidence that it can't.","Whoever makes the claim should provide the proof. Giving no basis yourself while demanding that others prove it “can't” turns the burden around."],"live_boss:2":["It's all natural, so it's absolutely safe. Drink without worry.","“Natural” doesn't mean “safe.” Many poisons come from natural plants."],"live_boss:3":["Since the state long ago certified that all health teas work, this one of course works too.","The premise itself is wrong: there is no such certification. If the starting point doesn't hold, the conclusion can't stand."],"live_boss:4":["Drinking tea is like maintaining your blood vessels, like changing the oil in a car. Of course the earlier the better.","Blood vessels and car engines aren't alike in the ways that matter, so the analogy itself doesn't hold."],"live_boss:5":["People who doubt us are exactly like those haters who smear the livestream industry.","It rejects the doubters' questions because they're “the same as” some group. Whether a doubt is valid depends on its reasons."],"live_boss:6":["Every order comes with a seven-day no-questions-asked return, so if you're not satisfied, you can send it back.","This is a concrete after-sales policy, not reasoning, so there's no fallacy."],"live_boss:7":["Last hour! Once it's sold out, it's gone. Fam, grab it fast!","This is a sales tactic, not reasoning, so it doesn't count as a logical fallacy. But beware the urgency it creates."],"bb_a01":["The core of a blind box is uncertainty. Minors' self-control and judgment are still developing, so they're more likely to buy repeatedly, which calls for stricter limits.","It starts from the characteristics of minors, a reason related to the conclusion. No fallacy."],"bb_a02":["My nephew spent two thousand yuan in a month on blind boxes, which shows how harmful blind boxes are to kids.","It draws “very harmful” from one child's case. An individual case can't represent the whole; more data is needed."],"bb_a03":["Open blind boxes today, learn to gamble tomorrow, lose everything the day after.","Every step is called inevitable without proof. Blind boxes aren't gambling, and gambling doesn't always mean ruin."],"bb_a04":["Think of the kids who've spent all their allowance. As adults, can you live with yourselves?","It uses guilt in place of reasons. Whether restrictions are needed has to be argued with data and rules."],"bb_a05":["For draws where price and odds aren't transparent, the odds should be required to be disclosed so consumers can choose with full knowledge.","It proposes a specific regulatory requirement and states its purpose. No fallacy."],"bb_a06":["Ever since someone in our class started playing lucky bags, our class's grades have dropped, so lucky bags affect studying.","One thing following another doesn't mean one caused the other. Grades may drop for many reasons; other factors need to be ruled out."],"bb_a07":["You oppose restrictions because you want all the kids to go gamble, right?","The other side opposes “restrictions” and never said kids should gamble. This distorts the other side's view."],"bb_a08":["If surveys show minors spend a large share of their allowance on blind boxes, that shows action is needed.","It bases the conclusion on a testable condition without deciding in advance. No fallacy."],"bb_a09":["An education expert said blind boxes are child gambling, so they must be banned.","It invokes only the expert's title without argument. “Blind boxes are gambling” itself needs to be explained."],"bb_a10":["Anyone speaking up for blind boxes must be a merchant making money off them.","It guesses the other side's motives instead of answering his arguments."],"bb_a11":["All three studies I found say blind boxes make kids more impulsive. The others saying little effect have too-small samples, so ignore them.","It accepts only the studies that favor it and dismisses opposing results outright. “Sample too small” needs specifics, not a brush-off."],"bb_a12":["Nine in ten people addicted to gambling-style draws started with blind boxes, so a kid who buys a blind box has a nine in ten chance of getting addicted.","It mixes up the two directions of probability: most addicts having bought blind boxes doesn't mean most blind-box buyers become addicts. You also need to know how many people buy blind boxes."],"bb_a13":["We could set a monthly spending cap for minors and require parental confirmation, which is easier to enforce than a blanket ban.","It offers a concrete, enforceable way to restrict, answering the “blanket ban” worry. No fallacy."],"bb_a14":["Either ban minors from buying entirely, or watch them get hooked. There's no other way.","It frames the choices as two extremes, ignoring spending caps, parental confirmation, odds disclosure and more."],"bb_b01":["Guardians are the first line of responsibility for minors' spending. Platforms provide reminders and tools, and parents managing payments is enough.","It points out the existing division of responsibility, a reason tied to the conclusion. Whether it's enough can be debated, but the argument itself has no fallacy."],"bb_b02":["I bought eleven in a row without getting the hidden edition, so the twelfth is sure to hit!","Whether each blind box wins is independent. Not winning before doesn't make winning later more likely. Dice have no memory.","Dice have no memory."],"bb_b03":["Three people in a row have pulled a common item from this series, so the next one is definitely the hidden edition.","Each draw is independent. Several people before not winning doesn't make the next person “due.”"],"bb_b04":["Everyone who posts their hidden-edition pull says it was worth it, so opening blind boxes is a sure win.","It sees only those who won and chose to post, not the many more who didn't win and didn't post."],"bb_b05":["I collected cards as a kid too and I'm fine now, so blind boxes are fine for kids.","It uses one person's own experience in place of evidence. He's fine, but that doesn't mean others are."],"bb_b06":["Instead of banning it, require disclosing the odds and add platform spending reminders, so kids and parents can both make judgments.","It offers an alternative and states the purpose. Whether it's enough can be discussed, but the argument itself is sound."],"bb_b07":["Tens of millions of people nationwide play blind boxes. With that many playing, what could be the problem?","Many people playing doesn't mean there's no problem."],"bb_b08":["Restrict blind boxes today, restrict games tomorrow, restrict all spending the day after, and kids can't buy anything.","It links one restriction straight to “can't buy anything,” with the steps in between unproven."],"bb_b09":["Those who support restrictions are old fogies who can't play and won't let others play either.","It sticks a label on the other side without answering his arguments."],"bb_b10":["After blind box sales rose, the juvenile crime rate fell, so blind boxes make kids better behaved.","Two numbers changing at the same time doesn't mean one causes the other. Many factors affect crime rates."],"bb_b11":["To decide whether to restrict, we need real data: minors' average spending, repeat purchase rate, and whether it affects studies.","It names the evidence needed to decide without deciding in advance. No fallacy."],"bb_b12":["The surveys I've seen all say parents are tolerant. The ones saying parents are worried are just deliberately smearing.","It accepts only the surveys that favor it and calls opposing results “smearing” without giving reasons."],"bb_b13":["Instead of policing blind boxes, deal with game top-ups first, that's where the real money goes!","Game top-ups are another topic. This steers the discussion away."],"bb_b14":["Minors also need to learn to manage money. Cutting them off entirely takes away the chance to practice at low risk.","It raises an overlooked value and limits it to “low-risk” situations. No fallacy."],"tk_a01":["For health-related products, once someone is harmed, pausing sales first and then finding the cause minimizes potential harm.","The reason is direct: the risk may be bodily harm, and pausing first prevents it from spreading. It can be debated, but the argument itself has no fallacy."],"tk_a02":["He drank the tea and was hospitalized the next day. If the tea didn't do it, is it just a coincidence?","One thing following another doesn't mean one caused the other. His hospitalization could be due to an underlying condition or other medication, which must be ruled out before concluding."],"tk_a03":["My coworker's mom got dizzy after drinking this tea. Isn't that enough to show there's a problem?","It uses one person's experience in place of evidence. Dizziness has many possible causes, and we need more controlled comparisons."],"tk_a04":["There are already two hundred complaints. A number that big shows the problem is serious.","It gives only the raw number, not how many people bought. Two hundred among two million buyers means something very different than among two thousand.","What's the denominator?"],"tk_a05":["Think of the elderly people who were cheated. Can you bear to let this tea keep being sold?","It uses pity in place of reasons. The elderly being pitiable is true, but whether the tea is harmful needs evidence."],"tk_a06":["The test says this batch of tea is over the limit, and the test is 99% accurate, so there's a 99% chance this batch is harmful.","It ignores the base rate: if harmful tea is very rare to begin with, then even with an accurate test, a large share of positive results are still false alarms."],"tk_a07":["Anyone speaking up for this tea is either one of the merchant's people or a streamer who took a red envelope.","It guesses the other side's motives instead of answering his arguments."],"tk_a08":["Taking it down is only a temporary measure, not a conviction. If the investigation finds nothing wrong, it can be restored right away, so the cost is manageable.","It points out that a takedown is reversible, answering the other side's main concern. No fallacy."],"tk_a09":["Of the three test reports, only one found excess ingredients, and that one is the most reliable. The other two that found nothing must have used the wrong method.","It trusts only the one report that favors it and dismisses the opposing results as “wrong method.” Why the other two are unreliable needs reasons."],"tk_a10":["Complaints with hospital records and purchase records should be checked first. That kind of material is more reliable than mere hearsay.","It offers a way to distinguish the quality of evidence without lumping all complaints together. No fallacy."],"tk_a11":["The doctor blogger on the trending list said this tea is poisonous. He has three million followers, so could he be wrong?","Many followers don't equal professional reliability, and no test basis is given."],"tk_a12":["Either take it down now, or you don't care about consumers' lives. There's no third choice.","It frames the choices as two extremes, ignoring warnings, limiting promotion, expedited checks and other middle options."],"tk_a13":["This brand hasn't had a problem in three years, so it's surely due for one this time.","Not having had a problem in the past doesn't make this time “more due.” Each case's quality is assessed independently; there's no “due.”"],"tk_a14":["Platforms have a duty to set up a fast-check mechanism, such as an initial conclusion within 24 hours, so a takedown doesn't become a long-term ban.","It proposes a supporting mechanism that answers the worry that “takedowns destroy merchants.” No fallacy."],"tk_b01":["A single complaint isn't a conclusion. Verify the purchase record and test results first, then decide how to handle it. That's fair to merchants and consumers alike.","It explains why to verify first and considers both sides' interests. No fallacy."],"tk_b02":["The comments are full of praise, which shows that everyone who drank it is fine.","It sees only the people willing to leave comments. Those who were harmed or stopped using it may not show up in the comments. The comment section isn't all users."],"tk_b03":["Our company's testing department said it's fine. They're professionals, so stop doubting.","It invokes only the “professional” title without giving specific test data, and the testing department's interests are tied to the company's."],"tk_b04":["You mean that anytime someone complains, the merchant can just be destroyed, right?","The other side argued for “pause first,” not for destroying the merchant. This distorts the other side's view."],"tk_b05":["That person who complained is obviously a paid troll hired by a competitor. Ignore them.","It doesn't check the content and instead guesses the complainer's identity. Whether a complaint is true depends on evidence."],"tk_b06":["Since this tea hit the trending list, sales have tripled, which shows the merchant bought the trending spot, and the complaints are all fake.","Rising sales can have many causes, and it doesn't prove the complaints are fake. This forces two things into a cause-and-effect link."],"tk_b07":["A takedown can cause irreversible losses to the merchant. When evidence is insufficient, we can first label the risk, limit promotion, and expedite the check.","It offers a concrete middle path between the two extremes, with reasons. No fallacy."],"tk_b08":["I read the first twenty comments, and nineteen say it's fine. That one complaint is just an exception and doesn't count.","It picks only the comments that favor it and excludes the opposing one outright. The sample is tiny and wasn't drawn at random."],"tk_b09":["My mom has drunk this tea for three months and her blood pressure is steady, so the tea is fine.","It uses one person's experience in place of evidence. One person being fine doesn't show everyone is fine."],"tk_b10":["For claims like “was hospitalized after drinking it,” other causes must be ruled out first, such as whether they already had an underlying condition or took other medication.","It points out the confounding factors that must be ruled out, a rigorous approach. No fallacy."],"tk_b11":["Take it down over one complaint today, and tomorrow anyone can use complaints to bring down rivals, and the market goes haywire.","It goes straight from one takedown to “the market goes haywire,” with the steps in between unproven."],"tk_b12":["Platforms have always investigated first and acted after. That's the industry norm, so there's no need to change.","“It's always been this way” doesn't show it's still appropriate in this situation."],"tk_b13":["Handle it in tiers: take it down immediately when there's clear evidence of health risk, otherwise add a warning and then verify.","It offers a conditional tiered approach, not a simple compromise but a reasoned one. No fallacy."],"tk_b14":["You never read test reports yourself when you shop online. Who are you to act like an expert now?","It dodges the question by pointing at the other person's behavior. Whether he reads test reports has nothing to do with how the platform should handle this."],"trending_boss:0":["Fam, tonight I'm going to reveal the truth about the Blood Pressure Tea.","This is an opening line. It makes no argument, so there's no fallacy."],"trending_boss:1":["Two hundred people complained, two hundred! Isn't that number scary enough?","It gives only the raw number, not how many people bought. Two hundred among two million buyers means something very different than among two thousand."],"trending_boss:2":["I've scrolled the comments for three days straight, and every day they're all praise. There's bound to be a bad review today.","Whether each comment is good or bad is independent. Praise before doesn't make a bad review “due” later."],"trending_boss:3":["Those who stay in the comment section to talk are mostly people who found it useful. We should go ask the ones who didn't speak.","It points out the bias that “only those who stay will speak.” That's guarding against survivorship bias, so this line has no fallacy."],"trending_boss:4":["I interviewed three people around me, and they all got diarrhea after drinking it, so everyone who drinks it will get diarrhea.","It draws “everyone” from three people. The sample is too small and wasn't randomly drawn."],"trending_boss:5":["We counted only the seven cases where something went wrong. The millions of people who had no problem don't need to be counted.","It picks only the cases that support its conclusion and skips the vast majority who had no problem."],"trending_boss:6":["As soon as I posted the expose, the brand's customer service line got flooded, so the tea must have a problem.","The flood of calls was most likely brought in by this very post, not evidence that the tea is flawed. It treats the effect as the cause."],"trending_boss:7":["Final note: all of the above is just my questions and doesn't amount to any conclusion. Repost as you like.","This is a disclaimer, not reasoning, so it isn't a logical fallacy. (Though it is leaving himself a way out.)"],"ap_a01":["When something goes wrong, acknowledge it and apologize first to show you take the affected people seriously, while saying you're investigating. That isn't accepting all the blame.","It separates “apologizing” from “accepting liability,” with a clear reason. No fallacy."],"ap_a02":["Look at all those angry consumers in the comments. Don't you feel for them at all?","It uses sympathy in place of reasons. Whether to apologize immediately has to be decided by weighing pros and cons, not by “feeling for” people."],"ap_a03":["We've already spent two million on our brand image. If we don't apologize now, isn't that money wasted?","Money already spent can't be recovered and shouldn't decide whether to apologize now. What matters is what's better from here on."],"ap_a04":["Last time you handled a complaint, didn't you drag your feet too? What gives you the right to say we should investigate first now?","It dodges the question by pointing to the other person's past behavior. What he did last time is a separate matter from what to do this time."],"ap_a05":["If we don't apologize today, the whole internet boycotts us tomorrow, and the company goes bankrupt the day after.","It goes straight from not apologizing to bankruptcy, with no proof for any step in between."],"ap_a06":["Common PR wisdom says the earlier you apologize the better. Of course, last year we didn't apologize, but that case was special.","Faced with a counterexample, it says “that case was special” without saying why. That way the rule can never be refuted."],"ap_a07":["The statement can simply state the facts: complaints received, investigation underway, when results will be released. It takes a stand without presuming a conclusion.","It gives a concrete, workable approach that addresses both sides' concerns. No fallacy."],"ap_a08":["Either apologize right now, or you don't care about consumers' health. There's no other choice.","It frames the choices as two extremes, ignoring the middle approach of speaking up first and investigating after."],"ap_a09":["A big name in PR said apologizing immediately is the golden rule, so listening to him can't be wrong.","It invokes only the “big name” without giving reasons or showing it applies this time."],"ap_a10":["What's the point of discussing whether to apologize now? Let's talk about what to do with last month's inventory!","Inventory is a separate matter. This steers the discussion away."],"ap_a11":["The longer the information vacuum lasts, the more easily rumors fill it, so speaking up right away has value.","It points out a specific mechanism, a reason tied to the conclusion. No fallacy."],"ap_a12":["Even if you publish the test report, I want to see the raw material suppliers. If you publish the suppliers, I want to see every worker's name.","Each time a condition is met, a new one is added. That standard can never be met."],"ap_a13":["Apologizing and assigning blame don't conflict: apologize publicly first to calm emotions, then assign blame once the investigation is in.","It puts the two things in order, answering the worry that “apologizing implicates responsibility.” No fallacy."],"ap_b01":["Apologizing before the facts are clear can take on responsibility that isn't yours. Saying we're investigating first and giving a conclusion later is safer.","It points out the risk of a hasty apology and offers an alternative. No fallacy."],"ap_b02":["If this tea really had a problem, the company would be finished, so it can't have a problem, and there's no need to apologize.","It decides “no problem” because the consequences of “a problem” are too bad. The facts must be answered by testing, not by looking at consequences."],"ap_b03":["Other companies in the industry all apologize when something goes wrong, but our company's situation is special, so we don't have to.","The rule applies to others but is an “exception” for itself, without explaining why."],"ap_b04":["We spent three million advertising this tea. Apologizing now would be admitting that money was wasted, wouldn't it?","Money already spent can't be recovered and can't be used to decide whether to apologize."],"ap_b05":["Now is not the time to dwell on apologies. We should focus on the competitor's new product this month!","The competitor's new product is a separate topic. This steers the discussion away."],"ap_b06":["Didn't your expense report from last month have problems too? What gives you the right to blame the company now?","It dodges the question by pointing to the other person's own problem. His expense report has nothing to do with whether to apologize."],"ap_b07":["If sales drop by half, we'll apologize. Sales dropped by half, so I said it had to be thirty percent. At thirty percent, I said we'd see next quarter.","Once the condition is met, the condition is raised. That standard will never be triggered."],"ap_b08":["If the investigation finds the product is fine, an apology already issued is hard to take back, so investigating first makes sense.","It points out that an apology is irreversible, a reason tied to the conclusion. No fallacy."],"ap_b09":["Legal said apologizing now carries legal risk. Legal is professional, so just listen to them.","It invokes only the “professional” title without saying what the specific legal risk is."],"ap_b10":["You mean no matter whether there's a problem, we have to get down on our knees and apologize first, right?","The other side argued for “apologize first, investigate after,” not “kneel no matter whether there's a problem.”"],"ap_b11":["Apologize at the first complaint today, and tomorrow anyone can use complaints to blackmail the company.","It goes straight from one apology to “everyone blackmails us,” with no proof for the steps in between."],"ap_b12":["The wording of an apology must be careful: distinguish “expressing regret to those affected” from “admitting the product is faulty,” showing empathy without misleading.","It offers a distinction-based approach without overstating. No fallacy."],"ap_b13":["I've seen three companies' stock fall after an apology, so apologies always hurt the company.","It draws “always” from three examples. The sample is too small, and other causes weren't considered."],"ap_b14":["Either admit fault now and ruin the brand, or wait a bit. There's no other way.","It reduces the choices to two, ignoring other approaches like speaking up without accepting blame."],"ap_b15":["The statement should include a timetable: when the investigation results will be released, so the public has something to expect and hold us to.","It adds a concrete way to make the statement credible. No fallacy."],"pl_a01":["Whether to continue the product line should depend on future returns and risks. If it can be fixed to comply and rebuild its reputation, continuing is still worthwhile.","It bases the judgment on the future and isn't held hostage by past investment. No fallacy."],"pl_a02":["We've already put five million into this line. If we shut it down now, isn't it all gone down the drain?","The five million is already spent and can't be recovered whether we stop or not. What should be compared is whether the benefit of continuing exceeds the cost from now on."],"pl_a03":["The team has worked for two years to get here. Can we face them if we give up now?","It uses the two years already invested and a sense of guilt in place of a judgment about the future."],"pl_a04":["If this line is shut down, thirty colleagues lose their jobs, so it can't have a problem.","It decides “no problem” because the consequences of “a problem” are too bad. Bad consequences can't make the problem disappear."],"pl_a05":["If we admit the tea doesn't work, all our earlier promotion becomes a joke, so it must work.","It decides it works because admitting otherwise would be embarrassing. Whether it works has to be shown with evidence."],"pl_a06":["Other companies stop making products when problems arise. Ours is different; we have heart.","The rule applies to others but is an exception for itself, with the only reason being “we have heart.”"],"pl_a07":["Hitting a hundred thousand in sales counts as success. At a hundred thousand, I said two hundred thousand; at two hundred thousand, I said wait for repurchase. So we should keep going.","Each time we get close to the goal, the goal changes. “Not successful yet” forever means a reason to continue forever."],"pl_a08":["Anyone who wants to shut down the product line doesn't understand the business and only knows how to count money.","It attacks the proposer's competence without answering his argument."],"pl_a09":["We could pause promotion and fix the labeling and credentials first, then evaluate whether to continue, without deciding life or death in one go.","It offers a step-by-step approach addressing both sides' concerns. No fallacy."],"pl_a10":["A product line is like a child. What parent gives up on their own child so easily?","A child and a product line aren't alike in the ways that matter: a product line's returns can be evaluated, and losses can be cut."],"pl_a11":["I know three companies that kept going after a crisis and all turned around, so we'll turn around too.","It sees only the companies that recovered, not the many more that continued and didn't."],"pl_a12":["We should compare this line's repurchase and complaint rates with similar products, not just look at this one trending incident.","It proposes a more reasonable benchmark. No fallacy."],"pl_a13":["Why talk about the product line now? Let's settle the website redesign first!","The website redesign is a separate topic. This steers the discussion away."],"pl_a14":["The cost of shutting down includes inventory, penalties and placing the team, and these should be worked out together with the risk of continuing.","It asks that both sides' costs be worked out without presuming a conclusion. No fallacy."],"pl_b01":["The precondition for continuing is controllable risk and compliant profitability. With the reputation damaged and compliance in doubt, the return on further investment isn't clear.","It states the conditions for continuing and points out they aren't met now. No fallacy."],"pl_b02":["Anyone who wants to continue is just unwilling to lose face and afraid to admit a mistake.","It guesses the other side's motives instead of answering his arguments."],"pl_b03":["Two companies I've seen didn't recover after a crisis, so shutting down this kind of product line is right.","It draws a conclusion from two examples. The sample is too small, and no other companies were compared."],"pl_b04":["If we don't shut this line down today, it'll drag down the whole company tomorrow.","It goes straight from not shutting this line down to “dragging down the company,” with no proof for the steps in between."],"pl_b05":["Think of the users we misled. How can we keep selling with a clear conscience?","It replaces analysis with guilt. Whether to continue requires comparing the returns and risks after a fix."],"pl_b06":["Company policy says off-budget projects need approval, but I support the shutdown plan, so it doesn't need approval.","The rule applies to others but becomes an exception for the plan it supports, with no reason given."],"pl_b07":["You say it can continue once fixed. It's fixed, so I say third-party certification. Certified, so I say three months of reputation data.","Each time a condition is met, it's raised. That standard can never be met."],"pl_b08":["Sunk costs shouldn't affect decisions. The five million is already spent. All that counts now: from today on, does the benefit of continuing exceed the cost?","It clearly separates costs already spent from future benefits. No fallacy."],"pl_b09":["Didn't your last project get shut down because it lost money? What gives you the right to urge us to continue?","It dodges the question by pointing to the other person's past experience."],"pl_b10":["The consulting firm said this kind of product line will definitely lose money within three years, so don't doubt it.","It invokes only the consulting firm without giving the basis. A claim like “definitely lose” also needs evidence."],"pl_b11":["You mean we can't stop no matter how much money we lose, right?","The other side only argued to evaluate first and then decide, not “can't stop no matter how much we lose.”"],"pl_b12":["Either we stop now or the company goes bankrupt. Those are the only two roads.","It frames the choices as two extremes, ignoring fixes, scaling down, and other methods."],"pl_b13":["We could set a clear stop-loss line and review checkpoints, for example stopping if repurchase rate misses the target within two quarters.","It sets a standard agreed in advance and testable. No fallacy."],"pl_b14":["I only looked at the month with the biggest loss, and that's enough to show this line can't be saved.","It picks only the worst month and ignores the overall trend."],"pl_b15":["Shutting down doesn't mean rejecting the team. We can reassign core members to a compliant new line, which is responsible toward people.","It answers the worry about “letting the team down” and offers a concrete arrangement. No fallacy."],"crisis_boss:0":["Everyone, I called you here today for one thing: this crisis is one we'll get through together.","This is an opening statement that sets out the purpose. It makes no argument, so there's no fallacy."],"crisis_boss:1":["If this tea really had a problem, the company would be finished, so I believe it has no problem at all.","It decides “no problem” because the consequences of “a problem” are too bad. The facts must be answered by testing, not by looking at consequences."],"crisis_boss:2":["We've already put in three million. Stopping now would waste it all, so we must continue.","The three million is already spent and can't be recovered whether we stop or not. What should be compared is whether the benefit of continuing exceeds the cost from now on."],"crisis_boss:3":["Compliance procedures matter for others, but this time we're short on time and our situation is special, so we can skip them for now.","The rule applies to others but becomes an “exception” for itself, with the only reason being “short on time.” Being short on time isn't a reason to skip compliance."],"crisis_boss:4":["We need to establish the facts first, then decide who's responsible. That's basic fairness.","This is a reasoned claim: facts first, then blame. No fallacy."],"crisis_boss:5":["Let's not talk about our responsibility. The competitor's new product last month had far bigger problems than ours.","It dodges its own problem with “others are worse.” Whether a competitor has problems doesn't show we don't."],"crisis_boss:6":["The goal was to suppress the negativity within three days. Once suppressed, we changed it to a week. When the week came, we changed it to this month, so we've been on plan all along.","Each time the goal is about to be met or missed, it's quietly changed. By that standard, we're always “on plan.”"],"crisis_boss:7":["Before we adjourn, let me stress once more: please check the minutes together after the meeting.","This is meeting logistics, not an argument, so there's no fallacy."],"ds_a01":["Publishing all test data, so third parties can independently verify it, rebuilds public trust better than a one-sided “conclusion.”","It explains the link between publishing data and rebuilding trust. No fallacy."],"ds_a02":["The affected families are waiting for an explanation. As a company, can you bear to keep hiding things?","It uses sympathy in place of reasons. Whether to publish all the data has to be answered by weighing pros and cons."],"ds_a03":["What exactly are you trying to hide, that you won't publish all the data?","The question assumes “you're hiding something.” Any answer accepts that premise."],"ds_a04":["This company is dishonest overall, so every one of its test reports can't be trusted.","It applies a judgment about the whole directly to every part. Whether a report is trustworthy depends on that report's own methods and data."],"ds_a05":["We compared a hundred reports, slicing them many ways, and found that batches shipped on Fridays had the highest failure rate, which shows Friday-shipped products have a problem.","Try enough ways of slicing the data and you'll find som

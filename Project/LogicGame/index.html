de":"B","angle":"证据","subtlety":2,"text":"我看的几项调查都说家长很宽容；那几项说家长担心的，都是在故意抹黑。","fallacy":"cherry_picking","explain":"只采纳对自己有利的调查，把相反的结果说成“抹黑”，却没有给出理由。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_b13","side":"B","angle":"话题","text":"与其管盲盒，不如先管管游戏充值，那才是花钱的大头！","fallacy":"red_herring","explain":"游戏充值是另一个话题，这是把讨论岔开了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_b14","side":"B","angle":"自主","text":"未成年人也需要学习管理金钱，完全隔绝，反而失去了在低风险下练习的机会。","fallacy":null,"explain":"提出了一个被忽视的价值，并限定在“低风险”的情形下。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null}],"chapter":"trending"},{"id":"takedown","title":"热搜上有人投诉降压茶，平台该不该先下架再调查？","scene":"一条“喝了降压茶住院”的帖子冲上了热搜第一，评论区瞬间吵翻了天。","tags":["网络","平台"],"sides":{"A":"先下架再调查","B":"先调查再决定"},"opponents":{"A":"dav","B":"jizhe"},"statements":[{"id":"tk_a01","side":"A","angle":"风险","opener":true,"text":"涉及健康的商品，一旦有人出事，先暂停销售、再查清原因，能把潜在的伤害降到最低。","fallacy":null,"explain":"理由直接：风险可能是人身伤害，先暂停能避免扩大。可以讨论，但论证本身没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_a02","side":"A","angle":"因果","text":"他喝了降压茶，第二天就住院了，不是茶害的，难道是巧合？","fallacy":"false_cause","explain":"先后发生不等于因果。他住院还可能因为基础病、别的药物，需要排查后才能下结论。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_a03","side":"A","angle":"经历","text":"我同事的妈妈喝了这茶就头晕，这还不够说明问题吗？","fallacy":"anecdotal","explain":"用一个人的经历代替证据。头晕可能有很多原因，需要更多的对照。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_a04","side":"A","angle":"数据","subtlety":2,"text":"已经有两百条投诉了，这么大的数字，说明问题很严重。","fallacy":"base_rate","explain":"只报绝对数字，不说总共有多少人买。两百条放在两百万买家里，和放在两千买家里，意思完全不同。","quip":"分母是多少？","opener":false,"accept":[],"decoys":[],"punch":null},{"id":"tk_a05","side":"A","angle":"情感","text":"想想那些被骗的老人，你忍心让这茶继续卖下去吗？","fallacy":"appeal_to_emotion","explain":"用同情代替理由。老人可怜是事实，但茶是否有害，需要证据来说明。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_a06","side":"A","angle":"数据","subtlety":3,"text":"检测说这批茶超标，这种检测有 99% 的准确率，所以这批茶有 99% 的可能有害。","fallacy":"base_rate","explain":"忽略了基础比率：如果有害的茶本来就极少，即使检测很准，阳性结果里仍有很大一部分是误报。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_a07","side":"A","angle":"动机","text":"替这款茶说话的，要么是商家的人，要么是收了红包的主播。","fallacy":"ad_hominem","explain":"揣测对方的动机，代替了回应他的论据。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_a08","side":"A","angle":"平台","text":"下架只是暂时措施，不是定罪。查清楚没问题，可以立即恢复，代价相对可控。","fallacy":null,"explain":"指出了下架的可逆性，回应了对方的主要顾虑。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_a09","side":"A","angle":"证据","subtlety":3,"text":"三份检测报告里，只有一份发现了超标成分，这份最靠谱；另外两份没发现的，肯定是方法不对。","fallacy":"cherry_picking","explain":"只相信对自己有利的那一份，把相反的结果直接说成“方法不对”。其余两份为什么不可信，需要给出理由。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_a10","side":"A","angle":"证据","text":"投诉里附有住院证明和购买记录的，应当优先核查，这类材料比单纯的转述更可靠。","fallacy":null,"explain":"提出了区分证据质量的做法，没有把所有投诉一概而论。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_a11","side":"A","angle":"权威","text":"热搜上的医生博主说了，这茶有毒。他有三百万粉丝，还能有错？","fallacy":"appeal_to_authority","explain":"粉丝多不等于专业可靠，也没有给出检测依据。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_a12","side":"A","angle":"选择","text":"要么现在下架，要么就是对消费者的生命不负责，没有第三种选择。","fallacy":"false_dilemma","explain":"把选择说成两个极端，忽略了加警示、限制宣传、加急核查等中间办法。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_a13","side":"A","angle":"概率","subtlety":2,"text":"这个品牌三年都没出过事，这次肯定轮到出事了。","fallacy":"gamblers_fallacy","explain":"过去没出事，不会让这次“更该出事”。每一次的质量情况是独立评估的，不存在“轮到”。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_a14","side":"A","angle":"平台","text":"平台有责任建立快速核查的机制，比如 24 小时内给出初步结论，让下架不至于变成长期封杀。","fallacy":null,"explain":"提出了配套机制，回应了“下架会毁掉商家”的担忧。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_b01","side":"B","angle":"证据","opener":true,"text":"一条投诉不等于结论，先核实购买记录和检测结果，再决定怎么处理，对商家和消费者都公平。","fallacy":null,"explain":"说明了先核实的理由，并考虑了双方利益。没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_b02","side":"B","angle":"数据","subtlety":2,"text":"评论区里一片好评，说明喝了的人都没事。","fallacy":"survivorship","explain":"只看到了愿意留言的人。出事的、已经停用的人，未必会出现在评论区里。评论区不等于全部使用者。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_b03","side":"B","angle":"权威","text":"我们公司的检测部门说没问题，他们是专业的，你们别再质疑了。","fallacy":"appeal_to_authority","explain":"只搬出“专业”的头衔，没有给出具体检测数据，而且检测部门与公司利益相关。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_b04","side":"B","angle":"动机","text":"你们的意思是，只要有人投诉，就可以直接把商家搞垮，对吧？","fallacy":"straw_man","explain":"对方主张的是“先暂停”，并没有说要搞垮商家。这是把对方的观点扭曲了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_b05","side":"B","angle":"动机","text":"那个投诉的人，一看就是竞品雇来的水军，不用理会。","fallacy":"ad_hominem","accept":["genetic"],"explain":"不去核实内容，而是揣测投诉者的身份。投诉是否属实，要看证据。","opener":false,"subtlety":1,"decoys":[],"quip":"","punch":null},{"id":"tk_b06","side":"B","angle":"因果","subtlety":2,"text":"自从这茶上了热搜，销量涨了三倍，可见热搜是商家自己买的，投诉都是假的。","fallacy":"false_cause","explain":"销量上涨可以有很多原因，也不能证明投诉是假的。这是把两件事硬连成因果。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_b07","side":"B","angle":"平台","text":"下架可能给商家造成不可逆的损失，证据不足时，可以先标注风险、限制宣传，再加急核查。","fallacy":null,"explain":"提出了介于两个极端之间的具体做法，并说明了理由。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_b08","side":"B","angle":"证据","subtlety":2,"text":"我看了前二十条评论，十九条说没事，那一条投诉只是例外，不算数。","fallacy":"cherry_picking","accept":["hasty_generalization"],"explain":"只挑对自己有利的评论，把相反的那一条直接排除。样本很小，也不是随机抽取的。","opener":false,"decoys":[],"quip":"","punch":null},{"id":"tk_b09","side":"B","angle":"经历","text":"我妈喝了这茶三个月，血压稳稳的，所以这茶没问题。","fallacy":"anecdotal","explain":"用一个人的经历代替证据。一个人没事，不能说明所有人都没事。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_b10","side":"B","angle":"因果","text":"对于“喝了就住院”这类说法，要先排除其他原因，比如是否本来有基础病、是否同时吃了别的药。","fallacy":null,"explain":"指出了需要排除的混杂因素，是严谨的做法。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_b11","side":"B","angle":"后果","text":"今天因为一条投诉就下架，明天人人都能靠投诉搞垮对手，市场就乱套了。","fallacy":"slippery_slope","explain":"从一次下架直接推到“市场乱套”，中间的步骤没有证明。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_b12","side":"B","angle":"传统","text":"平台一直都是先调查后处理，这是行业惯例，没必要改。","fallacy":"appeal_to_tradition","explain":"“一直如此”不能证明它在这种情形下仍然合适。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_b13","side":"B","angle":"平台","text":"可以分级处理：有明确健康风险的证据时立即下架，其余先加警示再核查。","fallacy":null,"explain":"提出了有条件的分级办法，不是简单折中，而是有理由的做法。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tk_b14","side":"B","angle":"动机","text":"你自己上次网购，不也从来不看检测报告？现在装什么专家？","fallacy":"tu_quoque","explain":"用对方自己的行为回避问题。他看不看检测报告，与平台该怎么处理无关。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null}],"chapter":"trending"},{"id":"apology","title":"出了问题，公司该不该第一时间公开道歉？","scene":"会议室的大屏幕上滚动着热搜。周总敲了敲桌子：道歉，还是不道歉？","tags":["公关","企业"],"sides":{"A":"立刻道歉","B":"查清再说"},"opponents":{"A":"zhubo","B":"zongjian"},"statements":[{"id":"ap_a01","side":"A","angle":"态度","opener":true,"text":"出了问题先承认并致歉，表明重视受影响的人，同时说明正在调查，不等于认下全部责任。","fallacy":null,"explain":"区分了“致歉”和“认责”，理由清楚。没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_a02","side":"A","angle":"情感","text":"看看评论区那些愤怒的消费者，难道你们一点都不心疼吗？","fallacy":"appeal_to_emotion","explain":"用同情代替理由。是否该立刻道歉，要靠分析利弊，而不是靠“心疼”。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_a03","side":"A","angle":"金钱","subtlety":2,"text":"我们已经花了两百万做品牌形象，现在不道歉，这笔钱不就白花了？","fallacy":"sunk_cost","explain":"已经花掉的钱收不回来，不该决定现在要不要道歉。要看的是：从现在起，怎么做更有利。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_a04","side":"A","angle":"动机","text":"你上次处理客诉不也是一拖再拖？现在凭什么说要先查清楚？","fallacy":"tu_quoque","explain":"用对方过去的行为回避问题。他上次怎么做，与这次该怎么做是两回事。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_a05","side":"A","angle":"后果","text":"今天不道歉，明天就会被全网抵制，后天公司就得倒闭。","fallacy":"slippery_slope","explain":"从不道歉直接推到公司倒闭，中间的每一步都没有证明。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_a06","side":"A","angle":"常识","subtlety":2,"text":"公关常识是越早道歉越好——当然，去年那次我们没道歉，那次情况特殊。","fallacy":"special_pleading","explain":"遇到反例，就说“那次特殊”，却不说为什么特殊。这样，规律永远不会被反驳。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_a07","side":"A","angle":"做法","text":"声明可以只陈述事实：收到投诉、正在调查、何时公布结果。既表态，又不预设结论。","fallacy":null,"explain":"给出了具体、可行的做法，兼顾双方的顾虑。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_a08","side":"A","angle":"选择","text":"要么马上道歉，要么就是对消费者的健康不负责，没有别的选择。","fallacy":"false_dilemma","explain":"把选择说成两个极端，忽略了“先表态、再调查”的中间做法。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_a09","side":"A","angle":"权威","text":"公关圈的大牛说了，第一时间道歉是黄金法则，听他的准没错。","fallacy":"appeal_to_authority","explain":"只搬出“大牛”的名头，没有给出理由，也没有说明是否适用于这一次。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_a10","side":"A","angle":"话题","text":"现在讨论要不要道歉有什么意义？先说说上个月那批库存怎么处理！","fallacy":"red_herring","explain":"库存是另一个问题，这是把讨论岔开了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_a11","side":"A","angle":"态度","text":"信息真空期越长，越容易被谣言填满，所以第一时间表态是有价值的。","fallacy":null,"explain":"指出了一个具体的机制，理由与结论相关。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_a12","side":"A","angle":"证据","subtlety":2,"text":"就算你们公布了检测报告，我也要看原料供应商；公布了供应商，我还要看每个工人的名单。","fallacy":"moving_goalposts","explain":"每满足一个条件，就提出新的条件。这样的标准永远无法达到。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_a13","side":"A","angle":"做法","text":"道歉和追责并不冲突：先公开致歉稳住情绪，再按调查结果追责。","fallacy":null,"explain":"把两件事排了先后，回应了“道歉会牵连责任”的担忧。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_b01","side":"B","angle":"证据","opener":true,"text":"事实没查清就道歉，可能把不属于自己的责任揽过来；先说明正在调查，再给结论更稳妥。","fallacy":null,"explain":"指出了仓促道歉的风险，并给出替代做法。没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_b02","side":"B","angle":"后果","subtlety":2,"text":"如果这茶真有问题，公司就完了，所以它不可能有问题，没必要道歉。","fallacy":"appeal_to_consequences","explain":"因为“有问题”的后果太糟，就断定“没有问题”。事实如何，要靠检测来回答，而不是看后果。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_b03","side":"B","angle":"常识","subtlety":2,"text":"行业里别人出了事都要道歉，但我们公司情况特殊，所以不用。","fallacy":"special_pleading","explain":"规则对别人适用，对自己却是“例外”，而没有说明为什么。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_b04","side":"B","angle":"金钱","text":"我们为这款茶投了三百万广告，现在道歉，不就等于承认这钱白花了？","fallacy":"sunk_cost","explain":"已经花掉的钱收不回来，不能用来决定要不要道歉。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_b05","side":"B","angle":"话题","text":"现在不是纠结道歉的时候，我们更应该关注竞争对手这个月的新品！","fallacy":"red_herring","explain":"竞争对手的新品是另一个话题，这是把讨论岔开了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_b06","side":"B","angle":"动机","text":"你上个月的报销单不也有问题？凭什么现在来指责公司？","fallacy":"tu_quoque","explain":"用对方自己的问题回避问题。报销单与该不该道歉无关。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_b07","side":"B","angle":"证据","subtlety":2,"text":"销量跌一半，我们就道歉；跌到一半了，我说要跌到三成；跌到三成，我又说要看下季度。","fallacy":"moving_goalposts","explain":"达到了条件，就提高条件。这样的标准永远不会触发。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_b08","side":"B","angle":"后果","text":"如果调查后发现产品没问题，已经发出的道歉就很难收回，所以先查再说有它的道理。","fallacy":null,"explain":"指出了道歉的不可逆性，理由与结论相关。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_b09","side":"B","angle":"权威","text":"法务部说了，现在道歉有法律风险，法务是专业的，你们听就好。","fallacy":"appeal_to_authority","explain":"只搬出“专业”的头衔，没有说明具体的法律风险是什么。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_b10","side":"B","angle":"动机","text":"你们的意思是，不管有没有问题，我们都得先跪下道歉，对吧？","fallacy":"straw_man","explain":"对方主张的是“先致歉、再调查”，并没有说“不管有没有问题都下跪”。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_b11","side":"B","angle":"后果","text":"今天一被投诉就道歉，明天任何人都能靠投诉敲诈公司。","fallacy":"slippery_slope","explain":"从一次道歉直接推到“人人敲诈”，中间的步骤没有证明。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_b12","side":"B","angle":"做法","text":"道歉的措辞要审慎：区分“对受影响的人表示歉意”和“承认产品有问题”，既有同理心，又不误导。","fallacy":null,"explain":"给出了有区分的做法，没有夸大。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_b13","side":"B","angle":"经历","text":"我见过三家公司道歉后股价下跌，可见道歉都会让公司受损。","fallacy":"hasty_generalization","accept":["anecdotal"],"explain":"用三个例子推出“都会”，样本太少，也没考虑别的原因。","opener":false,"subtlety":1,"decoys":[],"quip":"","punch":null},{"id":"ap_b14","side":"B","angle":"选择","text":"要么现在认错毁掉品牌，要么等一等，没有别的办法。","fallacy":"false_dilemma","explain":"把选择说成两个，忽略了“先表态、不认责”等其他做法。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ap_b15","side":"B","angle":"做法","text":"声明里要有时间表：什么时候公布调查结果，让公众有期待、有监督。","fallacy":null,"explain":"补充了让声明可信的具体做法。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null}],"chapter":"crisis"},{"id":"product_line","title":"降压茶这条产品线，该不该继续做下去？","scene":"会议室里，财务把一张亏损表投在了屏幕上。周总盯着它，半天没说话。","tags":["企业","决策"],"sides":{"A":"继续做","B":"停掉"},"opponents":{"A":"laoban","B":"caiwu"},"statements":[{"id":"pl_a01","side":"A","angle":"前景","opener":true,"text":"产品线是否继续，应看未来的收益和风险；若能整改合规、重建口碑，继续做仍有价值。","fallacy":null,"explain":"把判断的依据放在未来，没有被过去的投入绑架。没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_a02","side":"A","angle":"金钱","text":"我们已经在这条线上投了五百万，现在停掉，不就全打水漂了？","fallacy":"sunk_cost","explain":"五百万已经花掉，停不停都收不回来。该比较的是：从现在起，继续的收益是否大于成本。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_a03","side":"A","angle":"团队","subtlety":2,"text":"团队熬了两年才做到今天，这个时候放弃，对得起大家吗？","fallacy":"sunk_cost","accept":["appeal_to_emotion"],"explain":"用已经付出的两年和愧疚感，代替对未来的判断。","opener":false,"decoys":[],"quip":"","punch":null},{"id":"pl_a04","side":"A","angle":"后果","subtlety":2,"text":"这条线要是停了，三十个同事就要失业，所以它不可能有问题。","fallacy":"appeal_to_consequences","explain":"因为“有问题”的后果太糟，就断定“没有问题”。后果坏，不能让问题消失。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_a05","side":"A","angle":"后果","subtlety":2,"text":"要是承认降压茶没效果，前面所有宣传都成了笑话，所以它一定有效。","fallacy":"appeal_to_consequences","explain":"因为承认的后果难堪，就断定它有效。有没有效，要靠证据。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_a06","side":"A","angle":"规则","subtlety":2,"text":"别的公司的产品出了问题要停产，我们这个不一样，我们是有情怀的。","fallacy":"special_pleading","explain":"规则对别人适用，对自己却是例外，理由只是“有情怀”。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_a07","side":"A","angle":"目标","subtlety":2,"text":"销量到十万就算成功——到了十万，我说要二十万；到了二十万，我说要看复购。所以更要继续。","fallacy":"moving_goalposts","explain":"每次接近目标，就改目标。永远“还没成功”，也就永远有理由继续。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_a08","side":"A","angle":"动机","text":"想停掉产品线的，都是不懂业务、只会算账的人。","fallacy":"ad_hominem","explain":"攻击提出者的能力，没有回应他的论据。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_a09","side":"A","angle":"做法","text":"可以先暂停宣传、整改标签和资质，再评估要不要继续，不必一次定生死。","fallacy":null,"explain":"提出了分步骤的办法，回应了双方的顾虑。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_a10","side":"A","angle":"类比","text":"产品线就像孩子，哪有父母轻易放弃自己孩子的？","fallacy":"false_analogy","explain":"孩子和产品线在关键之处并不相似：产品线可以评估收益，也可以止损。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_a11","side":"A","angle":"经历","text":"我知道三家公司在危机后继续做，后来都翻盘了，所以我们也一定会。","fallacy":"survivorship","accept":["hasty_generalization"],"explain":"只看到了翻盘的公司，没看到更多继续做却没翻盘的。","opener":false,"subtlety":1,"decoys":[],"quip":"","punch":null},{"id":"pl_a12","side":"A","angle":"数据","text":"应把这条线的复购率和投诉率，与同类产品比较，而不是只看这一次的热搜。","fallacy":null,"explain":"提出了更合理的比较基准。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_a13","side":"A","angle":"话题","text":"现在谈产品线干什么？先把官网改版的事定下来！","fallacy":"red_herring","explain":"官网改版是另一个话题，这是把讨论岔开了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_a14","side":"A","angle":"数据","text":"停产的代价包括库存、违约金和团队安置，这些要和继续运营的风险一起算清楚。","fallacy":null,"explain":"要求把两边的成本都算清楚，没有预设结论。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_b01","side":"B","angle":"前景","opener":true,"text":"继续做的前提是风险可控、能合规盈利；目前口碑受损、合规存疑，继续投入的回报并不明确。","fallacy":null,"explain":"说明了继续做的条件，并指出目前不满足。没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_b02","side":"B","angle":"动机","text":"想继续做的，都是舍不得面子、不敢认错的人。","fallacy":"ad_hominem","explain":"揣测对方的动机，代替了回应他的论据。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_b03","side":"B","angle":"经历","text":"我看过的两家公司危机后都没翻盘，可见这类产品线停了才是对的。","fallacy":"anecdotal","accept":["hasty_generalization"],"explain":"用两个例子推出结论，样本太少，也没和其他公司比较。","opener":false,"subtlety":1,"decoys":[],"quip":"","punch":null},{"id":"pl_b04","side":"B","angle":"后果","text":"今天不停这条线，明天就会拖垮整个公司。","fallacy":"slippery_slope","explain":"从不停这条线直接推到“拖垮公司”，中间的步骤没有证明。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_b05","side":"B","angle":"情感","text":"想想那些被我们误导的用户，我们怎么还能心安理得继续卖？","fallacy":"appeal_to_emotion","explain":"用愧疚代替分析。是否继续，要比较整改后的收益与风险。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_b06","side":"B","angle":"规则","subtlety":2,"text":"公司规定预算外项目要走审批，但我支持的是停掉的方案，就不用走审批了。","fallacy":"special_pleading","explain":"规则对别人适用，对自己支持的方案却成了例外，没有说明理由。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_b07","side":"B","angle":"目标","subtlety":2,"text":"你说整改了就可以继续；整改了，我说要第三方认证；认证了，我说要三个月口碑数据。","fallacy":"moving_goalposts","explain":"每次满足条件，就提高条件。这样的标准永远无法达到。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_b08","side":"B","angle":"金钱","text":"沉没成本不该影响决策。五百万已经花掉了，现在只看：从今天起，继续的收益是否大于成本。","fallacy":null,"explain":"清楚地区分了已经花掉的成本和未来的收益。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_b09","side":"B","angle":"动机","text":"你上个项目不也是亏了才停的？现在凭什么劝我们继续？","fallacy":"tu_quoque","explain":"用对方过去的经历回避问题。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_b10","side":"B","angle":"权威","text":"咨询公司说了，这类产品线三年内必亏，你们别不信。","fallacy":"appeal_to_authority","explain":"只搬出咨询公司，没有给出依据。“必亏”这样的断言也需要证据。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_b11","side":"B","angle":"动机","text":"你们的意思是，亏多少钱都不能停，对吧？","fallacy":"straw_man","explain":"对方只是主张评估后再决定，并没有说“亏多少都不能停”。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_b12","side":"B","angle":"选择","text":"要么现在停，要么公司破产，只有这两条路。","fallacy":"false_dilemma","explain":"把选择说成两个极端，忽略了整改、缩减规模等办法。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_b13","side":"B","angle":"做法","text":"可以设定明确的止损线和复盘节点，比如两个季度内复购率达不到目标，就停止。","fallacy":null,"explain":"给出了事先约定的、可检验的标准。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_b14","side":"B","angle":"数据","text":"我只看了亏损最多的那个月的报表，就足以说明这条线救不回来。","fallacy":"cherry_picking","explain":"只挑最差的一个月，没看整体趋势。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"pl_b15","side":"B","angle":"团队","text":"停产不等于否定团队，可以把核心成员转岗到合规的新品线，这是对人负责。","fallacy":null,"explain":"回应了“对不起团队”的担忧，提出了具体安排。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null}],"chapter":"crisis"},{"id":"disclosure","title":"企业出了问题，该不该公开全部检测数据？","scene":"发布会前一小时，会务组把两份文件放在你面前：一份是“全部数据”，一份是“数据摘要”。","tags":["企业","透明"],"sides":{"A":"公开全部","B":"只公开结论"},"opponents":{"A":"jizhe","B":"laoban"},"statements":[{"id":"ds_a01","side":"A","angle":"信任","opener":true,"text":"公开全部检测数据，让第三方能独立复核，比单方面给出“结论”更能重建公众的信任。","fallacy":null,"explain":"说明了公开数据与重建信任之间的联系。没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_a02","side":"A","angle":"情感","text":"那些受害的家庭等着一个交代，你们当企业的忍心继续遮遮掩掩吗？","fallacy":"appeal_to_emotion","explain":"用同情代替理由。该不该公开全部数据，要靠利弊分析来回答。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_a03","side":"A","angle":"动机","subtlety":2,"text":"你们到底想隐瞒什么，才不肯把数据全部公开？","fallacy":"loaded_question","explain":"问题里预设了“你们在隐瞒”。无论怎么回答，都等于默认了这个前提。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_a04","side":"A","angle":"信任","subtlety":2,"text":"这家公司整体上就不诚信，所以它的每一份检测报告都不可信。","fallacy":"composition_division","explain":"把整体的评价，直接套到每一个部分上。一份报告可不可信，要看这份报告本身的方法和数据。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_a05","side":"A","angle":"证据","subtlety":3,"text":"我们对比了一百份报告的各种分组，发现周五出厂的几批不合格率最高，说明周五出厂的产品有问题。","fallacy":"texas_sharpshooter","explain":"分组方式试得足够多，总能找到某个“规律”。事后挑出来的规律，要用新的数据重新验证。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_a06","side":"A","angle":"态度","text":"数据必须公开，必须公开，必须全部公开！没有任何理由不公开！","fallacy":"repetition","explain":"把同一句话说得足够多，不等于证明了它。重复不是理由。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_a07","side":"A","angle":"做法","text":"涉及隐私和商业秘密的部分可以脱敏后公开，既保护必要的信息，也让核心数据可以复核。","fallacy":null,"explain":"提出了兼顾两边的具体做法。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_a08","side":"A","angle":"后果","text":"今天不公开全部数据，明天就敢公开假数据，后天就敢直接编数据。","fallacy":"slippery_slope","explain":"从“不公开全部”直接推到“编数据”，中间的步骤没有证明。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_a09","side":"A","angle":"权威","text":"监管部门的前官员说了，公开全部数据是国际惯例，你们必须照做。","fallacy":"appeal_to_authority","explain":"只搬出头衔，没有说明惯例的具体内容，也没说明是否适用。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_a10","side":"A","angle":"动机","text":"你们不愿意公开全部数据，就是想把公众当傻子糊弄，对吧？","fallacy":"straw_man","explain":"对方只是主张先公开结论，并没有说要糊弄公众。这是把对方的观点扭曲了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_a11","side":"A","angle":"做法","text":"数据可以分层公开：先公开摘要和方法，再按需提供原始数据，兼顾可读性和可复核性。","fallacy":null,"explain":"提出了分层的做法，回应了“难以理解”的担忧。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_a12","side":"A","angle":"原则","subtlety":2,"text":"真正负责任的企业，都会公开全部数据；没有公开的，就不是真正负责任的企业。","fallacy":"no_true_scotsman","explain":"把“负责任”的定义偷偷改成“公开全部数据”，让这个说法永远不会被反驳。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_a13","side":"A","angle":"选择","text":"要么公开全部数据，要么就是在隐瞒，没有第三种可能。","fallacy":"false_dilemma","explain":"把选择说成两个极端，忽略了脱敏、分层公开、向独立机构披露等办法。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_a14","side":"A","angle":"做法","text":"公开数据后，还应说明检测方法和局限，否则公众很容易误读数字。","fallacy":null,"explain":"补充了让公开真正有用的条件。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_b01","side":"B","angle":"理解","opener":true,"text":"原始数据体量大、专业性强，普通读者难以解读；先公开经过核实的结论和关键指标，反而更清楚。","fallacy":null,"explain":"从公众的理解成本出发，理由与结论相关。可以讨论，但论证本身没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_b02","side":"B","angle":"信任","subtlety":3,"text":"我们公司的每个部门都通过了内部审核，所以公司整体肯定没有问题。","fallacy":"composition_division","explain":"每个部分都合格，不等于整体没问题。问题可能出在部门之间的衔接，或者审核本身的标准上。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_b03","side":"B","angle":"态度","text":"我们的产品是安全的，安全的，真的是安全的，请大家相信我们。","fallacy":"repetition","explain":"重复不是证据。说多少遍“安全”，都需要有检测依据支持。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_b04","side":"B","angle":"概念","subtlety":3,"text":"我们公开了结论，而结论就是数据的精华，所以我们已经公开了数据。","fallacy":"equivocation","explain":"“公开数据”的含义被悄悄换成了“公开结论”。结论是数据的解读，不等于数据本身。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_b05","side":"B","angle":"权威","subtlety":3,"text":"一位不愿透露姓名的资深专家表示，这些数据不适合公开。","fallacy":"appeal_to_authority","explain":"借用一个无法核实的“专家”。没有姓名、没有理由，这个权威等于不存在。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_b06","side":"B","angle":"证据","subtlety":3,"text":"我们分析了二十个人群分组，发现A型血、周三购买的用户满意度提升最明显，说明这款茶特别适合他们。","fallacy":"texas_sharpshooter","explain":"分组试得足够多，总有一组看起来特别好。事后挑出的规律，必须用新数据重新验证。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_b07","side":"B","angle":"动机","subtlety":2,"text":"既然你也知道数据可能被误读，那为什么还坚持要公开，是想引导舆论吗？","fallacy":"loaded_question","explain":"问题里预设了“你想引导舆论”。无论怎么回答，都等于默认了这个前提。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_b08","side":"B","angle":"做法","text":"全部公开可能涉及供应商隐私，可以向监管机构和独立第三方完整披露，再向公众公布脱敏结果。","fallacy":null,"explain":"提出了分层披露的具体办法，没有回避复核。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_b09","side":"B","angle":"后果","text":"今天公开全部数据，明天竞争对手就能抄走我们的配方，公司就完了。","fallacy":"slippery_slope","explain":"从公开数据直接推到“公司完了”，中间的步骤没有证明。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_b10","side":"B","angle":"原则","subtlety":2,"text":"真正专业的人都明白，这类数据只能由企业来解读；要求看原始数据的，就不是真正懂行的人。","fallacy":"no_true_scotsman","explain":"遇到反对者，就把定义改成“真正懂行的人不会这样”，让自己的说法永远不会错。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_b11","side":"B","angle":"动机","text":"要求公开全部数据的人，不过是想借机炒作的记者。","fallacy":"ad_hominem","explain":"揣测对方的动机，代替了回应他的论据。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_b12","side":"B","angle":"话题","text":"与其纠结要不要公开，不如看看竞争对手的数据，他们的问题才大！","fallacy":"red_herring","explain":"竞争对手的数据是另一个话题，这是把讨论岔开了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_b13","side":"B","angle":"理解","text":"公开本身不是目的，关键是公众能理解、能监督；可以配套提供说明和答疑渠道。","fallacy":null,"explain":"把目标放在“能理解、能监督”上，并给出配套做法。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_b14","side":"B","angle":"因果","subtlety":2,"text":"自从我们公开了第一批数据，网上的质疑反而更多了，可见公开数据只会引发更多质疑。","fallacy":"false_cause","explain":"质疑增多，可能是因为关注度更高、信息更多。先后发生不等于因果。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ds_b15","side":"B","angle":"做法","text":"对尚未复核的数据，应当标注“待核实”，避免把初步结果当成最终结论公布。","fallacy":null,"explain":"提出了防止误导的做法，不是回避公开。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null}],"chapter":"launch"},{"id":"labeling","title":"保健品标签上的“辅助降压”这类说法，该不该禁止？","scene":"台下，有人举起了一张放大的产品标签：“三天，辅助降压”。会场安静了一秒。","tags":["消费","监管"],"sides":{"A":"应该禁止","B":"不必禁止"},"opponents":{"A":"jiaoshou","B":"zongjian"},"statements":[{"id":"lb_a01","side":"A","angle":"风险","opener":true,"text":"“辅助降压”这类说法，容易让人以为产品有疗效而减药停药，风险不低，所以需要严格管理。","fallacy":null,"explain":"指出了具体的风险，理由与结论相关。没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_a02","side":"A","angle":"概念","subtlety":3,"text":"“辅助”就是帮助，帮助降压就是能降压，所以写“辅助降压”，就是在宣称它能治病。","fallacy":"equivocation","explain":"“辅助”的含义被一步步换成了“治疗”。“帮助”和“能降压”并不是同一件事。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_a03","side":"A","angle":"动机","subtlety":2,"text":"你们是不是早就知道没效果，才用“辅助”这种模糊的词来打擦边球？","fallacy":"loaded_question","explain":"问题里预设了“你们早就知道没效果”。无论怎么回答，都等于默认了这个前提。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_a04","side":"A","angle":"情感","text":"想想那些停了降压药的老人，你们良心上过得去吗？","fallacy":"appeal_to_emotion","explain":"用愧疚代替论证。需要的是对风险大小的分析。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_a05","side":"A","angle":"行业","subtlety":3,"text":"保健品行业整体上就是靠夸大宣传赚钱的，所以每一款保健品都在夸大宣传。","fallacy":"composition_division","explain":"把对整个行业的评价，直接套到每一个产品上。每一款产品是否夸大，要逐个看它的宣传和依据。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_a06","side":"A","angle":"经历","text":"我爸就是信了“辅助降压”停了药，结果住了院，这类说法就是害人的。","fallacy":"anecdotal","explain":"用一个人的经历代替证据。需要更多的数据，才能判断这类说法的整体影响。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_a07","side":"A","angle":"做法","text":"标签用语应当与可验证的证据对应：宣称了功效，就要有相应的评价依据，没有就不应使用。","fallacy":null,"explain":"提出了明确的、可检验的标准。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_a08","side":"A","angle":"后果","text":"今天允许“辅助降压”，明天就会出现“辅助治癌”，后天就是“包治百病”。","fallacy":"slippery_slope","explain":"每一步都被说成必然，却没有证明。允许一种说法，不等于所有说法都会被允许。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_a09","side":"A","angle":"态度","text":"这种说法必须禁止，必须禁止，一刻也不能容忍，必须禁止！","fallacy":"repetition","explain":"重复不是理由。说多少遍“必须”，都需要论证来支持。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_a10","side":"A","angle":"动机","text":"你们反对禁止，就是支持商家随便骗人，对吧？","fallacy":"straw_man","explain":"反对“禁止”，不等于支持“骗人”。他们主张的是其他的管理办法。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_a11","side":"A","angle":"做法","text":"可以不一刀切：凡使用健康功效用语，须附上依据和风险提示，并接受抽查。","fallacy":null,"explain":"提出了不是简单禁止的办法，回应了对方的担忧。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_a12","side":"A","angle":"证据","subtlety":3,"text":"我们统计了三百条保健品宣传语，发现含“辅助”二字的投诉率恰好最高，可见这个词本身就有问题。","fallacy":"texas_sharpshooter","accept":["false_cause"],"explain":"先看到投诉率的差异，再回头挑一个词当原因。挑出来的“规律”可能只是巧合，需要新数据验证。","opener":false,"decoys":[],"quip":"","punch":null},{"id":"lb_a13","side":"A","angle":"权威","subtlety":2,"text":"据说有专家认为，所有保健品的功效用语，都应当禁止。","fallacy":"appeal_to_authority","explain":"“据说”“有专家”，没有姓名、没有出处，也没有给出理由。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_a14","side":"A","angle":"选择","text":"要么全面禁止这类说法，要么就是纵容欺骗，没有中间选项。","fallacy":"false_dilemma","explain":"把选择说成两个极端，忽略了依据审核、风险提示等管理办法。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_a15","side":"A","angle":"做法","text":"除了禁词，还可以要求在显著位置标注“本品不能代替药物”，让消费者一眼就能看到。","fallacy":null,"explain":"提出了补充的具体办法，没有只依赖禁止。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_b01","side":"B","angle":"做法","opener":true,"text":"“辅助”“调理”这类词语的含义比较宽泛，与其笼统禁止，不如要求企业提供依据并提示风险。","fallacy":null,"explain":"提出了替代方案，并说明了理由。没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_b02","side":"B","angle":"态度","text":"这是营销自由，是营销自由，是每一家企业都应该有的营销自由！","fallacy":"repetition","explain":"重复不是理由。说多少遍“自由”，都需要论证来支持。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_b03","side":"B","angle":"信任","subtlety":3,"text":"我们公司的每位员工都是诚实的人，所以我们公司的所有宣传都是诚实的。","fallacy":"composition_division","explain":"每个部分诚实，不等于整体的宣传都诚实。宣传是否诚实，要看宣传内容本身。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_b04","side":"B","angle":"概念","subtlety":2,"text":"自由就是想怎么说就怎么说，所以限制标签用语，就是剥夺言论自由。","fallacy":"equivocation","explain":"“言论自由”被悄悄换成了“商业宣传可以随便说”。两者受到的约束并不相同。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_b05","side":"B","angle":"动机","text":"你是不是对所有保健品都有偏见，才想把这个词也禁掉？","fallacy":"loaded_question","explain":"问题里预设了“你对所有保健品都有偏见”。无论怎么回答，都等于默认了这个前提。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_b06","side":"B","angle":"行业","subtlety":2,"text":"真正的保健品从不夸大功效；夸大的那些，不是真正的保健品，不能代表行业。","fallacy":"no_true_scotsman","explain":"遇到反例，就把定义改成“真正的保健品不会这样”，让自己的说法永远不会错。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_b07","side":"B","angle":"证据","subtlety":3,"text":"我们调查了一千名用户，发现住在东城、周末购买的血压改善最明显，所以这款茶特别适合这类人。","fallacy":"texas_sharpshooter","explain":"分组试得足够多，总有一组看起来特别好。事后挑出的规律，必须用新数据重新验证。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_b08","side":"B","angle":"做法","text":"标签用语应结合上下文来看，如果同时写明“不能代替药物”，消费者被误导的可能性会降低。","fallacy":null,"explain":"提出了一个有条件的缓解办法，没有否认风险。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_b09","side":"B","angle":"后果","text":"今天禁了“辅助降压”，明天就禁一切功效描述，保健品行业就没法做了。","fallacy":"slippery_slope","explain":"每一步都被说成必然，却没有证明。禁止一种说法，不等于禁止一切描述。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_b10","side":"B","angle":"动机","text":"你们医院的宣传不也夸大疗效吗？凭什么只管我们？","fallacy":"tu_quoque","explain":"用对方的问题回避问题。医院的宣传是否有问题，不能说明标签上的说法就没问题。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_b11","side":"B","angle":"传统","text":"保健品行业这样写了几十年，也没出过大事，没必要改。","fallacy":"appeal_to_tradition","explain":"“一直如此”不能证明它没有问题，也不能说明现在不需要改。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_b12","side":"B","angle":"做法","text":"监管的重点应该是虚假和夸大，而不是某几个词；有证据支持的功效描述应当被允许。","fallacy":null,"explain":"把监管的重点放在“有没有依据”上，不是简单放任。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_b13","side":"B","angle":"舆论","text":"几千万消费者都在买这类产品，这么多人买，说明这些说法没有问题。","fallacy":"appeal_to_popularity","explain":"买的人多，不等于说法没有问题。很多人买，也可能是被误导了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_b14","side":"B","angle":"教育","text":"消费者教育同样重要：教会大家看懂标签、咨询医生，比单纯禁词更长远。","fallacy":null,"explain":"提出了一个被忽略的重要方面，没有否认监管。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lb_b15","side":"B","angle":"数据","subtlety":2,"text":"买过的人里，愿意在网上写好评的，都说有效，可见确实有效。","fallacy":"survivorship","explain":"只看到了愿意留言的人。没效果的、已经不买的人，未必会写评价。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null}],"chapter":"launch"}],"speeches":[{"id":"family_boss","speaker":"er_jiu","title":"二舅的敬酒词","intro":"二舅端起酒杯，开始了他一年一度的演讲。点出有破绽的句子，选出它的名字。","time_limit":90,"max_mistakes":3,"sentences":[{"text":"各位亲戚，这一年大家都辛苦了，今天能坐在一起吃饭，是难得的缘分。","fallacy":null,"explain":"这只是寒暄，没有提出任何论点，所以没有谬误。","accept":[],"decoys":[],"quip":"","id":"family_boss:0"},{"text":"我吃过的盐比你们吃过的米还多，所以我说读书没用，就是没用。","fallacy":"appeal_to_authority","explain":"用资历和年纪代替理由。经验丰富值得参考，但“读书没用”这个结论仍然需要论据。","accept":[],"decoys":[],"quip":"","id":"family_boss:1"},{"text":"咱们老家几代人都是靠种地过来的，何必让孩子读那么多书。","fallacy":"appeal_to_tradition","explain":"“一直如此”不能证明它现在仍然合适，时代和条件都变了。","accept":[],"decoys":[],"quip":"","id":"family_boss:2"},{"text":"你看隔壁村的老李，没怎么读书照样开了厂，可见读书和赚钱没关系。","fallacy":"hasty_generalization","accept":["survivorship"],"explain":"用一个例子推出一般结论，样本太少，而且只看到了成功的人。","decoys":[],"quip":"","id":"family_boss:3"},{"text":"不过话说回来，读书能让人明白道理，这一点我是承认的。","fallacy":null,"explain":"这是对对方观点的让步，没有任何谬误。","accept":[],"decoys":[],"quip":"","id":"family_boss:4"},{"text":"现在年轻人都不爱听老人劝，要么听我的，要么以后别后悔！","fallacy":"false_dilemma","explain":"把选择说成只有两个：听我的，或者后悔。忽略了其他可能。","accept":[],"decoys":[],"quip":"","id":"family_boss:5"},{"text":"谁要是不同意我，就是不孝！","fallacy":"appeal_to_emotion","accept":["ad_hominem"],"explain":"用“不孝”的愧疚施压，代替了理由。孝顺和观点对不对，是两回事。","decoys":[],"quip":"","id":"family_boss:6"},{"text":"好了，话不多说，这杯酒，大家一起干了吧！","fallacy":null,"explain":"这只是邀请干杯，没有论证，所以没有谬误。","accept":[],"decoys":[],"quip":"","id":"family_boss:7"}],"chapter":"family"},{"id":"logic_boss","speaker":"xiaolin","title":"小林的结辩：期末考试该不该保留","intro":"小林翻开结辩稿。点出有破绽的句子，选出它的名字。","time_limit":85,"max_mistakes":3,"sentences":[{"text":"感谢主席，各位评委。今天我方的立场很清楚：期末考试应当保留。","fallacy":null,"explain":"这是开场陈述，亮明了立场，没有谬误。","accept":[],"decoys":[],"quip":"","id":"logic_boss:0"},{"text":"对方辩友说要取消考试，不就是想让大家不学习、混日子拿学分吗？","fallacy":"straw_man","explain":"对方只是主张取消考试，并没有说要混日子。这是把对方的观点扭曲后再反驳。","accept":[],"decoys":[],"quip":"","id":"logic_boss:1"},{"text":"今天取消了期末考试，明天就会取消平时作业，后天学校就变成游乐场。","fallacy":"slippery_slope","explain":"把一件事直接接到一连串更坏的结果，每一步都没有证明。","accept":[],"decoys":[],"quip":"","id":"logic_boss:2"},{"text":"考试是衡量学习成果的最好办法，因为没有比考试更能衡量学习成果的方式了。","fallacy":"circular","explain":"结论“最好的办法”被直接放进了前提，用自己证明自己。","accept":[],"decoys":[],"quip":"","id":"logic_boss:3"},{"text":"对方提出考试压力大，这是事实。但可以提高平时成绩的比例来缓解，不必取消考试。","fallacy":null,"explain":"承认了对方的理由，并给出具体的替代办法。没有谬误。","accept":[],"decoys":[],"quip":"","id":"logic_boss:4"},{"text":"我们要的是公平，而考试对所有人一视同仁，所以考试就是公平的。","fallacy":"equivocation","explain":"“公平”被悄悄换成了“一视同仁”。条件不同的人，做一样的事，不一定公平。","accept":[],"decoys":[],"quip":"","id":"logic_boss:5"},{"text":"要么保留所有考试，要么学校的教学质量彻底崩溃，没有第三种可能。","fallacy":"false_dilemma","explain":"把选择说成两个极端，忽略了改革考试形式等中间办法。","accept":[],"decoys":[],"quip":"","id":"logic_boss:6"},{"text":"综上，我方认为考试应当保留，但形式可以改进。","fallacy":null,"explain":"这是总结陈词，没有新的论证，也没有谬误。","accept":[],"decoys":[],"quip":"","id":"logic_boss:7"}],"chapter":"logic_club"},{"id":"live_boss","speaker":"zhubo","title":"小美的金牌话术","intro":"直播间人数破十万。点出有破绽的话术，选出它的名字。","time_limit":80,"max_mistakes":3,"sentences":[{"text":"家人们，欢迎来到直播间，今晚给大家介绍一款新品。","fallacy":null,"explain":"这只是开场白，没有论证，所以没有谬误。","accept":[],"decoys":[],"quip":"","id":"live_boss:0"},{"text":"这款茶能降血压，不信？你拿出证据证明它不能。","fallacy":"burden_of_proof","accept":["appeal_to_ignorance"],"explain":"提出主张的人应该举证。自己不给依据，却要求别人证明它“不能”，把责任倒了过来。","decoys":[],"quip":"","id":"live_boss:1"},{"text":"它是纯天然的，所以绝对安全，大家放心喝。","fallacy":"appeal_to_nature","explain":"“天然”不等于“安全”。很多毒物也来自天然植物。","accept":[],"decoys":[],"quip":"","id":"live_boss:2"},{"text":"既然国家早就认证了所有的养生茶都有效，这款当然也有效。","fallacy":"false_premise","explain":"前提本身就是错的：并没有这样的认证。起点不成立，结论也站不住。","accept":[],"decoys":[],"quip":"","id":"live_boss:3"},{"text":"喝茶就像给血管做保养，就像给汽车换机油，当然越早越好。","fallacy":"false_analogy","explain":"血管和汽车引擎在关键之处并不相似，这个类比本身就站不住。","accept":[],"decoys":[],"quip":"","id":"live_boss:4"},{"text":"质疑我们的人，和那些抹黑直播行业的黑粉一模一样。","fallacy":"guilt_by_association","explain":"因为和某个群体“一样”，就否定了对方的质疑。质疑对不对，要看理由。","accept":[],"decoys":[],"quip":"","id":"live_boss:5"},{"text":"每一份订单都附有七天无理由退换，买得不满意可以退。","fallacy":null,"explain":"这是一项具体的售后政策，不是推理，没有谬误。","accept":[],"decoys":[],"quip":"","id":"live_boss:6"},{"text":"最后一个小时！卖完就没有了，要买的家人们抓紧！","fallacy":null,"explain":"这是促销套路，不是推理，所以不算逻辑谬误。但要警惕它制造的紧迫感。","accept":[],"decoys":[],"quip":"","id":"live_boss:7"}],"chapter":"livestream"},{"id":"trending_boss","speaker":"dav","title":"老K的爆料直播：揭秘降压茶","intro":"晚上十点，老K 开启了“揭秘降压茶”直播。点出有破绽的句子，选出它的名字。小心：有的句子看起来像套路，其实没有问题。","time_limit":75,"max_mistakes":3,"sentences":[{"text":"家人们，今晚我来给大家揭开降压茶的真相。","fallacy":null,"explain":"这是开场白，没有论证，所以没有谬误。","accept":[],"decoys":[],"quip":"","id":"trending_boss:0"},{"text":"投诉的有两百人，两百人！这个数字还不够吓人吗？","fallacy":"base_rate","subtlety":2,"explain":"只报绝对数字，不说总共有多少人买。两百人放在两百万买家里，和放在两千买家里，意思完全不同。","accept":[],"decoys":[],"quip":"","id":"trending_boss:1"},{"text":"我连着刷了三天评论区，每天都是好评，今天一定该出现差评了。","fallacy":"gamblers_fallacy","explain":"每条评论是好是坏相互独立，前面都是好评，不会让后面“该”出现差评。","accept":[],"decoys":[],"quip":"","id":"trending_boss:2"},{"text":"留在评论区发言的，多半是觉得有用的人；没发言的人，我们更应该去问问。","fallacy":null,"explain":"指出了“只有留下的人才会发言”的偏差，是在避免幸存者偏差，所以这句没有谬误。","accept":[],"decoys":[],"quip":"","id":"trending_boss:3"},{"text":"我采访了身边的三个人，他们喝完都拉肚子，所以所有人喝了都会拉肚子。","fallacy":"anecdotal","accept":["hasty_generalization"],"explain":"用三个人的经历推出“所有人”，样本太少，也不是随机抽取的。","decoys":[],"quip":"","id":"trending_boss:4"},{"text":"我们只统计了出事的七个案例，没出事的几百万人，就不用算进来了。","fallacy":"cherry_picking","accept":["base_rate"],"subtlety":2,"explain":"只挑对自己结论有利的案例，把没出事的绝大多数直接略过。","decoys":[],"quip":"","id":"trending_boss:5"},{"text":"我一发爆料，品牌方的客服电话就被打爆了，可见茶一定有问题。","fallacy":"false_cause","explain":"客服电话被打爆，很可能正是这条爆料引来的，而不是茶有问题的证据。把结果当成了原因。","accept":[],"decoys":[],"quip":"","id":"trending_boss:6"},{"text":"最后声明：以上只是我的提问，不构成任何结论，转发请随意。","fallacy":null,"explain":"这是免责声明，不是推理，所以不算逻辑谬误。（不过，它是在给自己留后路。）","accept":[],"decoys":[],"quip":"","id":"trending_boss:7"}],"chapter":"trending"},{"id":"crisis_boss","speaker":"laoban","title":"周总的总结发言","intro":"会议接近尾声，周总站起来做总结发言。点出有破绽的句子，选出它的名字。小心：有的句子只是会议安排，不是论证。","time_limit":75,"max_mistakes":3,"sentences":[{"text":"各位，今天把大家叫来，只为一件事：这次的危机，我们要一起扛过去。","fallacy":null,"explain":"这是开场陈述，亮明了目的，没有论证，所以没有谬误。","accept":[],"decoys":[],"quip":"","id":"crisis_boss:0"},{"text":"这款茶如果真有问题，公司就完了，所以我相信它一定没有问题。","fallacy":"appeal_to_consequences","subtlety":2,"explain":"因为“有问题”的后果太糟，就断定“没有问题”。事实如何，要靠检测来回答，而不是看后果。","accept":[],"decoys":[],"quip":"","id":"crisis_boss:1"},{"text":"我们已经投了三百万，现在停下，就是前功尽弃，所以必须继续。","fallacy":"sunk_cost","explain":"三百万已经花掉，停不停都收不回来。该比较的是：从现在起，继续的收益是否大于成本。","accept":[],"decoys":[],"quip":"","id":"crisis_boss:2"},{"text":"合规流程对别人很重要，但我们这次时间紧、情况特殊，可以先跳过。","fallacy":"special_pleading","subtlety":3,"explain":"规则对别人适用，对自己却是“例外”，理由只是“时间紧”。时间紧不是跳过合规的理由。","accept":[],"decoys":[],"quip":"","id":"crisis_boss:3"},{"text":"我们需要先查清事实，再决定谁该负责，这是基本的公平。","fallacy":null,"explain":"这是一个有理由的主张：先查事实，再追责。没有谬误。","accept":[],"decoys":[],"quip":"","id":"crisis_boss:4"},{"text":"先别谈我们的责任，对手上个月的新品，问题比我们大多了。","fallacy":"tu_quoque","accept":["red_herring"],"explain":"用“别人更糟”回避自己的问题。对手有没有问题，不能说明我们没问题。","decoys":[],"quip":"","id":"crisis_boss:5"},{"text":"目标是三天内压下负面；压下去了，改成一周；一周到了，又改成这个月，所以我们一直在按计划进行。","fallacy":"moving_goalposts","subtlety":2,"explain":"每次目标快要达到或达不到，就悄悄改目标。这样的标准，永远“按计划进行”。","accept":[],"decoys":[],"quip":"","id":"crisis_boss:6"},{"text":"散会之前，我再强调一次：会议纪要，请大家会后一起核对。","fallacy":null,"explain":"这是会议安排，不是论证，没有谬误。","accept":[],"decoys":[],"quip":"","id":"crisis_boss:7"}],"chapter":"crisis"},{"id":"launch_boss","speaker":"laoban","title":"周总的发布会致辞","intro":"发布会进入致辞环节，周总打开了讲稿。点出有破绽的句子，选出它的名字。最漂亮的话术里，破绽最隐蔽。","time_limit":75,"max_mistakes":3,"sentences":[{"text":"各位媒体朋友，感谢大家今天的到来。我们将先通报情况，再接受提问。","fallacy":null,"explain":"这是开场和流程说明，没有论证，所以没有谬误。","accept":[],"decoys":[],"quip":"","id":"launch_boss:0"},{"text":"我们的产品是安全的，安全的，是经过充分验证的安全。","fallacy":"repetition","subtlety":2,"explain":"重复不是证据。“安全”说多少遍，都需要检测依据来支持。","accept":[],"decoys":[],"quip":"","id":"launch_boss:1"},{"text":"我们公司的每一位员工都诚实守信，所以公司发布的每一条信息，都是真实的。","fallacy":"composition_division","subtlety":3,"explain":"每个部分诚实，不等于整体发布的每条信息都真实。信息是否真实，要看信息本身。","accept":[],"decoys":[],"quip":"","id":"launch_boss:2"},{"text":"我们分析了三十个用户分组，发现周三下单的用户满意度提升了四成，说明产品对这类人特别有效。","fallacy":"texas_sharpshooter","subtlety":3,"explain":"分组试得足够多，总有一组看起来特别好。事后挑出的规律，必须用新数据重新验证。","accept":[],"decoys":[],"quip":"","id":"launch_boss:3"},{"text":"我们说的“安全”，是指“没有被证明有害”。所以请大家放心，我们的产品是安全的。","fallacy":"equivocation","accept":["appeal_to_ignorance"],"subtlety":3,"explain":"“安全”的含义被悄悄换成了“没有被证明有害”。没证明有害，不等于已经证明无害。","decoys":[],"quip":"","id":"launch_boss:4"},{"text":"请问在座各位：你们是不是也认为，媒体的报道才是造成恐慌的真正原因？","fallacy":"loaded_question","subtlety":2,"explain":"问题里预设了“恐慌是媒体造成的”。无论怎么回答，都等于默认了这个前提。","accept":[],"decoys":[],"quip":"","id":"launch_boss:5"},{"text":"对于尚未复核的数据，我们将标注“待核实”，并在七天内公布复核结果。","fallacy":null,"explain":"这是一个具体、可检验的承诺，没有谬误。小心：它看起来像推托，其实不是。","accept":[],"decoys":[],"quip":"","id":"launch_boss:6"},{"text":"最后，感谢大家的关注。后续进展，我们会在官网同步更新。","fallacy":null,"explain":"这是结束语和安排，没有论证，所以没有谬误。","accept":[],"decoys":[],"quip":"","id":"launch_boss:7"}],"chapter":"launch"}],"danmaku":{"ambient":["前排吃瓜","这场有意思","瓜子饮料花生～","小心，有坑","这个话题每年都要吵一遍","谁能说服谁呢","这个话题总是吵不完"],"opp_fallacy":["等等，这话哪里不对？","我闻到了 {fallacy} 的味道","听着挺有道理，细想不对","来了来了，老套路","这个逻辑我不敢苟同"],"opp_sound":["这一条倒是说得通","别乱喊，人家说的没毛病","这句讲道理"],"call_hit":["这不就是 {fallacy} 吗😂","漂亮！","火眼金睛！","拿捏了","记笔记：{fallacy}","当场破防"],"call_miss":["哎，看走眼了","这句其实没毛病","冲动是魔鬼","名字选错啦"],"bot_hit":["被抓包了😅","{fallacy}，你自己也中招","先检查自己说的话"],"bot_miss":["这波蒙混过关了","对手没发现！","胆子真大"],"combo":["连环破！！","这手速，杠精克星","停不下来了"],"win":["太强了","恭喜，你赢了这场辩论","GG"],"lose":["没关系，明年再战","多看看图鉴就好了"]},"roadmap":[]};</script>
<script>/* 且慢！· 游戏引擎（纯逻辑，不碰界面，可在 Node 里单独测试）
 * 所有数值来自 content/config.yaml 与关卡的 rules，所有文字来自 content。
 *   create()        一场对辩
 *   createSpeech()  一场 Boss 演讲（找出句子里的破绽）
 *   starsFor() / starsForSpeech()  星级 */
const Engine = (() => {
  // ── 工具 ─────────────────────────────────────────────
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function hash(str) {
    let h = 2166136261;
    for (let i = 0; i < str.length; i++) h = Math.imul(h ^ str.charCodeAt(i), 16777619);
    return h >>> 0;
  }
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  const shuffler = (rng) => (arr) => {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rng() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  };

  function index(data) {
    const idx = { fal: {}, chars: {}, topics: {}, speeches: {} };
    data.fallacies.forEach((f) => (idx.fal[f.id] = f));
    data.characters.forEach((c) => (idx.chars[c.id] = c));
    data.topics.forEach((t) => (idx.topics[t.id] = t));
    (data.speeches || []).forEach((s) => (idx.speeches[s.id] = s));
    return idx;
  }

  // 气势 1~3：作者可指定，不指定则按 id 稳定地随机生成（同一句永远同一个值）
  function punchOf(s) {
    if (s.punch) return s.punch;
    const r = (hash(s.id) % 100) / 100;
    if (s.fallacy) return r < 0.45 ? 2 : 3;
    return r < 0.25 ? 1 : r < 0.75 ? 2 : 3;
  }

  // 星级：赢了 ★；失误（喊错、被识破、超时）≤2 次 ★★；零失误 ★★★
  const starsFor = (sum) => (!sum.won ? 0 : sum.mistakes === 0 ? 3 : sum.mistakes <= 2 ? 2 : 1);
  const starsForSpeech = (sum) => (!sum.won ? 0 : sum.mistakes === 0 ? 3 : sum.mistakes === 1 ? 2 : 1);

  // 「且慢」时的 4 个选项：正确答案 + 容易混淆的 + 随机补足
  function buildCallOptions(data, idx, stmt, context, rng) {
    const shuffle = shuffler(rng);
    const accept = stmt.accept || [];
    const ids = new Set();
    if (stmt.fallacy) {
      ids.add(stmt.fallacy);
      if (accept.length) ids.add(accept[0]);
      (stmt.decoys || []).forEach((d) => ids.size < 4 && ids.add(d));
      const fam = idx.fal[stmt.fallacy].family;
      for (const f of shuffle(data.fallacies.filter((f) => f.family === fam && !ids.has(f.id) && !accept.includes(f.id)))) {
        if (ids.size >= 4) break; ids.add(f.id);
      }
    } else {
      for (const id of shuffle(context)) { if (ids.size >= 4) break; ids.add(id); }
    }
    for (const f of shuffle(data.fallacies)) { if (ids.size >= 4) break; if (!accept.includes(f.id)) ids.add(f.id); }
    return shuffle([...ids]).slice(0, 4);
  }
  const isCorrect = (stmt, fid) => !!stmt.fallacy && (fid === stmt.fallacy || (stmt.accept || []).includes(fid));

  // ── 一场对辩 ─────────────────────────────────────────
  // opts: { topicId, mySide, difficulty, rng, overrides: {turn_seconds, target_points, max_rounds, combo_bonus_at, opponent_fallacy_rate} }
  function create(data, opts) {
    const idx = index(data);
    const topic = idx.topics[opts.topicId];
    const cfg = data.config;
    const ov = opts.overrides || {};
    const G = Object.assign({}, cfg.game, ov);
    const fallacyRate = ov.opponent_fallacy_rate !== undefined ? ov.opponent_fallacy_rate : cfg.opponent_fallacy_rate;
    const rng = opts.rng || Math.random;
    const mySide = opts.mySide;
    const oppSide = mySide === "A" ? "B" : "A";
    const diff = cfg.bot.difficulty.find((d) => d.id === opts.difficulty) || { mult: 1 };
    const opponent = idx.chars[topic.opponents[oppSide]];

    const S = {
      round: 0, me: 0, opp: 0,
      bar: 0,                // -100（对手占优）~ +100（你占优）
      combo: 0, bestCombo: 0, correctCalls: 0,
      mistakes: 0,           // 失误：喊错、自己的谬误被识破、超时
      used: new Set(), current: null,
      mine: new Set(), lastMine: null,     // 玩家自己已经选过的发言（用来在合理发言用完时重提）
      over: false, result: null,
      learned: new Set(),
      review: [],            // 漏网之鱼：{stmt, who, outcome}
      stats: [],             // {fid, kind:'hit'|'miss'}
    };

    const shuffle = shuffler(rng);
    const pick = (arr) => arr[Math.floor(rng() * arr.length)];
    const weighted = (arr, wf) => {
      const w = arr.map(wf);
      let r = rng() * w.reduce((a, b) => a + b, 0);
      for (let i = 0; i < arr.length; i++) { r -= w[i]; if (r <= 0) return arr[i]; }
      return arr[arr.length - 1];
    };
    const addBar = (v) => { S.bar = clamp(S.bar + v, -100, 100); };
    const stat = (fid, kind) => { if (fid) S.stats.push({ fid, kind }); };

    function finish(reason) {
      if (S.over) return;
      S.over = true;
      let winner;
      if (S.me !== S.opp) winner = S.me > S.opp ? "me" : "opp";
      else winner = S.bar > 0 ? "me" : S.bar < 0 ? "opp" : "draw";
      S.result = { winner, reason };
    }
    const checkOver = () => { if (S.me >= G.target_points || S.opp >= G.target_points) finish("points"); };

    function nextOpponent() {
      if (S.over) return null;
      if (S.round >= G.max_rounds) { finish("rounds"); return null; }
      const pool = topic.statements.filter((s) => s.side === oppSide && !S.used.has(s.id));
      if (!pool.length) { finish("exhausted"); return null; }
      S.round++;
      let cands = pool;
      if (S.round === 1) {
        const op = pool.filter((s) => s.opener);
        if (op.length) cands = op;
      } else {
        const wantBad = rng() < fallacyRate;
        const f = cands.filter((s) => (wantBad ? s.fallacy : !s.fallacy));
        if (f.length) cands = f;
        const g = cands.filter((s) => !s.fallacy || s.fallacy !== S.lastOppFallacy);
        if (g.length) cands = g;
      }
      const target = Math.min(3, 1 + Math.floor((S.round - 1) / 3));
      const s = weighted(cands, (x) => 1 + (x.subtlety === target ? 1.5 : 0));
      S.used.add(s.id); S.current = s; S.lastOppFallacy = s.fallacy;
      return s;
    }

    // 玩家可选的回应：1 条合理 + 1 条含谬误 + 1 条随机，优先同角度
    function options() {
      const cur = S.current;
      const pool = topic.statements.filter((s) => s.side === mySide && !S.used.has(s.id));
      const scored = pool
        .map((s) => ({ s, w: (cur && s.angle && s.angle === cur.angle ? 2 : 0) + rng() }))
        .sort((a, b) => b.w - a.w).map((x) => x.s);
      const out = [];
      let sound = scored.find((s) => !s.fallacy);
      const bad = scored.find((s) => s.fallacy);
      // 保证：每个回合至少有一条没有逻辑问题的回应。
      // 没用过的合理发言用完了，就重提自己之前说过的合理观点（上一回合刚说过的除外），界面上会标成“再强调一遍”。
      if (!sound) {
        const again = topic.statements.filter((s) => s.side === mySide && !s.fallacy && S.mine.has(s.id) && s.id !== S.lastMine);
        const any = again.length ? again : topic.statements.filter((s) => s.side === mySide && !s.fallacy);
        if (any.length) sound = Object.assign({}, pick(any), { repeat: true });
      }
      if (sound) out.push(sound);
      if (bad) out.push(bad);
      for (const s of scored) { if (out.length >= 3) break; if (!out.some((o) => o.id === s.id)) out.push(s); }
      return shuffle(out).slice(0, 3);
    }

    const topicFallacies = [...new Set(topic.statements.map((s) => s.fallacy).filter(Boolean))];
    const callOptions = (stmt) => buildCallOptions(data, idx, stmt, topicFallacies, rng);

    function playerCall(fid) {
      const stmt = S.current;
      const correct = isCorrect(stmt, fid);
      const ev = { kind: "call", correct, stmt, chosen: fid, bonus: 0 };
      if (correct) {
        S.me++; S.combo++; S.correctCalls++;
        S.bestCombo = Math.max(S.bestCombo, S.combo);
        if (G.combo_bonus_at && S.combo % G.combo_bonus_at === 0) { S.me++; ev.bonus = 1; }
        addBar(cfg.audience.call_hit + punchOf(stmt) * 4);
        S.learned.add(fid); stat(fid, "hit");           // 记在玩家实际选的那个上（可能是备选答案）
      } else {
        S.opp++; S.combo = 0; S.mistakes++;
        addBar(-cfg.audience.call_miss);
        if (stmt.fallacy) { S.review.push({ stmt, who: "opp", outcome: "mislabeled" }); stat(stmt.fallacy, "miss"); }
      }
      ev.combo = S.combo;
      checkOver();
      return ev;
    }

    function playerReply(stmt) {
      const cur = S.current;
      const ev = { kind: "reply", stmt, oppStmt: cur, botCalled: false, botCorrect: false };
      addBar(-(punchOf(cur) * cfg.audience.step * 0.5));       // 对手的发言没被指出，就“立住”了
      if (cur.fallacy) { S.review.push({ stmt: cur, who: "opp", outcome: "passed" }); stat(cur.fallacy, "miss"); S.combo = 0; }
      S.used.add(stmt.id); S.mine.add(stmt.id); S.lastMine = stmt.id;
      addBar(punchOf(stmt) * cfg.audience.step);
      const sub = stmt.subtlety || 1;
      const p = stmt.fallacy ? Math.min(0.97, (cfg.bot.detect[sub] || 0.5) * diff.mult) : cfg.bot.false_call;
      if (rng() < p) {
        ev.botCalled = true;
        if (stmt.fallacy) {
          ev.botCorrect = true;
          S.opp++; S.combo = 0; S.mistakes++;
          addBar(-(punchOf(stmt) * cfg.audience.step + cfg.audience.call_miss));
          S.learned.add(stmt.fallacy);
          S.review.push({ stmt, who: "me", outcome: "caught" });
          stat(stmt.fallacy, "miss");
        } else { S.me++; addBar(8); }
      } else if (stmt.fallacy) {
        S.review.push({ stmt, who: "me", outcome: "passed" });
      }
      checkOver();
      return ev;
    }

    function timeout() {
      const cur = S.current;
      addBar(-(punchOf(cur) * cfg.audience.step * 0.5) - 10);
      S.combo = 0; S.mistakes++;
      if (cur.fallacy) { S.review.push({ stmt: cur, who: "opp", outcome: "timeout" }); stat(cur.fallacy, "miss"); }
      return { kind: "timeout", stmt: cur };
    }

    const botLine = (kind) => { const l = (opponent.lines || {})[kind]; return l && l.length ? pick(l) : ""; };

    function summary() {
      const sum = {
        won: !!S.result && S.result.winner === "me", draw: !!S.result && S.result.winner === "draw",
        reason: S.result && S.result.reason, me: S.me, opp: S.opp, bar: S.bar, rounds: S.round,
        correctCalls: S.correctCalls, bestCombo: S.bestCombo, mistakes: S.mistakes,
        learned: [...S.learned], review: S.review, stats: S.stats,
      };
      sum.stars = starsFor(sum);
      return sum;
    }

    return {
      state: S, topic, opponent, mySide, oppSide, idx, G,
      nextOpponent, options, callOptions, isCorrect: (s, f) => isCorrect(s, f),
      playerCall, playerReply, timeout, checkOver, botLine, summary, punchOf,
      finish: () => finish("rounds"),
    };
  }

  // ── 一场 Boss 演讲：在限时内找出所有有破绽的句子 ──
  function createSpeech(data, speechId, opts = {}) {
    const idx = index(data);
    const sp = idx.speeches[speechId];
    const rng = opts.rng || Math.random;
    const sents = sp.sentences;
    const S = {
      solved: {},            // i -> 'hit' | 'missed' | 'clean'
      found: 0, wrong: 0,
      total: sents.filter((s) => s.fallacy).length,
      maxWrong: sp.max_mistakes || 3,
      over: false, result: null,
      learned: new Set(), review: [], stats: [],
    };
    const ctx = [...new Set(sents.map((s) => s.fallacy).filter(Boolean))];
    const callOptions = (i) => buildCallOptions(data, idx, sents[i], ctx, rng);

    function finish(reason) {
      if (S.over) return;
      S.over = true;
      const won = S.found >= S.total && S.wrong < S.maxWrong;
      sents.forEach((s, i) => {          // 没找到的破绽，揭晓出来
        if (s.fallacy && !S.solved[i]) {
          S.solved[i] = "missed";
          S.review.push({ stmt: s, who: "opp", outcome: "missed" });
          S.stats.push({ fid: s.fallacy, kind: "miss" });
        }
      });
      S.result = { won, reason };
    }

    function guess(i, fid) {
      if (S.over || S.solved[i]) return null;
      const s = sents[i];
      const correct = isCorrect(s, fid);
      const ev = { kind: "guess", i, stmt: s, correct, chosen: fid };
      if (correct) {
        S.solved[i] = "hit"; S.found++; S.learned.add(fid); S.stats.push({ fid, kind: "hit" });
      } else {
        S.wrong++;
        if (s.fallacy) {
          S.solved[i] = "missed"; S.review.push({ stmt: s, who: "opp", outcome: "mislabeled" });
          S.stats.push({ fid: s.fallacy, kind: "miss" });
        } else S.solved[i] = "clean";
      }
      ev.wrong = S.wrong; ev.hearts = S.maxWrong - S.wrong;
      if (S.found >= S.total) finish("found");
      else if (S.wrong >= S.maxWrong) finish("hearts");
      return ev;
    }

    function summary() {
      const sum = {
        won: !!S.result && S.result.won, reason: S.result && S.result.reason,
        found: S.found, total: S.total, mistakes: S.wrong,
        learned: [...S.learned], review: S.review, stats: S.stats,
      };
      sum.stars = starsForSpeech(sum);
      return sum;
    }

    return {
      state: S, speech: sp, sentences: sents, speaker: idx.chars[sp.speaker],
      callOptions, guess, finish, summary, hearts: () => S.maxWrong - S.wrong,
    };
  }

  const api = { create, createSpeech, starsFor, starsForSpeech, mulberry32, punchOf, index, hash };
  if (typeof module !== "undefined" && module.exports) module.exports = api;
  return api;
})();

<script>(() => {

  };

// ───────── 计时器（对辩的每回合 / Boss 的整场），支持暂停 ─────────
const Timer = { id: null, deadline: 0, total: 0, onEnd: null, urgent: 5000, lastTick: 99, left: 0 };
function tickTimer() {
  const box = $("#timer"); if (!box) return stopTimer();
  const left = Timer.deadline - Date.now();
  box.firstElementChild.style.width = Math.max(0, (left / Timer.total) * 100) + "%";
  box.classList.toggle("urgent", left <= Timer.urgent);
  const sec = Math.ceil(left / 1000);
  if (left <= Timer.urgent && sec !== Timer.lastTick) { Timer.lastTick = sec; Sfx.tick(); }
  if (left <= 0) { const f = Timer.onEnd; stopTimer(); if (f) f(); }
}
function startTimer(seconds, onEnd, urgentSec = 5) {
  stopTimer();
  Timer.total = seconds * 1000; Timer.deadline = Date.now() + Timer.total; Timer.onEnd = onEnd;
  Timer.urgent = urgentSec * 1000; Timer.lastTick = 99; Timer.id = setInterval(tickTimer, 100);
}

function pauseTimer() { if (!Timer.id) return; Timer.left = Timer.deadline - Date.now(); clearInterval(Timer.id); Timer.id = null; }

function explain({ stmt, mode, ev, boss }) {
  return new Promise((res) => {
    const f = stmt.fallacy ? IDX.fal[stmt.fallacy] : null;
    const chosen = ev && ev.chosen ? IDX.fal[ev.chosen] : null;
    const altOk = mode === "hit" && f && chosen && chosen.id !== f.id;       // 选的是“也算对”的备选答案
    const isNew = (mode === "hit" || mode === "caught") && capture(altOk ? chosen : f);
    const tx = stmtTr(stmt);
    const penalty = boss ? t("失去 1 颗 ❤️") : t("对手 +1 分");
    const badges = [];
    let title, sub = "";
    if (mode === "hit") {
      title = t("识破！"); badges.push(`<span class="chip gold">${boss ? t("找到 1 处") : t("+1 分")}</span>`);
      if (ev && ev.bonus) badges.push(`<span class="chip gold">${t("连环破 +1 分")}</span>`);
      if (altOk) sub = t("你选的「{a}」也说得通：这句话同时有两个问题。最贴切的是「{b}」。", { a: esc(fname(chosen)), b: esc(fname(f)) });
    } else if (mode === "caught") { title = t("你被识破了"); badges.push(`<span class="chip red">${penalty}</span>`); }
    else if (!f) { title = t("这句话没有问题"); badges.push(`<span class="chip red">${penalty}</span>`); }
    else {
      title = t("名字选错了"); badges.push(`<span class="chip red">${penalty}</span>`);
      sub = t("你选的是「{a}」，更贴切的是「{b}」。", { a: esc(fname(IDX.fal[ev.chosen])), b: esc(fname(f)) });
    }
    if (isNew) badges.push(`<span class="chip red">${t("收进破绽簿")}</span>`);
    pauseTimer();
    showSheet(`<div class="explain">
      <div class="head"><div class="big">${f ? f.emoji : "👌"}</div>
        <div><h3>${title}</h3><div class="en">${f ? esc(fullName(f)) : t("合理的论证")}</div></div></div>
      <div class="badges">${badges.join("")}</div>
      <blockquote>${esc(tx.text)}</blockquote>
      ${sub ? `<p>${sub}</p>` : ""}

}

/* 40-scene.js · 剧情播放器：角色头像 + 对话框，逐字显示，轻点继续，可跳过。
 * 剧情数据格式（content/chapters/*）：[{ who: 角色id（不写=旁白）, mood: 表情, say: 台词 }, ...] */
function playScene(lines) {
  if (!lines || !lines.length) return Promise.resolve();
  return new Promise((resolve) => {
    const el = document.createElement("div");
    el.className = "scene-wrap";
    el.innerHTML = `<button class="scene-skip" data-scene="skip">${t("跳过")}</button>
      <div class="scene-stage"></div>
      <div class="dialog"><div class="nm"></div><div class="tx"></div><div class="more">${t("轻点继续 ▾")}</div></div>`;
    app.appendChild(el);
    const stage = $(".scene-stage", el), nm = $(".nm", el), tx = $(".tx", el), dialog = $(".dialog", el);
    let i = -1, typing = null, full = "", closed = false;

    const end = () => { if (closed) return; closed = true; clearTimeout(typing); el.remove(); resolve(); };
    function show(n) {
      const L = lines[n], who = L.who ? IDX.chars[L.who] : null;
      dialog.classList.toggle("narr", !who);
      stage.innerHTML = who ? `<div class="scene-av">${avatar(who, L.mood || "neutral")}</div>` : "";
      nm.textContent = who ? chName(who) : "";
      full = L.say; tx.textContent = ""; let k = 0;
      clearTimeout(typing);
      const step = () => { k++; tx.textContent = full.slice(0, k); typing = k < full.length ? setTimeout(step, 24) : null; };
      typing = setTimeout(step, 24);
      Sfx.page();
    }
    function advance() {
      if (typing) { clearTimeout(typing); typing = null; tx.textContent = full; return; }   // 正在逐字显示：先补全
      i++;
      if (i >= lines.length) return end();
      show(i);
    }
    el.addEventListener("click", (e) => { if (e.target.closest("[data-scene=skip]")) return end(); advance(); });
    advance();
  });
}

let curBubble = null, curOpts = [];
function showDock(opts) {
  const d = $("#dock");
  d.innerHTML = (opts.length
    ? opts.map((o, i) => `<button class="opt" data-act="reply" data-i="${i}"><span class="fire">${"🔥".repeat(Engine.punchOf(o))}</span><span>${esc(replyText(o))}</span></button>`).join("")
    : `<div class="empty">${t("你已经没有可用的回应，只能指出对方的问题。")}</div>`) +
    `<button class="callbtn" data-act="call">${esc(gtext("call_button"))}</button>`;
  d.classList.remove("lock");
}
const lockDock = () => { const d = $("#dock"); if (d) d.classList.add("lock"); };

async function nextRound() {
  const m = M, my = ++token, S = M.state;
  busy = true;
  const s = M.nextOpponent();
  if (!s) return finishMatch();
  updateHUD(); push(t("第 {n} 回合", { n: S.round }), "roundmark");
  if (S.round === 1) { say("open"); if (!(await wait(500))) return; }
  const ty = push("<i></i><i></i><i></i>", "typing");
  if (!(await wait(650))) return; ty.remove();
  if (M !== m || my !== token) return;
  curBubble = bubble("opp", s);
  setMood(s.fallacy ? "smug" : "neutral");
  curOpts = M.options(); showDock(curOpts);
  busy = false; startTimer(curG.turn_seconds, onTimeout);
  if (hintsOn) {      // 提示弹幕：只透露“哪一类”，不直接给答案
    setTimeout(() => {
      if (M !== m || token !== my || busy) return;
      dmEvent(s.fallacy ? "opp_fallacy" : "opp_sound", { fallacy: s.fallacy ? famName(IDX.fal[s.fallacy].family) : "" }, "gold");
    }, 3500);
  }
}
async function afterRound() {
  if (!M) return;
  updateHUD();
  if (M.state.over) return finishMatch();
  await nextRound();
}

async function doReply(i) {
  if (busy) return; busy = true; stopTimer(); lockDock();
  const m = M, stmt = curOpts[i], oppStmt = M.state.current, oppBubble = curBubble;
  const mine = bubble("me", stmt);
  const ev = M.playerReply(stmt); updateHUD();
  if (oppStmt.fallacy) { const f = IDX.fal[oppStmt.fallacy]; chipOn(oppBubble, `${t("漏掉了：")}${f.emoji} ${fname(f)}`, "red"); }
  if (!(await wait(800))) return;
  if (ev.botCalled && ev.botCorrect) {
    await objection(gtext("stamp_bot"), "opp"); if (M !== m) return;
    strike(mine); const f = IDX.fal[stmt.fallacy]; chipOn(mine, `${f.emoji} ${fname(f)}`, "gold");
    setMood("smug"); dmEvent("bot_hit", { fallacy: fname(f) }, "red", 2);
    await explain({ stmt, mode: "caught", ev }); if (M !== m) return;
  } else if (ev.botCalled) {
    await objection(gtext("stamp_bot"), "opp"); if (M !== m) return;
    aside(`<b>${t("裁判")}</b>${t("：")}${t("这句话没有问题，对手误判了。你得 1 分。")}`);
    Sfx.good(); setMood("flustered", true); dmEvent("call_miss", {}, "jade", 2);
    if (!(await wait(900))) return;
  } else if (stmt.fallacy) {
    const f = IDX.fal[stmt.fallacy]; chipOn(mine, `${t("蒙混过关：")}${f.emoji} ${fname(f)}`, "gold");
    dmEvent("bot_miss", {}, "gold", 2); setMood("neutral");
    if (!(await wait(700))) return;
  } else {
    setMood("flustered", true); Sfx.good();
    if (!(await wait(500))) return;
  }
  await afterRound();
}

function openCall() {
  if (busy) return;
  const s = M.state.current, opts = M.callOptions(s);
  showSheet(`<h3>${t("这句话的问题是？")}</h3><div class="sub">${t("选出最贴切的名称。选错，或者这句话没问题，对手得 1 分。")}</div>
    ${opts.map((id) => { const f = IDX.fal[id]; return `<button class="callopt" data-act="pick" data-f="${id}"><span class="em">${f.emoji}</span><span><b>${fname(f)}</b><small>${esc(fsub(f))}</small></span></button>`; }).join("")}
    <button class="btn ghost" style="width:100%" data-act="closeSheet">${t("再想想")}</button>`, { closeable: true });
}
async function doCall(fid) {
  if (busy) return; busy = true; stopTimer(); closeSheet(); lockDock();
  const m = M, s = M.state.current, bub = curBubble;
  const ev = M.playerCall(fid); updateHUD();
  if (ev.correct) {
    const f = IDX.fal[s.fallacy];
    await objection(gtext("stamp_call")); if (M !== m) return;
    strike(bub); chipOn(bub, `${f.emoji} ${fname(f)}`, "gold"); setMood("flustered", true); Sfx.good();
    say("caught"); dmEvent("call_hit", { fallacy: fname(f) }, "jade", 3);
    if (ev.combo >= 2) comboBanner(ev.combo);
    await explain({ stmt: s, mode: "hit", ev }); if (M !== m) return;
  } else {
    await objection(gtext("stamp_reject"), "no"); if (M !== m) return;
    setMood("smug"); say("wrong_call"); dmEvent("call_miss", {}, "red", 2);
    if (s.fallacy) { const f = IDX.fal[s.fallacy]; chipOn(bub, `${t("其实是：")}${f.emoji} ${fname(f)}`, "red"); }
    await explain({ stmt: s, mode: "wrong", ev }); if (M !== m) return;
  }
  await afterRound();
}
async function onTimeout() {
  if (busy || !M) return; busy = true; closeSheet(); lockDock();
  const m = M, s = M.state.current; M.timeout(); updateHUD();
  Sfx.bad(); aside(t("⏰ 时间到，你没来得及回应。")); setMood("smug");
  if (s.fallacy) { const f = IDX.fal[s.fallacy]; chipOn(curBubble, `${t("漏掉了：")}${f.emoji} ${fname(f)}`, "red"); }
  if (!(await wait(1200))) return;
  await afterRound();
}

// 对局结束：记录星级与印章 → 播放结束剧情 → 结算页
async function finishMatch() {
  stopTimer(); stopAmbient(); token++;
  const m = M, sum = M.summary(), lv = curLevel;
  save.matches++; if (sum.won) save.wins++;
  applyStats(sum.stats);
  const res = lv ? recordLevel(lv, sum.stars) : { stars: 0, firstClear: false, seal: null };
  persist();
  await sleep(500); if (M !== m) return;
  if (lv) { await playAfter(lv, sum.won, res.firstClear); if (M !== m) return; }
  resultScreen({
    won: sum.won, draw: sum.draw, level: lv, res, stars: sum.stars, who: m.opponent,
    scoreLine: `${sum.me} : ${sum.opp}`, review: sum.review, title: tTitle(m.topic),
    quote: (() => { const k = sum.won ? "lose" : "win"; return chLine(m.opponent, k, m.botLine(k)); })(),
    facts: [{ n: sum.correctCalls, label: t("识破") }, { n: sum.bestCombo, label: t("最高连破") }, { n: sum.mistakes, label: t("失误") }],
    callCount: sum.correctCalls,
  });
}

/* ===== 60-boss.js ===== */
/* 60-boss.js · Boss 关：对手一口气说完一段演讲，你在限时内点出有破绽的句子并选对名字。
 * 点错（名字不对，或这句其实没问题）失去一颗心；心用完或时间到就输。 */
let bossSel = -1;

const heartsHTML = () => { const left = B.hearts(), max = B.state.maxWrong; return "❤️".repeat(left) + "🖤".repeat(max - left); };
function updateBossHUD() {
  $("#hearts").innerHTML = heartsHTML();
  $("#found").textContent = `${B.state.found}/${B.state.total}`;
}

function startBoss(lv) {
  const sp = SPEECHES[lv.speech];
  B = Engine.createSpeech(DATA, sp.id, {});
  M = null; newly = []; busy = false; token++; screen = "boss"; closeSheet(); bossSel = -1;
  curG = G0; hintsOn = false;
  playCh = lv.chapter; applyChapter(chapterById(playCh));
  const o = B.speaker;
  mount(`
    <div class="hud">
      <button class="iconbtn" data-act="leave" aria-label="${t("退出")}">✕</button>
      <div class="score">
        <div class="side"><div class="hearts" id="hearts"></div><span>${t("你的容错")}</span></div>
        <span class="vsmark">${t("破")}</span>
        <div class="side"><b class="foundn" id="found"></b><span>${t("已找到破绽")}</span></div>
      </div>
      <button class="iconbtn" data-act="settings" aria-label="${t("设置")}">⚙</button>
    </div>
    <div class="stage"><div class="avatar" id="avatar"></div>
      <div class="who"><b>${esc(chName(o))}</b><small>${esc(chTitle(o))}</small>
        <div class="meta">${esc(spTitle(sp))}</div>
        <div class="meta">${t("限时 {s} 秒 · 最多错 {m} 次", { s: sp.time_limit, m: sp.max_mistakes || 3 })}</div></div></div>
    <div class="dm-layer" id="dm"></div>
    <div class="timer" id="timer"><i></i></div>
    <div class="speech" id="speech">
      <div class="aside">${esc(spIntro(sp))}</div>
      ${B.sentences.map((s, i) => `<button class="sent" data-act="sent" data-i="${i}"><span class="no">${i + 1}</span><span class="body"><span class="tx">${esc(stmtTr(s).text)}</span><span class="tags"></span></span></button>`).join("")}
    </div>
    <div class="dock"><div class="empty">${t("点击你觉得有问题的句子 · 点错会失去一颗心")}</div></div>`, "match boss");
  setMood("smug"); updateBossHUD(); startAmbient();
  startTimer(sp.time_limit, onBossTimeout, 10);
}

function openSentence(i) {
  if (busy || !B || B.state.over || B.state.solved[i]) return;
  bossSel = i;
  $$(".sent").forEach((c) => c.classList.toggle("sel", +c.dataset.i === i));
  const opts = B.callOptions(i);
  showSheet(`<h3>${t("第 {n} 句的问题是？", { n: i + 1 })}</h3><div class="sub">${t("选出最贴切的名称。选错，或者这句其实没问题，会失去一颗心。")}</div>
    ${opts.map((id) => { const f = IDX.fal[id]; return `<button class="callopt" data-act="spick" data-f="${id}"><span class="em">${f.emoji}</span><span><b>${fname(f)}</b><small>${esc(fsub(f))}</small></span></button>`; }).join("")}
    <button class="btn ghost" style="width:100%" data-act="closeSheet">${t("再想想")}</button>`, { closeable: true });
}
function markSentence(i, kind) {
  const card = $(`.sent[data-i="${i}"]`); if (!card || card.dataset.done) return;
  card.dataset.done = "1"; card.classList.remove("sel"); card.classList.add(kind);
  const s = B.sentences[i], f = s.fallacy ? IDX.fal[s.fallacy] : null, tags = $(".tags", card);
  const chip = kind === "hit" ? `<span class="chip gold">${f.emoji} ${fname(f)}</span>`
    : kind === "missed" ? `<span class="chip red">${t("其实是：")}${f.emoji} ${fname(f)}</span>`
    : `<span class="chip">${t("✓ 这句没问题")}</span>`;
  tags.innerHTML = chip;
}

async function doGuess(fid) {
  if (busy || !B) return; busy = true; closeSheet(); pauseTimer();
  const b = B, i = bossSel, ev = b.guess(i, fid);
  if (!ev) { busy = false; resumeTimer(); return; }
  updateBossHUD();
  const s = ev.stmt, f = s.fallacy ? IDX.fal[s.fallacy] : null;
  if (ev.correct) {
    await objection(gtext("stamp_call")); if (B !== b) return;
    markSentence(i, "hit"); setMood("flustered", true); Sfx.good(); dmEvent("call_hit", { fallacy: fname(f) }, "jade", 3);
    await explain({ stmt: s, mode: "hit", ev, boss: true });
  } else {
    await objection(gtext("stamp_reject"), "no"); if (B !== b) return;
    markSentence(i, f ? "missed" : "clean"); setMood("smug"); dmEvent("call_miss", {}, "red", 2);
    await explain({ stmt: s, mode: "wrong", ev, boss: true });
  }
  if (B !== b) return;
  busy = false;
  if (b.state.over) finishBoss(); else resumeTimer();
}
function onBossTimeout() {
  if (!B || B.state.over) return;
  closeSheet(); B.finish("time"); updateBossHUD(); finishBoss();
}

async function finishBoss() {
  stopTimer(); stopAmbient(); token++;
  const b = B, sum = b.summary(), lv = curLevel, sp = b.speech;
  b.sentences.forEach((s, i) => { if (b.state.solved[i] === "missed") markSentence(i, "missed"); });   // 揭晓没找到的
  save.matches++; if (sum.won) save.wins++;
  applyStats(sum.stats);
  const res = recordLevel(lv, sum.stars); persist();
  sum.won ? Sfx.good() : Sfx.bad();
  await sleep(1500); if (B !== b) return;
  await playAfter(lv, sum.won, res.firstClear); if (B !== b) return;
  const o = b.speaker, line = (o.lines && o.lines[sum.won ? "lose" : "win"]) || [];
  resultScreen({
    won: sum.won, level: lv, res, stars: sum.stars, who: o, boss: true,
    scoreLine: `${sum.found}/${sum.total}`, review: sum.review, title: spTitle(sp),
    quote: line.length ? chLine(o, sum.won ? "lose" : "win", rnd(line)) : "",
    facts: [{ n: sum.found, label: t("找到破绽") }, { n: sum.mistakes, label: t("失误") }, { n: b.hearts(), label: t("剩余的心") }],
  });
}

async function startLevel(id) {

  curLevel = lv; closeSheet(); playCh = ch.id; applyChapter(ch);
  if (lv.before && lv.before.length && !save.seen["before:" + id]) { save.seen["before:" + id] = 1; persist(); await playScene(sceneBefore(lv)); }

function launchLevel(lv) {
  curLevel = lv;

async function playAfter(lv, won, firstClear) {     // 结束剧情：第一次通关播放“赢”的剧情（Boss 还会播章节结尾）；第一次失败播放“输”的剧情
  const ch = chapterById(lv.chapter);
  let lines = [];

  else if (!save.seen["lose:" + lv.id]) { save.seen["lose:" + lv.id] = 1; persist(); lines = sceneLose(lv); }
  if (lines.length) await playScene(lines);
}

  if (ci < CHAPTERS.length - 1) return { kind: "chapter", id: CHAPTERS[ci + 1].id, name: cName(CHAPTERS[ci + 1]) };
  return { kind: "end" };

function leaveMatch() { stopTimer(); stopAmbient(); token++; M = null; B = null; busy = false; closeSheet(); }

/* ===== 99-main.js ===== */
/* 99-main.js · 事件分发（每个按钮的 data-act 对应一个动作）与启动。 */
app.addEventListener("click", (e) => {
  const sb = e.target.closest(".seg button");
  if (sb) { setup[sb.parentElement.dataset.seg] = sb.dataset.v; syncSeg(); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const d = el.dataset;
  switch (d.act) {
    // 导航
    case "home": leaveMatch(); home(); break;
    case "open": leaveMatch(); openChapter(d.id); break;
    case "map": { const ch = chapterById(curLevel ? curLevel.chapter : save.chapter); leaveMatch(); mapScreen(ch); break; }
    case "chapter": {
      const ch = chapterById(d.id);
      if (!chapterUnlocked(ch)) toast(t("通关上一章后解锁"));
      else { save.chapter = ch.id; persist(); home(); }
      break;
    }
    case "soon": soonSheet(d.id); break;
    case "dex": dex(); break;
    case "dextab": dex(d.v); break;
    case "topics": leaveMatch(); topics(); break;
    // 关卡
    case "level": levelSheet(d.id); break;
    case "startlevel": startLevel(d.id); break;
    case "gonext": leaveMatch(); startLevel(d.id); break;
    case "retry": if (curLevel) launchLevel(curLevel); else startMatch(lastSetup.id, lastSetup.sideChoice, lastSetup.diff, lastSetup.opt); break;
    // 自由对战
    case "setup": openSetup(d.id); break;
    case "start": curLevel = null; startMatch(setup.id, setup.side, setup.diff); break;
    // 对局中
    case "reply": doReply(+d.i); break;
    case "call": openCall(); break;
    case "pick": doCall(d.f); break;
    // Boss 中
    case "sent": openSentence(+d.i); break;
    case "spick": doGuess(d.f); break;
    // 面板与信息
    case "learn": learnSheet(chapterById(d.id)); break;
    case "fdetail": fdetail(d.id); break;
    case "sealinfo": sealInfo(d.id); break;
    case "help": help(); break;
    case "settings": settings(); break;
    case "closeSheet": closeSheet(); break;
    case "share": share(); break;
    case "leave":
      showSheet(`<h3>${t("退出这一关？")}</h3><div class="sub">${t("本局进度不会保存。")}</div>
        <button class="btn primary" style="width:100%;margin-bottom:8px" data-act="leaveYes">${t("退出")}</button>
        <button class="btn ghost" style="width:100%" data-act="closeSheet">${t("继续")}</button>`, { closeable: true });
      break;
    case "leaveYes": { const lv = curLevel; leaveMatch(); if (lv) mapScreen(chapterById(lv.chapter)); else topics(); break; }
    // 设置
    case "lang":
      // 对局进行中，界面上已经有一半是旧语言的文字了，所以只允许在首页切换
      if (screen !== "home") { toast("请先回到首页再切换语言 · Go back to the home screen to change the language"); break; }
      setLang(d.v); home(); settings();
      break;
    case "tog": save.settings[d.k] = !save.settings[d.k]; persist(); el.setAttribute("aria-pressed", String(save.settings[d.k])); break;
    case "reset":
      if (el.dataset.sure) { const keep = save.lang; save = defaults(); save.lang = keep; save.chapter = CHAPTERS[0].id; persist(); closeSheet(); if (screen === "home") home(); toast(t("进度已清除")); }
      else { el.dataset.sure = "1"; el.textContent = t("再点一次确认"); }
      break;
  }
});

// 启动：首页默认停在故事进行到的那一章
if (!save.chapter || !CHAPTERS.some((c) => c.id === save.chapter)) {
  const nl = nextLevel();
  save.chapter = (nl ? nl.ch : CHAPTERS[0]).id;
}
applyLang();
home();

})();</script>
</body>
</html>

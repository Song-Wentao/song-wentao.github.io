<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>且慢！</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>/* ───────── 设计令牌：夜宴（深紫墨色 + 灯笼红 + 金）；亮色为宣纸灰白 ───────── */
:root {
  --bg: #f1ecec; --bg2: #e7dfdf; --surface: #ffffff; --surface2: #f6f0ef;
  --ink: #241a2b; --ink2: #6a5d74; --line: rgba(36, 26, 43, .14);
  --red: #c8302d; --red2: #9c211e; --gold: #b7791f; --gold-bg: #f6dfae; --jade: #16866a; --blue: #2b6ed8;
  --paper: #fbf1dc; --paper-ink: #2b1e19; --me: #c8302d;
  --glow: rgba(200, 48, 45, .10); --red-soft: rgba(200, 48, 45, .14); --shadow: 0 6px 18px rgba(36, 26, 43, .16);
  --brush: "Ma Shan Zheng", "STKaiti", "KaiTi", "Kaiti SC", "楷体", serif;
  --sans: -apple-system, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #160f1e; --bg2: #1f1629; --surface: #2a1f38; --surface2: #34284a;
    --ink: #f5ecdd; --ink2: #b8abc6; --line: rgba(255, 255, 255, .13);
    --red: #ef4a3f; --red2: #b3231f; --gold: #f5b942; --gold-bg: #4a3512; --jade: #4cc9a4; --blue: #6aa2ff;
    --paper: #f3e3c6; --paper-ink: #2b1e19; --me: #d83a32;
    --glow: rgba(239, 74, 63, .24); --red-soft: rgba(239, 74, 63, .18); --shadow: 0 8px 24px rgba(0, 0, 0, .45); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #160f1e; --bg2: #1f1629; --surface: #2a1f38; --surface2: #34284a;
  --ink: #f5ecdd; --ink2: #b8abc6; --line: rgba(255, 255, 255, .13);
  --red: #ef4a3f; --red2: #b3231f; --gold: #f5b942; --gold-bg: #4a3512; --jade: #4cc9a4; --blue: #6aa2ff;
  --paper: #f3e3c6; --paper-ink: #2b1e19; --me: #d83a32;
  --glow: rgba(239, 74, 63, .24); --red-soft: rgba(239, 74, 63, .18); --shadow: 0 8px 24px rgba(0, 0, 0, .45); color-scheme: dark;
}

*, *::before, *::after { box-sizing: inherit; }
html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); -webkit-text-size-adjust: 100%; }
body {
  height: 100%; margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.5 var(--sans); -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
}
button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; padding: 0; }
button:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
#app { position: relative; height: 100%; max-width: 480px; margin: 0 auto; overflow: hidden;
  background: radial-gradient(90% 38% at 50% 0%, var(--glow), transparent 70%), var(--bg); }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.scroll { overflow-y: auto; -webkit-overflow-scrolling: touch; }

/* ───────── 通用组件 ───────── */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 11px 16px;
  border-radius: 12px; background: var(--surface2); border: 1.5px solid var(--line); font-weight: 600; }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--red); border-color: transparent; color: #fff; box-shadow: 0 4px 0 var(--red2); }
.btn.primary:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--red2); }
.btn.big { font-size: 20px; padding: 14px 24px; border-radius: 14px; letter-spacing: .12em; }
.btn.ghost { background: transparent; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; line-height: 1; padding: 4px 9px;
  border-radius: 999px; background: var(--surface2); border: 1px solid var(--line); color: var(--ink2); white-space: nowrap; }
.chip.red { background: var(--red-soft); border-color: transparent; color: var(--red); font-weight: 600; }
.chip.gold { background: var(--gold-bg); border-color: transparent; color: var(--gold); font-weight: 600; }
.topbar { display: flex; align-items: center; gap: 10px; padding: 12px 14px 8px; }
.topbar h2 { margin: 0; font-size: 19px; flex: 1; }
.iconbtn { width: 38px; height: 38px; border-radius: 12px; background: var(--surface2); border: 1.5px solid var(--line);
  display: grid; place-items: center; font-size: 17px; }

/* ───────── 首页 ───────── */
.home { align-items: center; }
.lanterns { position: absolute; top: 0; left: 0; right: 0; height: 130px; pointer-events: none; }
.lantern { position: absolute; top: -6px; transform-origin: 50% 0; animation: sway 4.5s ease-in-out infinite; }
.lantern:nth-child(2) { animation-delay: -1.5s; } .lantern:nth-child(3) { animation-delay: -3s; }
@keyframes sway { 0%, 100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg); } }
.hero { margin-top: 92px; text-align: center; padding: 0 24px; position: relative; }
.title { font-family: var(--brush); font-size: 92px; line-height: 1.05; margin: 0; letter-spacing: .06em; color: var(--ink);
  text-shadow: 0 3px 0 var(--red2); }
.seal { position: absolute; right: 2px; top: -10px; font-family: var(--brush); font-size: 19px; line-height: 1.15;
  color: #fff; background: var(--red); padding: 8px 6px; writing-mode: vertical-rl; border-radius: 4px;
  transform: rotate(7deg); box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .4); letter-spacing: .15em; }
.tagline { margin: 14px 0 0; color: var(--ink2); font-size: 15px; }
.family { display: flex; justify-content: center; margin-top: 26px; height: 92px; position: relative; }
.family .av { width: 84px; height: 84px; margin: 0 -9px; animation: bob 3s ease-in-out infinite; }
.family .av:nth-child(2n) { animation-delay: -1s; } .family .av:nth-child(3n) { animation-delay: -2s; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
.ground { width: 92%; margin-top: -14px; position: relative; z-index: 1; flex: none; }
.ground-tablecloth { height: 30px; border-radius: 50%; background: linear-gradient(var(--red), var(--red2)); box-shadow: var(--shadow); }
.ground-desk { height: 26px; border-radius: 10px 10px 4px 4px; background: linear-gradient(#3b3150, #241c33); border-top: 3px solid var(--red);
  box-shadow: 0 -4px 16px var(--red-soft), var(--shadow); }
.ground-podium { height: 28px; border-radius: 6px; background: linear-gradient(#e8c36a, #b98a2e); box-shadow: var(--shadow); }
.progress { width: calc(100% - 40px); margin-top: 26px; padding: 14px 16px; border-radius: 16px; background: var(--surface);
  border: 1.5px solid var(--line); }
.progress .r1 { display: flex; align-items: baseline; gap: 10px; }
.progress .rname { font-family: var(--brush); font-size: 30px; color: var(--red); line-height: 1; }
.meter { height: 8px; border-radius: 4px; background: var(--line); margin: 10px 0 6px; overflow: hidden; }
.meter i { display: block; height: 100%; background: var(--gold); border-radius: 4px; transition: width .6s; }
.progress small { color: var(--ink2); }
.home .cta { margin-top: 22px; width: calc(100% - 40px); }
.home .cta .btn.big { width: 100%; }
.home .row2 { display: flex; gap: 10px; margin-top: 14px; width: calc(100% - 40px); }
.home .row2 .btn { flex: 1; padding: 10px 6px; font-size: 14px; }

/* ───────── 选题 ───────── */
.topic { display: block; width: 100%; text-align: left; padding: 14px 14px 14px 18px; margin-bottom: 12px;
  background: var(--surface); border: 1.5px solid var(--line); border-left: 7px solid var(--red); border-radius: 6px 16px 16px 6px; }
.topic:active { transform: scale(.99); }
.topic h3 { margin: 0 0 4px; font-size: 18px; }
.topic p { margin: 0 0 10px; color: var(--ink2); font-size: 13.5px; }
.topic .foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.topic .sides { display: flex; gap: 6px; flex-wrap: wrap; }
.topic .mini { display: flex; } .topic .mini .av { width: 44px; height: 44px; margin-left: -10px; }
.list { padding: 4px 16px 24px; }
.seg { display: flex; background: var(--surface2); border: 1.5px solid var(--line); border-radius: 12px; padding: 3px; gap: 3px; }
.seg button { flex: 1; padding: 9px 4px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--ink2); }
.seg button[aria-pressed="true"] { background: var(--red); color: #fff; }
.setup h3 { margin: 0 0 4px; font-size: 19px; }
.setup .lbl { margin: 14px 0 6px; font-size: 13px; color: var(--ink2); }
.vs { display: flex; align-items: center; gap: 12px; padding: 10px 12px; margin-top: 12px; border-radius: 14px; background: var(--surface2); }
.vs .av { width: 56px; height: 56px; flex: none; }

/* ───────── 对局 ───────── */
.match { animation: none; }
.match.shake { animation: shake .42s; }
@keyframes shake { 10%, 90% { transform: translateX(-3px); } 30%, 70% { transform: translateX(6px); } 50% { transform: translateX(-6px); } }
.hud { display: flex; align-items: center; gap: 8px; padding: 10px 12px 4px; }
.score { flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; }
.side { display: flex; flex-direction: column; align-items: center; gap: 1px; font-size: 12px; color: var(--ink2); }
.pips { display: flex; gap: 1px; font-size: 17px; min-height: 22px; }
.pip { filter: grayscale(1) opacity(.28); transition: filter .3s, transform .3s; }
.pip.on { filter: none; transform: scale(1.12); }
.vsmark { font-family: var(--brush); font-size: 22px; color: var(--red); }
.stage { display: flex; align-items: center; gap: 10px; padding: 2px 14px 6px; }
.stage .avatar { width: 92px; height: 92px; flex: none; transition: transform .25s; }
.stage .avatar.hit { animation: hit .4s; }
@keyframes hit { 30% { transform: translateX(8px) rotate(4deg); } 60% { transform: translateX(-6px) rotate(-3deg); } }
.who { flex: 1; min-width: 0; }
.who b { font-size: 17px; } .who small { color: var(--ink2); margin-left: 6px; }
.meta { font-size: 12.5px; color: var(--ink2); margin: 2px 0 8px; }
.bar { position: relative; height: 14px; border-radius: 7px; background: var(--red2); overflow: hidden; border: 1.5px solid var(--line); }
.bar i { position: absolute; right: 0; top: 0; bottom: 0; width: 50%; background: linear-gradient(270deg, var(--gold), #ffd86b);
  border-radius: 7px 0 0 7px; transition: width .6s cubic-bezier(.2, .9, .3, 1.15); }
.bar::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 2px; background: rgba(255, 255, 255, .5); }
.barlbl { display: flex; justify-content: space-between; font-size: 11.5px; color: var(--ink2); margin-top: 3px; }
.dm-layer { position: absolute; left: 0; right: 0; top: 46px; height: 132px; overflow: hidden; pointer-events: none; z-index: 5; }
.dm { position: absolute; left: 0; white-space: nowrap; font-size: 14px; font-weight: 700; color: #fff;
  text-shadow: 0 1px 3px rgba(0, 0, 0, .85), 0 0 2px rgba(0, 0, 0, .8); animation: dm linear forwards; }
.dm.gold { color: #ffd86b; } .dm.red { color: #ff9c92; } .dm.jade { color: #7fe5c6; }
@keyframes dm { from { transform: translateX(var(--w)); } to { transform: translateX(-105%); } }

.chat { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 14px 10px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
.msg { max-width: 88%; display: flex; flex-direction: column; gap: 5px; animation: pop .28s cubic-bezier(.2, 1.2, .4, 1) both; }
.msg.opp { align-self: flex-start; } .msg.me { align-self: flex-end; align-items: flex-end; }
@keyframes pop { from { opacity: 0; transform: translateY(8px) scale(.96); } }
.bubble { position: relative; padding: 10px 13px; font-size: 15px; line-height: 1.55; background: var(--paper); color: var(--paper-ink);
  border-radius: 5px 16px 16px 16px; box-shadow: 0 2px 0 rgba(0, 0, 0, .2); overflow: hidden; }
.msg.me .bubble { background: var(--me); color: #fff; border-radius: 16px 5px 16px 16px; }
.bubble.struck { filter: saturate(.4); opacity: .78; }
.bubble.struck .txt { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--red2); }
.bubble.struck::after { content: ""; position: absolute; inset: 0; pointer-events: none; animation: crack .35s ease-out both;
  background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 40' preserveAspectRatio='none'><path vector-effect='non-scaling-stroke' d='M50 0 L45 9 L55 17 L43 26 L53 33 L48 40 M45 9 L28 13 M55 17 L74 15 M43 26 L26 31 M53 33 L70 36' stroke='%23b3231f' stroke-width='2' fill='none' stroke-linejoin='round'/></svg>") center/100% 100% no-repeat; }
@keyframes crack { from { opacity: 0; transform: scale(1.15); } }
.aside { align-self: center; text-align: center; font-size: 13px; color: var(--ink2); max-width: 94%; animation: pop .3s both; }
.aside b { color: var(--ink); font-weight: 600; }
.roundmark { align-self: stretch; display: flex; align-items: center; gap: 10px; color: var(--ink2); font-size: 12px; margin-top: 4px; }
.roundmark::before, .roundmark::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.typing { display: inline-flex; gap: 4px; padding: 12px 14px; background: var(--paper); border-radius: 5px 16px 16px 16px; align-self: flex-start; }
.typing i { width: 7px; height: 7px; border-radius: 50%; background: #9a8877; animation: blink 1s infinite; }
.typing i:nth-child(2) { animation-delay: .15s; } .typing i:nth-child(3) { animation-delay: .3s; }
@keyframes blink { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

.timer { height: 6px; background: var(--line); }
.timer i { display: block; height: 100%; width: 100%; background: var(--jade); transition: width .1s linear; }
.timer.urgent i { background: var(--red); animation: pulse .5s infinite; }
@keyframes pulse { 50% { opacity: .55; } }
.dock { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 8px; background: var(--bg2); border-top: 1px solid var(--line); }
.dock.lock { pointer-events: none; opacity: .55; }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; padding: 10px 12px; border-radius: 14px;
  background: var(--surface); border: 1.5px solid var(--line); font-size: 14.5px; line-height: 1.45; box-shadow: 0 3px 0 var(--line); }
.opt:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
.opt .fire { flex: none; font-size: 11px; margin-top: 3px; letter-spacing: -2px; min-width: 32px; }
.callbtn { width: 100%; padding: 13px; border-radius: 14px; background: var(--red); color: #fff; font-weight: 700; font-size: 17px;
  letter-spacing: .1em; box-shadow: 0 4px 0 var(--red2); }
.callbtn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--red2); }
.dock .empty { text-align: center; color: var(--ink2); font-size: 13px; padding: 4px; }

/* ───────── 印章、连击、面板 ───────── */
.stamp-wrap { position: absolute; inset: 0; z-index: 40; display: grid; place-items: center; }
.flash { position: absolute; inset: 0; background: #fff; animation: flash .4s ease-out forwards; pointer-events: none; }
@keyframes flash { from { opacity: .75; } to { opacity: 0; } }
.stamp { font-family: var(--brush); font-size: 92px; line-height: 1.1; color: var(--red); border: 7px solid var(--red); border-radius: 12px;
  padding: 0 24px 4px; background: rgba(255, 250, 240, .93); transform: rotate(-8deg); animation: stamp .42s cubic-bezier(.2, 1.7, .4, 1) both;
  box-shadow: 0 10px 30px rgba(0, 0, 0, .35); white-space: nowrap; }
.stamp.opp { color: var(--blue); border-color: var(--blue); }
.stamp.no { color: #6d6478; border-color: #6d6478; }
.stamp.sm { font-size: 60px; }
@keyframes stamp { from { opacity: 0; transform: rotate(-8deg) scale(3.2); } 60% { opacity: 1; } }
.combo { position: absolute; top: 30%; left: 0; right: 0; text-align: center; z-index: 45; pointer-events: none;
  font-family: var(--brush); font-size: 54px; color: #ffd86b; text-shadow: 0 3px 0 var(--red2), 0 0 18px rgba(255, 180, 60, .7); animation: combo 1.1s both; }
@keyframes combo { 0% { opacity: 0; transform: scale(.4); } 20% { opacity: 1; transform: scale(1.15); } 70% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: translateY(-30px); } }

.sheet-back { position: absolute; inset: 0; z-index: 30; display: flex; align-items: flex-end; background: rgba(8, 4, 14, .58); animation: fade .2s both; }
@keyframes fade { from { opacity: 0; } }
.sheet { width: 100%; max-height: 88%; overflow-y: auto; background: var(--surface); border-radius: 22px 22px 0 0; padding: 18px 16px 18px;
  animation: up .3s cubic-bezier(.2, .9, .3, 1); box-shadow: 0 -10px 30px rgba(0, 0, 0, .3); }
@keyframes up { from { transform: translateY(40%); opacity: 0; } }
.sheet h3 { margin: 0; font-size: 19px; }
.sheet .sub { color: var(--ink2); font-size: 13px; margin: 2px 0 12px; }
.callopt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 11px 12px; margin-bottom: 8px;
  border-radius: 14px; background: var(--surface2); border: 1.5px solid var(--line); }
.callopt:active { transform: scale(.99); }
.callopt .em { font-size: 28px; width: 36px; text-align: center; }
.callopt b { display: block; font-size: 16px; } .callopt small { color: var(--ink2); }
.explain .head { display: flex; gap: 12px; align-items: center; }
.explain .big { font-size: 46px; line-height: 1; animation: pop .5s cubic-bezier(.2, 1.6, .4, 1) both; }
.explain .en { color: var(--ink2); font-size: 12.5px; }
.explain .badges { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 4px; }
.explain blockquote { margin: 10px 0; padding: 8px 12px; border-left: 4px solid var(--line); background: var(--surface2); border-radius: 0 10px 10px 0;
  font-size: 14px; color: var(--ink2); }
.explain p { margin: 8px 0; }
.explain .quip { font-family: var(--brush); font-size: 22px; color: var(--red); }
.explain .tip { font-size: 13.5px; color: var(--ink2); }
.explain .btn { width: 100%; margin-top: 12px; }

/* ───────── 结算 ───────── */
.end { align-items: center; padding: 20px 18px; overflow-y: auto; }
.verdict { font-family: var(--brush); font-size: 72px; line-height: 1.1; margin: 14px 0 0; text-align: center; text-shadow: 0 3px 0 var(--red2); }
.verdict.win { color: #ffd86b; } .verdict.lose { color: var(--ink); }
.end .av { width: 110px; height: 110px; }
.scoreline { font-size: 20px; font-weight: 700; margin: 4px 0 12px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; width: 100%; margin: 8px 0; }
.fact { text-align: center; padding: 10px 4px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); }
.fact b { display: block; font-size: 22px; } .fact small { color: var(--ink2); }
.block { width: 100%; margin-top: 12px; padding: 12px 14px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); }
.block h4 { margin: 0 0 8px; font-size: 15px; }
.newrow { display: flex; gap: 8px; flex-wrap: wrap; }
.review-item { padding: 8px 0; border-top: 1px dashed var(--line); font-size: 14px; }
.review-item:first-of-type { border-top: 0; }
.review-item .q { color: var(--ink2); margin: 3px 0; }
.end .btns { display: flex; gap: 10px; width: 100%; margin: 16px 0 8px; }
.end .btns .btn { flex: 1; }

/* ───────── 图鉴 ───────── */
.dexhead { padding: 0 16px 6px; }
.dex-fam { margin: 14px 16px 8px; font-weight: 700; font-size: 15px; display: flex; justify-content: space-between; }
.dex-fam small { color: var(--ink2); font-weight: 400; }
.dex-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 16px; }
.tile { position: relative; padding: 12px 4px 10px; border-radius: 16px; background: var(--surface); border: 1.5px solid var(--line); text-align: center; }
.tile .em { font-size: 34px; display: block; line-height: 1.2; }
.tile b { font-size: 13.5px; display: block; margin-top: 2px; }
.tile.locked .em { filter: grayscale(1) opacity(.35); }
.tile.locked b { color: var(--ink2); font-weight: 500; }
.tile.got { border-color: var(--gold); }
.tile.got::after { content: "✓"; position: absolute; top: 5px; right: 8px; color: var(--jade); font-weight: 800; font-size: 13px; }
.tile.weak { border-color: var(--red); }
.weak-block { margin: 6px 16px 0; padding: 12px 14px; border-radius: 14px; background: var(--red-soft); }
.weak-block b { color: var(--red); }

/* ───────── 其他 ───────── */
.help ol { margin: 8px 0 0; padding-left: 20px; } .help li { margin-bottom: 8px; }
.row { display: flex; align-items: center; justify-content: space-between; padding: 12px 0; border-top: 1px solid var(--line); }
.toggle { width: 50px; height: 30px; border-radius: 15px; background: var(--line); position: relative; transition: background .2s; }
.toggle::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .2s; }
.toggle[aria-pressed="true"] { background: var(--jade); }
.toggle[aria-pressed="true"]::after { transform: translateX(20px); }
.hidden { display: none !important; }

@media (max-height: 640px) {
  .stage .avatar { width: 68px; height: 68px; }
  .bubble { font-size: 14px; } .opt { font-size: 13.5px; padding: 8px 10px; }
  .title { font-size: 76px; } .hero { margin-top: 74px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  .lantern, .family .av { animation: none !important; }
}

.av, .avatar { flex: none; }
.av svg, .avatar svg { width: 100%; height: 100%; display: block; }
.toast { position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 60; padding: 9px 16px; border-radius: 999px;
  background: var(--ink); color: var(--bg); font-size: 14px; font-weight: 600; animation: pop .3s both; white-space: nowrap; }

/* ───────── 章节 ───────── */
.chapters { display: flex; gap: 8px; width: 100%; margin-top: 20px; padding: 2px 20px 4px; overflow-x: auto; flex: none; scrollbar-width: none; }
.chapters::-webkit-scrollbar { display: none; }
.chap { flex: none; text-align: left; padding: 8px 14px; border-radius: 12px; background: var(--surface); border: 1.5px solid var(--line); min-width: 104px; }
.chap b { display: block; font-size: 15px; } .chap small { color: var(--ink2); font-size: 12px; }
.chap[aria-pressed="true"] { border-color: var(--red); background: var(--red-soft); box-shadow: 0 3px 0 var(--red); }
.lanterns svg.scene { display: block; }
.home .hero { transition: none; }
.chapter-tag { font-size: 12.5px; color: var(--ink2); }

/* ───────── 且慢！新增：首页、关卡图、剧情、Boss、印章、星级 ───────── */
.gear { position: absolute; top: 10px; right: 12px; z-index: 6; }
.chap.locked { opacity: .55; }
.chap.soon { border-style: dashed; opacity: .85; }
.chap.soon small { color: var(--gold); }

.levelmap { padding: 6px 16px 28px; }
.mapnote { color: var(--ink2); font-size: 13.5px; margin: 0 0 14px; }
.lv { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; padding: 12px 14px; margin-bottom: 14px; position: relative;
  background: var(--surface); border: 1.5px solid var(--line); border-radius: 16px; box-shadow: 0 3px 0 var(--line); }
.lv::before { content: ""; position: absolute; left: 32px; top: 100%; height: 14px; width: 3px; background: var(--line); }
.lv.last::before { display: none; }
.lv:active { transform: translateY(2px); }
.lv .num { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-weight: 800; font-size: 17px;
  background: var(--surface2); border: 2px solid var(--line); }
.lv.done .num { background: #f5b942; color: #3a2800; border-color: transparent; }
.lv.boss .num { background: var(--red); color: #fff; border-color: transparent; font-size: 20px; }
.lv.next { border-color: var(--red); box-shadow: 0 3px 0 var(--red), 0 0 0 4px var(--red-soft); }
.lv.locked { opacity: .5; }
.lv .info { flex: 1; min-width: 0; }
.lv .info b { display: block; font-size: 16px; }
.lv .info small { display: block; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.stars { font-size: 15px; letter-spacing: 1px; white-space: nowrap; }
.stars span, .starrow .bigstar { color: var(--line); }
.stars .on { color: #f5b942; }
.stars.inline { display: inline; }
.sealrow { display: flex; align-items: center; gap: 14px; width: 100%; text-align: left; padding: 12px 14px; margin-top: 8px;
  border-radius: 16px; background: var(--surface); border: 1.5px dashed var(--line); }
.sealrow small { display: block; color: var(--ink2); }
.sealrow .seal-stamp { width: 52px; height: 52px; font-size: 30px; flex: none; }
.grp { margin: 16px 0 8px; font-weight: 700; color: var(--ink2); font-size: 13px; }
.rules { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.learn-row { display: flex; gap: 12px; padding: 9px 0; border-top: 1px dashed var(--line); }
.learn-row .em { font-size: 26px; width: 34px; text-align: center; flex: none; }
.learn-row .def { color: var(--ink2); font-size: 13.5px; }

/* 剧情 */
.scene-wrap { position: absolute; inset: 0; z-index: 50; display: flex; flex-direction: column;
  background: radial-gradient(90% 50% at 50% 18%, var(--glow), transparent 70%), var(--bg); animation: fade .25s both; }
.scene-skip { position: absolute; top: 12px; right: 12px; z-index: 2; padding: 6px 13px; border-radius: 999px; background: var(--surface2);
  border: 1px solid var(--line); font-size: 13px; color: var(--ink2); }
.scene-stage { flex: 1; min-height: 0; display: grid; place-items: center; }
.scene-av { width: min(58vw, 240px); height: min(58vw, 240px); animation: pop .3s cubic-bezier(.2, 1.2, .4, 1) both; }
.scene-av svg { width: 100%; height: 100%; display: block; }
.dialog { margin: 0 14px 20px; padding: 14px 16px 26px; border-radius: 18px; background: var(--surface); border: 1.5px solid var(--line);
  min-height: 132px; box-shadow: var(--shadow); position: relative; }
.dialog .nm { font-weight: 800; color: var(--red); margin-bottom: 4px; min-height: 1.5em; }
.dialog .tx { font-size: 16.5px; line-height: 1.7; }
.dialog .more { position: absolute; right: 14px; bottom: 8px; font-size: 12px; color: var(--ink2); animation: blink 1.4s infinite; }
.dialog.narr { background: transparent; border-style: dashed; box-shadow: none; text-align: center; }
.dialog.narr .tx { color: var(--ink2); font-style: italic; }

/* Boss 演讲 */
.hearts { font-size: 17px; letter-spacing: 1px; min-height: 22px; }
.foundn { font-size: 22px; color: var(--gold); line-height: 1.2; }
.speech { flex: 1; min-height: 0; overflow-y: auto; padding: 8px 14px 10px; display: flex; flex-direction: column; gap: 9px; }
.sent { display: flex; gap: 10px; text-align: left; width: 100%; padding: 11px 12px; border-radius: 14px; font-size: 15px; line-height: 1.55;
  background: var(--paper); color: var(--paper-ink); box-shadow: 0 2px 0 rgba(0, 0, 0, .2); border-left: 6px solid transparent; }
.sent:active { transform: translateY(1px); }
.sent .no { flex: none; width: 22px; height: 22px; border-radius: 50%; background: rgba(0, 0, 0, .14); display: grid; place-items: center;
  font-size: 12px; font-weight: 700; margin-top: 2px; }
.sent .body { flex: 1; min-width: 0; }
.sent .tags { display: flex; gap: 6px; flex-wrap: wrap; }
.sent .tags:not(:empty) { margin-top: 6px; }
.sent.sel { outline: 3px solid var(--gold); }
.sent.hit { filter: saturate(.55); opacity: .85; border-left-color: var(--jade); }
.sent.hit .tx { text-decoration: line-through; text-decoration-thickness: 2px; text-decoration-color: var(--red2); }
.sent.missed { border-left-color: var(--red); opacity: .9; }
.sent.clean { border-left-color: var(--jade); opacity: .72; }
.match.boss .dock .empty { padding: 6px; }

/* 印章（收藏品） */
.seal-stamp { width: 76px; height: 76px; display: grid; place-items: center; position: relative; flex: none; transform: rotate(-5deg);
  font-family: var(--brush); font-size: 46px; line-height: 1; color: var(--red); border: 4px solid var(--red); border-radius: 10px;
  background: radial-gradient(circle at 30% 25%, rgba(255, 255, 255, .5), transparent 60%); }
.seal-stamp::after { content: ""; position: absolute; inset: 4px; border: 1.5px solid currentColor; border-radius: 6px; opacity: .5; }
.seal-stamp.gold { color: #7a4d00; border-color: #d9a400; background: linear-gradient(135deg, #ffeaa8, #f1c24a); box-shadow: 0 0 18px rgba(245, 185, 66, .55); }
.seal-stamp.locked { color: var(--ink2); border: 3px dashed var(--line); background: none; box-shadow: none; opacity: .75; }
.seal-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; padding: 0 16px; }
.sealcell { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 14px 4px 12px; border-radius: 16px;
  background: var(--surface); border: 1.5px solid var(--line); text-align: center; }
.sealcell b { font-size: 14px; } .sealcell small { color: var(--ink2); font-size: 11.5px; }
.bigseal { display: flex; justify-content: center; margin: 14px 0 12px; }
.bigseal .seal-stamp { width: 104px; height: 104px; font-size: 64px; }
.bigseal.pop .seal-stamp { animation: stamp .55s cubic-bezier(.2, 1.7, .4, 1) both; }
.seal-detail { text-align: center; } .seal-detail p { margin: 8px 0; }
.seal-mini .seal-stamp { width: 54px; height: 54px; font-size: 32px; }
.tabs { display: flex; gap: 8px; padding: 0 16px 10px; }
.tabs button { flex: 1; padding: 9px; border-radius: 12px; background: var(--surface2); border: 1.5px solid var(--line); font-weight: 600; }
.tabs button[aria-pressed="true"] { background: var(--red); color: #fff; border-color: transparent; }

/* 结算星级 */
.starrow { display: flex; gap: 8px; margin: 4px 0 0; }
.bigstar { font-size: 46px; line-height: 1.1; animation: starIn .55s cubic-bezier(.2, 1.6, .4, 1) both; }
.bigstar.on { color: #f5b942; text-shadow: 0 0 16px rgba(245, 185, 66, .75); }
@keyframes starIn { from { opacity: 0; transform: scale(.2) rotate(-90deg); } }
.verdict { margin-bottom: 0; }

@media (max-width: 360px) { .title { font-size: 76px; } .hero { padding: 0 16px; } }
</style>
</head>

<div id="app"></div>
<script>const DATA = {"game":{"title":"且慢！","subtitle":"Spot the Flaw","text":{"call_button":"✋ 且慢！","stamp_call":"且慢！","stamp_bot":"对方且慢！","stamp_reject":"驳回！"}},"config":{"game":{"target_points":4,"max_rounds":8,"turn_seconds":15,"combo_bonus_at":3},"bot":{"detect":{"1":0.8,"2":0.55,"3":0.35},"false_call":0.05,"difficulty":[{"id":"gentle","name":"温和","mult":0.6},{"id":"normal","name":"普通","mult":1.0},{"id":"sharp","name":"较真","mult":1.25}]},"audience":{"step":6,"call_hit":14,"call_miss":10},"opponent_fallacy_rate":0.65},"families":{"relevance":"相关性谬误","induction":"因果与归纳谬误","structure":"结构与语言谬误"},"fallacies":[{"id":"ad_hominem","zh":"人身攻击","en":"Ad hominem","latin":"Argumentum ad hominem","family":"relevance","emoji":"👉","def":"不去回应观点本身，而是攻击提出观点的人。","example":"你又没带过孩子，凭什么谈教育？","example_reply":"我有没有带过孩子，不影响“这个观点对不对”。","tip":"追问：这个人的身份，和他的论据是否成立有什么关系？"},{"id":"straw_man","zh":"稻草人谬误","en":"Straw man","family":"relevance","emoji":"🌾","def":"先把对方的观点歪曲成一个更容易攻击的版本，再去反驳这个被歪曲的版本。","example":"你说要限制手机，就是想让孩子与世隔绝！","example_reply":"我说的是限制使用时间，不是与世隔绝。","tip":"复原对方的原话，指出他把你的意思改成了什么。"},{"id":"red_herring","zh":"转移话题","en":"Red herring","family":"relevance","emoji":"🐟","def":"抛出一个看似相关、实则无关的话题，把讨论带偏。","example":"别聊工作了，你什么时候结婚？","example_reply":"结婚是另一件事，我们先把工作说完。","tip":"指出这是另一个问题，先把当前的说完。"},{"id":"tu_quoque","zh":"你也一样","en":"Tu quoque","latin":"Tu quoque","family":"relevance","emoji":"🪞","def":"以对方自己也做过类似的事，来否定对方的观点。","example":"你自己天天熬夜，凭什么劝我早睡？","example_reply":"我做没做到是一回事，早睡好不好是另一回事。","tip":"做不到，不代表说得不对。观点的对错与说话人的言行无关。"},{"id":"appeal_to_authority","zh":"诉诸权威","en":"Appeal to authority","latin":"Argumentum ad verecundiam","family":"relevance","emoji":"🎓","def":"仅因为某个“权威”这样说，就认定观点正确，而不看他的论据。","example":"专家说了，你一个普通人懂什么？","example_reply":"他是哪个领域的专家？依据是什么？","tip":"他是否精通这个领域？有没有证据支持？年头长、职位高不等于正确。"},{"id":"appeal_to_popularity","zh":"诉诸大众","en":"Appeal to popularity","latin":"Argumentum ad populum","family":"relevance","emoji":"👥","def":"因为很多人相信或这样做，就认为它是对的。","example":"大家都这么做，肯定没错。","example_reply":"做的人多，不等于它是对的。","tip":"多数人的选择，不等于正确的选择。"},{"id":"appeal_to_emotion","zh":"诉诸情感","en":"Appeal to emotion","latin":"Argumentum ad passiones","family":"relevance","emoji":"😭","def":"用恐惧、怜悯、愧疚等情绪代替理由，让人接受结论。","example":"你忍心看孩子哭吗？","example_reply":"我理解你的心疼。不过，该不该给，还是要看理由。","tip":"把情绪放一边：去掉这些感受，剩下的理由是什么？"},{"id":"appeal_to_tradition","zh":"诉诸传统","en":"Appeal to tradition","latin":"Argumentum ad antiquitatem","family":"relevance","emoji":"📜","def":"因为“一直如此”或“古已有之”，就认为它是正确的。","example":"老祖宗传下来的，肯定有道理。","tip":"历史悠久只说明存在得久，不说明它好。"},{"id":"appeal_to_nature","zh":"诉诸自然","en":"Appeal to nature","family":"relevance","emoji":"🌿","def":"认为“天然的”就是好的、安全的，“人造的”就是坏的。","example":"纯天然的，肯定没有副作用。","tip":"毒蘑菇、砒霜也都是天然的。"},{"id":"appeal_to_accomplishment","zh":"诉诸成就","en":"Appeal to accomplishment","family":"relevance","emoji":"🏆","def":"以对方没有做出成绩为由，否定他的批评或观点。","example":"你行你上啊！你做一个试试？","tip":"批评是否成立，不取决于批评者能不能亲自做到。"},{"id":"genetic","zh":"发生学谬误","en":"Genetic fallacy","family":"relevance","emoji":"🌱","def":"仅凭观点的来源或出身，就判定它是对是错。","example":"这是从某某网站上看来的，肯定是假的。","tip":"来源可以提醒你多核实，但不能代替核实。"},{"id":"guilt_by_association","zh":"罪恶关联","en":"Guilt by association","family":"relevance","emoji":"🤝","def":"因为某个观点和不受欢迎的人或群体有关联，就否定这个观点。","example":"这个主意某某坏人也提过，所以是错的。","tip":"观点要靠自己的理由成立或不成立，不看谁也说过。"},{"id":"false_cause","zh":"虚假因果","en":"Questionable cause","latin":"Post hoc ergo propter hoc","family":"induction","emoji":"🔗","def":"仅凭两件事先后发生或同时出现，就断定其中一件是另一件的原因。","example":"他一搬家就生病，肯定是新房子风水不好。","tip":"还有别的可能原因吗？有没有对照？"},{"id":"hasty_generalization","zh":"以偏概全","en":"Hasty generalization","family":"induction","emoji":"🎲","def":"用很少的样本，得出关于整体的结论。","example":"我认识的两个人创业都赔了，创业没有不赔的。","tip":"样本够多、够随机吗？"},{"id":"anecdotal","zh":"个案证据","en":"Anecdotal fallacy","family":"induction","emoji":"🗣️","def":"用个人的亲身经历或听来的故事，代替系统的证据。","example":"我邻居吃了这个药就好了，肯定有效。","example_reply":"一个人好了，也可能是自己好的，需要更多的对照。","tip":"个案生动，但不能代替统计和对照。"},{"id":"survivorship","zh":"幸存者偏差","en":"Survivorship bias","family":"induction","emoji":"✈️","def":"只看到成功、留下来的样本，忽略了大量失败、消失的样本。","example":"某某辍学创业成了首富，所以读书没用。","tip":"没成功的人去哪了？"},{"id":"cherry_picking","zh":"选择性取证","en":"Cherry-picking","family":"induction","emoji":"🍒","def":"只挑对自己有利的证据，无视相反的证据。","example":"有三篇文章说有效，其他说无效的都不算。","tip":"有没有相反的证据被略过了？"},{"id":"slippery_slope","zh":"滑坡谬误","en":"Slippery slope","family":"induction","emoji":"🎢","def":"声称一小步会引发一连串不可避免的坏结果，却不证明每一步都成立。","example":"今天让他玩游戏，明天就荒废学业，最后毁掉一生。","example_reply":"每一步都是必然的吗？哪一步的概率有多大？","tip":"逐环节追问：这一步真的必然发生吗？概率多大？"},{"id":"false_analogy","zh":"虚假类比","en":"False analogy","family":"induction","emoji":"🍊","def":"拿本质不同的两件事作比较，再把一方的结论强加给另一方。","example":"管孩子就像养花，不修剪就会长歪。","tip":"这两件事在关键的地方真的相似吗？"},{"id":"false_dilemma","zh":"非黑即白","en":"False dilemma","latin":"Falsum dilemma","family":"structure","emoji":"🚪","def":"把复杂的问题说成只有两个选项，忽略其他可能。","example":"要么听我的，要么你就别回这个家。","example_reply":"真的只有这两种可能吗？","tip":"追问：真的只有这两种可能吗？"},{"id":"circular","zh":"循环论证","en":"Circular reasoning","latin":"Circulus in probando","family":"structure","emoji":"🔄","def":"结论其实已经藏在前提里，用它自己来证明自己。","example":"他说的都是真的，因为他从不说谎。","example_reply":"你怎么知道他从不说谎？","tip":"把结论拿走，前提还成立吗？"},{"id":"equivocation","zh":"偷换概念","en":"Equivocation","family":"structure","emoji":"🎭","def":"在论证中让同一个词悄悄换了含义。","example":"人人都有言论自由，所以我在会议上想怎么骂就怎么骂。","tip":"这个词在前后两句里，意思还是同一个吗？"},{"id":"loaded_question","zh":"复杂问题","en":"Loaded question","latin":"Plurium interrogationum","family":"structure","emoji":"💣","def":"问题里暗含一个未经证实的前提，无论怎么回答都等于默认了它。","example":"你是不是已经不再偷懒了？","example_reply":"我根本没有偷过懒。","tip":"先拆开问题里藏着的预设，说明你不接受它，再决定怎么回答。"},{"id":"appeal_to_ignorance","zh":"诉诸无知","en":"Appeal to ignorance","latin":"Argumentum ad ignorantiam","family":"structure","emoji":"🕳️","def":"因为没有证据证明它错，就断定它对（或者反过来）。","example":"你不能证明鬼不存在，所以鬼存在。","tip":"没有证据，不等于有相反的证据。"},{"id":"burden_of_proof","zh":"举证责任倒置","en":"Shifting the burden of proof","latin":"Onus probandi","family":"structure","emoji":"🏋️","def":"提出主张的人不举证，反而要求别人来证明它是错的。","example":"我说这个方子有效，你说无效就拿证据来。","tip":"谁主张，谁举证。"},{"id":"middle_ground","zh":"中庸谬误","en":"Argument to moderation","latin":"Argumentum ad temperantiam","family":"structure","emoji":"⚖️","def":"认为两种观点之间的折中立场就一定是对的。","example":"一方说一加一等于二，一方说等于四，那就折中等于三吧。","tip":"折中不等于正确，先看各自的理由。"},{"id":"no_true_scotsman","zh":"诉诸纯洁","en":"No true Scotsman","family":"structure","emoji":"🥃","def":"遇到反例时，就把定义改成“真正的……不会这样”，让自己的说法永远不会错。","example":"有人用了没效，那是他没用到正宗的。","tip":"问：什么样的证据能让你承认自己错了？"},{"id":"moving_goalposts","zh":"移动球门","en":"Moving the goalposts","family":"structure","emoji":"🥅","def":"对方满足了你提出的条件后，你又提高或改变要求。","example":"你给了一篇研究，我要十篇；给了十篇，我又说不够权威。","tip":"先约定：什么证据算数？"},{"id":"personal_incredulity","zh":"个人怀疑","en":"Personal incredulity","family":"structure","emoji":"🙉","def":"因为自己想不通、听不懂，就断定它不成立。","example":"这么复杂的东西我都看不懂，肯定是骗人的。","tip":"你不理解，不代表它错。可以先去弄懂。"},{"id":"false_premise","zh":"虚假前提","en":"False premise","family":"structure","emoji":"🧱","def":"论证依赖的事实本身就是错的，或者根本无法成立。","example":"既然人只用了大脑的百分之十，我们就该开发剩下的九成。","tip":"在讨论推理之前，先核实它的起点是不是真的。"},{"id":"sunk_cost","zh":"沉没成本谬误","en":"Sunk cost fallacy","family":"structure","emoji":"💸","def":"因为已经投入了时间和金钱，就坚持继续，即使继续并不划算。","example":"都看了两个小时了，再烂的电影也要看完。","tip":"只问未来：从现在开始，继续值不值得？"},{"id":"gamblers_fallacy","zh":"赌徒谬误","en":"Gambler's fallacy","family":"induction","emoji":"🎰","def":"以为互相独立的随机事件，会“补偿”之前的结果。","example":"连输了五把，下一把一定该赢了。","tip":"骰子没有记忆：每一次独立事件的概率，不受之前结果影响。"},{"id":"base_rate","zh":"基础比率谬误","en":"Base rate fallacy","family":"induction","emoji":"📊","def":"只盯着眼前的具体信息或绝对数字，忽略了整体里这件事本来有多常见。","example":"这项检测 99% 准确，我测出阳性，所以我 99% 真的有病。（忽略了这种病本来就很少见）","tip":"先问：在所有人里，这种情况本来占多少？分母是多少？"},{"id":"special_pleading","zh":"特设辩护","en":"Special pleading","family":"structure","emoji":"🎫","def":"给自己（或自己人）设一个“例外”，却说不出为什么例外。","example":"规则很重要，但我们公司情况特殊，不适用。","tip":"问：为什么这条规则对别人适用，对你却是例外？"},{"id":"appeal_to_consequences","zh":"诉诸后果","en":"Appeal to consequences","latin":"Argumentum ad consequentiam","family":"relevance","emoji":"📉","def":"因为某个结论带来的后果太糟（或太好），就断定它不是真的（或是真的）。","example":"如果这茶真有问题，公司就完了，所以它不可能有问题。","tip":"事实是什么，和它会带来什么后果，是两个问题。后果再糟，也不能让事实消失。"},{"id":"texas_sharpshooter","zh":"德州神枪手谬误","en":"Texas sharpshooter fallacy","family":"induction","emoji":"🎯","def":"先看到数据里的某个规律，再回头把靶子画在弹孔周围。","example":"我们翻了一百项指标，发现 A 型血的用户血压下降最明显，所以这茶对 A 型血特别有效。","tip":"先定假设，再看数据。事后找到的规律，必须用新的数据重新验证。"},{"id":"composition_division","zh":"合成与分割谬误","en":"Fallacy of composition / division","family":"structure","emoji":"🧩","def":"以为整体具有的性质，每个部分也有（或者反过来）。","example":"我们公司整体信誉很好，所以我们的每一款产品都靠谱。","tip":"整体和部分是两回事。问问：这个性质，在具体的这一个上，成立吗？"},{"id":"repetition","zh":"重复断言","en":"Proof by assertion","latin":"Argumentum ad nauseam","family":"relevance","emoji":"🔁","def":"把同一句话说得足够多，就当作它被证明了。","example":"我们的产品是安全的，安全的，真的是安全的。","tip":"说多少遍，都不是证据。问：除了重复，理由是什么？"}],"characters":[{"id":"me","name":"你","title":"大一新生","catchphrase":"且慢！","look":{"skin":"#f1c9a5","hair":"#2b2b33","hair_style":"short","shirt":"#e6ebf3","outfit":"hoodie"},"lines":{"open":["各位，且慢。","我有个问题。"],"caught":["这一步，说不通。"],"wrong_call":["……好像是我错了。"],"win":["破绽，一个不留。"],"lose":["我回去再翻翻破绽簿。"]}},{"id":"er_jiu","name":"二舅","title":"资深长辈","catchphrase":"我吃过的盐比你吃过的米还多","look":{"skin":"#e3a77e","hair":"#3a3a3a","hair_style":"bald","shirt":"#8e2a2a","mustache":true,"blush":true},"lines":{"open":["来来来，小辈们，听二舅给你们说道说道。","喝了这杯酒，咱们好好聊聊。"],"caught":["哎哟，这也被你听出来了？","你这孩子，抓得还挺准。"],"wrong_call":["小孩子不懂别乱说！","这话哪里有问题了？"],"win":["年轻人，还得多练练。","二舅赢了，干杯！"],"lose":["行行行，你们有文化，你们说了算。","唉，后生可畏。"]}},{"id":"biao_ge","name":"表哥","title":"短视频重度用户","catchphrase":"我在视频里看到一个专家说……","look":{"skin":"#f0c09b","hair":"#22252e","hair_style":"spiky","shirt":"#3b5a7a","glasses":true},"lines":{"open":["我跟你们说，我最近刷到一个很有意思的观点。","这个问题我研究过。"],"caught":["呃……你这一说，好像是有点道理。","等等，让我再想想。"],"wrong_call":["你搜一下就知道了。","这不是很明显吗？"],"win":["看吧，我早说了。","信息差，懂吗？"],"lose":["我回头再查查资料……","这个……当我没说。"]}},{"id":"san_yi","name":"三姨","title":"亲戚群转发大户","catchphrase":"我都是为你好","look":{"skin":"#f2c6a3","hair":"#4a2c2a","hair_style":"curly","shirt":"#a0527a","earrings": M0-11 L2.5-2.5 L11 0 L2.5 2.5 L0 11 L-2.5 2.5 L-11 0 L-2.5-2.5Z\" opacity=\".7\"/>\n    <path transform=\"translate(46 96) scale(.7)\" d=\"M0-11 L2.5-2.5 L11 0 L2.5 2.5 L0 11 L-2.5 2.5 L-11 0 L-2.5-2.5Z\" opacity=\".7\"/>\n  <\/g>\n  <g style=\"stroke:var(--ink)\" fill=\"none\" stroke-width=\"3\" stroke-linecap=\"round\" opacity=\".75\">\n    <rect x=\"150\" y=\"84\" width=\"14\" height=\"22\" rx=\"7\"/><path d=\"M157 106 V126 M147 126 H167\"/>\n    <rect x=\"236\" y=\"84\" width=\"14\" height=\"22\" rx=\"7\"/><path d=\"M243 106 V126 M233 126 H253\"/>\n  <\/g>\n<\/svg>"}],"topics":[{"id":"health","title":"亲戚群里转发的养生偏方，能信吗？","scene":"群里又转发了一篇“三天降血压”的文章，三姨当场推荐了起来。","tags":["健康","生活"],"sides":{"A":"值得一试","B":"不能轻信"},"opponents":{"A":"san_yi","B":"biao_jie"},"statements":[{"id":"hl_a01","side":"A","angle":"风险","opener":true,"text":"生姜红糖水这类食疗方，成本低、风险小，感冒时喝一杯暖暖身子，试试无妨。","fallacy":null,"explain":"主张很有限（“试试无妨”），理由是低成本、低风险，没有夸大疗效。没有明显谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a02","side":"A","angle":"亲身","text":"我膝盖疼了好多年，喝了亲戚推荐的药酒，一个月就好了，你说灵不灵？","fallacy":"anecdotal","explain":"用个人经历代替证据。可能是自己好转，也可能是别的原因，需要对照才能判断。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a03","side":"A","angle":"安全","text":"这些偏方都是纯天然的草药，不像西药有那么多化学成分，吃了肯定没副作用。","fallacy":"appeal_to_nature","explain":"“天然”不等于“安全”。毒蘑菇、马兜铃酸也都来自天然植物。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a04","side":"A","angle":"传统","text":"老祖宗传了几千年的方子，肯定有道理，比现在的新药靠谱。","fallacy":"appeal_to_tradition","explain":"历史悠久只说明它存在得久，不说明它有效。流传下来的方子里，有效和无效的都有。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a05","side":"A","angle":"证据","subtlety":2,"text":"你说这偏方没用，可你能证明它一点用都没有吗？证明不了，就说明可能有用。","fallacy":"appeal_to_ignorance","accept":["burden_of_proof"],"explain":"没有证据证明无效，不等于有效。谁主张有效，谁应该举证。","opener":false,"decoys":[],"quip":"","punch":null},{"id":"hl_a06","side":"A","angle":"权威","text":"这篇文章是一位教授写的，人家是教授，还能有假？","fallacy":"appeal_to_authority","explain":"只看头衔。教授的专业是否相关？文章有没有数据和出处？这些才是关键。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a07","side":"A","angle":"传播","text":"家族群里几百个人都转发了，这么多人信，总不会是假的吧。","fallacy":"appeal_to_popularity","explain":"转发的人多，只说明传播得广，不说明内容真实。谣言也可以被大量转发。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a08","side":"A","angle":"风险","text":"医院治不好的病，不试试偏方还能怎么办？难道等死吗？","fallacy":"false_dilemma","explain":"把选择说成只有“偏方”或者“等死”。还有姑息治疗、临床试验、换医院咨询等其他选项。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a09","side":"A","angle":"证据","subtlety":2,"text":"偏方没效果，那是你没找到正宗的，正宗的方子肯定有效。","fallacy":"no_true_scotsman","explain":"遇到反例就把定义改成“正宗的才算”，这样的说法永远不会被证明错。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a10","side":"A","angle":"风险","text":"如果病情不重、偏方本身无害，作为辅助来尝试，同时不耽误正规治疗，风险是可控的。","fallacy":null,"explain":"提出了明确的前提条件（病情不重、无害、不耽误治疗），是有限定的合理主张。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a11","side":"A","angle":"生活","text":"很多家庭的养生习惯其实是生活经验，比如吃得清淡、早睡早起，就算没有药效，也有实际的好处。","fallacy":null,"explain":"把话题限定在生活习惯上，并且承认“没有药效”，不夸大也不回避。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a12","side":"A","angle":"亲情","text":"有些人用偏方图的是心理安慰，只要不耽误治疗，尊重长辈的选择也是一种体谅。","fallacy":null,"explain":"承认了偏方的局限，同时提出了一个尊重他人的立场。有前提，没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a13","side":"A","angle":"证据","subtlety":2,"text":"我上网搜了，有三篇文章说姜黄能抗癌，其余说没用的，肯定是药企在抹黑。","fallacy":"cherry_picking","explain":"只采纳对自己有利的文章，把相反的证据直接排除。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a14","side":"A","angle":"亲情","text":"你说偏方没用，你行你上啊！你把我爸的病治好给我看看！","fallacy":"appeal_to_accomplishment","explain":"批评一件事不需要先亲自做到。偏方有没有用，与批评者会不会治病无关。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a15","side":"A","angle":"证据","text":"什么随机对照试验，我一句也听不懂，肯定是唬人的。","fallacy":"personal_incredulity","explain":"自己听不懂，不代表它不成立。可以先弄懂它在说什么。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b01","side":"B","angle":"证据","opener":true,"text":"判断偏方有没有用，需要有对照的试验证据。个别人说有效，说明不了问题。","fallacy":null,"explain":"说明了判断有效性需要什么证据，理由与结论直接相关。没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b02","side":"B","angle":"风险","text":"有些偏方本身有毒性，或者和正在吃的药冲突。一旦延误治疗，代价谁也承担不起。","fallacy":null,"explain":"指出了具体的风险，没有把所有偏方一概而论。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b03","side":"B","angle":"传播","text":"会转这种文章的，都是没文化又爱瞎转的老年人，他们说的话不用听。","fallacy":"ad_hominem","explain":"攻击转发的人，没有回应内容是否成立。文章对不对，要看它本身。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b04","side":"B","angle":"权威","text":"网上那个医学博主说了，所有偏方都是骗人的，他说了算。","fallacy":"appeal_to_authority","explain":"把一个博主的话当成结论。“所有”这样的说法同样需要证据，而不是看谁说的。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b05","side":"B","angle":"传统","text":"相信偏方就像相信算命，都是迷信，一个道理。","fallacy":"false_analogy","explain":"偏方里有的成分可以被检验，有的甚至确有药理作用；算命则不能检验。两者的关键区别被抹掉了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b06","side":"B","angle":"证据","text":"我看到过三条偏方害人的新闻，可见所有偏方都是骗局。","fallacy":"hasty_generalization","explain":"用三条新闻推出“所有偏方”，样本太少，也不够公平。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b07","side":"B","angle":"风险","text":"今天信一个偏方，明天就停掉降压药，后天就有生命危险。","fallacy":"slippery_slope","explain":"把“信偏方”直接接到“停药”和“生命危险”，中间的每一步都没有证明。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b08","side":"B","angle":"亲情","text":"病人吃偏方耽误了治疗，家人得多后悔啊！你一点都不心疼吗？","fallacy":"appeal_to_emotion","explain":"用后悔和心疼代替理由。风险要用证据说明，而不是靠情绪施压。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b09","side":"B","angle":"安全","text":"你们就是觉得现代医学一无是处，什么病都要靠草根树皮吧？","fallacy":"straw_man","explain":"对方只是说偏方值得一试，并没有说现代医学一无是处。这是歪曲了对方的观点。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b10","side":"B","angle":"安全","text":"“纯天然”不等于安全，毒蘑菇也是纯天然的，关键要看成分和剂量有没有研究。","fallacy":null,"explain":"用一个具体的反例回应了“天然就安全”的说法，并指出了判断标准。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b11","side":"B","angle":"生活","text":"不必全盘否定：可以把偏方当作日常小习惯，但遇到真正的疾病，必须以正规医疗为准。","fallacy":null,"explain":"给出了清晰的边界，不是“折中”，而是有理由的主张。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b12","side":"B","angle":"亲情","text":"转偏方的人先别急着说话，你上次借我的钱什么时候还？","fallacy":"red_herring","explain":"借钱的事与偏方是否可信无关，是在岔开话题。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b13","side":"B","angle":"证据","subtlety":2,"text":"偏方没有科学依据，所以不能信。为什么说没有科学依据？因为它只是偏方。","fallacy":"circular","explain":"用“偏方”解释“没有依据”，又用“没有依据”推出“偏方不可信”，结论就藏在前提里。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a16","side":"A","angle":"亲身","subtlety":2,"text":"我这药酒都喝了大半年了，现在说不信，之前不就白喝了吗？","fallacy":"sunk_cost","explain":"已经花掉的时间和钱收不回来，不能用来证明它有效。要看的是证据，而不是投入。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b14","side":"B","angle":"传播","text":"这篇文章是在亲戚群里看到的，所以肯定是假的。","fallacy":"genetic","explain":"仅凭来源就判定真假。群里转发的内容可能对，也可能错，要看它给出的证据。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null}],"chapter":"family"},{"id":"job","title":"毕业后，该不该优先考公、进体制？","scene":"刚毕业的表弟说想出去闯一闯，老爸放下了筷子。","tags":["职业","人生选择"],"sides":{"A":"优先考公","B":"先出去闯"},"opponents":{"A":"lao_ba","B":"biao_ge"},"statements":[{"id":"job_a01","side":"A","angle":"风险","opener":true,"text":"体制内的收入和福利相对稳定，对要还房贷、刚成家的年轻人来说，风险更低。","fallacy":null,"explain":"理由具体，与结论相关。“更稳定”是可以讨论的判断，但这条论证本身没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a02","side":"A","angle":"传统","text":"我们家几代人都是端铁饭碗的，一直这样，你也该走这条路。","fallacy":"appeal_to_tradition","explain":"以“一直如此”当作理由。家里人这么走，不能证明这条路适合你。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a03","side":"A","angle":"风险","text":"全国那么多人挤破头考公，报名人数一年比一年多，这还能有错？","fallacy":"appeal_to_popularity","explain":"报名的人多，不代表适合每个人。热门不等于正确。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a04","side":"A","angle":"创业","text":"我认识的两个创业的亲戚都赔了钱，创业根本没有不赔的。","fallacy":"hasty_generalization","explain":"用两个例子推出“创业没有不赔的”，样本太少，也没有说明他们为什么失败。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a05","side":"A","angle":"人生","text":"要么进体制过安稳日子，要么四处漂泊一辈子受苦，你自己选。","fallacy":"false_dilemma","explain":"把选择说成只有两条路，忽略了先就业再转型、进企业等其他可能。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a06","side":"A","angle":"亲情","text":"你妈为你操了多少年心，你就不能考个公务员让她放心吗？","fallacy":"appeal_to_emotion","explain":"用愧疚代替理由。让家人放心是一种考虑，但这不能证明考公对你是最好的选择。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a07","side":"A","angle":"亲情","text":"你就是好高骛远、不切实际，这样的人说的话能听吗？","fallacy":"ad_hominem","explain":"攻击说话的人，没有回应他的想法是否有道理。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a08","side":"A","angle":"风险","text":"体制内岗位的晋升规则相对明确，对不擅长人际周旋的人比较友好。","fallacy":null,"explain":"给出了具体的理由，可以被反驳，但没有明显的逻辑谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a09","side":"A","angle":"创业","text":"先进入稳定的单位，积累经验和积蓄，再考虑转行或创业，比一毕业就闯风险小。","fallacy":null,"explain":"提出了分阶段的做法，并且承认创业的可能。论证合理。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a10","side":"A","angle":"权威","text":"我吃过的盐比你吃过的米还多，我说体制内好，就是好。","fallacy":"appeal_to_authority","explain":"用资历和年龄代替理由。经验丰富值得听，但结论仍然要看论据。","quip":"经验可以参考，理由呢？","opener":false,"subtlety":1,"accept":[],"decoys":[],"punch":null},{"id":"job_a11","side":"A","angle":"亲情","text":"现在聊这个干什么，你先说说什么时候结婚吧！","fallacy":"red_herring","explain":"结婚与职业选择是两件事，用它把话题岔开了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a12","side":"A","angle":"人生","text":"在体制内同样能做出成绩，有些岗位能直接参与公共事务，这种价值感不一定比创业差。","fallacy":null,"explain":"回应了“体制内没有价值”这种看法，给出了具体的理由。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a13","side":"A","angle":"学业","subtlety":2,"text":"你读了十几年书，不考公不就白读了吗？前面的投入都浪费了。","fallacy":"sunk_cost","explain":"已经花掉的时间无法收回，不应该决定将来怎么选。该看的是，从现在起哪条路更适合你。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b01","side":"B","angle":"人生","opener":true,"text":"职业选择应该结合兴趣和能力，勉强进入不适合自己的岗位，长期来看满意度和表现都会打折扣。","fallacy":null,"explain":"论证有理由支撑，没有夸大成“考公一定不好”。没有明显谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b02","side":"B","angle":"创业","text":"看看那些大公司的创始人，哪个不是自己闯出来的？自己闯就能成功。","fallacy":"survivorship","explain":"只看到了成功的人，没有看到更多闯了但没成功的。成功案例不等于成功率。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b03","side":"B","angle":"亲情","text":"你们让我考公，无非是想让我一辈子混日子、什么都不用做，对吧？","fallacy":"straw_man","explain":"对方强调的是稳定，并没有说要“混日子”。这是把对方的意思扭曲后再反驳。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b04","side":"B","angle":"权威","text":"某位著名企业家说了，体制内没有前途，年轻人就该出来拼。他说的还能有错？","fallacy":"appeal_to_authority","explain":"成功的企业家不等于对所有人的职业选择都有发言权，也没有给出具体依据。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b05","side":"B","angle":"风险","text":"我认识的几个公务员天天加班还看不到前途，进体制就是浪费青春。","fallacy":"hasty_generalization","explain":"用身边几个人的经历推出“进体制都是浪费青春”，样本太少。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b06","side":"B","angle":"人生","text":"他一进体制就变得死气沉沉，可见体制会让人变平庸。","fallacy":"false_cause","explain":"先后发生不等于因果。他可能本来就是这个性格，也可能是别的原因。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b07","side":"B","angle":"创业","text":"在没有家庭负担的时候，尝试的代价较低，早点试错能更快知道自己适合什么。","fallacy":null,"explain":"给出了条件（没有家庭负担）和理由，是有限定的主张，不是绝对化的结论。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b08","side":"B","angle":"风险","text":"岗位有限而报考的人很多，如果只押注考公，落榜后可能耽误两三年，需要有备选方案。","fallacy":null,"explain":"指出了考公自己的风险，并提出了应对办法，切中要害。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b09","side":"B","angle":"亲情","text":"你年轻的时候不也没听家里的安排？现在凭什么要我听？","fallacy":"tu_quoque","explain":"用对方过去的行为来回避问题。你当年听不听，不影响“考公是否适合我”这个问题。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b10","side":"B","angle":"人生","text":"要么追逐梦想，要么庸庸碌碌一辈子，你选哪个？","fallacy":"false_dilemma","explain":"把人生说成只有两种：追梦或平庸，忽略了在稳定的工作里同样能有意义。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b11","side":"B","angle":"创业","text":"现在的年轻人都在选自由职业，大家都这么选，这肯定是趋势，也肯定是对的。","fallacy":"appeal_to_popularity","explain":"趋势不等于正确。很多人这么选，也不能证明对你合适。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b12","side":"B","angle":"人生","text":"如果只图稳定却觉得工作没有意义，长期的心理消耗也是一种成本，应该算进决策里。","fallacy":null,"explain":"提出了一个被忽略的成本，并没有把稳定完全否定。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b13","side":"B","angle":"人生","subtlety":2,"text":"今天为了稳定放弃梦想，明天为了房贷放弃自由，最后你就成了自己最讨厌的人。","fallacy":"slippery_slope","explain":"把一连串后果说成必然，却没有证明每一步都会发生。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a14","side":"A","angle":"经历","text":"你连一份正经工作都没干过，凭什么评价体制内好不好？","fallacy":"appeal_to_accomplishment","explain":"评价体制内有没有道理，不取决于评价者有没有工作过。要看他给的理由是否成立。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a15","side":"A","angle":"人生","subtlety":3,"text":"我们单位没人想辞职去创业；就算有，那也不是真正适合体制的人。","fallacy":"no_true_scotsman","explain":"遇到反例，就把定义改成“真正适合的人不会这样”，让自己的说法永远不会错。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b14","side":"B","angle":"人生","subtlety":2,"text":"你们一个说必须考公，一个说必须创业，折中一下，两样同时做，这样一定最好。","fallacy":"middle_ground","explain":"折中不等于正确。两样同时做，可能两头都耽误，需要看理由。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null}],"chapter":"family"},{"id":"phone","title":"该不该给孩子买手机？","scene":"八岁的侄子盯着桌上的手机不肯放，大人们为这件事吵了起来。","tags":["家庭","教育"],"sides":{"A":"应该买","B":"不该买"},"opponents":{"A":"biao_ge","B":"er_jiu"},"statements":[{"id":"ph_a01","side":"A","angle":"安全","opener":true,"text":"孩子有手机，家长随时联系得上，放学路上和外出的安全都多一层保障。","fallacy":null,"explain":"理由具体，也和结论直接相关：手机确实能提升联络和安全。可以继续讨论利弊，但这条论证本身没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_a02","side":"A","angle":"学习","text":"教育博主说了，孩子越早接触手机越聪明。人家是专家，听专家的准没错。","fallacy":"appeal_to_authority","explain":"只搬出“专家”的头衔，没有给出证据。头衔不能代替论据。","quip":"哪个领域的专家？研究在哪里？","opener":false,"subtlety":1,"accept":[],"decoys":[],"punch":null},{"id":"ph_a03","side":"A","angle":"社交","text":"班上同学都有手机，就你家孩子没有，当然应该买。","fallacy":"appeal_to_popularity","explain":"别人都有，不等于应该有。多数人的做法，不能证明它对孩子好。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_a04","side":"A","angle":"学习","subtlety":2,"text":"邻居家孩子有了手机以后，成绩进了前十，可见手机能提高成绩。","fallacy":"false_cause","accept":["anecdotal"],"explain":"成绩提升可能因为更努力、换了老师。先后发生，不代表有因果关系。","opener":false,"decoys":[],"quip":"","punch":null},{"id":"ph_a05","side":"A","angle":"未来","text":"不给孩子手机，他将来就会被时代淘汰。要么现在买，要么以后后悔。","fallacy":"false_dilemma","accept":["slippery_slope"],"explain":"把选择说成只有两个：现在买，或者被淘汰。忽略了逐步引入、用别的方式学习数字技能等可能。","opener":false,"subtlety":1,"decoys":[],"quip":"","punch":null},{"id":"ph_a06","side":"A","angle":"自控","subtlety":2,"text":"你们不让买手机，是想把孩子关起来与世隔绝，一点自由都不给吗？","fallacy":"straw_man","decoys":["false_dilemma","appeal_to_emotion"],"explain":"对方只是反对买手机，并没有说要隔绝孩子。这是把对方的观点夸大歪曲，再去攻击它。","opener":false,"accept":[],"quip":"","punch":null},{"id":"ph_a07","side":"A","angle":"自控","text":"给孩子一部有家长模式的手机，约好每天用多久，比一刀切禁止更能培养自我管理。","fallacy":null,"explain":"提出了具体做法和理由。“更能培养”是可以讨论的判断，但这是有依据的论证，不是谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_a08","side":"A","angle":"学习","text":"作业通知和学习软件大多在线上，没有手机，孩子容易错过信息。","fallacy":null,"explain":"这是与结论相关的现实理由。它可以被反驳（比如家长的手机也能代替），但论证本身合理。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_a09","side":"A","angle":"自控","text":"你自己天天刷手机到半夜，凭什么不让孩子用？","fallacy":"tu_quoque","explain":"用对方自己的行为来否定对方的观点。你刷不刷手机，与“孩子该不该有手机”是两回事。","quip":"我做不到，不代表这话不对。","opener":false,"subtlety":1,"accept":[],"decoys":[],"punch":null},{"id":"ph_a10","side":"A","angle":"亲情","text":"孩子哭着说想要手机，你忍心吗？当爹妈的心怎么这么硬！","fallacy":"appeal_to_emotion","explain":"用愧疚和心疼代替理由。孩子想要，不等于应该给。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_a11","side":"A","angle":"亲情","subtlety":2,"text":"你是不是根本不爱这个孩子，才连一部手机都舍不得买？","fallacy":"loaded_question","explain":"问题里预设了“不买手机就是不爱孩子”。无论怎么回答，都等于默认了这个前提。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_a12","side":"A","angle":"未来","text":"与其禁止，不如教孩子辨别网上的信息，这个能力他早晚要学。","fallacy":null,"explain":"提出了替代方案和理由，没有夸大也没有回避对方的顾虑。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_b01","side":"B","angle":"健康","opener":true,"text":"长时间看屏幕和近视、睡眠不足有关，所以要限制孩子用屏幕的时间。","fallacy":null,"explain":"结论是“限制时间”，理由也与之相关，没有夸大成“绝对不能碰”。这条论证本身没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_b02","side":"B","angle":"学习","text":"今天给了手机，明天就沉迷游戏，后天荒废学业，一辈子都毁了。","fallacy":"slippery_slope","explain":"每一步都被说成必然，却没有证明。给手机不等于沉迷，沉迷也不等于毁掉一生。","quip":"哪一步是必然的？","opener":false,"subtlety":1,"accept":[],"decoys":[],"punch":null},{"id":"ph_b03","side":"B","angle":"传统","text":"我们小时候没有手机，不也好好长大了？孩子不需要。","fallacy":"appeal_to_tradition","explain":"“过去没有也行”不能证明“现在不需要”。环境变了，需求也可能变了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_b04","side":"B","angle":"学习","text":"我认识的三个孩子有了手机成绩都下滑，可见手机对学习就是有害的。","fallacy":"hasty_generalization","accept":["anecdotal"],"explain":"用三个例子推出“手机一定有害”，样本太少，也没考虑别的原因。","opener":false,"subtlety":1,"decoys":[],"quip":"","punch":null},{"id":"ph_b05","side":"B","angle":"权威","text":"校长在家长会上说，手机对孩子只有坏处没有好处。校长都这么说了，还有什么好争的？","fallacy":"appeal_to_authority","explain":"只借用校长的身份，没有给证据。“只有坏处”本身也需要证明。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_b06","side":"B","angle":"亲情","text":"你又没带过孩子，懂什么手机不手机的！","fallacy":"ad_hominem","explain":"攻击的是人的经历，而不是观点。带没带过孩子，不能决定论点对不对。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_b07","side":"B","angle":"自控","text":"孩子的自控力还在发育，很多应用又刻意设计得让人停不下来，低龄孩子独立管理手机并不合适。","fallacy":null,"explain":"理由具体，也承认了问题出在“低龄独立使用”而不是手机本身。没有明显谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_b08","side":"B","angle":"安全","text":"如果只是为了联系，只能打电话的儿童手表就够了，不必买智能手机。","fallacy":null,"explain":"针对对方的理由（联系和安全）提出了替代方案，切中要点。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_b09","side":"B","angle":"金钱","text":"现在讨论手机干什么？你先说说房贷还有多少没还完吧。","fallacy":"red_herring","explain":"房贷与孩子该不该有手机无关，是把话题岔开了。","quip":"这是另一个问题，先说手机。","opener":false,"subtlety":1,"accept":[],"decoys":[],"punch":null},{"id":"ph_b10","side":"B","angle":"健康","text":"孩子就该在大自然里跑跑跳跳，那才是天然的成长方式，手机都是人造的坏东西。","fallacy":"appeal_to_nature","explain":"把“天然”当成好、“人造”当成坏。户外活动确实有益，但这不能推出手机有害。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_b11","side":"B","angle":"学习","subtlety":2,"text":"手机让孩子变笨，看他越来越不爱思考就知道了。孩子不爱思考，当然是手机害的。","fallacy":"circular","explain":"用“手机让人变笨”解释“不爱思考”，又拿“不爱思考”证明“手机让人变笨”，在原地打转。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_b12","side":"B","angle":"未来","text":"建议等孩子上了初中，再根据自控情况逐步放开，先从限定时间开始。","fallacy":null,"explain":"提出了明确的时间点和渐进的做法，没有夸大，也没有回避对方的顾虑。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_a13","side":"A","angle":"金钱","subtlety":2,"text":"手机已经买回来了，现在再不让孩子用，那钱不就白花了吗？","fallacy":"sunk_cost","explain":"已经花掉的钱收不回来，不该决定孩子该不该用。要看的是：从现在起，这样做对孩子好不好。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_b13","side":"B","angle":"学习","text":"我表弟被没收手机以后，成绩一下子就上去了，可见管住手机就管住了成绩。","fallacy":"anecdotal","accept":["false_cause"],"explain":"用一个人的经历代替证据。成绩上升也可能有别的原因，需要更多的对照。","opener":false,"subtlety":1,"decoys":[],"quip":"","punch":null},{"id":"ph_b14","side":"B","angle":"自控","subtlety":2,"text":"你说有家长模式，我就要你证明孩子破解不了；证明了，我又要你证明他不会换设备。","fallacy":"moving_goalposts","explain":"对方每满足一个条件，就提出新的条件。这样的标准永远无法达到。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null}],"chapter":"family"},{"id":"lie","title":"善意的谎言，可以接受吗？","scene":"决赛的辩题抽出来了：如果谎言是为了对方好，它还算错吗？","tags":["伦理","沟通"],"sides":{"A":"可以接受","B":"不可以接受"},"opponents":{"A":"xiaozhou","B":"jiaoshou"},"statements":[{"id":"lie_a01","side":"A","angle":"动机","opener":true,"text":"如果真话只会造成无谓的伤害，而谎言能让对方免于痛苦、又不损害他的重要利益，它可能是更善良的选择。","fallacy":null,"explain":"提出了条件（无谓伤害、不损害重要利益），并没有说所有谎言都可以。没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a02","side":"A","angle":"舆论","text":"每个人都说过善意的谎言，大家都这样，怎么可能是错的？","fallacy":"appeal_to_popularity","explain":"很多人都做，不等于它是对的。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a03","side":"A","angle":"情感","text":"你忍心对一个病重的老人，说出那么残酷的真相吗？","fallacy":"appeal_to_emotion","explain":"用不忍心代替理由。是否隐瞒，还要看对老人自己的权利和选择。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a04","side":"A","angle":"动机","text":"你自己也骗过你妈说成绩还不错，凭什么说谎言不可接受？","fallacy":"tu_quoque","explain":"用对方自己的行为否定对方的观点。他做过，不代表这件事就是对的或错的。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a05","side":"A","angle":"选择","text":"要么说一句让人开心的谎，要么说一句伤人的真话，没有别的说法。","fallacy":"false_dilemma","explain":"把选择说成两种，忽略了沉默、委婉、先问对方想不想听等办法。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a06","side":"A","angle":"经历","text":"我小时候被善意的谎言保护过，长大也没出事，所以善意的谎言没有坏处。","fallacy":"anecdotal","explain":"用一个人的经历代替证据。没出事，不代表别人也没出事。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a07","side":"A","angle":"动机","text":"你们反对谎言，就是要大家无论何时，都把刀子一样的真话捅向别人！","fallacy":"straw_man","explain":"反对说谎，并不等于主张说伤人的话。这是把对方的观点夸大歪曲了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a08","side":"A","angle":"后果","text":"判断善意的谎言，要看动机和后果，比如是否真是为了对方、是否会形成依赖，不能一概而论。","fallacy":null,"explain":"提出了判断的标准，没有一概而论。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a09","side":"A","angle":"传统","text":"中国人自古讲究和为贵、给人留面子，这个传统说明善意的谎言是对的。","fallacy":"appeal_to_tradition","explain":"传统能说明某种习惯长期存在，不能证明它在道德上正确。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a10","side":"A","angle":"情境","text":"有时说出真相会伤害无辜的第三方，比如危急时隐瞒受害者的藏身处，这时说谎的正当性更强。","fallacy":null,"explain":"用一个典型情境限定了适用范围。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a11","side":"A","angle":"权威","text":"心理学家说了，适度的善意谎言有助于维持关系，所以它是对的。","fallacy":"appeal_to_authority","explain":"没有说明哪个研究。即使有研究，“有助于关系”也不等于“在道德上正确”。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a12","side":"A","angle":"概念","text":"善意的谎言和恶意的欺骗不同：前者以对方的利益为目的，后者以自己的利益为目的，这个区分有意义。","fallacy":null,"explain":"提出了一个有意义的区分，并说明了区分的依据。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a13","side":"A","angle":"证据","subtlety":2,"text":"我举了三个善意谎言帮助别人的例子，那些造成伤害的例子都是特例，不算数。","fallacy":"cherry_picking","explain":"只采纳对自己有利的例子，把相反的例子直接排除。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a14","side":"A","angle":"区分","subtlety":2,"text":"你们一边说绝对不能撒谎，一边说想撒就撒，那折中一下，偶尔撒谎就是对的。","fallacy":"middle_ground","explain":"折中不等于正确。“偶尔”的界线在哪里，需要理由，而不只是它位于两者之间。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b01","side":"B","angle":"自主","opener":true,"text":"谎言剥夺了对方基于真实信息做决定的机会，即使动机善意，也是对他自主权的不尊重。","fallacy":null,"explain":"从自主权出发，理由与结论直接相关。没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b02","side":"B","angle":"后果","text":"今天说一个善意的谎，明天就会说更大的谎，最后整个人际信任都会崩塌。","fallacy":"slippery_slope","explain":"从一个小谎直接推到信任崩塌，中间的步骤没有证明。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b03","side":"B","angle":"因果","text":"他被善意的谎言瞒着以后，没多久病情加重了，可见谎言害了他。","fallacy":"false_cause","explain":"先后发生不等于因果。病情加重可能是疾病本身的发展。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b04","side":"B","angle":"权威","text":"某位哲学大师说过，说谎在任何情况下都是错的，所以善意的谎言也不行。","fallacy":"appeal_to_authority","explain":"借用大师的名字，没有给出理由。哲学家之间对此也有分歧。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b05","side":"B","angle":"动机","subtlety":2,"text":"“为你好”这套说法，当年骗子们也用过，所以善意谎言的理由不可信。","fallacy":"guilt_by_association","explain":"因为说法与骗子有关联就否定它。观点要靠自己的理由来评判。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b06","side":"B","angle":"证据","subtlety":2,"text":"历史上那些诚实的人都受到了尊敬，可见诚实一定有好结果。","fallacy":"survivorship","explain":"只看到了被记住的诚实者，没有看到更多诚实却没得到回报的人。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b07","side":"B","angle":"信任","text":"谎言一旦被发现，代价不只是那一句，对方会怀疑你说过的其他话，信任很难修复。","fallacy":null,"explain":"说明了谎言被发现后的具体代价。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b08","side":"B","angle":"选择","text":"要么永远诚实，要么就成了满口谎话的人，没有中间地带。","fallacy":"false_dilemma","explain":"把选择说成两个极端，忽略了“在特定情形下有所取舍”的立场。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b09","side":"B","angle":"替代","text":"可以不说，但不必说谎：选择沉默、委婉表达，或者先问对方想不想知道，往往比编造更可行。","fallacy":null,"explain":"提出了替代做法，回应了“只能说谎”的想法。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b10","side":"B","angle":"证据","subtlety":2,"text":"你举出一个无害的谎言，我就要你再举十个；举出十个，我又要求它们全都经得起追问。","fallacy":"moving_goalposts","explain":"对方满足一个条件，就提高要求，这样的标准永远无法达到。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b11","side":"B","angle":"情感","text":"被最亲近的人欺骗的痛苦，你体会过吗？你怎么还能说谎可以接受？","fallacy":"appeal_to_emotion","explain":"用个人痛苦代替理由。有人被欺骗痛苦，也有人被真相伤害。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b12","side":"B","angle":"动机","text":"你们的意思是，为了让人开心，什么谎都可以随便说，对吗？","fallacy":"straw_man","explain":"对方主张的是“善意的、有条件的谎言”，并不是“什么谎都可以”。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b13","side":"B","angle":"证据","subtlety":2,"text":"人类的大脑天生就能识别谎言，所以善意的谎言一定会被识破，说了也没有意义。","fallacy":"false_premise","explain":"这个前提本身不成立：人识别谎言的准确率并不高。起点错了，结论也站不住。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a15","side":"A","angle":"情境","subtlety":2,"text":"我想不通不说谎怎么维持关系，所以在人际交往里，谎言一定是必要的。","fallacy":"personal_incredulity","explain":"自己想象不出别的办法，不代表没有别的办法。沉默、委婉、先问对方想不想听，都是选择。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b14","side":"B","angle":"自主","subtlety":3,"text":"既然你也承认说谎会伤害信任，那你打算怎么向被你骗过的人道歉？","fallacy":"loaded_question","explain":"问题里藏着两个预设：你承认了说谎伤害信任，你也骗过人。无论怎么回答，都等于默认了。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a16","side":"A","angle":"证据","subtlety":2,"text":"我说善意的谎言没有坏处，不信？你拿出一个有坏处的例子来证明。","fallacy":"burden_of_proof","accept":["appeal_to_ignorance"],"explain":"提出主张的人应该举证。自己不给依据，却要求别人证明相反，把责任倒了过来。","opener":false,"decoys":[],"quip":"","punch":null}],"chapter":"logic_club"},{"id":"trolley","title":"电车难题：该不该拉动拉杆，牺牲一人救五人？","scene":"辩论赛的抽签结果出来了，这一场的辩题是伦理学里最著名的难题。","tags":["伦理","经典"],"sides":{"A":"应该拉杆","B":"不该拉杆"},"opponents":{"A":"xiaochen","B":"xiaolin"},"statements":[{"id":"tr_a01","side":"A","angle":"数量","opener":true,"text":"五条生命比一条生命更多，在其他条件相同时，挽救更多的生命是更好的选择。","fallacy":null,"explain":"提出了明确的原则和条件（其他条件相同）。这是功利主义的核心论证，没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a02","side":"A","angle":"情感","text":"想想那五个人家里的孩子，你怎么忍心眼睁睁看着他们被撞死？","fallacy":"appeal_to_emotion","explain":"用怜悯代替理由。被牺牲的那个人也有家人，情感不能决定对错。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a03","side":"A","angle":"舆论","text":"调查显示大多数人都会选择拉杆，这么多人这样选，肯定是对的。","fallacy":"appeal_to_popularity","explain":"多数人的选择，不等于道德上正确的选择。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a04","side":"A","angle":"选择","text":"要么拉杆，要么就是见死不救，没有第三种选择。","fallacy":"false_dilemma","explain":"把选择说成只有两种，忽略了大声警告、尝试让车停下等其他可能。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a05","side":"A","angle":"权威","text":"某位著名哲学家说了，功利主义才是正确的，所以应该拉杆。","fallacy":"appeal_to_authority","explain":"借用名气，没有说明理由。哲学家之间对这个问题本来就有分歧。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a06","side":"A","angle":"动机","text":"你们反对拉杆，就是觉得五个人的命一文不值，对吗？","fallacy":"straw_man","explain":"反对拉杆，并不等于认为五个人的命不值钱。这是把对方的观点扭曲了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a07","side":"A","angle":"责任","text":"不作为也是一种选择，明知可以救人却不救，也需要为结果负责，这一点不能回避。","fallacy":null,"explain":"指出了不作为也有责任，回应了对方的区分。可以继续讨论，但论证本身合理。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a08","side":"A","angle":"动机","text":"反对拉杆的，都是只想保住自己手上干净、不在乎别人死活的伪君子。","fallacy":"ad_hominem","explain":"攻击对方的人品，没有回应他的论据。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a09","side":"A","angle":"舆论","text":"我问过的五个朋友都选了拉杆，可见所有正常人都会拉。","fallacy":"hasty_generalization","explain":"五个朋友不能代表“所有人”。“正常人”的说法，还暗含了对不同意者的否定。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a10","side":"A","angle":"数量","text":"承认牺牲一个人令人痛苦，但两害相权取其轻，仍然是一个可以被说明的理由。","fallacy":null,"explain":"承认了代价，并给出了取舍的理由。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a11","side":"A","angle":"证据","subtlety":2,"text":"谁也不能证明拉杆是错的，所以拉杆就是对的。","fallacy":"appeal_to_ignorance","explain":"没有证明它错，不等于它对。主张“应该拉”的一方也要给出理由。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a12","side":"A","angle":"责任","text":"别光讨论拉不拉杆，你们先说说，铁路公司为什么不装安全系统！","fallacy":"red_herring","explain":"铁路安全是另一个话题，这是把讨论岔开了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a13","side":"A","angle":"类比","text":"现实中急救分诊也要在有限资源下取舍，说明“比较数量”并非完全不可接受。","fallacy":null,"explain":"用一个现实的例子，说明这种思路并非不可接受。没有夸大，论证合理。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a14","side":"A","angle":"来源","text":"“不能主动伤害”这套观念是宗教留下来的，所以不值得重视。","fallacy":"genetic","explain":"仅凭观念的来源就否定它。一个原则是否成立，要看它的理由。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b01","side":"B","angle":"责任","opener":true,"text":"主动导致一个无辜者死亡，和没能阻止死亡，在道德上并不相同，这个区别值得认真对待。","fallacy":null,"explain":"提出了“作为与不作为”的区别，这是伦理学里被认真讨论的论证。没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b02","side":"B","angle":"概念","subtlety":2,"text":"杀人是错的，拉杆会导致一个人死亡，所以拉杆就是杀人，当然是错的。","fallacy":"equivocation","explain":"把“导致死亡”悄悄换成了“杀人”。两者在意图和因果上是否相同，正是争论的焦点。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b03","side":"B","angle":"后果","text":"今天能为五个人牺牲一个人，明天就能为十个人牺牲两个，最后人命只是数字。","fallacy":"slippery_slope","explain":"从一次取舍直接推到“人命只是数字”，中间的步骤没有证明。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b04","side":"B","angle":"传统","text":"历来的道德教育都教我们不能主动伤害别人，这是传统，不能违背。","fallacy":"appeal_to_tradition","explain":"传统久远不代表在任何情形下都成立，仍需要给出理由。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b05","side":"B","angle":"原则","subtlety":2,"text":"拉杆不道德，因为我们有不得伤害无辜者的义务；为什么有这个义务？因为伤害无辜者是不道德的。","fallacy":"circular","explain":"用“不道德”解释“义务”，又用“义务”证明“不道德”，在原地打转。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b06","side":"B","angle":"动机","text":"支持拉杆的人，都是把人当数字的冷血功利主义者。","fallacy":"ad_hominem","explain":"给对方贴标签，没有回应他的论点。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b07","side":"B","angle":"原则","text":"人不应只被当作达成目的的工具。拉杆等于把那一个人当作拯救五人的手段，需要特别的理由。","fallacy":null,"explain":"提出了一个明确的道德原则，并说明它如何适用。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b08","side":"B","angle":"类比","text":"如果只按人数取舍成立，那医生杀一个健康人取器官救五个人也成立。多数人不接受，说明“只看人数”可能有问题。","fallacy":null,"explain":"这是一个归谬论证：把对方的原则推到另一个情形，检验它是否可接受。有理由，没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b09","side":"B","angle":"证据","subtlety":2,"text":"你证明了五条命更多，我就要你证明每条命价值相等；证明了这个，我还会要你证明别的。","fallacy":"moving_goalposts","explain":"每次对方满足了条件，就提出新的条件。这样的标准永远无法达到。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b10","side":"B","angle":"情感","text":"那个被牺牲的人也有家人，你让他们怎么接受亲人被你拉杆害死？","fallacy":"appeal_to_emotion","explain":"用愧疚和痛苦代替理由。两边都有家人，情感本身不能决定对错。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b11","side":"B","angle":"选择","text":"要么永远不能主动伤害任何人，要么就是道德沦丧。","fallacy":"false_dilemma","explain":"把选择说成两个极端，忽略了在极端情形下有限度地取舍的可能。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b12","side":"B","angle":"现实","text":"现实里我们往往无法确定结果，也不知道拉杆后是否只死一人，不确定性越大，越应谨慎行动。","fallacy":null,"explain":"指出了思想实验和现实的差别，并给出了谨慎的理由。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b13","side":"B","angle":"权威","text":"我的伦理学老师说了，不能拉杆。老师是专家，你得听。","fallacy":"appeal_to_authority","explain":"只搬出老师的身份。专家之间也有不同意见，要看他给出的理由。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a15","side":"A","angle":"证据","subtlety":3,"text":"这次我只引用最新的那项调查，因为它的结果最清楚；之前几项不一致的，都过时了。","fallacy":"cherry_picking","explain":"只挑对自己有利的证据，把不利的直接说成“过时”。结果不一致，本身就是需要面对的信息。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b14","side":"B","angle":"情感","text":"我实在想不明白，怎么会有人忍心主动拉杆，所以拉杆不可能是对的。","fallacy":"personal_incredulity","explain":"自己想不通，不代表它不成立。需要的是论证，而不是“我无法想象”。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null}],"chapter":"logic_club"},{"id":"ai_art","title":"AI 生成的作品，该不该受版权保护？","scene":"主播当场用 AI 画出一幅画，粉丝立刻分成了两派。","tags":["科技","创作"],"sides":{"A":"应该保护","B":"不该保护"},"opponents":{"A":"chengxuyuan","B":"gangjing"},"statements":[{"id":"ai_a01","side":"A","angle":"劳动","opener":true,"text":"使用者为作品付出了构思、反复调整和筛选，这些智力投入应当得到某种保护。","fallacy":null,"explain":"从使用者的付出出发，理由与结论相关。没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a02","side":"A","angle":"概念","subtlety":2,"text":"AI 也在“创作”，创作出来的东西当然是作品，作品就该有版权。","fallacy":"equivocation","explain":"“创作”一词的含义悄悄变了：人类的创作，与模型生成内容，是不是同一回事，正是争论的焦点。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a03","side":"A","angle":"舆论","text":"现在几百万人都在用 AI 画图，这么多人用，当然应该保护。","fallacy":"appeal_to_popularity","explain":"用的人多，不等于应该受保护。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a04","side":"A","angle":"后果","text":"今天不保护 AI 作品，明天所有创作者都没动力，最后文化产业全完蛋。","fallacy":"slippery_slope","explain":"把一个政策判断夸大成连锁崩溃，每一步都没有证明。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a05","side":"A","angle":"权威","text":"某位科技大佬说了，AI 作品必须有版权。他是行业领袖，听他的准没错。","fallacy":"appeal_to_authority","explain":"行业地位不等于法律和伦理上的正确。应该看他给出了什么理由。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a06","side":"A","angle":"动机","text":"你们反对保护，就是想让所有用 AI 的人白忙一场、一分钱都赚不到吗？","fallacy":"straw_man","explain":"对方反对的是“版权保护”，并没有说使用者不能赚钱。这是把观点夸大后再反驳。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a07","side":"A","angle":"后果","text":"如果完全没有保护，商业使用者很难投入，创作者的积极性也会受影响，所以需要明确的规则。","fallacy":null,"explain":"说明了没有规则会带来什么后果，并提出需要规则。论证合理。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a08","side":"A","angle":"类比","subtlety":2,"text":"AI 画画就像相机拍照，相机刚出现时也被说不是艺术，现在谁还这么说？","fallacy":"false_analogy","explain":"相似点有，但关键差别被略过了：画面有多少是人控制的。类比需要说明关键之处为什么相同。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a09","side":"A","angle":"动机","text":"反对保护 AI 作品的，无非是怕被取代的画手在嫉妒。","fallacy":"ad_hominem","explain":"揣测对方的动机，代替了回应他的论据。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a10","side":"A","angle":"区分","text":"可以按人的参与程度来区分：只写一句话就生成的不保护，经过大量修改编辑的可以保护。","fallacy":null,"explain":"提出了可操作的区分标准，回应了对方的顾虑。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a11","side":"A","angle":"情感","text":"有个残障小伙靠 AI 画画才找回了自信，你忍心让他的作品没人保护吗？","fallacy":"appeal_to_emotion","explain":"用个别感人的故事代替论证。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a12","side":"A","angle":"后果","text":"要么保护 AI 作品，要么就是扼杀技术创新，没有第三条路。","fallacy":"false_dilemma","explain":"把选择说成两个极端，忽略了部分保护、登记制度等办法。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a13","side":"A","angle":"劳动","text":"版权的目的是激励创作和传播，只要人的选择与修改体现了个性，就值得讨论保护。","fallacy":null,"explain":"从版权的目的出发，并给了条件（体现个性）。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a14","side":"A","angle":"证据","subtlety":2,"text":"你说使用者没有独创性，那就请你拿证据证明他们没有付出智力劳动。","fallacy":"burden_of_proof","explain":"要主张“应当保护”的一方先说明独创性在哪里，而不是要求对方去证明“没有”。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_b01","side":"B","angle":"原则","opener":true,"text":"传统上版权保护的是人的独创表达，AI 生成内容缺少人类作者这一环，保护的依据并不明确。","fallacy":null,"explain":"指出了版权理论的前提，并只说“依据不明确”，没有夸大。没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{

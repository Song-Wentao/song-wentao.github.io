e “pattern.” A pattern picked out after the fact has to be re-verified with new data."],"ds_a06":["The data must be published, must be published, must all be published! There's no reason not to publish!","Saying the same thing over and over doesn't prove it. Repetition isn't a reason."],"ds_a07":["Parts involving privacy and trade secrets can be published after anonymizing, protecting what needs protecting while keeping the core data verifiable.","It offers a concrete approach that serves both sides. No fallacy."],"ds_a08":["If you don't publish all the data today, you'll dare to publish fake data tomorrow, and just make up data outright the day after.","It goes straight from “not publishing everything” to “making up data,” with no proof for the steps in between."],"ds_a09":["A former regulator said that publishing all the data is international practice, so you have to follow it.","It invokes only a title without saying what the practice actually is or whether it applies."],"ds_a10":["You don't want to publish all the data because you want to treat the public like fools, right?","The other side only argued for publishing conclusions first, not for fooling the public. This distorts the other side's view."],"ds_a11":["Data can be released in layers: summary and methods first, then raw data on request, balancing readability and verifiability.","It offers a layered approach, answering the worry that “it's hard to understand.” No fallacy."],"ds_a12":["A truly responsible company publishes all its data. One that doesn't isn't truly responsible.","It quietly redefines “responsible” as “publishes all data,” so the claim can never be refuted."],"ds_a13":["Either publish all the data, or you're hiding something. There's no third possibility.","It frames the choices as two extremes, ignoring anonymizing, layered release, disclosure to independent bodies and more."],"ds_a14":["After publishing the data, we should also explain the testing methods and limitations, or the public will easily misread the numbers.","It adds a condition that makes disclosure actually useful. No fallacy."],"ds_b01":["Raw data is huge and technical, hard for ordinary readers to interpret. Publishing the verified conclusions and key metrics first is actually clearer.","It starts from the cost to the public of understanding, a reason related to the conclusion. It's open to debate, but the argument itself has no fallacy."],"ds_b02":["Every department in our company has passed internal review, so the company as a whole certainly has no problem.","Every part passing doesn't mean the whole is fine. The problem could be in how departments connect, or in the review standards themselves."],"ds_b03":["Our product is safe, safe, truly safe, so please trust us.","Repetition isn't evidence. However many times you say “safe,” it needs test results to back it up."],"ds_b04":["We've published the conclusions, and the conclusions are the essence of the data, so we have published the data.","The meaning of “publishing the data” is quietly swapped for “publishing the conclusions.” Conclusions are an interpretation of the data, not the data itself."],"ds_b05":["A senior expert who asked not to be named said this data isn't suitable for release.","It borrows an unverifiable “expert.” With no name and no reasons, that authority doesn't exist."],"ds_b06":["We analyzed twenty population subgroups and found that users with type A blood who bought on Wednesdays showed the biggest satisfaction gains, so this tea suits them especially well.","Try enough subgroups and one will always look especially good. A pattern picked out after the fact must be re-verified with new data."],"ds_b07":["Since you also know the data may be misread, why do you still insist on publishing it? Are you trying to steer public opinion?","The question assumes “you want to steer public opinion.” Any answer accepts that premise."],"ds_b08":["Publishing everything may involve suppliers' privacy. We can disclose it in full to regulators and independent third parties, then publish anonymized results to the public.","It offers a concrete layered disclosure without avoiding verification. No fallacy."],"ds_b09":["Publish all the data today, and tomorrow our competitors can copy our formula, and the company is finished.","It goes straight from publishing data to “the company is finished,” with no proof for the steps in between."],"ds_b10":["Any true professional understands that this kind of data can only be interpreted by the company. Anyone who demands the raw data isn't truly knowledgeable.","Faced with opponents, it redefines the term as “a truly knowledgeable person wouldn't do that,” so the claim can never be wrong."],"ds_b11":["The people demanding all the data are just reporters trying to hype it up.","It guesses the other side's motives instead of answering his arguments."],"ds_b12":["Rather than agonizing over whether to publish, look at the competitor's data. Their problems are much bigger!","The competitor's data is a separate topic. This steers the discussion away."],"ds_b13":["Publishing isn't the goal in itself. What matters is that the public can understand and oversee it, and we can provide explanations and a Q&A channel to go with it.","It puts the goal on being “understandable and open to oversight” and offers supporting steps. No fallacy."],"ds_b14":["Ever since we published the first batch of data, there have been even more doubts online, so publishing data just causes more doubt.","More doubts may be due to more attention and more information. One thing following another doesn't mean one caused the other."],"ds_b15":["Data that hasn't been verified should be marked “pending verification,” to avoid publishing preliminary results as final conclusions.","It offers a way to prevent misleading people, not a way to avoid disclosure. No fallacy."],"lb_a01":["Claims like “helps lower blood pressure” can make people think the product works and cut or stop their medication. The risk is significant, so strict control is needed.","It points out a specific risk, a reason tied to the conclusion. No fallacy."],"lb_a02":["“Helps” just means assisting, and assisting lower blood pressure means it can lower blood pressure, so writing “helps lower blood pressure” claims it can treat illness.","“Helps” is stepped up bit by bit into “treats.” “Assisting” and “being able to lower” are not the same thing."],"lb_a03":["Did you know all along it doesn't work, and use a vague word like “helps” to skirt the rules?","The question assumes “you knew all along it doesn't work.” Any answer accepts that premise."],"lb_a04":["Think of the elderly people who stopped taking their blood pressure pills. Can you live with yourselves?","It uses guilt in place of argument. What's needed is an analysis of how large the risk is."],"lb_a05":["The supplement industry as a whole makes money by exaggerating, so every single supplement is exaggerating.","It applies a judgment about the whole industry directly to every product. Whether each product exaggerates must be checked one by one against its claims and evidence."],"lb_a06":["My dad believed “helps lower blood pressure,” stopped his medication, and ended up in the hospital. That kind of wording just hurts people.","It uses one person's experience in place of evidence. More data is needed to judge the overall effect of such claims."],"lb_a07":["Label wording should match verifiable evidence: if you claim an effect, you need the corresponding evidence, and without it you shouldn't use the wording.","It offers a clear, testable standard. No fallacy."],"lb_a08":["Allow “helps lower blood pressure” today, and tomorrow it's “helps treat cancer,” and the day after “cures everything.”","Every step is called inevitable without proof. Allowing one claim doesn't mean every claim will be allowed."],"lb_a09":["This kind of claim must be banned, must be banned, can't be tolerated for a moment, must be banned!","Repetition isn't a reason. However many times you say “must,” an argument has to back it up."],"lb_a10":["You oppose a ban, so you support merchants lying however they like, right?","Opposing a “ban” doesn't mean supporting “lying.” They argue for other ways of regulating."],"lb_a11":["It doesn't have to be all-or-nothing: any health-benefit wording must come with supporting evidence and a risk notice, and be subject to spot checks.","It offers an approach that isn't a simple ban, answering the other side's worry. No fallacy."],"lb_a12":["We counted three hundred supplement slogans and found that those containing the word “helps” happened to have the highest complaint rate, so that word itself is the problem.","It sees a difference in complaint rates first, then goes back and picks a word as the cause. A pattern picked out this way may be only a coincidence and needs new data to verify."],"lb_a13":["Reportedly, some experts believe all health-benefit wording on supplements should be banned.","“Reportedly” and “some experts”: no names, no sources, and no reasons given."],"lb_a14":["Either ban this kind of wording entirely, or you're condoning deception. There's no middle option.","It frames the choices as two extremes, ignoring evidence review, risk notices and other regulatory methods."],"lb_a15":["Besides banning words, we could also require a prominent note, “This product is not a substitute for medication,” so consumers see it at a glance.","It offers a concrete supplement and doesn't rely on bans alone. No fallacy."],"lb_b01":["Words like “helps” and “regulates” are fairly broad. Rather than banning them wholesale, it's better to require companies to provide evidence and flag risks.","It offers an alternative and explains why. No fallacy."],"lb_b02":["It's marketing freedom, marketing freedom, the marketing freedom every company should have!","Repetition isn't a reason. However many times you say “freedom,” an argument has to back it up."],"lb_b03":["Every employee at our company is an honest person, so all of our company's advertising is honest.","Each part being honest doesn't mean the whole body of advertising is honest. Whether advertising is honest depends on the advertising itself."],"lb_b04":["Freedom means saying whatever you want, so restricting label wording is stripping away free speech.","“Free speech” is quietly swapped for “commercial advertising can say anything.” The two are not subject to the same limits."],"lb_b05":["Are you prejudiced against all supplements, which is why you want to ban this phrase too?","The question assumes “you're prejudiced against all supplements.” Any answer accepts that premise."],"lb_b06":["A true supplement never exaggerates its effects. The ones that exaggerate aren't true supplements and can't represent the industry.","Faced with a counterexample, it redefines the term as “a true supplement wouldn't do that,” so the claim can never be wrong."],"lb_b07":["We surveyed a thousand users and found that those living in the east district who bought on weekends saw the biggest blood pressure improvement, so this tea suits that kind of person especially well.","Try enough subgroups and one will always look especially good. A pattern picked out after the fact must be re-verified with new data."],"lb_b08":["Label wording should be read in context. If it also states “not a substitute for medication,” consumers are less likely to be misled.","It offers a conditional way to ease the problem without denying the risk. No fallacy."],"lb_b09":["Ban “helps lower blood pressure” today, ban every benefit description tomorrow, and the supplement industry can't operate.","Every step is called inevitable without proof. Banning one claim doesn't mean banning all descriptions."],"lb_b10":["Don't your hospitals' ads exaggerate effects too? Why are you only going after us?","It dodges the question by pointing at the other side's problem. Whether hospital ads have issues doesn't show the label's claims are fine."],"lb_b11":["The supplement industry has written labels this way for decades without a major incident, so there's no need to change.","“It's always been this way” doesn't show there's no problem, or that no change is needed now."],"lb_b12":["Regulation should focus on falsehood and exaggeration, not on a few words. Benefit descriptions supported by evidence should be allowed.","It puts the regulatory focus on “whether there's evidence,” not simple permissiveness. No fallacy."],"lb_b13":["Tens of millions of consumers buy this kind of product. With so many buying, these claims must be fine.","Many buyers doesn't mean the claims are fine. Many people buying may also mean they've been misled."],"lb_b14":["Consumer education matters just as much: teaching people to read labels and consult doctors is more far-reaching than just banning words.","It raises an important overlooked aspect without denying regulation. No fallacy."],"lb_b15":["Among buyers, those willing to leave good reviews online all say it works, so it really works.","It sees only the people willing to post. Those for whom it didn't work, or who stopped buying, may not write reviews."],"launch_boss:0":["Dear members of the press, thank you for coming today. We will first report the situation, then take questions.","This is an opening and a note on procedure. It makes no argument, so there's no fallacy."],"launch_boss:1":["Our product is safe, safe, a safe that has been fully verified.","Repetition isn't evidence. However many times you say “safe,” it needs test results to back it up."],"launch_boss:2":["Every employee at our company is honest and trustworthy, so every piece of information the company releases is true.","Each part being honest doesn't mean every piece of information released as a whole is true. Whether information is true depends on the information itself."],"launch_boss:3":["We analyzed thirty customer subgroups and found that satisfaction rose forty percent among users who ordered on Wednesdays, which shows the product works especially well for that group.","Try enough subgroups and one will always look especially good. A pattern picked out after the fact must be re-verified with new data."],"launch_boss:4":["When we say “safe,” we mean “not proven harmful.” So please rest assured: our product is safe.","The meaning of “safe” is quietly swapped for “not proven harmful.” Not proven harmful doesn't mean proven harmless."],"launch_boss:5":["May I ask everyone here: don't you also think that media coverage is the real cause of the panic?","The question assumes “the panic was caused by the media.” Any answer accepts that premise."],"launch_boss:6":["For data that hasn't been verified, we will mark it “pending verification” and publish the verification results within seven days.","This is a concrete, testable commitment, with no fallacy. Careful: it looks like stalling, but it isn't."],"launch_boss:7":["Finally, thank you for your attention. We will update our website with further developments.","This is a closing remark and a plan. It makes no argument, so there's no fallacy."]},"speeches":{"family_boss":{"title":"Second Uncle's Toast","intro":"Second Uncle raises his glass and begins his annual speech. Tap the flawed lines and pick their names."},"logic_boss":{"title":"Lin's Closing Statement: Should Final Exams Be Kept?","intro":"Lin opens her closing statement. Tap the flawed lines and pick their names."},"live_boss":{"title":"Mei's Golden Sales Script","intro":"The livestream passes a hundred thousand viewers. Tap the flawed lines and pick their names."},"trending_boss":{"title":"Old K's Expose Livestream: Revealing the Blood Pressure Tea","intro":"Ten p.m., and Old K starts his “Exposing the Blood Pressure Tea” stream. Tap the flawed lines and pick their names. Careful: some lines look like tricks but are actually fine."},"crisis_boss":{"title":"Boss Zhou's Closing Remarks","intro":"The meeting is nearing its end, and Boss Zhou stands for his closing remarks. Tap the flawed lines and pick their names. Careful: some lines are just meeting logistics, not arguments."},"launch_boss":{"title":"Boss Zhou's Press Conference Speech","intro":"The press conference reaches the opening remarks, and Boss Zhou opens his script. Tap the flawed lines and pick their names. The most polished spin hides the most subtle flaws."}}}},"languages":[{"code":"en","name":"English"}],"families":{"relevance":"相关性谬误","induction":"因果与归纳谬误","structure":"结构与语言谬误"},"fallacies":[{"id":"ad_hominem","zh":"人身攻击","en":"Ad hominem","latin":"Argumentum ad hominem","family":"relevance","emoji":"👉","def":"不去回应观点本身，而是攻击提出观点的人。","example":"你又没带过孩子，凭什么谈教育？","example_reply":"我有没有带过孩子，不影响“这个观点对不对”。","tip":"追问：这个人的身份，和他的论据是否成立有什么关系？"},{"id":"straw_man","zh":"稻草人谬误","en":"Straw man","family":"relevance","emoji":"🌾","def":"先把对方的观点歪曲成一个更容易攻击的版本，再去反驳这个被歪曲的版本。","example":"你说要限制手机，就是想让孩子与世隔绝！","example_reply":"我说的是限制使用时间，不是与世隔绝。","tip":"复原对方的原话，指出他把你的意思改成了什么。"},{"id":"red_herring","zh":"转移话题","en":"Red herring","family":"relevance","emoji":"🐟","def":"抛出一个看似相关、实则无关的话题，把讨论带偏。","example":"别聊工作了，你什么时候结婚？","example_reply":"结婚是另一件事，我们先把工作说完。","tip":"指出这是另一个问题，先把当前的说完。"},{"id":"tu_quoque","zh":"你也一样","en":"Tu quoque","latin":"Tu quoque","family":"relevance","emoji":"🪞","def":"以对方自己也做过类似的事，来否定对方的观点。","example":"你自己天天熬夜，凭什么劝我早睡？","example_reply":"我做没做到是一回事，早睡好不好是另一回事。","tip":"做不到，不代表说得不对。观点的对错与说话人的言行无关。"},{"id":"appeal_to_authority","zh":"诉诸权威","en":"Appeal to authority","latin":"Argumentum ad verecundiam","family":"relevance","emoji":"🎓","def":"仅因为某个“权威”这样说，就认定观点正确，而不看他的论据。","example":"专家说了，你一个普通人懂什么？","example_reply":"他是哪个领域的专家？依据是什么？","tip":"他是否精通这个领域？有没有证据支持？年头长、职位高不等于正确。"},{"id":"appeal_to_popularity","zh":"诉诸大众","en":"Appeal to popularity","latin":"Argumentum ad populum","family":"relevance","emoji":"👥","def":"因为很多人相信或这样做，就认为它是对的。","example":"大家都这么做，肯定没错。","example_reply":"做的人多，不等于它是对的。","tip":"多数人的选择，不等于正确的选择。"},{"id":"appeal_to_emotion","zh":"诉诸情感","en":"Appeal to emotion","latin":"Argumentum ad passiones","family":"relevance","emoji":"😭","def":"用恐惧、怜悯、愧疚等情绪代替理由，让人接受结论。","example":"你忍心看孩子哭吗？","example_reply":"我理解你的心疼。不过，该不该给，还是要看理由。","tip":"把情绪放一边：去掉这些感受，剩下的理由是什么？"},{"id":"appeal_to_tradition","zh":"诉诸传统","en":"Appeal to tradition","latin":"Argumentum ad antiquitatem","family":"relevance","emoji":"📜","def":"因为“一直如此”或“古已有之”，就认为它是正确的。","example":"老祖宗传下来的，肯定有道理。","tip":"历史悠久只说明存在得久，不说明它好。"},{"id":"appeal_to_nature","zh":"诉诸自然","en":"Appeal to nature","family":"relevance","emoji":"🌿","def":"认为“天然的”就是好的、安全的，“人造的”就是坏的。","example":"纯天然的，肯定没有副作用。","tip":"毒蘑菇、砒霜也都是天然的。"},{"id":"appeal_to_accomplishment","zh":"诉诸成就","en":"Appeal to accomplishment","family":"relevance","emoji":"🏆","def":"以对方没有做出成绩为由，否定他的批评或观点。","example":"你行你上啊！你做一个试试？","tip":"批评是否成立，不取决于批评者能不能亲自做到。"},{"id":"genetic","zh":"发生学谬误","en":"Genetic fallacy","family":"relevance","emoji":"🌱","def":"仅凭观点的来源或出身，就判定它是对是错。","example":"这是从某某网站上看来的，肯定是假的。","tip":"来源可以提醒你多核实，但不能代替核实。"},{"id":"guilt_by_association","zh":"罪恶关联","en":"Guilt by association","family":"relevance","emoji":"🤝","def":"因为某个观点和不受欢迎的人或群体有关联，就否定这个观点。","example":"这个主意某某坏人也提过，所以是错的。","tip":"观点要靠自己的理由成立或不成立，不看谁也说过。"},{"id":"false_cause","zh":"虚假因果","en":"Questionable cause","latin":"Post hoc ergo propter hoc","family":"induction","emoji":"🔗","def":"仅凭两件事先后发生或同时出现，就断定其中一件是另一件的原因。","example":"他一搬家就生病，肯定是新房子风水不好。","tip":"还有别的可能原因吗？有没有对照？"},{"id":"hasty_generalization","zh":"以偏概全","en":"Hasty generalization","family":"induction","emoji":"🎲","def":"用很少的样本，得出关于整体的结论。","example":"我认识的两个人创业都赔了，创业没有不赔的。","tip":"样本够多、够随机吗？"},{"id":"anecdotal","zh":"个案证据","en":"Anecdotal fallacy","family":"induction","emoji":"🗣️","def":"用个人的亲身经历或听来的故事，代替系统的证据。","example":"我邻居吃了这个药就好了，肯定有效。","example_reply":"一个人好了，也可能是自己好的，需要更多的对照。","tip":"个案生动，但不能代替统计和对照。"},{"id":"survivorship","zh":"幸存者偏差","en":"Survivorship bias","family":"induction","emoji":"✈️","def":"只看到成功、留下来的样本，忽略了大量失败、消失的样本。","example":"某某辍学创业成了首富，所以读书没用。","tip":"没成功的人去哪了？"},{"id":"cherry_picking","zh":"选择性取证","en":"Cherry-picking","family":"induction","emoji":"🍒","def":"只挑对自己有利的证据，无视相反的证据。","example":"有三篇文章说有效，其他说无效的都不算。","tip":"有没有相反的证据被略过了？"},{"id":"slippery_slope","zh":"滑坡谬误","en":"Slippery slope","family":"induction","emoji":"🎢","def":"声称一小步会引发一连串不可避免的坏结果，却不证明每一步都成立。","example":"今天让他玩游戏，明天就荒废学业，最后毁掉一生。","example_reply":"每一步都是必然的吗？哪一步的概率有多大？","tip":"逐环节追问：这一步真的必然发生吗？概率多大？"},{"id":"false_analogy","zh":"虚假类比","en":"False analogy","family":"induction","emoji":"🍊","def":"拿本质不同的两件事作比较，再把一方的结论强加给另一方。","example":"管孩子就像养花，不修剪就会长歪。","tip":"这两件事在关键的地方真的相似吗？"},{"id":"false_dilemma","zh":"非黑即白","en":"False dilemma","latin":"Falsum dilemma","family":"structure","emoji":"🚪","def":"把复杂的问题说成只有两个选项，忽略其他可能。","example":"要么听我的，要么你就别回这个家。","example_reply":"真的只有这两种可能吗？","tip":"追问：真的只有这两种可能吗？"},{"id":"circular","zh":"循环论证","en":"Circular reasoning","latin":"Circulus in probando","family":"structure","emoji":"🔄","def":"结论其实已经藏在前提里，用它自己来证明自己。","example":"他说的都是真的，因为他从不说谎。","example_reply":"你怎么知道他从不说谎？","tip":"把结论拿走，前提还成立吗？"},{"id":"equivocation","zh":"偷换概念","en":"Equivocation","family":"structure","emoji":"🎭","def":"在论证中让同一个词悄悄换了含义。","example":"人人都有言论自由，所以我在会议上想怎么骂就怎么骂。","tip":"这个词在前后两句里，意思还是同一个吗？"},{"id":"loaded_question","zh":"复杂问题","en":"Loaded question","latin":"Plurium interrogationum","family":"structure","emoji":"💣","def":"问题里暗含一个未经证实的前提，无论怎么回答都等于默认了它。","example":"你是不是已经不再偷懒了？","example_reply":"我根本没有偷过懒。","tip":"先拆开问题里藏着的预设，说明你不接受它，再决定怎么回答。"},{"id":"appeal_to_ignorance","zh":"诉诸无知","en":"Appeal to ignorance","latin":"Argumentum ad ignorantiam","family":"structure","emoji":"🕳️","def":"因为没有证据证明它错，就断定它对（或者反过来）。","example":"你不能证明鬼不存在，所以鬼存在。","tip":"没有证据，不等于有相反的证据。"},{"id":"burden_of_proof","zh":"举证责任倒置","en":"Shifting the burden of proof","latin":"Onus probandi","family":"structure","emoji":"🏋️","def":"提出主张的人不举证，反而要求别人来证明它是错的。","example":"我说这个方子有效，你说无效就拿证据来。","tip":"谁主张，谁举证。"},{"id":"middle_ground","zh":"中庸谬误","en":"Argument to moderation","latin":"Argumentum ad temperantiam","family":"structure","emoji":"⚖️","def":"认为两种观点之间的折中立场就一定是对的。","example":"一方说一加一等于二，一方说等于四，那就折中等于三吧。","tip":"折中不等于正确，先看各自的理由。"},{"id":"no_true_scotsman","zh":"诉诸纯洁","en":"No true Scotsman","family":"structure","emoji":"🥃","def":"遇到反例时，就把定义改成“真正的……不会这样”，让自己的说法永远不会错。","example":"有人用了没效，那是他没用到正宗的。","tip":"问：什么样的证据能让你承认自己错了？"},{"id":"moving_goalposts","zh":"移动球门","en":"Moving the goalposts","family":"structure","emoji":"🥅","def":"对方满足了你提出的条件后，你又提高或改变要求。","example":"你给了一篇研究，我要十篇；给了十篇，我又说不够权威。","tip":"先约定：什么证据算数？"},{"id":"personal_incredulity","zh":"个人怀疑","en":"Personal incredulity","family":"structure","emoji":"🙉","def":"因为自己想不通、听不懂，就断定它不成立。","example":"这么复杂的东西我都看不懂，肯定是骗人的。","tip":"你不理解，不代表它错。可以先去弄懂。"},{"id":"false_premise","zh":"虚假前提","en":"False premise","family":"structure","emoji":"🧱","def":"论证依赖的事实本身就是错的，或者根本无法成立。","example":"既然人只用了大脑的百分之十，我们就该开发剩下的九成。","tip":"在讨论推理之前，先核实它的起点是不是真的。"},{"id":"sunk_cost","zh":"沉没成本谬误","en":"Sunk cost fallacy","family":"structure","emoji":"💸","def":"因为已经投入了时间和金钱，就坚持继续，即使继续并不划算。","example":"都看了两个小时了，再烂的电影也要看完。","tip":"只问未来：从现在开始，继续值不值得？"},{"id":"gamblers_fallacy","zh":"赌徒谬误","en":"Gambler's fallacy","family":"induction","emoji":"🎰","def":"以为互相独立的随机事件，会“补偿”之前的结果。","example":"连输了五把，下一把一定该赢了。","tip":"骰子没有记忆：每一次独立事件的概率，不受之前结果影响。"},{"id":"base_rate","zh":"基础比率谬误","en":"Base rate fallacy","family":"induction","emoji":"📊","def":"只盯着眼前的具体信息或绝对数字，忽略了整体里这件事本来有多常见。","example":"这项检测 99% 准确，我测出阳性，所以我 99% 真的有病。（忽略了这种病本来就很少见）","tip":"先问：在所有人里，这种情况本来占多少？分母是多少？"},{"id":"special_pleading","zh":"特设辩护","en":"Special pleading","family":"structure","emoji":"🎫","def":"给自己（或自己人）设一个“例外”，却说不出为什么例外。","example":"规则很重要，但我们公司情况特殊，不适用。","tip":"问：为什么这条规则对别人适用，对你却是例外？"},{"id":"appeal_to_consequences","zh":"诉诸后果","en":"Appeal to consequences","latin":"Argumentum ad consequentiam","family":"relevance","emoji":"📉","def":"因为某个结论带来的后果太糟（或太好），就断定它不是真的（或是真的）。","example":"如果这茶真有问题，公司就完了，所以它不可能有问题。","tip":"事实是什么，和它会带来什么后果，是两个问题。后果再糟，也不能让事实消失。"},{"id":"texas_sharpshooter","zh":"德州神枪手谬误","en":"Texas sharpshooter fallacy","family":"induction","emoji":"🎯","def":"先看到数据里的某个规律，再回头把靶子画在弹孔周围。","example":"我们翻了一百项指标，发现 A 型血的用户血压下降最明显，所以这茶对 A 型血特别有效。","tip":"先定假设，再看数据。事后找到的规律，必须用新的数据重新验证。"},{"id":"composition_division","zh":"合成与分割谬误","en":"Fallacy of composition / division","family":"structure","emoji":"🧩","def":"以为整体具有的性质，每个部分也有（或者反过来）。","example":"我们公司整体信誉很好，所以我们的每一款产品都靠谱。","tip":"整体和部分是两回事。问问：这个性质，在具体的这一个上，成立吗？"},{"id":"repetition","zh":"重复断言","en":"Proof by assertion","latin":"Argumentum ad nauseam","family":"relevance","emoji":"🔁","def":"把同一句话说得足够多，就当作它被证明了。","example":"我们的产品是安全的，安全的，真的是安全的。","tip":"说多少遍，都不是证据。问：除了重复，理由是什么？"}],"characters":[{"id":"me","name":"你","title":"大一新生","catchphrase":"且慢！","look":{"skin":"#f1c9a5","hair":"#2b2b33","hair_style":"short","shirt":"#e6ebf3","outfit":"hoodie"},"lines":{"open":["各位，且慢。","我有个问题。"],"caught":["这一步，说不通。"],"wrong_call":["……好像是我错了。"],"win":["破绽，一个不留。"],"lose":["我回去再翻翻破绽簿。"]}},{"id":"er_jiu","name":"二舅","title":"资深长辈","catchphrase":"我吃过的盐比你吃过的米还多","look":{"skin":"#e3a77e","hair":"#3a3a3a","hair_style":"bald","shirt":"#8e2a2a","mustache":true,"blush":true},"lines":{"open":["来来来，小辈们，听二舅给你们说道说道。","喝了这杯酒，咱们好好聊聊。"],"caught":["哎哟，这也被你听出来了？","你这孩子，抓得还挺准。"],"wrong_call":["小孩子不懂别乱说！","这话哪里有问题了？"],"win":["年轻人，还得多练练。","二舅赢了，干杯！"],"lose":["行行行，你们有文化，你们说了算。","唉，后生可畏。"]}},{"id":"biao_ge","name":"表哥","title":"短视频重度用户","catchphrase":"我在视频里看到一个专家说……","look":{"skin":"#f0c09b","hair":"#22252e","hair_style":"spiky","shirt":"#3b5a7a","glasses":true},"lines":{"open":["我跟你们说，我最近刷到一个很有意思的观点。","这个问题我研究过。"],"caught":["呃……你这一说，好像是有点道理。","等等，让我再想想。"],"wrong_call":["你搜一下就知道了。","这不是很明显吗？"],"win":["看吧，我早说了。","信息差，懂吗？"],"lose":["我回头再查查资料……","这个……当我没说。"]}},{"id":"san_yi","name":"三姨","title":"亲戚群转发大户","catchphrase":"我都是为你好","look":{"skin":"#f2c6a3","hair":"#4a2c2a","hair_style":"curly","shirt":"#a0527a","earrings":true,"blush":true},"lines":{"open":["哎呀，三姨就是心疼你们。","你们年轻人啊，就是不听劝。"],"caught":["三姨就是随口一说嘛……","我这不是关心你吗！"],"wrong_call":["你这孩子怎 ements":[{"id":"hl_a01","side":"A","angle":"风险","opener":true,"text":"生姜红糖水这类食疗方，成本低、风险小，感冒时喝一杯暖暖身子，试试无妨。","fallacy":null,"explain":"主张很有限（“试试无妨”），理由是低成本、低风险，没有夸大疗效。没有明显谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a02","side":"A","angle":"亲身","text":"我膝盖疼了好多年，喝了亲戚推荐的药酒，一个月就好了，你说灵不灵？","fallacy":"anecdotal","explain":"用个人经历代替证据。可能是自己好转，也可能是别的原因，需要对照才能判断。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a03","side":"A","angle":"安全","text":"这些偏方都是纯天然的草药，不像西药有那么多化学成分，吃了肯定没副作用。","fallacy":"appeal_to_nature","explain":"“天然”不等于“安全”。毒蘑菇、马兜铃酸也都来自天然植物。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a04","side":"A","angle":"传统","text":"老祖宗传了几千年的方子，肯定有道理，比现在的新药靠谱。","fallacy":"appeal_to_tradition","explain":"历史悠久只说明它存在得久，不说明它有效。流传下来的方子里，有效和无效的都有。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a05","side":"A","angle":"证据","subtlety":2,"text":"你说这偏方没用，可你能证明它一点用都没有吗？证明不了，就说明可能有用。","fallacy":"appeal_to_ignorance","accept":["burden_of_proof"],"explain":"没有证据证明无效，不等于有效。谁主张有效，谁应该举证。","opener":false,"decoys":[],"quip":"","punch":null},{"id":"hl_a06","side":"A","angle":"权威","text":"这篇文章是一位教授写的，人家是教授，还能有假？","fallacy":"appeal_to_authority","explain":"只看头衔。教授的专业是否相关？文章有没有数据和出处？这些才是关键。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a07","side":"A","angle":"传播","text":"家族群里几百个人都转发了，这么多人信，总不会是假的吧。","fallacy":"appeal_to_popularity","explain":"转发的人多，只说明传播得广，不说明内容真实。谣言也可以被大量转发。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a08","side":"A","angle":"风险","text":"医院治不好的病，不试试偏方还能怎么办？难道等死吗？","fallacy":"false_dilemma","explain":"把选择说成只有“偏方”或者“等死”。还有姑息治疗、临床试验、换医院咨询等其他选项。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a09","side":"A","angle":"证据","subtlety":2,"text":"偏方没效果，那是你没找到正宗的，正宗的方子肯定有效。","fallacy":"no_true_scotsman","explain":"遇到反例就把定义改成“正宗的才算”，这样的说法永远不会被证明错。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a10","side":"A","angle":"风险","text":"如果病情不重、偏方本身无害，作为辅助来尝试，同时不耽误正规治疗，风险是可控的。","fallacy":null,"explain":"提出了明确的前提条件（病情不重、无害、不耽误治疗），是有限定的合理主张。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a11","side":"A","angle":"生活","text":"很多家庭的养生习惯其实是生活经验，比如吃得清淡、早睡早起，就算没有药效，也有实际的好处。","fallacy":null,"explain":"把话题限定在生活习惯上，并且承认“没有药效”，不夸大也不回避。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a12","side":"A","angle":"亲情","text":"有些人用偏方图的是心理安慰，只要不耽误治疗，尊重长辈的选择也是一种体谅。","fallacy":null,"explain":"承认了偏方的局限，同时提出了一个尊重他人的立场。有前提，没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a13","side":"A","angle":"证据","subtlety":2,"text":"我上网搜了，有三篇文章说姜黄能抗癌，其余说没用的，肯定是药企在抹黑。","fallacy":"cherry_picking","explain":"只采纳对自己有利的文章，把相反的证据直接排除。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a14","side":"A","angle":"亲情","text":"你说偏方没用，你行你上啊！你把我爸的病治好给我看看！","fallacy":"appeal_to_accomplishment","explain":"批评一件事不需要先亲自做到。偏方有没有用，与批评者会不会治病无关。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a15","side":"A","angle":"证据","text":"什么随机对照试验，我一句也听不懂，肯定是唬人的。","fallacy":"personal_incredulity","explain":"自己听不懂，不代表它不成立。可以先弄懂它在说什么。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b01","side":"B","angle":"证据","opener":true,"text":"判断偏方有没有用，需要有对照的试验证据。个别人说有效，说明不了问题。","fallacy":null,"explain":"说明了判断有效性需要什么证据，理由与结论直接相关。没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b02","side":"B","angle":"风险","text":"有些偏方本身有毒性，或者和正在吃的药冲突。一旦延误治疗，代价谁也承担不起。","fallacy":null,"explain":"指出了具体的风险，没有把所有偏方一概而论。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b03","side":"B","angle":"传播","text":"会转这种文章的，都是没文化又爱瞎转的老年人，他们说的话不用听。","fallacy":"ad_hominem","explain":"攻击转发的人，没有回应内容是否成立。文章对不对，要看它本身。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b04","side":"B","angle":"权威","text":"网上那个医学博主说了，所有偏方都是骗人的，他说了算。","fallacy":"appeal_to_authority","explain":"把一个博主的话当成结论。“所有”这样的说法同样需要证据，而不是看谁说的。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b05","side":"B","angle":"传统","text":"相信偏方就像相信算命，都是迷信，一个道理。","fallacy":"false_analogy","explain":"偏方里有的成分可以被检验，有的甚至确有药理作用；算命则不能检验。两者的关键区别被抹掉了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b06","side":"B","angle":"证据","text":"我看到过三条偏方害人的新闻，可见所有偏方都是骗局。","fallacy":"hasty_generalization","explain":"用三条新闻推出“所有偏方”，样本太少，也不够公平。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b07","side":"B","angle":"风险","text":"今天信一个偏方，明天就停掉降压药，后天就有生命危险。","fallacy":"slippery_slope","explain":"把“信偏方”直接接到“停药”和“生命危险”，中间的每一步都没有证明。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b08","side":"B","angle":"亲情","text":"病人吃偏方耽误了治疗，家人得多后悔啊！你一点都不心疼吗？","fallacy":"appeal_to_emotion","explain":"用后悔和心疼代替理由。风险要用证据说明，而不是靠情绪施压。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b09","side":"B","angle":"安全","text":"你们就是觉得现代医学一无是处，什么病都要靠草根树皮吧？","fallacy":"straw_man","explain":"对方只是说偏方值得一试，并没有说现代医学一无是处。这是歪曲了对方的观点。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b10","side":"B","angle":"安全","text":"“纯天然”不等于安全，毒蘑菇也是纯天然的，关键要看成分和剂量有没有研究。","fallacy":null,"explain":"用一个具体的反例回应了“天然就安全”的说法，并指出了判断标准。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b11","side":"B","angle":"生活","text":"不必全盘否定：可以把偏方当作日常小习惯，但遇到真正的疾病，必须以正规医疗为准。","fallacy":null,"explain":"给出了清晰的边界，不是“折中”，而是有理由的主张。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b12","side":"B","angle":"亲情","text":"转偏方的人先别急着说话，你上次借我的钱什么时候还？","fallacy":"red_herring","explain":"借钱的事与偏方是否可信无关，是在岔开话题。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b13","side":"B","angle":"证据","subtlety":2,"text":"偏方没有科学依据，所以不能信。为什么说没有科学依据？因为它只是偏方。","fallacy":"circular","explain":"用“偏方”解释“没有依据”，又用“没有依据”推出“偏方不可信”，结论就藏在前提里。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_a16","side":"A","angle":"亲身","subtlety":2,"text":"我这药酒都喝了大半年了，现在说不信，之前不就白喝了吗？","fallacy":"sunk_cost","explain":"已经花掉的时间和钱收不回来，不能用来证明它有效。要看的是证据，而不是投入。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"hl_b14","side":"B","angle":"传播","text":"这篇文章是在亲戚群里看到的，所以肯定是假的。","fallacy":"genetic","explain":"仅凭来源就判定真假。群里转发的内容可能对，也可能错，要看它给出的证据。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null}],"chapter":"family"},{"id":"job","title":"毕业后，该不该优先考公、进体制？","scene":"刚毕业的表弟说想出去闯一闯，老爸放下了筷子。","tags":["职业","人生选择"],"sides":{"A":"优先考公","B":"先出去闯"},"opponents":{"A":"lao_ba","B":"biao_ge"},"statements":[{"id":"job_a01","side":"A","angle":"风险","opener":true,"text":"体制内的收入和福利相对稳定，对要还房贷、刚成家的年轻人来说，风险更低。","fallacy":null,"explain":"理由具体，与结论相关。“更稳定”是可以讨论的判断，但这条论证本身没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a02","side":"A","angle":"传统","text":"我们家几代人都是端铁饭碗的，一直这样，你也该走这条路。","fallacy":"appeal_to_tradition","explain":"以“一直如此”当作理由。家里人这么走，不能证明这条路适合你。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a03","side":"A","angle":"风险","text":"全国那么多人挤破头考公，报名人数一年比一年多，这还能有错？","fallacy":"appeal_to_popularity","explain":"报名的人多，不代表适合每个人。热门不等于正确。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a04","side":"A","angle":"创业","text":"我认识的两个创业的亲戚都赔了钱，创业根本没有不赔的。","fallacy":"hasty_generalization","explain":"用两个例子推出“创业没有不赔的”，样本太少，也没有说明他们为什么失败。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a05","side":"A","angle":"人生","text":"要么进体制过安稳日子，要么四处漂泊一辈子受苦，你自己选。","fallacy":"false_dilemma","explain":"把选择说成只有两条路，忽略了先就业再转型、进企业等其他可能。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a06","side":"A","angle":"亲情","text":"你妈为你操了多少年心，你就不能考个公务员让她放心吗？","fallacy":"appeal_to_emotion","explain":"用愧疚代替理由。让家人放心是一种考虑，但这不能证明考公对你是最好的选择。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a07","side":"A","angle":"亲情","text":"你就是好高骛远、不切实际，这样的人说的话能听吗？","fallacy":"ad_hominem","explain":"攻击说话的人，没有回应他的想法是否有道理。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a08","side":"A","angle":"风险","text":"体制内岗位的晋升规则相对明确，对不擅长人际周旋的人比较友好。","fallacy":null,"explain":"给出了具体的理由，可以被反驳，但没有明显的逻辑谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a09","side":"A","angle":"创业","text":"先进入稳定的单位，积累经验和积蓄，再考虑转行或创业，比一毕业就闯风险小。","fallacy":null,"explain":"提出了分阶段的做法，并且承认创业的可能。论证合理。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a10","side":"A","angle":"权威","text":"我吃过的盐比你吃过的米还多，我说体制内好，就是好。","fallacy":"appeal_to_authority","explain":"用资历和年龄代替理由。经验丰富值得听，但结论仍然要看论据。","quip":"经验可以参考，理由呢？","opener":false,"subtlety":1,"accept":[],"decoys":[],"punch":null},{"id":"job_a11","side":"A","angle":"亲情","text":"现在聊这个干什么，你先说说什么时候结婚吧！","fallacy":"red_herring","explain":"结婚与职业选择是两件事，用它把话题岔开了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a12","side":"A","angle":"人生","text":"在体制内同样能做出成绩，有些岗位能直接参与公共事务，这种价值感不一定比创业差。","fallacy":null,"explain":"回应了“体制内没有价值”这种看法，给出了具体的理由。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a13","side":"A","angle":"学业","subtlety":2,"text":"你读了十几年书，不考公不就白读了吗？前面的投入都浪费了。","fallacy":"sunk_cost","explain":"已经花掉的时间无法收回，不应该决定将来怎么选。该看的是，从现在起哪条路更适合你。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b01","side":"B","angle":"人生","opener":true,"text":"职业选择应该结合兴趣和能力，勉强进入不适合自己的岗位，长期来看满意度和表现都会打折扣。","fallacy":null,"explain":"论证有理由支撑，没有夸大成“考公一定不好”。没有明显谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b02","side":"B","angle":"创业","text":"看看那些大公司的创始人，哪个不是自己闯出来的？自己闯就能成功。","fallacy":"survivorship","explain":"只看到了成功的人，没有看到更多闯了但没成功的。成功案例不等于成功率。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b03","side":"B","angle":"亲情","text":"你们让我考公，无非是想让我一辈子混日子、什么都不用做，对吧？","fallacy":"straw_man","explain":"对方强调的是稳定，并没有说要“混日子”。这是把对方的意思扭曲后再反驳。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b04","side":"B","angle":"权威","text":"某位著名企业家说了，体制内没有前途，年轻人就该出来拼。他说的还能有错？","fallacy":"appeal_to_authority","explain":"成功的企业家不等于对所有人的职业选择都有发言权，也没有给出具体依据。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b05","side":"B","angle":"风险","text":"我认识的几个公务员天天加班还看不到前途，进体制就是浪费青春。","fallacy":"hasty_generalization","explain":"用身边几个人的经历推出“进体制都是浪费青春”，样本太少。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b06","side":"B","angle":"人生","text":"他一进体制就变得死气沉沉，可见体制会让人变平庸。","fallacy":"false_cause","explain":"先后发生不等于因果。他可能本来就是这个性格，也可能是别的原因。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b07","side":"B","angle":"创业","text":"在没有家庭负担的时候，尝试的代价较低，早点试错能更快知道自己适合什么。","fallacy":null,"explain":"给出了条件（没有家庭负担）和理由，是有限定的主张，不是绝对化的结论。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b08","side":"B","angle":"风险","text":"岗位有限而报考的人很多，如果只押注考公，落榜后可能耽误两三年，需要有备选方案。","fallacy":null,"explain":"指出了考公自己的风险，并提出了应对办法，切中要害。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b09","side":"B","angle":"亲情","text":"你年轻的时候不也没听家里的安排？现在凭什么要我听？","fallacy":"tu_quoque","explain":"用对方过去的行为来回避问题。你当年听不听，不影响“考公是否适合我”这个问题。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b10","side":"B","angle":"人生","text":"要么追逐梦想，要么庸庸碌碌一辈子，你选哪个？","fallacy":"false_dilemma","explain":"把人生说成只有两种：追梦或平庸，忽略了在稳定的工作里同样能有意义。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b11","side":"B","angle":"创业","text":"现在的年轻人都在选自由职业，大家都这么选，这肯定是趋势，也肯定是对的。","fallacy":"appeal_to_popularity","explain":"趋势不等于正确。很多人这么选，也不能证明对你合适。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b12","side":"B","angle":"人生","text":"如果只图稳定却觉得工作没有意义，长期的心理消耗也是一种成本，应该算进决策里。","fallacy":null,"explain":"提出了一个被忽略的成本，并没有把稳定完全否定。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b13","side":"B","angle":"人生","subtlety":2,"text":"今天为了稳定放弃梦想，明天为了房贷放弃自由，最后你就成了自己最讨厌的人。","fallacy":"slippery_slope","explain":"把一连串后果说成必然，却没有证明每一步都会发生。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a14","side":"A","angle":"经历","text":"你连一份正经工作都没干过，凭什么评价体制内好不好？","fallacy":"appeal_to_accomplishment","explain":"评价体制内有没有道理，不取决于评价者有没有工作过。要看他给的理由是否成立。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_a15","side":"A","angle":"人生","subtlety":3,"text":"我们单位没人想辞职去创业；就算有，那也不是真正适合体制的人。","fallacy":"no_true_scotsman","explain":"遇到反例，就把定义改成“真正适合的人不会这样”，让自己的说法永远不会错。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"job_b14","side":"B","angle":"人生","subtlety":2,"text":"你们一个说必须考公，一个说必须创业，折中一下，两样同时做，这样一定最好。","fallacy":"middle_ground","explain":"折中不等于正确。两样同时做，可能两头都耽误，需要看理由。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null}],"chapter":"family"},{"id":"phone","title":"该不该给孩子买手机？","scene":"八岁的侄子盯着桌上的手机不肯放，大人们为这件事吵了起来。","tags":["家庭","教育"],"sides":{"A":"应该买","B":"不该买"},"opponents":{"A":"biao_ge","B":"er_jiu"},"statements":[{"id":"ph_a01","side":"A","angle":"安全","opener":true,"text":"孩子有手机，家长随时联系得上，放学路上和外出的安全都多一层保障。","fallacy":null,"explain":"理由具体，也和结论直接相关：手机确实能提升联络和安全。可以继续讨论利弊，但这条论证本身没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_a02","side":"A","angle":"学习","text":"教育博主说了，孩子越早接触手机越聪明。人家是专家，听专家的准没错。","fallacy":"appeal_to_authority","explain":"只搬出“专家”的头衔，没有给出证据。头衔不能代替论据。","quip":"哪个领域的专家？研究在哪里？","opener":false,"subtlety":1,"accept":[],"decoys":[],"punch":null},{"id":"ph_a03","side":"A","angle":"社交","text":"班上同学都有手机，就你家孩子没有，当然应该买。","fallacy":"appeal_to_popularity","explain":"别人都有，不等于应该有。多数人的做法，不能证明它对孩子好。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_a04","side":"A","angle":"学习","subtlety":2,"text":"邻居家孩子有了手机以后，成绩进了前十，可见手机能提高成绩。","fallacy":"false_cause","accept":["anecdotal"],"explain":"成绩提升可能因为更努力、换了老师。先后发生，不代表有因果关系。","opener":false,"decoys":[],"quip":"","punch":null},{"id":"ph_a05","side":"A","angle":"未来","text":"不给孩子手机，他将来就会被时代淘汰。要么现在买，要么以后后悔。","fallacy":"false_dilemma","accept":["slippery_slope"],"explain":"把选择说成只有两个：现在买，或者被淘汰。忽略了逐步引入、用别的方式学习数字技能等可能。","opener":false,"subtlety":1,"decoys":[],"quip":"","punch":null},{"id":"ph_a06","side":"A","angle":"自控","subtlety":2,"text":"你们不让买手机，是想把孩子关起来与世隔绝，一点自由都不给吗？","fallacy":"straw_man","decoys":["false_dilemma","appeal_to_emotion"],"explain":"对方只是反对买手机，并没有说要隔绝孩子。这是把对方的观点夸大歪曲，再去攻击它。","opener":false,"accept":[],"quip":"","punch":null},{"id":"ph_a07","side":"A","angle":"自控","text":"给孩子一部有家长模式的手机，约好每天用多久，比一刀切禁止更能培养自我管理。","fallacy":null,"explain":"提出了具体做法和理由。“更能培养”是可以讨论的判断，但这是有依据的论证，不是谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_a08","side":"A","angle":"学习","text":"作业通知和学习软件大多在线上，没有手机，孩子容易错过信息。","fallacy":null,"explain":"这是与结论相关的现实理由。它可以被反驳（比如家长的手机也能代替），但论证本身合理。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_a09","side":"A","angle":"自控","text":"你自己天天刷手机到半夜，凭什么不让孩子用？","fallacy":"tu_quoque","explain":"用对方自己的行为来否定对方的观点。你刷不刷手机，与“孩子该不该有手机”是两回事。","quip":"我做不到，不代表这话不对。","opener":false,"subtlety":1,"accept":[],"decoys":[],"punch":null},{"id":"ph_a10","side":"A","angle":"亲情","text":"孩子哭着说想要手机，你忍心吗？当爹妈的心怎么这么硬！","fallacy":"appeal_to_emotion","explain":"用愧疚和心疼代替理由。孩子想要，不等于应该给。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_a11","side":"A","angle":"亲情","subtlety":2,"text":"你是不是根本不爱这个孩子，才连一部手机都舍不得买？","fallacy":"loaded_question","explain":"问题里预设了“不买手机就是不爱孩子”。无论怎么回答，都等于默认了这个前提。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_a12","side":"A","angle":"未来","text":"与其禁止，不如教孩子辨别网上的信息，这个能力他早晚要学。","fallacy":null,"explain":"提出了替代方案和理由，没有夸大也没有回避对方的顾虑。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_b01","side":"B","angle":"健康","opener":true,"text":"长时间看屏幕和近视、睡眠不足有关，所以要限制孩子用屏幕的时间。","fallacy":null,"explain":"结论是“限制时间”，理由也与之相关，没有夸大成“绝对不能碰”。这条论证本身没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_b02","side":"B","angle":"学习","text":"今天给了手机，明天就沉迷游戏，后天荒废学业，一辈子都毁了。","fallacy":"slippery_slope","explain":"每一步都被说成必然，却没有证明。给手机不等于沉迷，沉迷也不等于毁掉一生。","quip":"哪一步是必然的？","opener":false,"subtlety":1,"accept":[],"decoys":[],"punch":null},{"id":"ph_b03","side":"B","angle":"传统","text":"我们小时候没有手机，不也好好长大了？孩子不需要。","fallacy":"appeal_to_tradition","explain":"“过去没有也行”不能证明“现在不需要”。环境变了，需求也可能变了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_b04","side":"B","angle":"学习","text":"我认识的三个孩子有了手机成绩都下滑，可见手机对学习就是有害的。","fallacy":"hasty_generalization","accept":["anecdotal"],"explain":"用三个例子推出“手机一定有害”，样本太少，也没考虑别的原因。","opener":false,"subtlety":1,"decoys":[],"quip":"","punch":null},{"id":"ph_b05","side":"B","angle":"权威","text":"校长在家长会上说，手机对孩子只有坏处没有好处。校长都这么说了，还有什么好争的？","fallacy":"appeal_to_authority","explain":"只借用校长的身份，没有给证据。“只有坏处”本身也需要证明。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_b06","side":"B","angle":"亲情","text":"你又没带过孩子，懂什么手机不手机的！","fallacy":"ad_hominem","explain":"攻击的是人的经历，而不是观点。带没带过孩子，不能决定论点对不对。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_b07","side":"B","angle":"自控","text":"孩子的自控力还在发育，很多应用又刻意设计得让人停不下来，低龄孩子独立管理手机并不合适。","fallacy":null,"explain":"理由具体，也承认了问题出在“低龄独立使用”而不是手机本身。没有明显谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_b08","side":"B","angle":"安全","text":"如果只是为了联系，只能打电话的儿童手表就够了，不必买智能手机。","fallacy":null,"explain":"针对对方的理由（联系和安全）提出了替代方案，切中要点。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_b09","side":"B","angle":"金钱","text":"现在讨论手机干什么？你先说说房贷还有多少没还完吧。","fallacy":"red_herring","explain":"房贷与孩子该不该有手机无关，是把话题岔开了。","quip":"这是另一个问题，先说手机。","opener":false,"subtlety":1,"accept":[],"decoys":[],"punch":null},{"id":"ph_b10","side":"B","angle":"健康","text":"孩子就该在大自然里跑跑跳跳，那才是天然的成长方式，手机都是人造的坏东西。","fallacy":"appeal_to_nature","explain":"把“天然”当成好、“人造”当成坏。户外活动确实有益，但这不能推出手机有害。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_b11","side":"B","angle":"学习","subtlety":2,"text":"手机让孩子变笨，看他越来越不爱思考就知道了。孩子不爱思考，当然是手机害的。","fallacy":"circular","explain":"用“手机让人变笨”解释“不爱思考”，又拿“不爱思考”证明“手机让人变笨”，在原地打转。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_b12","side":"B","angle":"未来","text":"建议等孩子上了初中，再根据自控情况逐步放开，先从限定时间开始。","fallacy":null,"explain":"提出了明确的时间点和渐进的做法，没有夸大，也没有回避对方的顾虑。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_a13","side":"A","angle":"金钱","subtlety":2,"text":"手机已经买回来了，现在再不让孩子用，那钱不就白花了吗？","fallacy":"sunk_cost","explain":"已经花掉的钱收不回来，不该决定孩子该不该用。要看的是：从现在起，这样做对孩子好不好。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ph_b13","side":"B","angle":"学习","text":"我表弟被没收手机以后，成绩一下子就上去了，可见管住手机就管住了成绩。","fallacy":"anecdotal","accept":["false_cause"],"explain":"用一个人的经历代替证据。成绩上升也可能有别的原因，需要更多的对照。","opener":false,"subtlety":1,"decoys":[],"quip":"","punch":null},{"id":"ph_b14","side":"B","angle":"自控","subtlety":2,"text":"你说有家长模式，我就要你证明孩子破解不了；证明了，我又要你证明他不会换设备。","fallacy":"moving_goalposts","explain":"对方每满足一个条件，就提出新的条件。这样的标准永远无法达到。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null}],"chapter":"family"},{"id":"lie","title":"善意的谎言，可以接受吗？","scene":"决赛的辩题抽出来了：如果谎言是为了对方好，它还算错吗？","tags":["伦理","沟通"],"sides":{"A":"可以接受","B":"不可以接受"},"opponents":{"A":"xiaozhou","B":"jiaoshou"},"statements":[{"id":"lie_a01","side":"A","angle":"动机","opener":true,"text":"如果真话只会造成无谓的伤害，而谎言能让对方免于痛苦、又不损害他的重要利益，它可能是更善良的选择。","fallacy":null,"explain":"提出了条件（无谓伤害、不损害重要利益），并没有说所有谎言都可以。没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a02","side":"A","angle":"舆论","text":"每个人都说过善意的谎言，大家都这样，怎么可能是错的？","fallacy":"appeal_to_popularity","explain":"很多人都做，不等于它是对的。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a03","side":"A","angle":"情感","text":"你忍心对一个病重的老人，说出那么残酷的真相吗？","fallacy":"appeal_to_emotion","explain":"用不忍心代替理由。是否隐瞒，还要看对老人自己的权利和选择。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a04","side":"A","angle":"动机","text":"你自己也骗过你妈说成绩还不错，凭什么说谎言不可接受？","fallacy":"tu_quoque","explain":"用对方自己的行为否定对方的观点。他做过，不代表这件事就是对的或错的。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a05","side":"A","angle":"选择","text":"要么说一句让人开心的谎，要么说一句伤人的真话，没有别的说法。","fallacy":"false_dilemma","explain":"把选择说成两种，忽略了沉默、委婉、先问对方想不想听等办法。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a06","side":"A","angle":"经历","text":"我小时候被善意的谎言保护过，长大也没出事，所以善意的谎言没有坏处。","fallacy":"anecdotal","explain":"用一个人的经历代替证据。没出事，不代表别人也没出事。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a07","side":"A","angle":"动机","text":"你们反对谎言，就是要大家无论何时，都把刀子一样的真话捅向别人！","fallacy":"straw_man","explain":"反对说谎，并不等于主张说伤人的话。这是把对方的观点夸大歪曲了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a08","side":"A","angle":"后果","text":"判断善意的谎言，要看动机和后果，比如是否真是为了对方、是否会形成依赖，不能一概而论。","fallacy":null,"explain":"提出了判断的标准，没有一概而论。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a09","side":"A","angle":"传统","text":"中国人自古讲究和为贵、给人留面子，这个传统说明善意的谎言是对的。","fallacy":"appeal_to_tradition","explain":"传统能说明某种习惯长期存在，不能证明它在道德上正确。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a10","side":"A","angle":"情境","text":"有时说出真相会伤害无辜的第三方，比如危急时隐瞒受害者的藏身处，这时说谎的正当性更强。","fallacy":null,"explain":"用一个典型情境限定了适用范围。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a11","side":"A","angle":"权威","text":"心理学家说了，适度的善意谎言有助于维持关系，所以它是对的。","fallacy":"appeal_to_authority","explain":"没有说明哪个研究。即使有研究，“有助于关系”也不等于“在道德上正确”。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a12","side":"A","angle":"概念","text":"善意的谎言和恶意的欺骗不同：前者以对方的利益为目的，后者以自己的利益为目的，这个区分有意义。","fallacy":null,"explain":"提出了一个有意义的区分，并说明了区分的依据。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a13","side":"A","angle":"证据","subtlety":2,"text":"我举了三个善意谎言帮助别人的例子，那些造成伤害的例子都是特例，不算数。","fallacy":"cherry_picking","explain":"只采纳对自己有利的例子，把相反的例子直接排除。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a14","side":"A","angle":"区分","subtlety":2,"text":"你们一边说绝对不能撒谎，一边说想撒就撒，那折中一下，偶尔撒谎就是对的。","fallacy":"middle_ground","explain":"折中不等于正确。“偶尔”的界线在哪里，需要理由，而不只是它位于两者之间。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b01","side":"B","angle":"自主","opener":true,"text":"谎言剥夺了对方基于真实信息做决定的机会，即使动机善意，也是对他自主权的不尊重。","fallacy":null,"explain":"从自主权出发，理由与结论直接相关。没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b02","side":"B","angle":"后果","text":"今天说一个善意的谎，明天就会说更大的谎，最后整个人际信任都会崩塌。","fallacy":"slippery_slope","explain":"从一个小谎直接推到信任崩塌，中间的步骤没有证明。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b03","side":"B","angle":"因果","text":"他被善意的谎言瞒着以后，没多久病情加重了，可见谎言害了他。","fallacy":"false_cause","explain":"先后发生不等于因果。病情加重可能是疾病本身的发展。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b04","side":"B","angle":"权威","text":"某位哲学大师说过，说谎在任何情况下都是错的，所以善意的谎言也不行。","fallacy":"appeal_to_authority","explain":"借用大师的名字，没有给出理由。哲学家之间对此也有分歧。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b05","side":"B","angle":"动机","subtlety":2,"text":"“为你好”这套说法，当年骗子们也用过，所以善意谎言的理由不可信。","fallacy":"guilt_by_association","explain":"因为说法与骗子有关联就否定它。观点要靠自己的理由来评判。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b06","side":"B","angle":"证据","subtlety":2,"text":"历史上那些诚实的人都受到了尊敬，可见诚实一定有好结果。","fallacy":"survivorship","explain":"只看到了被记住的诚实者，没有看到更多诚实却没得到回报的人。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b07","side":"B","angle":"信任","text":"谎言一旦被发现，代价不只是那一句，对方会怀疑你说过的其他话，信任很难修复。","fallacy":null,"explain":"说明了谎言被发现后的具体代价。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b08","side":"B","angle":"选择","text":"要么永远诚实，要么就成了满口谎话的人，没有中间地带。","fallacy":"false_dilemma","explain":"把选择说成两个极端，忽略了“在特定情形下有所取舍”的立场。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b09","side":"B","angle":"替代","text":"可以不说，但不必说谎：选择沉默、委婉表达，或者先问对方想不想知道，往往比编造更可行。","fallacy":null,"explain":"提出了替代做法，回应了“只能说谎”的想法。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b10","side":"B","angle":"证据","subtlety":2,"text":"你举出一个无害的谎言，我就要你再举十个；举出十个，我又要求它们全都经得起追问。","fallacy":"moving_goalposts","explain":"对方满足一个条件，就提高要求，这样的标准永远无法达到。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b11","side":"B","angle":"情感","text":"被最亲近的人欺骗的痛苦，你体会过吗？你怎么还能说谎可以接受？","fallacy":"appeal_to_emotion","explain":"用个人痛苦代替理由。有人被欺骗痛苦，也有人被真相伤害。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b12","side":"B","angle":"动机","text":"你们的意思是，为了让人开心，什么谎都可以随便说，对吗？","fallacy":"straw_man","explain":"对方主张的是“善意的、有条件的谎言”，并不是“什么谎都可以”。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b13","side":"B","angle":"证据","subtlety":2,"text":"人类的大脑天生就能识别谎言，所以善意的谎言一定会被识破，说了也没有意义。","fallacy":"false_premise","explain":"这个前提本身不成立：人识别谎言的准确率并不高。起点错了，结论也站不住。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a15","side":"A","angle":"情境","subtlety":2,"text":"我想不通不说谎怎么维持关系，所以在人际交往里，谎言一定是必要的。","fallacy":"personal_incredulity","explain":"自己想象不出别的办法，不代表没有别的办法。沉默、委婉、先问对方想不想听，都是选择。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_b14","side":"B","angle":"自主","subtlety":3,"text":"既然你也承认说谎会伤害信任，那你打算怎么向被你骗过的人道歉？","fallacy":"loaded_question","explain":"问题里藏着两个预设：你承认了说谎伤害信任，你也骗过人。无论怎么回答，都等于默认了。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"lie_a16","side":"A","angle":"证据","subtlety":2,"text":"我说善意的谎言没有坏处，不信？你拿出一个有坏处的例子来证明。","fallacy":"burden_of_proof","accept":["appeal_to_ignorance"],"explain":"提出主张的人应该举证。自己不给依据，却要求别人证明相反，把责任倒了过来。","opener":false,"decoys":[],"quip":"","punch":null}],"chapter":"logic_club"},{"id":"trolley","title":"电车难题：该不该拉动拉杆，牺牲一人救五人？","scene":"辩论赛的抽签结果出来了，这一场的辩题是伦理学里最著名的难题。","tags":["伦理","经典"],"sides":{"A":"应该拉杆","B":"不该拉杆"},"opponents":{"A":"xiaochen","B":"xiaolin"},"statements":[{"id":"tr_a01","side":"A","angle":"数量","opener":true,"text":"五条生命比一条生命更多，在其他条件相同时，挽救更多的生命是更好的选择。","fallacy":null,"explain":"提出了明确的原则和条件（其他条件相同）。这是功利主义的核心论证，没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a02","side":"A","angle":"情感","text":"想想那五个人家里的孩子，你怎么忍心眼睁睁看着他们被撞死？","fallacy":"appeal_to_emotion","explain":"用怜悯代替理由。被牺牲的那个人也有家人，情感不能决定对错。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a03","side":"A","angle":"舆论","text":"调查显示大多数人都会选择拉杆，这么多人这样选，肯定是对的。","fallacy":"appeal_to_popularity","explain":"多数人的选择，不等于道德上正确的选择。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a04","side":"A","angle":"选择","text":"要么拉杆，要么就是见死不救，没有第三种选择。","fallacy":"false_dilemma","explain":"把选择说成只有两种，忽略了大声警告、尝试让车停下等其他可能。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a05","side":"A","angle":"权威","text":"某位著名哲学家说了，功利主义才是正确的，所以应该拉杆。","fallacy":"appeal_to_authority","explain":"借用名气，没有说明理由。哲学家之间对这个问题本来就有分歧。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a06","side":"A","angle":"动机","text":"你们反对拉杆，就是觉得五个人的命一文不值，对吗？","fallacy":"straw_man","explain":"反对拉杆，并不等于认为五个人的命不值钱。这是把对方的观点扭曲了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a07","side":"A","angle":"责任","text":"不作为也是一种选择，明知可以救人却不救，也需要为结果负责，这一点不能回避。","fallacy":null,"explain":"指出了不作为也有责任，回应了对方的区分。可以继续讨论，但论证本身合理。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a08","side":"A","angle":"动机","text":"反对拉杆的，都是只想保住自己手上干净、不在乎别人死活的伪君子。","fallacy":"ad_hominem","explain":"攻击对方的人品，没有回应他的论据。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a09","side":"A","angle":"舆论","text":"我问过的五个朋友都选了拉杆，可见所有正常人都会拉。","fallacy":"hasty_generalization","explain":"五个朋友不能代表“所有人”。“正常人”的说法，还暗含了对不同意者的否定。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a10","side":"A","angle":"数量","text":"承认牺牲一个人令人痛苦，但两害相权取其轻，仍然是一个可以被说明的理由。","fallacy":null,"explain":"承认了代价，并给出了取舍的理由。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a11","side":"A","angle":"证据","subtlety":2,"text":"谁也不能证明拉杆是错的，所以拉杆就是对的。","fallacy":"appeal_to_ignorance","explain":"没有证明它错，不等于它对。主张“应该拉”的一方也要给出理由。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a12","side":"A","angle":"责任","text":"别光讨论拉不拉杆，你们先说说，铁路公司为什么不装安全系统！","fallacy":"red_herring","explain":"铁路安全是另一个话题，这是把讨论岔开了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a13","side":"A","angle":"类比","text":"现实中急救分诊也要在有限资源下取舍，说明“比较数量”并非完全不可接受。","fallacy":null,"explain":"用一个现实的例子，说明这种思路并非不可接受。没有夸大，论证合理。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a14","side":"A","angle":"来源","text":"“不能主动伤害”这套观念是宗教留下来的，所以不值得重视。","fallacy":"genetic","explain":"仅凭观念的来源就否定它。一个原则是否成立，要看它的理由。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b01","side":"B","angle":"责任","opener":true,"text":"主动导致一个无辜者死亡，和没能阻止死亡，在道德上并不相同，这个区别值得认真对待。","fallacy":null,"explain":"提出了“作为与不作为”的区别，这是伦理学里被认真讨论的论证。没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b02","side":"B","angle":"概念","subtlety":2,"text":"杀人是错的，拉杆会导致一个人死亡，所以拉杆就是杀人，当然是错的。","fallacy":"equivocation","explain":"把“导致死亡”悄悄换成了“杀人”。两者在意图和因果上是否相同，正是争论的焦点。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b03","side":"B","angle":"后果","text":"今天能为五个人牺牲一个人，明天就能为十个人牺牲两个，最后人命只是数字。","fallacy":"slippery_slope","explain":"从一次取舍直接推到“人命只是数字”，中间的步骤没有证明。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b04","side":"B","angle":"传统","text":"历来的道德教育都教我们不能主动伤害别人，这是传统，不能违背。","fallacy":"appeal_to_tradition","explain":"传统久远不代表在任何情形下都成立，仍需要给出理由。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b05","side":"B","angle":"原则","subtlety":2,"text":"拉杆不道德，因为我们有不得伤害无辜者的义务；为什么有这个义务？因为伤害无辜者是不道德的。","fallacy":"circular","explain":"用“不道德”解释“义务”，又用“义务”证明“不道德”，在原地打转。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b06","side":"B","angle":"动机","text":"支持拉杆的人，都是把人当数字的冷血功利主义者。","fallacy":"ad_hominem","explain":"给对方贴标签，没有回应他的论点。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b07","side":"B","angle":"原则","text":"人不应只被当作达成目的的工具。拉杆等于把那一个人当作拯救五人的手段，需要特别的理由。","fallacy":null,"explain":"提出了一个明确的道德原则，并说明它如何适用。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b08","side":"B","angle":"类比","text":"如果只按人数取舍成立，那医生杀一个健康人取器官救五个人也成立。多数人不接受，说明“只看人数”可能有问题。","fallacy":null,"explain":"这是一个归谬论证：把对方的原则推到另一个情形，检验它是否可接受。有理由，没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b09","side":"B","angle":"证据","subtlety":2,"text":"你证明了五条命更多，我就要你证明每条命价值相等；证明了这个，我还会要你证明别的。","fallacy":"moving_goalposts","explain":"每次对方满足了条件，就提出新的条件。这样的标准永远无法达到。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b10","side":"B","angle":"情感","text":"那个被牺牲的人也有家人，你让他们怎么接受亲人被你拉杆害死？","fallacy":"appeal_to_emotion","explain":"用愧疚和痛苦代替理由。两边都有家人，情感本身不能决定对错。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b11","side":"B","angle":"选择","text":"要么永远不能主动伤害任何人，要么就是道德沦丧。","fallacy":"false_dilemma","explain":"把选择说成两个极端，忽略了在极端情形下有限度地取舍的可能。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b12","side":"B","angle":"现实","text":"现实里我们往往无法确定结果，也不知道拉杆后是否只死一人，不确定性越大，越应谨慎行动。","fallacy":null,"explain":"指出了思想实验和现实的差别，并给出了谨慎的理由。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b13","side":"B","angle":"权威","text":"我的伦理学老师说了，不能拉杆。老师是专家，你得听。","fallacy":"appeal_to_authority","explain":"只搬出老师的身份。专家之间也有不同意见，要看他给出的理由。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_a15","side":"A","angle":"证据","subtlety":3,"text":"这次我只引用最新的那项调查，因为它的结果最清楚；之前几项不一致的，都过时了。","fallacy":"cherry_picking","explain":"只挑对自己有利的证据，把不利的直接说成“过时”。结果不一致，本身就是需要面对的信息。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"tr_b14","side":"B","angle":"情感","text":"我实在想不明白，怎么会有人忍心主动拉杆，所以拉杆不可能是对的。","fallacy":"personal_incredulity","explain":"自己想不通，不代表它不成立。需要的是论证，而不是“我无法想象”。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null}],"chapter":"logic_club"},{"id":"ai_art","title":"AI 生成的作品，该不该受版权保护？","scene":"主播当场用 AI 画出一幅画，粉丝立刻分成了两派。","tags":["科技","创作"],"sides":{"A":"应该保护","B":"不该保护"},"opponents":{"A":"chengxuyuan","B":"gangjing"},"statements":[{"id":"ai_a01","side":"A","angle":"劳动","opener":true,"text":"使用者为作品付出了构思、反复调整和筛选，这些智力投入应当得到某种保护。","fallacy":null,"explain":"从使用者的付出出发，理由与结论相关。没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a02","side":"A","angle":"概念","subtlety":2,"text":"AI 也在“创作”，创作出来的东西当然是作品，作品就该有版权。","fallacy":"equivocation","explain":"“创作”一词的含义悄悄变了：人类的创作，与模型生成内容，是不是同一回事，正是争论的焦点。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a03","side":"A","angle":"舆论","text":"现在几百万人都在用 AI 画图，这么多人用，当然应该保护。","fallacy":"appeal_to_popularity","explain":"用的人多，不等于应该受保护。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a04","side":"A","angle":"后果","text":"今天不保护 AI 作品，明天所有创作者都没动力，最后文化产业全完蛋。","fallacy":"slippery_slope","explain":"把一个政策判断夸大成连锁崩溃，每一步都没有证明。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a05","side":"A","angle":"权威","text":"某位科技大佬说了，AI 作品必须有版权。他是行业领袖，听他的准没错。","fallacy":"appeal_to_authority","explain":"行业地位不等于法律和伦理上的正确。应该看他给出了什么理由。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a06","side":"A","angle":"动机","text":"你们反对保护，就是想让所有用 AI 的人白忙一场、一分钱都赚不到吗？","fallacy":"straw_man","explain":"对方反对的是“版权保护”，并没有说使用者不能赚钱。这是把观点夸大后再反驳。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a07","side":"A","angle":"后果","text":"如果完全没有保护，商业使用者很难投入，创作者的积极性也会受影响，所以需要明确的规则。","fallacy":null,"explain":"说明了没有规则会带来什么后果，并提出需要规则。论证合理。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a08","side":"A","angle":"类比","subtlety":2,"text":"AI 画画就像相机拍照，相机刚出现时也被说不是艺术，现在谁还这么说？","fallacy":"false_analogy","explain":"相似点有，但关键差别被略过了：画面有多少是人控制的。类比需要说明关键之处为什么相同。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a09","side":"A","angle":"动机","text":"反对保护 AI 作品的，无非是怕被取代的画手在嫉妒。","fallacy":"ad_hominem","explain":"揣测对方的动机，代替了回应他的论据。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a10","side":"A","angle":"区分","text":"可以按人的参与程度来区分：只写一句话就生成的不保护，经过大量修改编辑的可以保护。","fallacy":null,"explain":"提出了可操作的区分标准，回应了对方的顾虑。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a11","side":"A","angle":"情感","text":"有个残障小伙靠 AI 画画才找回了自信，你忍心让他的作品没人保护吗？","fallacy":"appeal_to_emotion","explain":"用个别感人的故事代替论证。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a12","side":"A","angle":"后果","text":"要么保护 AI 作品，要么就是扼杀技术创新，没有第三条路。","fallacy":"false_dilemma","explain":"把选择说成两个极端，忽略了部分保护、登记制度等办法。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a13","side":"A","angle":"劳动","text":"版权的目的是激励创作和传播，只要人的选择与修改体现了个性，就值得讨论保护。","fallacy":null,"explain":"从版权的目的出发，并给了条件（体现个性）。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a14","side":"A","angle":"证据","subtlety":2,"text":"你说使用者没有独创性，那就请你拿证据证明他们没有付出智力劳动。","fallacy":"burden_of_proof","explain":"要主张“应当保护”的一方先说明独创性在哪里，而不是要求对方去证明“没有”。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_b01","side":"B","angle":"原则","opener":true,"text":"传统上版权保护的是人的独创表达，AI 生成内容缺少人类作者这一环，保护的依据并不明确。","fallacy":null,"explain":"指出了版权理论的前提，并只说“依据不明确”，没有夸大。没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_b02","side":"B","angle":"来源","text":"这张图是 AI 生成的，所以它没有任何艺术价值。","fallacy":"genetic","explain":"仅凭来源就判定价值。作品好不好，要看作品本身，而不只是它怎么来的。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_b03","side":"B","angle":"证据","text":"我看过的几幅 AI 画都有抄袭的痕迹，说明 AI 作品全都是抄来的。","fallacy":"hasty_generalization","explain":"用几幅画推出“全部”，样本太少。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_b04","side":"B","angle":"后果","text":"今天保护了 AI 作品，明天人人都批量生成，最后版权系统彻底失控。","fallacy":"slippery_slope","explain":"把“保护”与“失控”直接连起来，中间的环节没有证明。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_b05","side":"B","angle":"原则","text":"艺术是人类天生的情感表达，机器生成的东西不自然，不配被保护。","fallacy":"appeal_to_nature","explain":"把“天然”当成价值标准。是否值得保护，与是否“天然”无关。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_b06","side":"B","angle":"传统","text":"版权从来只保护人类作者，这是几百年的规矩，不能改。","fallacy":"appeal_to_tradition","explain":"规矩存在得久，不代表它不能随技术变化。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_b07","side":"B","angle":"证据","subtlety":2,"text":"没有人能证明 AI 作品有独创性，所以它就是没有独创性。","fallacy":"appeal_to_ignorance","explain":"没有证明，不等于不存在。“没证明出有”不能推出“肯定没有”。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_b08","side":"B","angle":"训练","text":"AI 模型用了大量他人的作品来训练，应先解决训练数据的授权问题，再谈保护输出。","fallacy":null,"explain":"指出了一个在先的问题，并说明处理次序。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_b09","side":"B","angle":"动机","text":"支持保护的人，是想让机器取代所有人类艺术家吧？","fallacy":"straw_man","explain":"对方只是主张保护使用者，并没有说要取代艺术家。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_b10","side":"B","angle":"区分","text":"版权之外还有别的办法，比如标注来源、行业自律，未必需要同等的版权保护。","fallacy":null,"explain":"提出了替代方案。可以再讨论它够不够，但论证本身合理。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_b11","side":"B","angle":"区分","subtlety":2,"text":"一边说全保护，一边说不保护，那就折中一下，保护五年，这样最公平。","fallacy":"middle_ground","explain":"折中不等于正确。“五年”是怎么来的？需要看理由，而不是只看它在两者之间。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_b12","side":"B","angle":"舆论","text":"大部分画师都反对保护 AI 作品，这么多人反对，肯定有道理。","fallacy":"appeal_to_popularity","explain":"反对的人多，不能证明反对是对的。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_b13","side":"B","angle":"劳动","text":"如果只写一句提示词就能生成作品，人的独创贡献很小，这时给予垄断性的权利并不合适。","fallacy":null,"explain":"限定了情形（贡献很小），并说明了理由。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a15","side":"A","angle":"证据","subtlety":2,"text":"靠 AI 作品走红的人都赚到了钱，可见这类作品值得受保护。","fallacy":"survivorship","explain":"只看到了走红的人，没看到更多无人问津的作品。成功案例不能说明整体情形。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_b14","side":"B","angle":"原则","subtlety":2,"text":"真正的艺术家从来不用 AI；用了 AI 的，就不算真正的创作者。","fallacy":"no_true_scotsman","explain":"遇到反例，就把定义改成“真正的……不会这样”，让自己的说法永远不会错。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_a16","side":"A","angle":"动机","subtlety":2,"text":"反对保护 AI 作品的，和当年反对相机的守旧派是一伙的，他们的话不用听。","fallacy":"guilt_by_association","explain":"因为和“守旧派”有关联，就否定了观点本身。观点要靠自己的理由来评判。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"ai_b15","side":"B","angle":"训练","subtlety":2,"text":"既然所有 AI 作品都只是把训练数据拼接复制出来的，它们当然没有独创性。","fallacy":"false_premise","explain":"“所有作品都是拼接复制”是一个没有证据的绝对说法。起点没有证明，结论就站不住。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null}],"chapter":"livestream"},{"id":"sales","title":"带货主播该不该对商品质量担责？","scene":"直播间里，一款“纯天然”面膜被粉丝投诉，评论区瞬间吵成一片。","tags":["消费","网络"],"sides":{"A":"应该担责","B":"不该担责"},"opponents":{"A":"gangjing","B":"zhubo"},"statements":[{"id":"sl_a01","side":"A","angle":"信誉","opener":true,"text":"主播靠自己的信誉促成交易，还从中拿佣金，就应该对推荐的商品承担相应责任。","fallacy":null,"explain":"理由直接：享受了利益，就应承担相应责任。这是可以讨论的论证，没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_a02","side":"A","angle":"情感","text":"那些买了假货的老人多可怜，你忍心让他们自认倒霉吗？","fallacy":"appeal_to_emotion","explain":"用怜悯代替理由。老人可怜是事实，但主播是否该担责，需要另外论证。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_a03","side":"A","angle":"后果","text":"今天主播不用担责，明天人人都敢卖假货，最后整个电商都要完蛋。","fallacy":"slippery_slope","explain":"把“主播不担责”直接接到“电商完蛋”，中间的每一步都没有证明。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_a04","side":"A","angle":"经历","text":"我买过两次带货的东西都有问题，看来所有带货都是坑。","fallacy":"hasty_generalization","accept":["anecdotal"],"explain":"用两次经历推出“所有带货”，样本太少。","opener":false,"subtlety":1,"decoys":[],"quip":"","punch":null},{"id":"sl_a05","side":"A","angle":"动机","text":"替主播说话的，不是收了钱的托，就是没脑子的粉丝。","fallacy":"ad_hominem","explain":"攻击对方的动机和智商，没有回应他的论据。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_a06","side":"A","angle":"舆论","text":"网上一片骂声，大家都说主播该负责，你还有什么好说的？","fallacy":"appeal_to_popularity","explain":"骂声大不等于有道理。多数人的意见不能代替论证。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_a07","side":"A","angle":"信誉","text":"主播有选品权，也比消费者更了解供应链，让他们担责，能促使他们认真审核。","fallacy":null,"explain":"指出了主播的信息优势，并说明担责会带来什么激励。论证合理。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_a08","side":"A","angle":"类比","text":"广告代言人为虚假宣传担责已有先例，带货主播的作用类似，可以参照。","fallacy":null,"explain":"指出了两者在关键点上的相似，并且只说“可以参照”，没有夸大。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_a09","side":"A","angle":"救济","text":"要么主播全程担责，要么消费者只能任人宰割，没有别的办法。","fallacy":"false_dilemma","explain":"把选择说成两个极端，忽略了平台监管、商家赔付、保险等其他办法。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_a10","side":"A","angle":"动机","text":"你们说不该担责，不就是说主播可以随便骗人、骗了也没事吗？","fallacy":"straw_man","explain":"对方只是反对“全面担责”，并没有说骗人没事。这是把对方的观点扭曲了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_a11","side":"A","angle":"权威","text":"某位著名律师在节目里说，主播就该连带担责。人家是律师，还能说错？","fallacy":"appeal_to_authority","explain":"只借用职业头衔，没有给出具体法律依据和理由。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_a12","side":"A","angle":"动机","subtlety":2,"text":"反对主播担责的，和当年卖假药的商家是一伙人，他们的话能信吗？","fallacy":"guilt_by_association","explain":"因为观点与某个名声不好的群体有关联，就否定这个观点。观点要靠自己的理由来评判。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_a13","side":"A","angle":"后果","text":"担责不等于无限责任，可以按是否明知、是否尽到审核义务来划分，既保护消费者，也不会压垮主播。","fallacy":null,"explain":"提出了有限定的方案，回应了对方最担心的问题。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_b01","side":"B","angle":"能力","opener":true,"text":"主播既不生产商品，也没有检测条件，要他们对质量兜底，超出了他们的能力。","fallacy":null,"explain":"指出了责任和能力不匹配，理由与结论相关。没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_b02","side":"B","angle":"证据","subtlety":2,"text":"我说这款面膜安全有效，你说不是，那就请你拿证据来证明。","fallacy":"burden_of_proof","accept":["appeal_to_ignorance"],"explain":"提出主张的人应该先举证。自己不给依据，却要求别人来证明它是错的，把责任倒了过来。","quip":"谁主张，谁举证。","opener":false,"decoys":[],"punch":null},{"id":"sl_b03","side":"B","angle":"平台","subtlety":2,"text":"平台早就把每件商品都严格检验过了，所以主播根本不用再操心质量。","fallacy":"false_premise","explain":"这个前提未必成立：平台审核不等于逐件检验。推理的起点是错的，结论就站不住。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_b04","side":"B","angle":"传统","text":"直播带货一直都是这样做的，行业惯例就是主播不担责，何必改。","fallacy":"appeal_to_tradition","explain":"“一直如此”不能证明它合理。惯例也可能有问题。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_b05","side":"B","angle":"权威","text":"我们公司的法务总监说了，主播不用担责。他懂法，你听他的就行。","fallacy":"appeal_to_authority","explain":"只搬出职位，没有给出法律依据。而且他的立场也可能与公司利益有关。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_b06","side":"B","angle":"后果","text":"自从要求主播担责的呼声变大，很多小主播就失业了，可见担责要求毁了这个行业。","fallacy":"false_cause","explain":"两件事先后发生，不等于有因果关系。小主播失业，还可能与竞争、流量有关。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_b07","side":"B","angle":"动机","text":"你自己网购时不也从来不看评价？凭什么只怪主播？","fallacy":"tu_quoque","explain":"用对方自己的行为回避问题。消费者有没有看评价，与主播该不该担责是两回事。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_b08","side":"B","angle":"话题","text":"现在讨论责任干什么？你们先去管管那些刷单的商家！","fallacy":"red_herring","explain":"刷单是另一个问题，这是把话题岔开了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_b09","side":"B","angle":"救济","text":"消费者可以直接向商家和平台索赔，已经有现成的救济渠道，不必再叠加一层主播责任。","fallacy":null,"explain":"提出了现有的替代办法。它可以被反驳（比如商家难以追责），但论证本身合理。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_b10","side":"B","angle":"后果","text":"要么主播完全不担责，要么整个直播行业关门，你选哪个？","fallacy":"false_dilemma","explain":"把选择说成只有两个极端，忽略了“按情形分担”等中间方案。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_b11","side":"B","angle":"情感","text":"主播们每天熬夜赚辛苦钱，你们还要让他们背锅，心里过意得去吗？","fallacy":"appeal_to_emotion","explain":"用同情代替理由。辛苦不等于不用负责。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_b12","side":"B","angle":"经历","text":"我认识的三个主播都被商家骗过，可见主播其实都是受害者。","fallacy":"hasty_generalization","explain":"用三个例子推出“所有主播”，样本太少。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_b13","side":"B","angle":"信誉","text":"明知商品有问题仍然推荐，当然要担责；但对无从知晓的质量问题，主播不该与商家承担同样的责任。","fallacy":null,"explain":"区分了“明知”与“不知”，给出了有限定的主张。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_b14","side":"B","angle":"能力","text":"主播核对过商品的资质和检测报告，就已经尽到了合理的注意义务。","fallacy":null,"explain":"给出了一个可以判断的标准，虽然可以讨论标准是否足够，但论证本身合理。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_a14","side":"A","angle":"动机","text":"你一单货都没带过，凭什么说主播不用担责？","fallacy":"appeal_to_accomplishment","explain":"有没有带过货，与主播该不该担责无关。批评是否成立，要看理由。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_b15","side":"B","angle":"动机","subtlety":2,"text":"你是不是收了竞品的钱，才这么坚持要主播担责？","fallacy":"loaded_question","explain":"问题里预设了“你收了竞品的钱”。无论回答是或不是，都等于默认了这个前提。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_a15","side":"A","angle":"证据","text":"没有人能证明这款茶没有害处，所以它一定有害，主播就该担责。","fallacy":"appeal_to_ignorance","explain":"没有证明无害，不等于已经证明有害。需要的是证明有害的证据。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_b16","side":"B","angle":"做法","subtlety":2,"text":"一边说主播全担责，一边说完全不担责，那就折中一下，担一半，这样最公平。","fallacy":"middle_ground","explain":"折中不等于正确。“一半”是怎么算出来的？需要看理由，而不只是它位于两个极端之间。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"sl_b17","side":"B","angle":"来源","text":"这条质疑是从一个小道消息账号传出来的，所以不用理会。","fallacy":"genetic","explain":"仅凭来源就否定内容。来源可以提醒你多核实，但不能代替核实。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null}],"chapter":"livestream"},{"id":"blindbox","title":"直播间的盲盒和福袋，该不该限制未成年人购买？","scene":"直播间的福袋抽奖火了，一个初中生花光了一整个月的零花钱。","tags":["消费","未成年人"],"sides":{"A":"应该限制","B":"不必限制"},"opponents":{"A":"jizhe","B":"dage"},"statements":[{"id":"bb_a01","side":"A","angle":"未成年","opener":true,"text":"盲盒的核心是不确定性，未成年人的自控力和判断力还在发育，更容易反复购买，所以需要更严格的限制。","fallacy":null,"explain":"从未成年人的特点出发，理由与结论相关。没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_a02","side":"A","angle":"经历","text":"我外甥一个月花了两千块抽盲盒，可见盲盒对孩子的危害有多大。","fallacy":"anecdotal","accept":["hasty_generalization"],"explain":"用一个孩子的情况推出“危害很大”。个例不能代表整体，需要更多的数据。","opener":false,"subtlety":1,"decoys":[],"quip":"","punch":null},{"id":"bb_a03","side":"A","angle":"后果","text":"今天抽盲盒，明天就学会赌博，后天就会倾家荡产。","fallacy":"slippery_slope","explain":"每一步都被说成必然，却没有证明。抽盲盒不等于赌博，赌博也不等于倾家荡产。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_a04","side":"A","angle":"情感","text":"想想那些把零花钱花光的孩子，你们当大人的心里过意得去吗？","fallacy":"appeal_to_emotion","explain":"用愧疚代替理由。是否需要限制，要靠数据和规则来论证。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_a05","side":"A","angle":"监管","text":"对价格和概率不透明的抽奖，应当要求公开中奖概率，让消费者知情选择。","fallacy":null,"explain":"提出了具体的监管要求，并说明了目的。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_a06","side":"A","angle":"因果","subtlety":2,"text":"自从班里有人玩福袋，我们班的成绩就下滑了，可见福袋影响学习。","fallacy":"false_cause","explain":"先后发生不等于因果。成绩下滑可能有很多原因，需要排除其他因素。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_a07","side":"A","angle":"动机","text":"你们反对限制，就是想让所有孩子都去赌，对吧？","fallacy":"straw_man","explain":"对方反对的是“限制”，并没有说要让孩子去赌。这是把对方的观点扭曲了。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_a08","side":"A","angle":"数据","text":"如果调查显示，未成年人在盲盒上花的钱占零花钱的很大比例，就说明有必要采取措施。","fallacy":null,"explain":"把结论建立在可检验的条件上，没有预先下结论。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_a09","side":"A","angle":"权威","text":"某位教育专家说，盲盒就是儿童赌博，所以必须禁止。","fallacy":"appeal_to_authority","explain":"只搬出专家的头衔，没有给出论证。“盲盒就是赌博”本身也需要说明。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_a10","side":"A","angle":"动机","text":"替盲盒说话的，肯定是靠它赚钱的商家。","fallacy":"ad_hominem","explain":"揣测对方的动机，代替了回应他的论据。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_a11","side":"A","angle":"证据","subtlety":2,"text":"我找到的三篇研究都说盲盒让孩子更冲动；另外几篇说影响不大的，样本太小，不用看。","fallacy":"cherry_picking","explain":"只采纳对自己有利的研究，把相反的结果直接排除。样本小需要具体说明，而不是一句带过。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_a12","side":"A","angle":"数据","subtlety":3,"text":"九成沉迷抽奖的人，当初都是从买盲盒开始的，所以孩子买盲盒，就有九成的可能沉迷。","fallacy":"base_rate","explain":"混淆了两个方向的概率：沉迷者里多数买过盲盒，不等于买盲盒的人里多数会沉迷。还要看买盲盒的人有多少。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_a13","side":"A","angle":"监管","text":"可以设置未成年人每月消费上限，并要求家长确认，这比一刀切禁止更容易执行。","fallacy":null,"explain":"提出了具体、可执行的限制方式，回应了“一刀切”的担忧。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_a14","side":"A","angle":"选择","text":"要么全面禁止未成年人购买，要么就看着他们沉迷，没有别的办法。","fallacy":"false_dilemma","explain":"把选择说成两个极端，忽略了消费上限、家长确认、概率公示等办法。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_b01","side":"B","angle":"家长","opener":true,"text":"监护人本来就是未成年人消费的第一责任人，平台提供提醒和工具，家长管好支付就够了。","fallacy":null,"explain":"指出了现有的责任分工，理由与结论相关。可以讨论是否足够，但论证本身没有谬误。","subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_b02","side":"B","angle":"概率","text":"我一连买了十一个都没中隐藏款，第十二个肯定该中了！","fallacy":"gamblers_fallacy","explain":"每个盲盒是否中奖相互独立，前面没中，不会让后面更容易中。骰子没有记忆。","quip":"骰子没有记忆。","opener":false,"subtlety":1,"accept":[],"decoys":[],"punch":null},{"id":"bb_b03","side":"B","angle":"概率","subtlety":2,"text":"这个系列已经连着三个人抽到普通款了，下一个一定是隐藏款。","fallacy":"gamblers_fallacy","explain":"每次抽取互相独立。前面几个人没抽到，并不会让下一个人“该抽到了”。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_b04","side":"B","angle":"数据","text":"晒出隐藏款的人都说值了，可见抽盲盒是稳赚不亏的事。","fallacy":"survivorship","explain":"只看到了抽中并愿意晒的人，没看到更多没中、也没晒的人。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_b05","side":"B","angle":"经历","text":"我小时候也抽过卡，现在不也好好的？所以孩子抽盲盒没问题。","fallacy":"anecdotal","accept":["appeal_to_tradition"],"explain":"用自己一个人的经历代替证据。他没事，不代表别人没事。","opener":false,"subtlety":1,"decoys":[],"quip":"","punch":null},{"id":"bb_b06","side":"B","angle":"监管","text":"与其禁止，不如强制公开概率，再加上平台的消费提醒，让孩子和家长都能做出判断。","fallacy":null,"explain":"提出了替代方案，并说明了目的。可以再讨论它够不够，但论证本身合理。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_b07","side":"B","angle":"舆论","text":"全国几千万人都在玩盲盒，这么多人玩，哪有什么问题？","fallacy":"appeal_to_popularity","explain":"玩的人多，不等于没有问题。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_b08","side":"B","angle":"后果","text":"今天限制盲盒，明天就限制游戏，后天就限制一切消费，孩子什么都买不了了。","fallacy":"slippery_slope","explain":"把一次限制直接接到“什么都买不了”，中间的步骤没有证明。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_b09","side":"B","angle":"动机","text":"支持限制的，都是自己不会玩，也不让别人玩的老古板。","fallacy":"ad_hominem","explain":"给对方贴标签，没有回应他的论据。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_b10","side":"B","angle":"因果","subtlety":2,"text":"盲盒销量上涨以后，青少年犯罪率下降了，可见盲盒让孩子更守规矩。","fallacy":"false_cause","explain":"两个数据同时变化，不等于有因果关系。还有很多因素会影响犯罪率。","opener":false,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_b11","side":"B","angle":"数据","text":"判断要不要限制，得看真实的数据：未成年人的平均花费、复购率、是否影响学习。","fallacy":null,"explain":"提出了判断所需的证据，没有预先下结论。没有谬误。","opener":false,"subtlety":1,"accept":[],"decoys":[],"quip":"","punch":null},{"id":"bb_b12","si

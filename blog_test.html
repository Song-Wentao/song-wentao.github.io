<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name = "format-detection" content = "telephone=no">

	<title>Wentao Song — Wildlife Ecologist</title>

	<link rel="stylesheet" type="text/css" href="css/global.css">
	<link rel="stylesheet" type="text/css" href="css/blog.css">
	
	<!--Google fonts link-->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
</head>
<body>
  <!--header-->
	<div id="navbar"></div>	

	<!--login-->
	<div id="login"></div>

  <section id="blog">
    <div class="blog-intro center-text">
      <h2>Blog</h2>
    
    </div>

    <div class="blog-layout">
      <aside class="blog-toc">
        <ul class="toc-list" id="tocList">
          <!-- populated from update/blog.json -->
        </ul>
      </aside>

      <article class="blog-article" id="articleView">
        <div id="articleContent" class="article-loading">Loading…</div>

        <div class="article-nav">
          <button id="prevBtn" class="nav-btn prev-btn" disabled>
            <span class="nav-label">← Previous</span>
          </button>
          <button id="nextBtn" class="nav-btn next-btn" disabled>
            <span class="nav-label">Next →</span>
          </button>
        </div>
      </article>
    </div>
  </section>

	<!--Footer-->
	<div id="footer"></div>


	<!--js link-->
	<script src="js/components.js"></script>
	<script src="/login/login.js"></script>
	<script src="/js/blog.js"></script>
</body>
</html>

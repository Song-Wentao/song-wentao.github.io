    "tag": "PART 2",

    "type": "bullets",
    "eyebrow": "BUILDING BLOCKS",
    "title": "Recall: single-species logistic growth (Ch. 2, Lecture 7)",
    "items": [
      "dN/dt = rN(K − N)/K — population growth slows as N approaches carrying capacity K.",
      "The term (K − N)/K is the <b>unused portion of carrying capacity</b> — it scales growth down from the maximum rate r toward zero as resources are depleted.",
      "Implicit assumption: every individual added to the population consumes the same resources and has the same depressing effect on further growth — i.e., only <b>intraspecific</b> competition operates.",

    "eyebrow": "THE MODEL",

    "bullets": [
      "N1, N2 = population sizes of species 1 and 2",
      "r1, r2 = intrinsic rates of increase; K1, K2 = carrying capacities in the absence of the competitor",
      "α12 = effect of species 2 on species 1; α21 = effect of species 1 on species 2"

  {
    "type": "bullets",
    "eyebrow": "READING THE EQUATION",
    "title": "Unpacking dN1/dt = r1N1(K1 − N1 − α12N2)/K1",
    "items": [
      "This is the logistic equation for species 1 with one modification: the numerator now subtracts <b>both</b> N1 (species 1's own individuals) <b>and</b> α12N2 (species 2's individuals, converted to species-1 equivalents).",

      "If α12N2 is large, species 1's effective ceiling drops well below K1 — the competitor is eating heavily into species 1's resource space."

  },

    "type": "bullets",
    "eyebrow": "READING THE EQUATION",
    "title": "The mirror-image equation for species 2",

      "Now α21 converts species 1 individuals into their equivalent impact on species 2's carrying capacity.",
      "Critically, α12 ≠ α21 in general — the two species need not affect each other equally. Species 2 might barely dent species 1's resources while species 1 devastates species 2's.",

    ]
  },
  {
    "type": "section",
    "tag": "PART 3",
    "title": "Competition Coefficients",
    "sub": "Converting one species into 'equivalent' individuals of the other"
  },
  {
    "type": "term",
    "eyebrow": "KEY PARAMETER",
    "title": "The competition coefficient α12",
    "term": "α12 = the per-capita effect of an individual of species 2 on species 1, expressed in units of species 1's own intraspecific effect",
    "def": "α12 is a conversion factor: it answers 'how many species-1 individuals' worth of resource depletion does one species-2 individual cause, from species 1's point of view?'",
    "bullets": [
      "It is not a rate or a probability — it is a ratio of per-capita competitive effects.",
      "Estimated empirically by comparing a species' growth in mixed culture versus in monoculture (Rockwood Ch. 7)."

  },
  {
    "type": "term",
    "eyebrow": "KEY PARAMETER",
    "title": "The competition coefficient α21",
    "term": "α21 = the per-capita effect of an individual of species 1 on species 2, in units of species 2's own intraspecific effect",
    "def": "The reverse conversion factor, used in species 2's equation. Together α12 and α21 fully describe the (linear) interspecific competitive relationship between the two species.",

  },

    "type": "compare",
    "eyebrow": "QUICK REFERENCE",
    "title": "Interpreting the magnitude of a competition coefficient",
    "headers": [
      "Value of α12",
      "Relative strength",
      "Biological meaning"
    ],
    "rows": [
      [
        "α12 = 0",
        "No interspecific effect",

      ],
      [
        "α12 < 1",
        "Intra > inter",
        "One species-2 individual counts as less than one species-1 individual"
      ],
      [
        "α12 = 1",
        "Intra = inter",
        "Species are competitively equivalent from species 1's perspective"
      ],
      [
        "α12 > 1",
        "Inter > intra",
        "One species-2 individual suppresses species 1 more than a conspecific would"

  },

    "type": "bullets",
    "eyebrow": "THE 'EQUIVALENT INDIVIDUALS' IDEA",
    "title": "Why 'equivalent individuals' is the right way to think about α",
    "items": [

    "type": "bullets",

// RENDER ENGINE

function esc(s){ return s; } // bullets allow inline <b> tags intentionally

function renderSlide(s, idx){
  let inner = "";
  switch(s.type){

    case "title":
      inner = `
        <div class="center-stage">
          <span class="tag">${s.eyebrow||""}</span>
          <div class="big-word">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
          <div class="footnote">${s.footnote||""}</div>
        </div>`;
      break;

    case "section":
      inner = `
        <div class="center-stage">
          <span class="tag gold">${s.tag||"Section"}</span>
          <div class="big-word" style="font-size:2.6rem;">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
        </div>`;
      break;

    case "bullets":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content"><ul class="bullets">
          ${s.items.map(i=>`<li>${i}</li>`).join("")}
        </ul></div>`;
      break;

    case "term":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <div class="term-box">
            <span class="term">${s.term}</span>
            <span class="def">${s.def}</span>
          </div>
          ${s.bullets ? `<ul class="bullets sub">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
        </div>`;
      break;

    case "twocol":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="two-col">
          <div class="col-box"><h3>${s.left.h}</h3><p>${s.left.body}</p></div>
          <div class="col-box"><h3>${s.right.h}</h3><p>${s.right.body}</p></div>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "compare":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <table class="compare">
            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Population Ecology · BIOL 4XX</span>
        <span>Lecture 25</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>

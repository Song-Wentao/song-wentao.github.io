  {

  {

    "items": [

  {
    "type": "bullets",
    "eyebrow": "The Problem",
    "title": "Real Landscapes Are Not Continuous",
    "items": [
      "Habitat is rarely a single uniform block — it is patchy: meadows separated by forest, ponds separated by land, host plants scattered across a field",
      "Many species do not live as one continuous population but as a collection of smaller <b>local populations</b> occupying discrete <b>habitat patches</b>",
      "Individuals move between patches at some rate — <b>dispersal</b> links patches to one another",
      "Local populations can wink out (go extinct) and empty patches can be re-founded (colonized)",
      "This creates a population <b>of populations</b> — a metapopulation"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Core Concept",
    "title": "Defining the Metapopulation",
    "term": "Metapopulation",
    "def": "A set of spatially separated local populations of the same species that interact via dispersal (immigration and emigration) among discrete habitat patches.",
    "bullets": [
      "Coined by Richard Levins (1969) to describe pest population dynamics in agricultural landscapes",
      "Key idea: persistence of the species regionally does not require any single local population to persist forever",
      "The relevant unit of study shifts from 'the population' to 'the network of patches'"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "A Shift in Perspective",
    "title": "Single Population vs. Metapopulation Thinking",
    "left": {
      "h": "Classical (Ch. 1–4) view",
      "body": "One population, one location. Growth is governed by births, deaths, r, K, and (with age structure) the life table. Local extinction is treated as a rare, catastrophic endpoint — not a routine part of the dynamics."
    },
    "right": {
      "h": "Metapopulation view",
      "body": "Many small local populations linked by dispersal. Local extinction is common and expected. Regional persistence depends on the balance between how fast patches go extinct and how fast empty patches are recolonized."
    }
  },
  {
    "type": "bullets",
    "eyebrow": "Vocabulary",
    "title": "Key Terms You Need for This Chapter",
    "items": [
      "<b>Patch:</b> a discrete area of habitat suitable for occupation by a local population, embedded in a matrix of unsuitable habitat",
      "<b>Local population (subpopulation):</b> the individuals occupying a single patch at a given time",
      "<b>Local extinction:</b> the disappearance of a local population from a patch it previously occupied",
      "<b>Colonization:</b> the establishment of a new local population in a previously empty (unoccupied) patch, via dispersal of individuals from occupied patches",
      "<b>Patch occupancy:</b> the proportion or fraction of habitat patches in the network that are currently occupied — the central variable of metapopulation models"
    ]
  },
  {
    "type": "cards",
    "eyebrow": "Why It Matters",
    "title": "Why Study Metapopulations?",
    "cards": [
      {
        "h": "Conservation",
        "p": "Endangered species are often confined to fragmented habitat; understanding patch dynamics predicts extinction risk and guides reserve design."
      },
      {
        "h": "Habitat fragmentation",
        "p": "Human land use increasingly converts continuous habitat into patch networks — metapopulation theory is the natural framework for the modern landscape."
      },
      {
        "h": "Pest & disease management",
        "p": "Levins originally modeled agricultural pests; the same math applies to disease spread among host patches."
      },
      {
        "h": "General ecological theory",
        "p": "Metapopulation dynamics link local (within-patch) processes to regional (landscape-scale) persistence."
      }
    ]
  },
  {
    "type": "timeline",
    "eyebrow": "Historical Context",
    "title": "Milestones in Metapopulation Theory",
    "items": [
      {
        "y": "1969",
        "t": "Richard Levins proposes the metapopulation concept and the colonization–extinction model, motivated by agricultural pest control"
      },
      {
        "y": "1970s–80s",
        "t": "Island biogeography (MacArthur & Wilson) and metapopulation ideas cross-pollinate; conservation biologists begin applying patch-based thinking to fragmented reserves"
      },
      {
        "y": "1991",
        "t": "Ilkka Hanski begins the long-term Glanville fritillary (Melitaea cinxia) survey across ~4,000 meadow patches in the Åland Islands, Finland"
      },
      {
        "y": "1990s",
        "t": "Hanski develops the Incidence Function Model, a spatially explicit extension of Levins' framework, calibrated with Åland occupancy data"
      },
      {
        "y": "Today",
        "t": "Metapopulation theory underpins reserve design, endangered species recovery plans, and landscape connectivity planning worldwide"
      }
    ]
  },
  {
    "type": "section",
    "tag": "PART 2",
    "title": "The Levins (1969) Model",
    "sub": "A minimal model of patch occupancy dynamics"
  },
  {
    "type": "bullets",
    "eyebrow": "Setting Up the Model",
    "title": "Levins' Simplifying Framework",
    "items": [
      "Consider a large (in the limit, infinite) number of identical habitat patches",
      "Each patch is either <b>occupied</b> by a local population or <b>empty</b> — Levins does not track the size or age structure of each local population, only presence/absence",
      "Let <b>p</b> = the proportion of patches occupied at time t (0 ≤ p ≤ 1)",
      "Patches turn over: occupied patches can go locally extinct; empty patches can be colonized",
      "The model asks: how does p change through time, and does the metapopulation settle to a stable occupancy level?"
    ]
  },
  {
    "type": "term",
    "eyebrow": "The Equation",
    "title": "The Levins Model",
    "term": "dp/dt = c·p(1 − p) − e·p",
    "def": "The rate of change in the proportion of occupied patches equals the colonization rate minus the extinction rate.",
    "bullets": [
      "<b>p</b> = proportion of patches currently occupied",
      "<b>c</b> = colonization rate parameter (per-patch rate at which occupied patches 'export' colonists to empty patches)",
      "<b>e</b> = extinction rate parameter (per-patch probability/rate of local extinction)",
      "Structurally similar to the logistic equation — but here p is a proportion of patches, not a population size"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Reading the Equation",
    "title": "Two Terms, Two Processes",
    "left": {
      "h": "Colonization term: c·p(1 − p)",
      "body": "Colonists come from occupied patches (proportion p) and can only successfully colonize empty patches (proportion 1 − p). The product p(1 − p) is maximized at intermediate occupancy — plenty of source patches AND plenty of empty targets."
    },
    "right": {
      "h": "Extinction term: e·p",
      "body": "Only occupied patches can go extinct, so the loss rate is simply proportional to the fraction currently occupied, p, scaled by the per-patch extinction rate e."
    }
  },
  {
    "type": "bullets",
    "eyebrow": "Model Logic",
    "title": "Why p(1 − p) and Not Just p?",
    "items": [
      "Compare to logistic growth dN/dt = rN(1 − N/K): N(1 − N/K) is the density-dependent brake on growth of individuals",
      "In Levins' model, p(1 − p) plays an analogous role for <b>patches</b>: colonization requires both a source (occupied patch) and a destination (empty patch)",
      "If p is near 0, almost no patches are occupied → few colonists produced, even though empty patches abound",
      "If p is near 1, colonists are abundant but there are almost no empty patches left to colonize",
      "Colonization is therefore self-limiting — it is fastest at intermediate occupancy, exactly like logistic growth is fastest at intermediate N"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Finding Equilibrium",
    "title": "Solving for Equilibrium Occupancy, p*",
    "items": [
      "At equilibrium, dp/dt = 0, i.e., colonization rate = extinction rate",
      "c·p(1 − p) = e·p",
      "Divide both sides by p (for p ≠ 0): c(1 − p) = e",
      "Solve: 1 − p = e/c → <b>p* = 1 − e/c</b>",
      "Two equilibria exist mathematically: p = 0 (trivial, metapopulation extinct) and p* = 1 − e/c (nontrivial, a persistent metapopulation)"
    ]
  },
  {
    "type": "term",
    "eyebrow": "The Key Result",
    "title": "Equilibrium Patch Occupancy",
    "term": "p* = 1 − e/c",
    "def": "The long-term, stable fraction of occupied patches is determined entirely by the ratio of extinction rate to colonization rate.",
    "bullets": [
      "If e/c is small (colonization far outpaces extinction), p* approaches 1 — nearly all patches occupied",
      "If e/c is large (extinction outpaces colonization), p* approaches 0 — most patches empty",
      "The absolute values of c and e do not matter individually — only their <b>ratio</b> sets equilibrium occupancy"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Persistence Criterion",
    "title": "When Does the Metapopulation Persist?",
    "items": [
      "For p* to be positive (a biologically meaningful, non-extinct equilibrium), we need 1 − e/c > 0",
      "Rearranged: <b>c > e</b> — the colonization rate parameter must exceed the extinction rate parameter",
      "If c ≤ e, the only stable equilibrium is p* = 0: the metapopulation goes regionally extinct even though individual patches may be perfectly suitable habitat",
      "This is a profound result: the metapopulation can vanish due to a poor balance of colonization and extinction, independent of whether any single patch is 'good habitat'",
      "Regional persistence is an emergent, landscape-level property — not simply the sum of local population health"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Stability",
    "title": "Stability of the Two Equilibria",
    "left": {
      "h": "p = 0 (extinction)",
      "body": "Unstable if c > e: any small colonization event pushes p away from zero and toward p*. Stable (the only outcome) if c ≤ e: the metapopulation always collapses to extinction regardless of starting occupancy."
    },
    "right": {
      "h": "p* = 1 − e/c (persistence)",
      "body": "Stable whenever it exists (c > e): perturbations in occupancy — a bad year with more extinctions, or a good year with more colonizations — are damped, and p returns to p*."
    }
  },
  {
    "type": "bullets",
    "eyebrow": "Interpreting the Model",
    "title": "What the Levins Model Tells Us",
    "items": [
      "Metapopulations can persist in a dynamic equilibrium even though <b>every individual local population is doomed to eventually go extinct</b>",
      "Persistence is a turnover process: patches wink in and out of occupancy, but the proportion occupied stabilizes at p*",
      "This reframes 'extinction' from a species-level catastrophe to a routine, expected local event — the regional population can be stable while local populations are constantly being lost and re-formed",
      "Management implication: you can increase regional persistence either by lowering local extinction rate (e) or by raising colonization rate (c) — e.g., improving patch quality vs. improving connectivity"
    ]
  },
  {
    "type": "cards",
    "eyebrow": "Two Levers",
    "title": "Two Ways to Raise p*",
    "cards": [
      {
        "h": "Lower e (extinction rate)",
        "p": "Improve patch quality, increase patch size, reduce local threats (predators, disease, habitat degradation) so local populations persist longer."
      },
      {
        "h": "Raise c (colonization rate)",
        "p": "Improve connectivity between patches — corridors, stepping-stone patches, reduced matrix hostility — so empty patches are found and recolonized faster."
      },
      {
        "h": "Combined strategies",
        "p": "Real conservation plans typically target both simultaneously: better patches that are also better connected."
      },
      {
        "h": "The ratio is what matters",
        "p": "Because p* = 1 − e/c, halving e has the same equilibrium effect as doubling c — planners can choose whichever lever is more feasible."
      }
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Worked Example",
    "title": "Applying the Model: A Numerical Example",
    "items": [
      "Suppose a metapopulation has colonization parameter c = 0.5 per year and extinction parameter e = 0.2 per year",

      "Equilibrium occupancy: p* = 1 − e/c = 1 − 0.2/0.5 = 1 − 0.4 = <b>0.6</b> — 60% of patches occupied at equilibrium, on average, at any given time",
      "If habitat degradation raises e to 0.45 (patches become poorer quality), p* falls to 1 − 0.45/0.5 = 0.10 — only 10% occupancy, a steep decline from a modest change in e",
      "This sensitivity illustrates why even small increases in local extinction risk (e.g., from fragmentation) can cause large drops in regional occupancy"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Beyond the Deterministic Average",
    "title": "Stochasticity in Real, Finite Patch Networks",

    ]

function esc(s){ return s; } // bullets allow inline <b> tags intentionally

function renderSlide(s, idx){
  let inner = "";
  switch(s.type){

    case "title":
      inner = `
        <div class="center-stage">
          <span class="tag">${s.eyebrow||""}</span>
          <div class="big-word">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
          <div class="footnote">${s.footnote||""}</div>
        </div>`;
      break;

    case "section":
      inner = `
        <div class="center-stage">
          <span class="tag gold">${s.tag||"Section"}</span>
          <div class="big-word" style="font-size:2.6rem;">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
        </div>`;
      break;

    case "bullets":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content"><ul class="bullets">
          ${s.items.map(i=>`<li>${i}</li>`).join("")}
        </ul></div>`;
      break;

    case "term":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <div class="term-box">
            <span class="term">${s.term}</span>
            <span class="def">${s.def}</span>
          </div>
          ${s.bullets ? `<ul class="bullets sub">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
        </div>`;
      break;

    case "twocol":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="two-col">
          <div class="col-box"><h3>${s.left.h}</h3><p>${s.left.body}</p></div>
          <div class="col-box"><h3>${s.right.h}</h3><p>${s.right.body}</p></div>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "compare":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <table class="compare">
            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Population Ecology · BIOL 4XX</span>
        <span>Lecture 17</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>

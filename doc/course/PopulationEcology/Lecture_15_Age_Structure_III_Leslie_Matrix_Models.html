<script>
// =====================================================================

// object with a `type` (layout) and layout-specific fields.
// =====================================================================
const slides = [
  {
    "type": "title",
    "eyebrow": "POPULATION ECOLOGY — BIOL 4XX — LECTURE 15",
    "title": "Age Structure III: Leslie Matrix Models",
    "sub": "From summary statistics to dynamic projection — building and iterating the population projection matrix",
    "footnote": "Reading: Rockwood, Introduction to Population Ecology (2nd ed.), Ch. 4 — Age Structure"
  },
  {
    "type": "section",
    "tag": "PART 1",
    "title": "Why We Need More Than R0 and r",
    "sub": "The limits of life-table summary statistics"
  },
  {
    "type": "bullets",
    "eyebrow": "RECAP",
    "title": "Where We Left Off: Lecture 14",
    "items": [
      "Built a <b>fecundity schedule</b> mx: expected offspring produced by a female of age x",
      "Combined survivorship lx and fecundity mx into <b>net reproductive rate</b>, R0 = Σ lx·mx",
      "Estimated <b>generation time</b> T and the intrinsic rate of increase r via the <b>Euler-Lotka equation</b>",
      "These are all <b>single numbers</b> — they summarize a population's long-run growth tendency"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "THE PROBLEM",
    "title": "What Summary Statistics Don't Tell Us",
    "items": [
      "R0 and r describe growth <b>averaged over the whole life cycle</b>, once the population has settled into a steady pattern",
      "They say nothing about the population's <b>age distribution</b> right now, or how it will change year to year",
      "A population can have R0 > 1 and still <b>decline temporarily</b> if its current age structure is unfavorable (e.g., too few reproductive adults)",
      "Managers, conservationists, and forecasters often need to know <b>numbers by age class</b>, not just a growth rate"
    ]
  },
  {
    "type": "term",
    "eyebrow": "THE SOLUTION",
    "title": "A Tool for Dynamic Projection",
    "term": "Matrix Population Model",
    "def": "A method that tracks the number of individuals in each age class simultaneously and projects the entire age distribution forward in time, one time step at a time.",
    "bullets": [
      "Built directly from the same life table data used in Lecture 14 (lx, mx → survival and fecundity)",
      "Output is not one number but an entire <b>vector</b> of age-class abundances at every time step",
      "Developed by Patrick H. Leslie (1945) — hence the <b>Leslie matrix</b>"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "ROADMAP",
    "title": "What This Lecture Builds Toward",
    "items": [
      "Define the structure of the <b>Leslie matrix</b>: where fecundities and survival probabilities go",
      "Define the <b>population vector</b> and the matrix projection equation n(t+1) = L·n(t)",
      "Work a numerical example by hand, iterating the projection several time steps",
      "Introduce the <b>dominant eigenvalue λ</b> as the long-run growth rate — the bridge to Lecture 16"
    ]
  },
  {
    "type": "section",
    "tag": "PART 2",
    "title": "The Leslie Matrix",
    "sub": "Structure, notation, and the projection equation"
  },
  {
    "type": "term",
    "eyebrow": "NOTATION",
    "title": "The Population Vector",
    "term": "n(t)",
    "def": "A column vector listing the number of individuals in each age class at time t.",
    "bullets": [
      "n(t) = [n0(t), n1(t), n2(t), ..., nk(t)]ᵀ, where ni(t) is the count in age class i",
      "Total population size N(t) is simply the sum of all entries in n(t)",
      "The vector changes shape (its <b>proportions</b>) as well as its total as the population ages and reproduces"
    ]
  },
  {
    "type": "term",
    "eyebrow": "NOTATION",
    "title": "The Projection Matrix",
    "term": "Leslie Matrix, L",
    "def": "A square matrix whose entries encode how individuals in each age class contribute to each age class one time step later.",
    "bullets": [
      "<b>Top row</b>: fecundity values Fx — offspring contributed to age class 0 by each age class x",
      "<b>Subdiagonal</b>: survival probabilities Px — the fraction of age class x that survives to become age class x+1",
      "<b>Everywhere else</b>: zeros — individuals cannot skip age classes or regress to a younger one"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "STRUCTURE",
    "title": "Anatomy of a Leslie Matrix (4 Age Classes)",
    "left": {
      "h": "Row and column meaning",
      "body": "Rows index the age class being produced (at t+1); columns index the age class contributing (at t). Reading across the top row multiplies each age class's abundance by its fecundity and sums the results — this becomes the new age-0 class."
    },
    "right": {
      "h": "Layout",
      "body": "F0  F1  F2  F3\nP0   0   0   0\n 0  P1   0   0\n 0   0  P2   0\n\nFx = fecundity of age x\nPx = survival probability age x to x+1"
    },
    "footnote": "Note: the last age class typically has no Px (individuals leave the projection when they die of old age, unless a terminal self-loop is modeled)"
  },
  {
    "type": "bullets",
    "eyebrow": "BUILDING BLOCKS",
    "title": "Where Fx and Px Come From",
    "items": [
      "<b>Px</b> (survival probability, age x to x+1) = lx+1 / lx, taken directly from the survivorship schedule",
      "<b>Fx</b> (fecundity entry) is built from mx, the per-capita fecundity schedule from Lecture 14",
      "In the simplest formulation, Fx = mx for reproductive ages; more refined versions adjust for the timing of a census relative to the birth pulse",
      "Every entry in L is therefore just a repackaging of the <b>same life-table data</b> you already calculated in Lecture 14"
    ]
  },
  {
    "type": "term",
    "eyebrow": "THE CORE EQUATION",
    "title": "Projecting the Population Forward",
    "term": "n(t+1) = L · n(t)",
    "def": "Multiplying the Leslie matrix by the current population vector produces the population vector one time step later.",
    "bullets": [
      "Applying it once advances the population by one time step; applying it repeatedly (Lⁿ·n(0)) projects n time steps into the future",
      "This is the matrix-model analog of Nt+1 = λNt from Lecture 3 — but now tracking age structure, not just total size"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "THE ARITHMETIC",
    "title": "What Matrix Multiplication Actually Does",
    "items": [
      "Each entry in the new vector n(t+1) is a <b>weighted sum</b> of every entry in the old vector n(t)",
      "The weights are the corresponding row of L: multiply each age class's current abundance by its matrix entry, then add",
      "New age-0 individuals: n0(t+1) = F0·n0(t) + F1·n1(t) + F2·n2(t) + ...",
      "Individuals surviving into age x+1: nx+1(t+1) = Px·nx(t) — only one nonzero term, because survival moves individuals one age class at a time"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "WARM-UP",
    "title": "A Simple Numeric Example, No Biology Yet",
    "left": {
      "h": "A 2×2 matrix and vector",
      "body": "L = | 1  2 |\n    | 0.5 0 |\n\nn(0) = | 4 |\n       | 6 |"
    },
    "right": {
      "h": "One multiplication",
      "body": "n1(1) = 1(4) + 2(6) = 16\nn2(1) = 0.5(4) + 0(6) = 2\n\nn(1) = | 16 |\n       |  2 |\n\nEach new entry: multiply row by vector, then sum"
    }
  },
  {
    "type": "twocol",
    "eyebrow": "CONCEPT CHECK",
    "title": "Two Kinds of Row in the Matrix",
    "left": {
      "h": "The fecundity row (row 1)",
      "body": "Sums contributions from ALL reproductive age classes at once. A wide age distribution of breeders each adds newborns proportional to its own fecundity and abundance."
    },
    "right": {
      "h": "The survival rows (rows 2+)",
      "body": "Each survival row has only ONE nonzero entry (Px on the subdiagonal). Age class x+1 next time step comes only from age class x now — nothing else."
    }
  },
  {
    "type": "bullets",
    "eyebrow": "ASSUMPTIONS",
    "title": "What the Basic Leslie Model Assumes",
    "items": [
      "<b>Discrete time steps</b> matching the age-class interval (e.g., annual census, annual age classes)",
      "<b>Constant vital rates</b>: Fx and Px do not change across time steps (no density dependence, no environmental variation)",
      "<b>Female-only</b> (or one-sex) accounting is typical — Fx and Px describe the female segment, assuming a stable sex ratio",
      "Individuals in the oldest age class either die (no further Px) or, in some formulations, remain and reproduce (a terminal self-loop)"
    ]
  },
  {
    "type": "term",
    "eyebrow": "A SUBTLETY",
    "title": "Pre-Breeding vs. Post-Breeding Census",
    "term": "Census Timing",
    "def": "Whether the population is counted just before or just after the annual reproductive pulse changes exactly how Fx is defined.",
    "bullets": [
      "<b>Pre-breeding census</b>: age-0 individuals are counted right after birth, before the next round of mortality — Fx = mx·Px is often used to account for survival of both mother and offspring to the count",
      "<b>Post-breeding census</b>: age-0 individuals are counted at the end of the year, so Fx = mx alone (the convention used in today's example)",
      "Always check which convention a data source or software package assumes before building L"
    ]
  },
  {
    "type": "section",
    "tag": "PART 3",
    "title": "A Worked Numerical Example",
    "sub": "From life table to Leslie matrix to population projection"
  },
  {
    "type": "bullets",
    "eyebrow": "SETUP",
    "title": "Starting From the Lecture 14 Life Table",
    "items": [
      "Recall a simple 3-age-class life table (ages 0, 1, 2) with survivorship lx and fecundity mx",
      "lx: l0 = 1.0, l1 = 0.5, l2 = 0.2 — the same schedule used to calculate R0 in Lecture 14",
      "mx: m0 = 0 (pre-reproductive), m1 = 2.0 offspring/female, m2 = 3.0 offspring/female",
      "We will convert these into the entries of a 3×3 Leslie matrix"
    ]
  },
  {
    "type": "term",
    "eyebrow": "STEP 1",
    "title": "Converting Survivorship Into Px",
    "term": "Px = lx+1 / lx",
    "def": "Survival probability is the conditional chance of surviving from age x to age x+1, given survival to age x.",
    "bullets": [
      "P0 = l1 / l0 = 0.5 / 1.0 = 0.5",
      "P1 = l2 / l1 = 0.2 / 0.5 = 0.4",
      "These become the subdiagonal entries of the Leslie matrix"
    ]
  },
  {
    "type": "term",
    "eyebrow": "STEP 2",
    "title": "Assigning the Fecundity Row",
    "term": "F1 = 2.0, F2 = 3.0",
    "def": "Using the simplified convention Fx = mx, the fecundity values from Lecture 14 populate the top row directly.",
    "bullets": [
      "F0 = 0 (age-0 individuals do not reproduce)",
      "F1 = m1 = 2.0",
      "F2 = m2 = 3.0"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "STEP 3",
    "title": "The Assembled 3×3 Leslie Matrix",
    "left": {
      "h": "Matrix L",
      "body": "| 0    2.0  3.0 |\n| 0.5   0    0  |\n|  0   0.4   0  |\n\nRow 1 = fecundities (F0, F1, F2)\nRow 2 = P0 on the subdiagonal\nRow 3 = P1 on the subdiagonal"
    },
    "right": {
      "h": "Initial population vector",
      "body": "Start with a hypothetical cohort of 100 newborns and no older individuals:\n\nn(0) = [100, 0, 0]ᵀ\n\nN(0) = 100"
    }
  },
  {
    "type": "bullets",
    "eyebrow": "ITERATION 1",
    "title": "Projecting One Time Step: n(1) = L·n(0)",
    "items": [
      "n0(1) = F0·100 + F1·0 + F2·0 = 0(100) + 2(0) + 3(0) = 0",
      "n1(1) = P0·n0(0) = 0.5 × 100 = 50",
      "n2(1) = P1·n1(0) = 0.4 × 0 = 0",
      "Result: n(1) = [0, 50, 0]ᵀ, N(1) = 50 — the whole cohort simply aged forward one step"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "ITERATION 2",
    "title": "Projecting the Next Step: n(2) = L·n(1)",
    "items": [
      "n0(2) = 2(50) + 3(0) = 100 — the age-1 survivors now reproduce",
      "n1(2) = 0.5 × 0 = 0",
      "n2(2) = 0.4 × 50 = 20",
      "Result: n(2) = [100, 0, 20]ᵀ, N(2) = 120 — the population has grown and now spans all three age classes"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "ITERATIONS 3–5",
    "title": "Continuing the Projection by Hand",
    "items": [
      "n(3): n0 = 2(0)+3(20) = 60; n1 = 0.5(100) = 50; n2 = 0.4(0) = 0 → n(3) = [60, 50, 0]ᵀ, N(3) = 110",
      "n(4): n0 = 2(50)+3(0) = 100; n1 = 0.5(60) = 30; n2 = 0.4(50) = 20 → n(4) = [100, 30, 20]ᵀ, N(4) = 150",
      "n(5): n0 = 2(30)+3(20) = 120; n1 = 0.5(100) = 50; n2 = 0.4(30) = 12 → n(5) = [120, 50, 12]ᵀ, N(5) = 182",
      "Each step is the same mechanical operation: multiply the matrix by the current vector to get the next"
    ]
  },
  {
    "type": "compare",
    "eyebrow": "THE FULL PROJECTION",
    "title": "Age Distribution Over Six Time Steps",
    "headers": [

// RENDER ENGINE

function esc(s){ return s; } // bullets allow inline <b> tags intentionally

function renderSlide(s, idx){
  let inner = "";
  switch(s.type){

    case "title":
      inner = `
        <div class="center-stage">
          <span class="tag">${s.eyebrow||""}</span>
          <div class="big-word">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
          <div class="footnote">${s.footnote||""}</div>
        </div>`;
      break;

    case "section":
      inner = `
        <div class="center-stage">
          <span class="tag gold">${s.tag||"Section"}</span>
          <div class="big-word" style="font-size:2.6rem;">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
        </div>`;
      break;

    case "bullets":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content"><ul class="bullets">
          ${s.items.map(i=>`<li>${i}</li>`).join("")}
        </ul></div>`;
      break;

    case "term":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <div class="term-box">
            <span class="term">${s.term}</span>
            <span class="def">${s.def}</span>
          </div>
          ${s.bullets ? `<ul class="bullets sub">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
        </div>`;
      break;

    case "twocol":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="two-col">
          <div class="col-box"><h3>${s.left.h}</h3><p>${s.left.body}</p></div>
          <div class="col-box"><h3>${s.right.h}</h3><p>${s.right.body}</p></div>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "compare":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <table class="compare">
            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Population Ecology · BIOL 4XX</span>
        <span>Lecture 15</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>

  {

  },
  {
    "type": "term",
    "eyebrow": "The new column",
    "title": "Age-Specific Fecundity",
    "term": "mx",
    "def": "The average number of offspring produced by a surviving individual of age x during the interval from age x to age x+1 — often restricted to female offspring per female (in a female-only life table).",
    "bullets": [
      "mx is conditional on being alive at age x — it says nothing about the probability of reaching age x in the first place; that information lives entirely in lx.",
      "Because most demographic life tables track only the female segment of the population (assuming males do not limit reproduction), mx is usually defined as daughters per female, not total offspring per individual.",
      "mx = 0 for pre-reproductive age classes (juveniles) and for any age class past the end of the reproductive lifespan (post-reproductive individuals, where they exist).",
      "Unlike lx, which is constrained to decline monotonically from 1 toward 0, mx can rise, fall, spike, or stay flat across age — its shape is a direct signature of a species' life history strategy."

  },
  {
    "type": "bullets",
    "eyebrow": "Getting the numbers",
    "title": "Measuring mx in the Field",
    "items": [
      "mx is estimated by tracking a cohort (or a cross-sectional sample of ages) and counting offspring produced by individuals of each age class over one time interval.",
      "For organisms with discrete breeding seasons (most temperate birds, mammals, annual plants), mx is naturally measured per breeding season, matching the same time step used for lx.",
      "For continuously breeding organisms, mx must be measured over a matching, consistently defined interval (e.g., births per female per year) so that lx and mx line up on the same age axis.",
      "Only female offspring are typically counted when constructing a female-based life table, since it is female survival and reproduction that determines the growth of most sexually reproducing populations under a 1:1 sex ratio assumption.",

    "type": "bullets",
    "eyebrow": "Shapes to expect",
    "title": "Patterns of mx Across Taxa",
    "items": [
      "Many organisms show mx = 0 through a juvenile pre-reproductive period, then a rise to a peak at some optimal reproductive age, then a decline in old age (senescence) — a hump-shaped curve.",
      "Some organisms (many perennial plants, large long-lived vertebrates) show mx increasing with age or body size for most of the lifespan, as larger/older individuals can provision more offspring.",
      "Organisms with a single reproductive bout (annual plants, Pacific salmon, periodical cicadas) show mx = 0 at every age except one, where it spikes to a large value — reproduction concentrated entirely at one age.",
      "Some long-lived species (e.g., some whales, humans) show a post-reproductive stage where mx returns to 0 well before death — lx continues to decline after mx has already hit zero.",
      "None of these shapes can be inferred from lx alone — mx is independent empirical information that must be measured separately."
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Two axes of the life table",
    "title": "lx and mx Are Complementary, Not Redundant",
    "left": {
      "h": "lx — the survival axis",
      "body": "lx answers: 'of individuals born together, what fraction is still alive at age x?' It always starts at 1.00 (or close to it) and can only decline or stay flat with age — it never increases. lx alone was the entire subject of Lecture 13."
    },
    "right": {
      "h": "mx — the reproduction axis",
      "body": "mx answers: 'given an individual is alive at age x, how many offspring does it produce?' It has no such monotonic constraint — it can be zero, rise, fall, or spike at any age. mx alone tells us nothing about how many individuals actually reach that age."
    }
  },
  {
    "type": "bullets",
    "eyebrow": "Merging the two columns",
    "title": "Building the Combined Life Table",
    "items": [
      "The combined life table lists age class x down the rows, with lx and mx as adjacent columns, both measured on the same age axis and time step.",
      "A third derived column, <b>lx·mx</b>, gives the expected number of offspring produced by age x per individual <i>originally in the cohort</i> (not just per survivor) — this is the column that matters for population-level reproduction.",
      "lx·mx is what converts 'reproduction by survivors' (mx) into 'reproduction by the average newborn, accounting for the chance it never gets there' (lx·mx) — the same logic as expected value in probability.",

    ]
  },
  {
    "type": "section",
    "tag": "Part 3",
    "title": "Net Reproductive Rate, R0",
    "sub": "How many offspring does a newborn expect to leave, over its whole life?"
  },
  {
    "type": "term",
    "eyebrow": "The central quantity",
    "title": "Net Reproductive Rate",
    "term": "R0 = Σ(lx · mx)",
    "def": "The average number of offspring produced by an individual over its entire lifetime, summed across all age classes, with reproduction at each age discounted by the probability of surviving to that age.",
    "bullets": [
      "R0 is computed by summing the lx·mx column across every age class in the life table — one number that compresses the whole combined life table into a single measure of reproductive performance.",

    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Reading the number",
    "title": "Interpreting R0: Growing, Stable, Declining",
    "items": [
      "<b>R0 > 1</b>: on average, each individual more than replaces itself — the population is growing from one generation to the next.",
      "<b>R0 = 1</b>: on average, each individual exactly replaces itself — the population is stationary generation over generation.",
      "<b>R0 < 1</b>: on average, each individual fails to replace itself — the population is declining generation over generation, and will trend toward extinction if R0 stays below 1.",

    ]
  },
  {
    "type": "cards",
    "eyebrow": "Three regimes",
    "title": "What R0 Tells You About Population Trajectory",
    "cards": [
      {
        "h": "R0 > 1 — Growing",
        "p": "Each newborn leaves more than one replacement on average; abundance rises generation after generation, all else equal."
      },
      {
        "h": "R0 = 1 — Stationary",
        "p": "Each newborn exactly replaces itself; abundance is unchanged generation after generation — the population's demographic equilibrium."
      },
      {
        "h": "R0 < 1 — Declining",
        "p": "Each newborn fails to replace itself; abundance falls generation after generation, trending toward local extinction if sustained."
      }
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Why not just average mx",
    "title": "Why R0 Uses lx·mx, Not mx Alone",
    "items": [
      "A species could have an enormous mx at, say, age 5 — but if lx at age 5 is nearly zero (almost nobody survives that long), that reproductive potential barely contributes to R0.",
      "Summing raw mx values across ages would badly overstate lifetime reproduction, because it ignores the attrition that survivorship imposes before those ages are ever reached.",
      "This is exactly why the life table needed both columns: lx supplies the 'how many are still around to reproduce,' and mx supplies 'how much do they reproduce if they are' — R0 multiplies them together age by age before summing.",

    ]
  },

    "type": "bullets",
    "eyebrow": "What R0 does not tell you",
    "title": "R0 Is Not a Rate — Units and Caveats",

    ]
  },
  {
    "type": "section",
    "tag": "Part 4",
    "title": "Generation Time and the Euler-Lotka Equation",
    "sub": "Converting R0 into r — closing the loop to exponential growth"

  {
    "type": "term",
    "eyebrow": "Timing reproduction",
    "title": "Generation Time (T)",
    "term": "T ≈ Σ(x·lx·mx) / R0",
    "def": "The mean age of the parents of all offspring produced by a cohort — a weighted average age of reproduction, where the weights are the expected reproductive output (lx·mx) at each age.",
    "bullets": [

      "The numerator, Σ(x·lx·mx), sums each age x multiplied by that age's contribution to lifetime reproduction; dividing by R0 (the total contribution) converts this into a weighted mean age.",

    ]
  },
  {
    "type": "bullets",
    "eyebrow": "From the life table",
    "title": "Computing T from the Life Table",
    "items": [

      "Sum the x·lx·mx column across all ages to get the numerator; sum the lx·mx column (already computed) to get R0, the denominator.",

      "Because T is reproduction-weighted, an age class contributes to T only in proportion to how much it contributes to R0 — an age class with lx·mx = 0 (pre- or post-reproductive) contributes nothing to T, regardless of how many individuals are alive at that age."
    ]
  },
  {
    "type": "term",
    "eyebrow": "The exact solution",
    "title": "The Euler-Lotka Equation",
    "term": "Σ e^(−rx) · lx · mx = 1",
    "def": "The equation that must be satisfied by the intrinsic rate of increase r, given a population's full age-specific survivorship (lx) and fecundity (mx) schedule — solved by finding the value of r that makes the weighted sum equal exactly 1.",
    "bullets": [

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Population Ecology · BIOL 4XX</span>
        <span>Lecture 14</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>
</body>

  {
    "type": "bullets",
    "eyebrow": "Recap — Chapter 10",

    "items": [

      "Case studies included Darwin's finches (beak size tracking rainfall and seed hardness) and guppies (predation-driven shifts in life history)",

  },
  {
    "type": "bullets",
    "eyebrow": "Setting the Stage",
    "title": "What Do We Mean by \"Sex\"?",
    "items": [
      "In evolutionary biology, sex specifically means genetic recombination — the mixing of genetic material from two parents to produce offspring",
      "This is distinct from mating behavior; some organisms recombine DNA without anything resembling animal courtship (e.g., bacteria, fungi)",
      "Sexual reproduction in eukaryotes involves meiosis (halving chromosome number) and fertilization (restoring it), with recombination in between",
      "Contrast with asexual reproduction: offspring are genetic clones of a single parent, produced by mitosis (budding, fission, parthenogenesis)",
      "The vast majority of eukaryotic species reproduce sexually at least some of the time — this near-universality is itself a clue and a puzzle"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Key Concept",
    "title": "The Twofold Cost of Sex",
    "term": "Twofold Cost of Sex",
    "def": "The demographic disadvantage faced by sexual females relative to asexual females: a sexual female passes on only 50% of her genome to each offspring (the other 50% comes from her mate), while an asexual female passes on 100% of her genome to every offspring, and every offspring she produces is itself a reproducing female.",
    "bullets": [
      "First introduced briefly in Evolution I, Lecture 16 — today we examine it rigorously",
      "Also called the \"cost of males,\" since males contribute genes but (in most species) not direct parental investment in offspring production",
      "Under this cost alone, an asexual mutant arising in a sexual population should double in frequency every generation relative to sexual competitors"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Working the Numbers",
    "title": "The Math Intuition Behind the Cost",
    "left": {
      "h": "Sexual Population",
      "body": "<p>Assume each female mates and produces 2 offspring, roughly 1 son and 1 daughter.</p><ul><li>Only the daughter carries forward the reproductive lineage</li><li>Each offspring is only 50% related to its mother (the other 50% from the father)</li><li>Population growth rate per female lineage: effectively halved each generation relative to a clonal alternative</li></ul>"
    },
    "right": {
      "h": "Asexual Population",
      "body": "<p>An asexual (parthenogenetic) female produces 2 offspring, both daughters, both exact clones.</p><ul><li>100% of her genome passed to each offspring</li><li>Both offspring are reproducing females — no \"wasted\" male offspring</li><li>Under identical resource conditions, an asexual lineage's numbers double relative to a sexual lineage each generation</li></ul>"
    }
  },
  {
    "type": "bullets",
    "eyebrow": "The Core Puzzle",
    "title": "The Paradox, Stated Plainly",
    "items": [
      "If asexual reproduction is twice as efficient at converting resources into descendant gene copies, selection should rapidly eliminate sex wherever an asexual mutant arises",
      "Yet roughly 99% of eukaryotic species reproduce sexually, at least facultatively — obligate asexuality is rare and evolutionarily short-lived (with a few striking exceptions we'll discuss)",
      "This mismatch between theoretical prediction and observed reality is one of the longest-standing open problems in evolutionary biology",
      "John Maynard Smith called it \"the queen of problems in evolutionary biology\" — a title that has stuck in the field ever since",
      "Solving it requires finding a compensating benefit to sex large enough to outweigh a 2x reproductive handicap every single generation"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Two Distinct Questions",
    "title": "Origin of Sex vs. Maintenance of Sex",
    "left": {
      "h": "Origin of Sex",
      "body": "<p>How and why did recombination first evolve in early eukaryotes?</p><ul><li>Occurred roughly 1–2 billion years ago, likely in a single-celled common ancestor of all eukaryotes</li><li>Probably favored because early cells were haploid and simple, so the twofold cost barely applied — sex may have originated for DNA repair or to reset genome damage</li><li>This is fundamentally a historical, one-time evolutionary event</li></ul>"
    },
    "right": {
      "h": "Maintenance of Sex",
      "body": "<p>Given that the twofold cost now applies to complex, diploid, sexually differentiated organisms, why hasn't selection eliminated sex since then?</p><ul><li>An ongoing, recurring evolutionary problem, not a one-time event</li><li>Must be re-solved in every lineage, every generation, against constant pressure from potential asexual mutants</li><li>This is the focus of essentially all modern research and of today's lecture</li></ul>"
    }
  },
  {
    "type": "bullets",
    "eyebrow": "Why the Distinction Matters",
    "title": "Don't Conflate the Two Questions",
    "items": [
      "A hypothesis that explains the origin of sex does not automatically explain its maintenance, and vice versa",
      "For example, DNA repair benefits may have mattered enormously at the origin (in simple, small-genome organisms) but be a minor factor in large, complex animals today",
      "Conversely, Red Queen dynamics with coevolving parasites likely couldn't have driven the very first appearance of sex, since parasite-host arms races require established ecological complexity",
      "Most current hypotheses are aimed squarely at the maintenance problem — explaining why sex is stable now, not how it began",
      "Keep this distinction in mind as we evaluate each hypothesis's evidence"
    ]
  },
  {
    "type": "cards",
    "eyebrow": "Beyond the Twofold Cost",
    "title": "Sex Has Other Costs Too",
    "cards": [
      {
        "h": "Finding a Mate",
        "p": "Time, energy, and risk spent searching for and attracting mates — courtship displays, territory defense, and travel all divert resources from growth or offspring production."
      },
      {
        "h": "Breaking Up Good Combinations",
        "p": "Recombination shuffles gene combinations every generation, meaning a well-adapted genotype built up over generations can be broken apart in a single meiotic event."
      },
      {
        "h": "Disease and Predation Risk",
        "p": "Mating often requires close physical contact, increasing exposure to sexually transmitted pathogens and predators that target conspicuous mating displays."
      },
      {
        "h": "Genetic Conflict",
        "p": "Combining two parents' genomes creates opportunities for selfish genetic elements, meiotic drive, and parent-offspring or sexual conflict — topics we return to in Lecture 6."
      }
    ]
  },
  {
    "type": "section",
    "tag": "The Search for Compensating Benefits",
    "title": "Hypotheses for the Maintenance of Sex",
    "sub": "If sex is so costly, it must generate a countervailing genetic advantage. Four major hypotheses dominate the literature — none universally accepted, all empirically testable."
  },
  {
    "type": "term",
    "eyebrow": "Hypothesis 1",
    "title": "The Red Queen Hypothesis",
    "term": "Red Queen Hypothesis",
    "def": "The idea that sex is maintained because it generates novel genetic combinations each generation, allowing hosts to keep pace with rapidly coevolving parasites and pathogens — named for the Red Queen in Lewis Carroll's Through the Looking-Glass, who must run constantly just to stay in place.",
    "bullets": [
      "Proposed by Leigh Van Valen (1973) originally for a broader coevolutionary pattern; later applied specifically to sex by W.D. Hamilton and colleagues",
      "Parasites evolve rapidly to exploit the most common host genotype; sex lets hosts generate rare, novel genotypes that parasites haven't yet adapted to",

    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Mechanism",
    "title": "How the Red Queen Dynamic Works",
    "left": {
      "h": "The Coevolutionary Arms Race",
      "body": "<p>Parasites have short generation times and huge population sizes, letting them evolve to exploit common host genotypes quickly.</p><ul><li>An asexual host lineage produces genetically uniform offspring — an easy, stable target for parasite adaptation</li><li>Once a parasite \"cracks\" that genotype, it can sweep through the entire clonal lineage</li></ul>"
    },
    "right": {
      "h": "Sex as a Moving Target",
      "body": "<p>Sexual reproduction reshuffles host genotypes every generation via recombination.</p><ul><li>Offspring genotypes are novel combinations that current parasite strains are not yet adapted to exploit</li><li>This constant genetic novelty keeps the host population one step ahead — even though average fitness never permanently improves, since parasites keep catching up</li></ul>"
    }
  },
  {
    "type": "bullets",
    "eyebrow": "Testing the Red Queen",
    "title": "Evidence: The New Zealand Mud Snail",
    "items": [
      "Potamopyrgus antipodarum is a freshwater snail with both sexual and asexual (clonal) populations coexisting in the same lakes — an ideal natural experiment",

  },
  {
    "type": "cards",
    "eyebrow": "Case Study Detail",
    "title": "Why the Mud Snail System Is So Convincing",
    "cards": [
      {
        "h": "Natural Coexistence",
        "p": "Sexual and clonal snails live side by side in the same lake, sharing habitat and resources — controlling for many confounding ecological variables."

        "h": "Direct Fitness Cost",

      {
        "h": "Frequency-Dependence Confirmed",
        "p": "Common clonal genotypes suffered disproportionately higher infection rates over time, the signature prediction of Red Queen dynamics."

        "h": "Cross-Lake Replication",

      }
    ]
  },

    "title": "Muller's Ratchet",
    "term": "Muller's Ratchet",
    "def": "The irreversible, one-directional accumulation of deleterious mutations in small asexual populations, arising because asexual lineages have no mechanism to produce mutation-free offspring once every individual in the lineage carries at least one harmful mutation.",

    "type": "twocol",

    "eyebrow": "Testing Muller's Ratchet",

      "Prediction: purely asexual lineages should accumulate mutation load and go extinct relatively quickly — so ancient, long-lived asexual clades should be rare",

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Evolution II · BIOL 2XY</span>
        <span>Lecture 5</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>
</body>

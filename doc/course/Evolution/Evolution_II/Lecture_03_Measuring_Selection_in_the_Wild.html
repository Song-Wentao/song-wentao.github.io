    "type": "bullets",

    ]

  {
    "type": "quote",

    "quote": "To say that a trait is 'under selection' is a hypothesis. To say by how much, and in what direction, relative to which other traits — that is a measurement.",

  {
    "type": "section",
    "tag": "PART 2",
    "title": "The Selection Differential (S)",

  {
    "type": "term",
    "eyebrow": "KEY TERM",
    "title": "Selection Differential (S)",
    "term": "Selection differential, S",
    "def": "The covariance between an individual's trait value and its relative fitness; equivalently, the difference between the mean trait value of selected (surviving/reproducing) individuals and the mean trait value of the population before selection.",
    "bullets": [
      "S = cov(z, w), where z is the trait and w is relative fitness (individual fitness divided by mean population fitness)",
      "Equivalently: S = z̄(after selection) − z̄(before selection)",
      "Units are in the original trait units (mm, g, days), making S intuitive but not directly comparable across traits",
      "S is a purely descriptive, phenotypic statistic — it says nothing yet about genetics or causation"
    ]
  },

    "type": "bullets",
    "eyebrow": "MECHANICS",
    "title": "How S Is Actually Measured in the Field",
    "items": [
      "Step 1: capture, mark, and measure a trait (e.g., beak depth, body size, wing length) on a large sample at the start of a fitness-relevant period",
      "Step 2: track survival, mating success, or offspring number for each marked individual (a season, a year, or a lifetime)",
      "Step 3: convert absolute fitness (e.g., number of offspring) to relative fitness by dividing by the population mean",
      "Step 4: compute the covariance (or the mean-difference formula) between trait value and relative fitness",
      "A positive S means individuals with larger trait values had higher relative fitness; negative S means smaller values were favored"
    ]
  },

    "type": "twocol",
    "eyebrow": "WORKED NUMBERS",
    "title": "A Simple S Calculation",
    "left": {
      "h": "Before selection (n = 200 finches)",
      "body": "<p>Mean beak depth z̄ = 9.4 mm</p><ul><li>Drought year: only large-seeded, hard fruits available</li><li>Survivors of the dry season are recaptured 6 months later</li></ul>"
    },
    "right": {
      "h": "After selection (survivors, n = 84)",
      "body": "<p>Mean beak depth z̄' = 10.1 mm</p><ul><li>S = z̄' − z̄ = 10.1 − 9.4 = <strong>+0.7 mm</strong></li><li>Positive S: selection favored deeper beaks during the drought</li></ul>"
    }
  },
  {
    "type": "bullets",
    "eyebrow": "IMPORTANT CAVEAT",
    "title": "What S Does — and Does Not — Tell You",
    "items": [
      "S measures the total selection acting on a trait, including selection that is only apparent because the trait is correlated with some other, unmeasured trait under direct selection",
      "Example: if beak depth is correlated with overall body size, and body size is what predators/starvation actually 'sees,' S on beak depth will be nonzero even if beak depth itself has no causal effect on survival",
      "This is the central limitation that motivated Lande & Arnold's extension from S to β",
      "S answers 'is this trait associated with fitness?' — not 'does this trait causally affect fitness, independent of other traits?'"
    ]
  },
  {
    "type": "section",
    "tag": "PART 3",
    "title": "The Selection Gradient (β)",
    "sub": "Disentangling direct selection from correlated selection"
  },
  {
    "type": "term",
    "eyebrow": "KEY TERM",
    "title": "Selection Gradient (β)",
    "term": "Selection gradient, β",
    "def": "The partial regression coefficient of relative fitness on a trait, holding all other measured traits constant; it estimates the direct, causal strength of selection acting on that trait alone.",

      "Each βᵢ is the slope on trait i after statistically controlling for correlations with all other traits in the model",
      "Because traits are standardized (mean 0, variance 1) before analysis, β values are directly comparable across traits with different units",
      "Introduced formally by Russell Lande and Stevan Arnold (1983, Evolution) as the standard method for multivariate selection analysis"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "LANDE & ARNOLD (1983) FRAMEWORK",
    "title": "Selection Differential vs. Selection Gradient",
    "left": {
      "h": "S — Selection Differential",
      "body": "<p><strong>What it is:</strong> total (bivariate) covariance between one trait and relative fitness</p><ul><li>Includes direct selection on the trait itself</li><li>Includes indirect selection 'borrowed' via correlation with other selected traits</li><li>Easy to compute; needs only one trait and fitness data</li><li>Cannot distinguish cause from correlation</li></ul>"
    },
    "right": {
      "h": "β — Selection Gradient",
      "body": "<p><strong>What it is:</strong> partial regression coefficient, controlling for all other measured traits</p><ul><li>Isolates direct selection on the focal trait</li><li>Removes the contribution of trait correlations</li><li>Requires simultaneous measurement of multiple, potentially correlated traits</li><li>Only as good as the set of traits included in the model — 'unmeasured confounds' can still bias β</li></ul>"

      "This matrix algebra is the same logic used for the breeder's equation extended to multiple traits (multivariate breeder's equation: Δz̄ = Gβ, with G the genetic covariance matrix)"
    ]
  },

    "type": "twocol",
    "eyebrow": "CLASSIC ILLUSTRATION",
    "title": "When S and β Disagree: A Cautionary Case",

      "body": "<p>Suppose tail length and body size are positively correlated in a bird population.</p><ul><li>Long-tailed birds happen to survive better (positive S for tail length)</li><li>Conclusion if you stop here: 'long tails are directly favored by selection'</li></ul>"

      "h": "What the gradient reveals",
      "body": "<p>Multiple regression controlling for body size shows β for tail length ≈ 0.</p><ul><li>The true target of selection is body size (β for body size is large and positive)</li><li>Tail length only appeared under selection because it correlates with body size</li><li>This is exactly the scenario Lande & Arnold's method was designed to catch</li></ul>"

        "p": "Subtract the mean and divide by the standard deviation (z-scores); resulting β is in units of standard deviations of selection per generation."

        "h": "Why it matters",
        "p": "Without standardization, a β for beak depth (mm) and a β for body mass (g) cannot be meaningfully compared — standardization puts all traits on the same scale."

    ]

    "type": "section",

      "Distinct from Sewall Wright's population-level adaptive landscape (genotype/allele-frequency space) — this is a phenotype-fitness surface for a single population at a point in time",

  },

      "This is the standard method (Lande & Arnold 1983; Phillips & Arnold 1989) for estimating nonlinear selection in wild populations"
    ]

        "h": "Stabilizing (γ < 0)",
        "p": "Fitness peaks at an intermediate value and declines on both sides; negative quadratic coefficient. Fitness surface is a dome/hill with the population sitting near the peak."

        "h": "Disruptive (γ > 0)",

    "left": {
      "h": "Single peak (stabilizing on both axes)",
      "body": "<p>Contour lines form closed ellipses/circles around one optimum combination of trait 1 and trait 2.</p><ul><li>Selection pulls the population toward the peak from any direction</li><li>Common for traits under strong functional/biomechanical constraints (e.g., beak shape trade-offs)</li></ul>"

function esc(s){ return s; } // bullets allow inline <b> tags intentionally

function renderSlide(s, idx){
  let inner = "";
  switch(s.type){

    case "title":
      inner = `
        <div class="center-stage">
          <span class="tag">${s.eyebrow||""}</span>
          <div class="big-word">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
          <div class="footnote">${s.footnote||""}</div>
        </div>`;
      break;

    case "section":
      inner = `
        <div class="center-stage">
          <span class="tag gold">${s.tag||"Section"}</span>
          <div class="big-word" style="font-size:2.6rem;">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
        </div>`;
      break;

    case "bullets":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content"><ul class="bullets">
          ${s.items.map(i=>`<li>${i}</li>`).join("")}
        </ul></div>`;
      break;

    case "term":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <div class="term-box">
            <span class="term">${s.term}</span>
            <span class="def">${s.def}</span>
          </div>
          ${s.bullets ? `<ul class="bullets sub">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
        </div>`;
      break;

    case "twocol":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="two-col">
          <div class="col-box"><h3>${s.left.h}</h3><p>${s.left.body}</p></div>
          <div class="col-box"><h3>${s.right.h}</h3><p>${s.right.body}</p></div>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "compare":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <table class="compare">
            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Evolution II · BIOL 2XY</span>
        <span>Lecture 3</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>

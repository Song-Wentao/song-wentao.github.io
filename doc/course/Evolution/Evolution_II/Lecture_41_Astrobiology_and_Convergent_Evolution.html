    "bullets": [
      "Lithopanspermia (rock-based transfer within a solar system) has real supporting evidence: confirmed Martian meteorites have been found on Earth, and some microbial spores/lichens have survived simulated space-exposure experiments",
      "Interstellar panspermia remains far more speculative, given the enormous transit times and radiation exposure involved, though it cannot be entirely excluded for hardy dormant forms",
      "Panspermia does not explain the origin of life (abiogenesis) — it only relocates the problem to wherever the transfer originated, making it a transport hypothesis rather than an origin hypothesis",
      "For this lecture's purposes, panspermia is the key confound that must be ruled out before any claim of independently convergent alien evolution can be taken seriously"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "A FINAL METHODOLOGICAL NOTE",
    "title": "How to Argue About Alien Life Like a Scientist, Not a Screenwriter",
    "items": [
      "Always specify the level of claim being made: process-level (selection operates), functional-level (some form of sensing/locomotion is favored), or structural-level (a camera eye with opsins) — confidence should decrease sharply from process to structure",
      "Always ask whether a proposed 'universal' pattern could instead be an artifact of shared ancestry (panspermia) or a single contingent starting point (LUCA) rather than genuine independent convergence",
      "Always distinguish a falsifiable, testable prediction (a specific atmospheric biosignature ratio) from an appealing but untestable narrative (what an alien 'probably looks like') — astrobiology's scientific credibility rests on preferring the former",
      "This same discipline — separating universal process from contingent outcome, and testable prediction from appealing story — is the same critical-thinking skill this course has asked you to apply to Earth's own evolutionary history all year"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "END-OF-LECTURE SUMMARY",
    "title": "Key Takeaways From Today",
    "items": [
      "Astrobiology applies evolutionary biology beyond Earth by separating what is logically/mathematically necessary about selection from what is a contingent historical fact about Earth's specific biochemistry",
      "Natural selection itself (given replication, heredity, and variation) is the strongest candidate for a near-universal principle; the genetic code, DNA, and common descent from LUCA are much more clearly Earth-specific contingencies",
      "The Gould-vs-Conway-Morris tape-of-life debate remains unresolved but productively reframed: contingency dominates at the molecular level, convergence dominates at the functional level — exactly what Lenski's LTEE demonstrated in miniature",
      "Earth's convergent evolution (eyes, flight, C4 photosynthesis, echolocation, and more) is our best — and only — evidence base for what might be predictable about life elsewhere, but it is convergence within a single biochemical toolkit and cannot be assumed to generalize to alternative chemistries",
      "Rigorous astrobiology builds tiered, falsifiable predictions (biosignatures, chirality tests) rather than confident narratives about alien anatomy, and treats questions like the Rare Earth Hypothesis and the Fermi Paradox as open, not settled",
      "The deepest value of this lecture is methodological: it forces precise thinking about what evolutionary theory actually claims, and at what level of generality those claims can be defended"
    ]
  },
  {
    "type": "section",
    "tag": "NEXT LECTURE",
    "title": "Lecture 42: Student Presentations I",
    "sub": "The Applied & Synthesis unit shifts to student-led work — teams present independent research projects applying course concepts to a self-selected case study. Come prepared with feedback for your peers."
  }
];

// =====================================================================
// RENDER ENGINE
// =====================================================================
function esc(s){ return s; } // bullets allow inline <b> tags intentionally

function renderSlide(s, idx){
  let inner = "";
  switch(s.type){

    case "title":
      inner = `
        <div class="center-stage">
          <span class="tag">${s.eyebrow||""}</span>
          <div class="big-word">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
          <div class="footnote">${s.footnote||""}</div>
        </div>`;
      break;

    case "section":
      inner = `
        <div class="center-stage">
          <span class="tag gold">${s.tag||"Section"}</span>
          <div class="big-word" style="font-size:2.6rem;">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
        </div>`;
      break;

    case "bullets":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content"><ul class="bullets">
          ${s.items.map(i=>`<li>${i}</li>`).join("")}
        </ul></div>`;
      break;

    case "term":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <div class="term-box">
            <span class="term">${s.term}</span>
            <span class="def">${s.def}</span>
          </div>
          ${s.bullets ? `<ul class="bullets sub">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
        </div>`;
      break;

    case "twocol":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="two-col">
          <div class="col-box"><h3>${s.left.h}</h3><p>${s.left.body}</p></div>
          <div class="col-box"><h3>${s.right.h}</h3><p>${s.right.body}</p></div>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "compare":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <table class="compare">
            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Evolution II · BIOL 2XY</span>
        <span>Lecture 41</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>

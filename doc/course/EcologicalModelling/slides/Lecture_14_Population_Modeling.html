// =====================================================================

const slides = [
  {
    "type": "title",
    "eyebrow": "Lecture 14",
    "title": "Population Modeling",
    "sub": "From dN/dt = rN to stage-structured matrices -- the loggerhead sea turtle model that redirected conservation policy",
    "footnote": "Ecological Modelling with R, Python, and Julia"
  },
  {
    "type": "section",
    "tag": "From Process Noise to Population Structure",
    "title": "Lecture 10 Modelled the Population as a Single Number",
    "sub": "Gompertz and Ricker state-space models tracked total abundance N(t) -- but a population is not one number, it is a mix of individuals in very different states"
  },
  {
    "type": "bullets",
    "eyebrow": "Quick Refresher",
    "title": "Unstructured Growth: dN/dt = rN and the Logistic",
    "items": [
      "Exponential growth dN/dt = rN: constant per-capita growth rate r, population grows (or shrinks) geometrically forever -- N(t) = N(0) e^(rt)",
      "Logistic growth dN/dt = rN(1 - N/K): growth rate declines as N approaches carrying capacity K, producing an S-shaped trajectory",
      "Both models treat the population as a single undifferentiated count -- every individual is assumed identical and equally likely to reproduce or die",
      "Most students have already met these in an introductory ecology course; today we go one level deeper"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Why Structure Matters",
    "title": "A Population of All Juveniles Behaves Nothing Like a Population of All Adults",
    "items": [
      "Real populations are mixtures of individuals differing in age, size, or developmental stage -- and these classes differ enormously in survival and reproduction",
      "A population dominated by newborns will grow differently over the next year than one dominated by breeding adults, even if total N is identical today",
      "Ignoring structure hides exactly the information conservation and management decisions need: which life stage is the population's weak link?",
      "Structured population models track a vector of stage- or age-specific abundances, not a single scalar N"
    ]
  },
  {
    "type": "term",
    "eyebrow": "The Age-Structured Case",
    "title": "The Leslie Matrix",
    "term": "Leslie matrix",
    "def": "A square projection matrix that advances a population vector classified by discrete AGE classes one time step forward: survival probabilities on the subdiagonal move individuals from age class i to age class i+1, and a top row of age-specific fecundities produces new age-0 individuals.",
    "bullets": [
      "Assumes age is the right way to classify individuals -- appropriate when age closely determines survival and reproduction",
      "Named for P.H. Leslie (1945), who formalized the age-structured matrix approach",
      "Every individual that survives an age class moves to exactly the next age class -- a rigid, deterministic bookkeeping structure"
    ]
  },
  {
    "type": "term",
    "eyebrow": "The Stage-Structured Generalization",
    "title": "The Lefkovitch Matrix",
    "term": "Lefkovitch matrix",
    "def": "A generalization of the Leslie matrix that classifies individuals by developmental STAGE (e.g. hatchling, juvenile, subadult, adult) rather than strict chronological age, allowing individuals to remain in the same stage for more than one time step (stasis) as well as advance to the next stage (growth).",
    "bullets": [
      "Appropriate whenever growth rate to the next stage varies among individuals -- e.g. a sea turtle's time as a 'juvenile' depends on food and temperature, not a fixed number of birthdays",
      "Diagonal entries = probability of surviving AND remaining in the same stage; subdiagonal entries = probability of surviving AND growing into the next stage",
      "The loggerhead sea turtle model used throughout this lecture is a Lefkovitch matrix, not a Leslie matrix"
    ]
  },
  {
    "type": "compare",
    "eyebrow": "Choosing a Structure",
    "title": "Leslie vs. Lefkovitch: Which Classification Fits Your Species?",
    "headers": [
      "",
      "Leslie (age-structured)",
      "Lefkovitch (stage-structured)"
    ],
    "rows": [
      [
        "Classification",
        "Discrete age classes (0,1,2,... years)",
        "Life-history stages (egg, juvenile, adult, ...)"
      ],
      [
        "Individuals per class",
        "Everyone moves up exactly one age each step",
        "Individuals can stay (stasis) or advance (growth)"
      ],
      [
        "Good fit when",
        "Age tightly predicts survival/fecundity",
        "Growth rate to maturity varies among individuals"
      ],
      [
        "Classic example",
        "Human demography, birds with fixed breeding age",
        "Sea turtles, trees, corals, many plants"
      ],
      [
        "Matrix structure",
        "Subdiagonal survival + top-row fecundity",
        "Diagonal stasis + subdiagonal growth + top-row fecundity"
      ]
    ]
  },
  {
    "type": "section",
    "tag": "The Textbook Case Study",
    "title": "Loggerhead Sea Turtles and a Paper That Changed Policy",
    "sub": "Crouse, Crowder & Caswell (1987), Ecology 68(5):1412-1423 -- the most widely taught matrix population model in ecology"
  },
  {
    "type": "bullets",
    "eyebrow": "Background",
    "title": "Why Loggerheads? Why This Paper?",
    "items": [
      "Loggerhead sea turtles (Caretta caretta) nest on beaches but spend most of their multi-decade life cycle at sea, passing through pelagic and benthic juvenile stages before reaching sexual maturity",
      "By the 1980s, loggerhead populations were declining and conservation dollars were overwhelmingly spent protecting nests and hatchlings on beaches",
      "Crouse, Crowder & Caswell (1987) built a 5-stage Lefkovitch matrix model and asked a sharper question: which life stage, if protected, would do the most good for lambda?",
      "The answer surprised policymakers -- and this lecture reconstructs the model to show exactly how that answer was reached"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Read This Before Trusting Any Number on the Next 20 Slides",
    "title": "Where These Matrix Values Actually Come From",
    "term": "Data provenance",
    "def": "The 5-stage matrix used in this lecture is a RECONSTRUCTION built from memory to be representative of Crouse, Crowder & Caswell (1987)'s stage structure and qualitative conclusions (a declining population dominated by juvenile bycatch mortality) -- it is NOT claimed to reproduce the exact published matrix entries.",
    "bullets": [
      "Hatchling survival is set low (~0.6-0.7), survival increases through larger juvenile stages (~0.7-0.8), and adult survival is highest (~0.8), matching the qualitative pattern in real sea turtle demography",
      "Adult fecundity is discounted by egg-to-hatchling survival to keep numbers biologically plausible rather than reporting raw eggs-laid",
      "The resulting lambda (~0.95) is deliberately in the same regime the original paper reported: slightly below 1, i.e. a declining population under status-quo bycatch",
      "For the precise published numbers, consult Crouse, Crowder & Caswell (1987), Ecology 68(5):1412-1423, or Caswell's textbook 'Matrix Population Models', which reproduces this example in full"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "The Life Cycle",
    "title": "Five Stages, Five Very Different Survival Regimes",
    "items": [
      "Stage 1 -- Eggs/Hatchlings: laid on beaches, extremely vulnerable to predation and nest disturbance; the stage everyone historically focused on protecting",
      "Stage 2 -- Small juveniles: pelagic, drifting with ocean currents for years, cryptic and hard to study or protect directly",
      "Stage 3 -- Large juveniles: benthic, coastal foraging grounds -- this and the next stage overlap heavily with shrimp-trawling grounds",
      "Stage 4 -- Subadults: still growing toward maturity, still vulnerable to trawl bycatch, not yet reproducing",
      "Stage 5 -- Adults: breeding females returning to natal beaches to nest; highest survival of any stage, the only stage producing eggs"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Building the Model",
    "title": "The Lefkovitch Matrix in Base R",
    "left": {
      "h": "R -- matrix() with named dimnames",
      "body": "<pre><code>stage_names &lt;- c(&quot;Eggs/Hatchlings&quot;, &quot;Small Juv&quot;,\n  &quot;Large Juv&quot;, &quot;Subadult&quot;, &quot;Adult&quot;)\n\nA &lt;- matrix(c(\n  0.000, 0.000, 0.000, 1.000, 3.200,\n  0.675, 0.643, 0.000, 0.000, 0.000,\n  0.000, 0.107, 0.656, 0.000, 0.000,\n  0.000, 0.000, 0.094, 0.667, 0.000,\n  0.000, 0.000, 0.000, 0.133, 0.800\n), nrow = 5, ncol = 5, byrow = TRUE,\n   dimnames = list(stage_names, stage_names))</code></pre>"
    },
    "right": {
      "h": "Reading the Matrix",
      "body": "<p>Column j = stage at time t, row i = stage at time t+1. The diagonal holds stasis probabilities (survive and stay in the same stage); the subdiagonal holds growth probabilities (survive and advance to the next stage).</p><p>Row 1 holds fecundities: only Subadults and Adults contribute new hatchlings, with Adults (3.2) contributing far more than Subadults (1.0) per capita.</p>"
    }
  },
  {
    "type": "twocol",
    "eyebrow": "Building the Model",
    "title": "The Same Matrix in NumPy",
    "left": {
      "h": "Python -- numpy.array",
      "body": "<pre><code>import numpy as np\n\nstage_names = [&quot;Eggs/Hatchlings&quot;, &quot;Small Juv&quot;,\n    &quot;Large Juv&quot;, &quot;Subadult&quot;, &quot;Adult&quot;]\n\nA = np.array([\n    [0.000, 0.000, 0.000, 1.000, 3.200],\n    [0.675, 0.643, 0.000, 0.000, 0.000],\n    [0.000, 0.107, 0.656, 0.000, 0.000],\n    [0.000, 0.000, 0.094, 0.667, 0.000],\n    [0.000, 0.000, 0.000, 0.133, 0.800],\n])</code></pre>"
    },
    "right": {
      "h": "Same Numbers, Same Structure",
      "body": "<p>Deliberately identical matrix entries across R, Python, and Julia so results (lambda, stable stage distribution, elasticities) can be cross-checked line by line between languages.</p><p>Zero-indexing shifts row/column labels by one relative to R, but the biology and the matrix layout are unchanged.</p>"
    }
  },
  {
    "type": "twocol",
    "eyebrow": "Building the Model",
    "title": "The Same Matrix in Julia",
    "left": {
      "h": "Julia -- a literal Matrix{Float64}",
      "body": "<pre><code>stage_names = [&quot;Eggs/Hatchlings&quot;, &quot;Small Juv&quot;,\n    &quot;Large Juv&quot;, &quot;Subadult&quot;, &quot;Adult&quot;]\n\nA = [\n    0.000  0.000  0.000  1.000  3.200;\n    0.675  0.643  0.000  0.000  0.000;\n    0.000  0.107  0.656  0.000  0.000;\n    0.000  0.000  0.094  0.667  0.000;\n    0.000  0.000  0.000  0.133  0.800\n]</code></pre>"
    },
    "right": {
      "h": "Julia's Matrix Literal Syntax",
      "body": "<p>Semicolons separate rows, spaces separate columns -- Julia's native matrix literal is compact and reads almost identically to the mathematical notation used on the board.</p><p>Julia was not executed in the environment this lecture was authored in; the script is written carefully from documented <code>LinearAlgebra</code> APIs and mirrors the R/Python versions line for line.</p>"
    }
  },
  {
    "type": "bullets",
    "eyebrow": "The Core Operation",
    "title": "Population Projection: n(t+1) = A n(t)",
    "items": [
      "n(t) is a vector of five numbers: how many individuals are in each stage right now",
      "Multiplying the projection matrix A by n(t) produces n(t+1): every stage's survivors plus this year's new hatchlings, all in one matrix-vector product",
      "Iterating n(t+1) = A n(t) repeatedly projects the population arbitrarily far into the future under constant vital rates -- exactly analogous to iterating dN/dt = rN, but now for a whole vector instead of a scalar",
      "This is the same 'project forward with a fixed operator' idea as Lecture 10's Gompertz/Ricker state-space models, generalized from one number to a structured vector"
    ]
  },
  {
    "type": "term",
    "eyebrow": "The Long-Run Growth Rate",
    "title": "The Dominant Eigenvalue, lambda",
    "term": "Dominant eigenvalue (lambda)",
    "def": "The largest-magnitude eigenvalue of the projection matrix A. Once a population projected by n(t+1) = A n(t) has run long enough to lose its initial-condition memory, total population size grows (or shrinks) asymptotically by a factor of lambda every time step, exactly like r in dN/dt = rN but derived from the full stage structure.",
    "bullets": [
      "lambda > 1: population growing; lambda = 1: population stationary; lambda < 1: population declining",
      "For a matrix with nonnegative entries and the right connectivity (irreducible, primitive), the Perron-Frobenius theorem guarantees a single largest real, positive eigenvalue -- exactly the lambda used in population ecology",
      "Computed numerically with eigen() / numpy.linalg.eig / LinearAlgebra.eigen -- no need to solve the characteristic polynomial by hand"
    ]
  },
  {
    "type": "term",
    "eyebrow": "The Long-Run Structure",
    "title": "The Stable Stage Distribution",
    "term": "Stable stage distribution",
    "def": "The right eigenvector associated with the dominant eigenvalue lambda, normalized to sum to 1. It describes the proportion of individuals in each stage once the population has settled into its long-run structure -- regardless of the starting stage vector, repeated projection converges toward this same proportional mix.",
    "bullets": [
      "Two populations that start with very different stage structures but share the same projection matrix A converge to the SAME stable stage distribution, even though their starting sizes and mixes differ",
      "Before convergence, growth can run faster or slower than lambda predicts -- these early deviations are called transient dynamics",
      "For the loggerhead matrix, the stable stage distribution is heavily juvenile-weighted, reflecting high early mortality and long stage durations before maturity"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Computing Lambda",
    "title": "eigen() in Base R",

function esc(s){ return s; } // bullets allow inline <b> tags intentionally

function renderSlide(s, idx){
  let inner = "";
  switch(s.type){

    case "title":
      inner = `
        <div class="center-stage">
          <span class="tag">${s.eyebrow||""}</span>
          <div class="big-word">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
          <div class="footnote">${s.footnote||""}</div>
        </div>`;
      break;

    case "section":
      inner = `
        <div class="center-stage">
          <span class="tag gold">${s.tag||"Section"}</span>
          <div class="big-word" style="font-size:2.6rem;">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
        </div>`;
      break;

    case "bullets":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content"><ul class="bullets">
          ${s.items.map(i=>`<li>${i}</li>`).join("")}
        </ul></div>`;
      break;

    case "term":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <div class="term-box">
            <span class="term">${s.term}</span>
            <span class="def">${s.def}</span>
          </div>
          ${s.bullets ? `<ul class="bullets sub">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
        </div>`;
      break;

    case "twocol":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="two-col">
          <div class="col-box"><h3>${s.left.h}</h3><p>${s.left.body}</p></div>
          <div class="col-box"><h3>${s.right.h}</h3><p>${s.right.body}</p></div>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "compare":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <table class="compare">
            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Ecological Modelling · R / Python / Julia</span>
        <span>Lecture 14</span>
      </footer>
    </div>`;
}

  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>
</body>
</html>

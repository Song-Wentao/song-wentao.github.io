// =====================================================================
const slides = [
  {
    "type": "title",
    "eyebrow": "Lecture 16",
    "title": "Spatial Modeling",
    "sub": "The course finale: what happens when 'near things' really are more related, and how to model that directly -- spatial autocorrelation, spatial smooths, and point process models",
    "footnote": "Ecological Modelling with R, Python, and Julia"
  },
  {
    "type": "quote",
    "eyebrow": "Tobler's First Law of Geography",
    "quote": "Everything is related to everything else, but near things are more related than distant things.",
    "attrib": "Waldo Tobler (1970)"
  },
  {
    "type": "section",
    "tag": "Picking Up the Thread",
    "title": "Lecture 13 Left a Loose End",
    "sub": "The BEI habitat-suitability map had structure left in its residuals that elev and grad alone did not explain -- that structure was space"
  },
  {
    "type": "bullets",
    "eyebrow": "What Lecture 13 Foreshadowed",
    "title": "SDM Residuals Are Rarely Independent in Space",
    "items": [
      "The Lecture 13 logistic-regression and random-forest SDMs for Beilschmiedia pendula predicted suitability from elevation and gradient alone -- but two nearby grid cells with similar covariates also tend to have similar residual error, simply because they are near each other",
      "That is not a modeling mistake specific to SDMs -- it is a near-universal property of ecological data collected across space: soil, microclimate, dispersal limitation, and disturbance history are all spatially structured",
      "Every model from Lecture 5 onward -- LM, GLM, GLMM, GAM, Bayesian hierarchical, time series, occupancy, ML, SDM, population, community -- assumes (or at best partially relaxes) independent errors",
      "This closing lecture makes that violation precise, measurable, and fixable -- and introduces a second, complementary spatial framework built for mapped point data specifically"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Two Real Datasets, Two Spatial Questions",
    "title": "Correlated Residuals vs. Modeling the Points Themselves",
    "items": [
      "Question A -- 'Are nearby measurements more similar than distant ones, and does that break my model's assumptions?' We answer this with Borcard & Legendre's (1994) oribatid mite survey at Lac Cromwell: 70 soil cores with real x, y coordinates and a water-content measurement (WatrCont) at each",
      "Question B -- 'Given only the locations of individuals, what process generated that spatial pattern?' We answer this with Condit, Hubbell & Foster's (2002) Barro Colorado Island 50-ha census: 3,604 mapped Beilschmiedia pendula tree locations, the standard teaching dataset for spatial point-process methods",
      "These are genuinely different statistical problems -- the first treats space as a nuisance to diagnose and correct for; the second treats the spatial locations as the response variable itself"
    ]
  },
  {
    "type": "section",
    "tag": "Quantifying Spatial Autocorrelation",
    "title": "Moran's I",
    "sub": "A single number that asks: are nearby values more similar than chance would predict?"
  },
  {
    "type": "term",
    "eyebrow": "Key Concept",
    "title": "Moran's I",
    "term": "Moran's I",
    "def": "A global statistic measuring spatial autocorrelation: whether values at nearby locations are more similar (positive I), more dissimilar (negative I), or no more related than chance (I near its expected value) than a random spatial arrangement of the same values would produce.",
    "bullets": [
      "I = (n / S0) * [ sum_ij w_ij (x_i - xbar)(x_j - xbar) ] / [ sum_i (x_i - xbar)^2 ], where w_ij is a spatial weight (how 'connected' sites i and j are) and S0 = sum of all weights",
      "Ranges roughly from -1 (perfect checkerboard dissimilarity) to +1 (perfect spatial clustering of similar values); its expected value under no autocorrelation is -1/(n-1), not exactly 0",
      "Requires a spatial weights matrix W as an input choice, not an output -- W encodes your assumption about which locations count as 'neighbours' and how strongly",
      "Significance is almost always assessed by permutation: shuffle the data values across the fixed locations many times, recompute I each time, and see how extreme the observed I is relative to that null distribution"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Before You Can Compute I",
    "title": "Building a Spatial Weights Matrix",
    "items": [
      "A weights matrix W says, for every pair of sites (i, j), how much site j should count as a 'neighbour' of site i -- W is a modeling choice, not a fact about the data",
      "Distance-band weights: connect all sites within some radius d; simple but brittle when points are irregularly spaced (some sites end up with zero neighbours, others with dozens)",
      "k-nearest-neighbour (k-NN) weights: connect each site to its k closest sites, regardless of exact distance -- robust to irregular spacing, which is exactly the situation with the 70 mite cores (not on a regular grid)",
      "We use k = 5 nearest neighbours, row-standardized so each site's weights sum to 1 -- a common, defensible default for irregularly spaced ecological survey points"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "R",
    "title": "Moran's I with spdep::moran.test() and a Permutation Test",
    "left": {
      "h": "Build k-NN weights and run the analytic test",
      "body": "<pre><code>library(spdep)\n\nmite_env &lt;- read.csv(\"data/mite_env.csv\")\ncoords &lt;- as.matrix(mite_env[, c(\"x\",\"y\")])\n\nknn &lt;- knearneigh(coords, k = 5)\nnb  &lt;- knn2nb(knn)\nlw  &lt;- nb2listw(nb, style = \"W\")\n\nmt &lt;- moran.test(mite_env$WatrCont, lw)\nprint(mt)\n# Moran I statistic = 0.543, p &lt; 2.2e-16</code></pre>"
    },
    "right": {
      "h": "Permutation (Monte Carlo) version -- more robust p-value",
      "body": "<pre><code>mc &lt;- moran.mc(mite_env$WatrCont, lw,\n               nsim = 999)\nprint(mc)\n# statistic = 0.543\n# observed rank = 1000 / 1000\n# p-value = 0.001\n\n# The lecture script hand-rolls the same\n# statistic directly (no spdep dependency)\n# and recovers the identical I = 0.543 --\n# a good cross-check of the formula.</code></pre>"
    }
  },
  {
    "type": "twocol",
    "eyebrow": "Python",
    "title": "Moran's I with esda.Moran (PySAL) and a k-NN Weights Object",
    "left": {
      "h": "Build k-NN weights, run esda.Moran",
      "body": "<pre><code>from libpysal.weights import KNN\nfrom esda.moran import Moran\n\ncoords = mite_env[[\"x\",\"y\"]].values\nw = KNN.from_array(coords, k=5)\nw.transform = \"r\"   # row-standardize\n\nmi = Moran(mite_env[\"WatrCont\"].values,\n           w, permutations=999)\nprint(mi.I, mi.p_sim)\n# I = 0.542, p_sim = 0.001</code></pre>"
    },
    "right": {
      "h": "Hand-rolled cross-check (scipy cKDTree)",
      "body": "<pre><code>from scipy.spatial import cKDTree\nimport numpy as np\n\ndef morans_i(x, W):\n    n, xbar = len(x), x.mean()\n    dev = x - xbar\n    S0 = W.sum()\n    num = np.sum(W * np.outer(dev, dev))\n    den = np.sum(dev**2)\n    return (n / S0) * (num / den)\n\n# W built from cKDTree k=5 neighbours;\n# matches esda's I to 3 decimal places</code></pre>"
    }
  },
  {
    "type": "twocol",
    "eyebrow": "Julia",
    "title": "Hand-Rolled Moran's I with NearestNeighbors.jl",
    "left": {
      "h": "k-NN weights matrix from a KD-tree",
      "body": "<pre><code>using NearestNeighbors, Statistics\n\nfunction knn_weights(coords, k)\n    n = size(coords, 1)\n    tree = KDTree(permutedims(coords))\n    idxs, _ = knn(tree, permutedims(coords),\n                  k + 1)  # +1: self is closest\n    W = zeros(n, n)\n    for i in 1:n\n        nb = filter(!=(i), idxs[i])[1:k]\n        W[i, nb] .= 1.0 / k\n    end\n    return W\nend</code></pre>"
    },
    "right": {
      "h": "Moran's I and a permutation test",
      "body": "<pre><code>function morans_i(x, W)\n    n, xbar = length(x), mean(x)\n    dev = x .- xbar\n    S0 = sum(W)\n    num = sum(W .* (dev * dev'))\n    den = sum(dev .^ 2)\n    return (n / S0) * (num / den)\nend\n\nI_obs = morans_i(mite_env.WatrCont, W)\n# I_obs = 0.543 -- matches R and Python\n# to 3 decimal places</code></pre>"
    }
  },
  {
    "type": "bullets",
    "eyebrow": "Reading the Output",
    "title": "I = 0.54, p = 0.001 -- What That Actually Says",
    "items": [
      "All three languages agree closely: I is approximately 0.54, far above the expected value of about -0.014 under no spatial structure, and the permutation p-value is 0.001 (the observed I exceeds every one of 999 shuffled datasets)",
      "This is strong, statistically clear positive spatial autocorrelation: soil cores that are physically close to each other at Lac Cromwell have much more similar water content than a random arrangement of the same 70 values would produce",
      "The companion Moran scatterplot (WatrCont vs. its spatially lagged value -- the average of each site's 5 nearest neighbours) makes this visual: the fitted line's slope is approximately equal to Moran's I itself, and here it slopes clearly upward",
      "This is not a mite-specific quirk -- soil moisture, canopy cover, disturbance history, and most other ecological covariates are spatially patchy for genuinely ecological reasons (drainage, topography, dispersal)"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "The Consequence",
    "title": "Every Model Since Lecture 5 Assumed This Away",
    "items": [
      "Linear models (5), GLMs (6), and even GAMs (8) assume residuals are independent, conditional on the predictors in the model -- their standard errors, p-values, and confidence intervals are built on that assumption",
      "Mixed models (7) relax independence only within specified random-effects groups (e.g. site, year) -- they do not automatically handle continuous spatial proximity unless you explicitly add a spatial correlation structure",
      "When residuals are positively spatially autocorrelated (as WatrCont is here), your effective sample size is smaller than n -- nearby points are partially redundant copies of the same information -- and standard errors computed as if n independent observations exist will be too small, inflating apparent significance",
      "This is exactly the risk flagged at the end of Lecture 13: an SDM fit on spatially autocorrelated presence/background data can look far more confident than it should be, and a naive random train/test split overstates accuracy for the same reason"
    ]
  },
  {
    "type": "section",
    "tag": "Two Complementary Fixes",
    "title": "Absorbing the Spatial Structure",
    "sub": "A spatial regression term, or a bivariate smooth you already know how to fit"
  },
  {
    "type": "bullets",
    "eyebrow": "Two Honest Options",
    "title": "Model the Correlation, or Model the Surface",
    "items": [
      "Option 1 -- spatial regression models: add an explicit autocorrelation term to the model's error structure (e.g. a simultaneous autoregressive [SAR] or conditional autoregressive [CAR] error model, spdep::errorsarlm() in R) so standard errors are corrected for the redundancy nearby points carry",
      "Option 2 -- a GAM with a 2-D spatial smooth: fit s(x, y) as a covariate (Lecture 8's smooth-term machinery, just with two inputs instead of one) so the model's fitted surface directly absorbs whatever smooth spatial trend was inflating the residual correlation",
      "Neither one is universally 'better' -- SAR/CAR models are the traditional spatial-statistics tool and give an interpretable autocorrelation parameter; a 2-D smooth is often faster to fit, easier to visualize, and reuses machinery you already know",
      "Both share the same goal: stop treating a spatially patchy nuisance as noise, and instead give the model an explicit way to account for it"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "R",
    "title": "A Bivariate Smooth s(x, y) IS a Simple Spatial Model",
    "left": {
      "h": "Fit the 2-D smooth (same mgcv as Lecture 8)",
      "body": "<pre><code>library(mgcv)\n\ngam_spatial &lt;- gam(\n  WatrCont ~ s(x, y),\n  data = mite_env\n)\nsummary(gam_spatial)\n# s(x,y): edf = 8.9, p &lt; 2.2e-16\n# Deviance explained: 62.3%</code></pre>"
    },
    "right": {
      "h": "Check: did it absorb the autocorrelation?",
      "body": "<pre><code>resid_gam &lt;- residuals(gam_spatial)\nI_resid &lt;- morans_i(resid_gam, W)\n\ncat(I_resid, \"\\n\")\n# I_resid ~ 0.10 -- far below the raw\n# data's I = 0.54: the smooth surface\n# soaked up most of the spatial pattern,\n# leaving residuals close to independent</code></pre>"
    }
  },
  {
    "type": "bullets",
    "eyebrow": "The Other Route",
    "title": "Spatial Regression: Modeling the Error Structure Directly",
    "items": [
      "A simultaneous autoregressive (SAR) error model writes the residual e_i as e_i = rho * sum_j w_ij * e_j + u_i -- each site's leftover error is partly a weighted average of its neighbours' errors, plus genuinely independent noise u_i",
      "rho (the spatial autoregressive coefficient) is estimated directly and is itself interpretable: how strongly, and at what weighting, does unexplained residual variation propagate across space?",
      "In R, spdep::errorsarlm(WatrCont ~ Substrate + Shrub, data = mite_env, listw = lw) fits exactly this on top of any linear predictor -- the fixed-effects coefficients get corrected standard errors that properly reflect the reduced effective sample size",
      "Rule of thumb: reach for spatial regression when the spatial autocorrelation itself is scientifically interesting (e.g. estimating a dispersal or contagion scale); reach for s(x, y) when space is a nuisance you mainly want to control for while estimating other effects cleanly"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "R",
    "title": "Spatial Error Regression with spdep::errorsarlm()",

            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Ecological Modelling · R / Python / Julia</span>
        <span>Lecture 16</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>
</body>
</html>

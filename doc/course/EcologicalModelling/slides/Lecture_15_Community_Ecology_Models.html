const slides = [
  {
    "type": "title",
    "eyebrow": "Lecture 15",
    "title": "Community Ecology Models",
    "sub": "Species co-occurrence, null models, networks, and joint species distribution models -- in R, Python, and Julia",
    "footnote": "Ecological Modelling with R, Python, and Julia"
  },
  {
    "type": "section",
    "tag": "From Groups to Species",
    "title": "A Different Question About the Same Data",
    "sub": "Lecture 4 asked whether groups differ in composition -- today we ask how species relate to each other"
  },
  {
    "type": "bullets",
    "eyebrow": "Where We Left Off",
    "title": "Lecture 4 Answered a Group-Level Question",
    "items": [
      "PCA, NMDS, and PERMANOVA (Lecture 4) all treat the community matrix as sites x species and ask: do SITES (or groups of sites) differ in composition?",
      "PERMANOVA on dune_species.csv: Management explained a significant share of Bray-Curtis dissimilarity among sites",
      "That machinery is about GROUPS OF SITES -- it never asks whether two individual species are found together more or less often than chance",
      "Today's question is the transpose: hold sites fixed, and ask how SPECIES co-vary with each other across those sites",
      "Same dune_species.csv and BCI_species.csv datasets, a completely different analytical lens"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "The Core Question",
    "title": "Do Species Occur Together More (or Less) Than Chance?",
    "items": [
      "Two species sharing many sites could mean: shared habitat preference, facilitation, or pure chance given how common each species is",
      "Two species rarely sharing sites could mean: competitive exclusion, divergent niches, or again -- pure chance",
      "Raw correlation alone cannot distinguish 'chance' from 'signal' -- a common species and another common species will co-occur a lot no matter what",
      "We need: (1) pairwise association, (2) a null model that accounts for how common each species is, (3) a way to visualize the resulting structure, (4) a way to separate environment from residual biotic signal"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Key Concept",
    "title": "Co-occurrence Null Model",
    "term": "co-occurrence null model",
    "def": "A randomization procedure that generates many 'random' community matrices constrained to preserve each species' total occurrence frequency and each site's total richness, against which an observed co-occurrence statistic (e.g. the C-score) is compared to ask whether the real pattern is more segregated or more aggregated than chance.",
    "bullets": [
      "Preserving row AND column sums ('fixed-fixed') is the standard, most defensible constraint -- it compares apples to apples",
      "Implemented in R as vegan::oecosimu() with method = \"quasiswap\"",
      "Output is a standardized effect size (SES / z-score) and an empirical p-value, exactly like a permutation test"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "The Toolbox",
    "title": "Four Tools, One Underlying Question",
    "items": [
      "1. Pairwise Spearman correlation among species abundances across sites -- descriptive, fast, but ignores multiple testing and marginal frequencies",
      "2. Null-model C-score test (Gotelli 2000) -- formally tests observed co-occurrence against a randomized null distribution",
      "3. Co-occurrence NETWORK -- threshold significant associations into a graph you can actually look at and summarize",
      "4. Joint species distribution model (JSDM) -- the modern extension: fit all species together, model the residual correlation that's left after accounting for environment"
    ]
  },
  {
    "type": "section",
    "tag": "Step 1",
    "title": "Pairwise Species Correlation",
    "sub": "A descriptive first look at the dune_species.csv community matrix (20 sites x 30 species)"
  },
  {
    "type": "bullets",
    "eyebrow": "Method",
    "title": "Spearman Correlation Across Sites, Species by Species",
    "items": [
      "For every pair of species, correlate their abundance vectors across the 20 dune sites using Spearman's rank correlation (robust to the many zeros and skew typical of abundance data)",
      "435 = choose(30, 2) pairwise tests for the 30-species dune matrix",
      "Flag pairs with uncorrected p < 0.05 AND positive r as candidate positive associations",
      "CAVEAT: at alpha = 0.05 across 435 tests we expect ~22 false positives by chance alone -- a real analysis should use FDR correction (p.adjust) or lean on the null-model test in Step 2 instead"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Correlation Code",
    "title": "Pairwise Spearman Correlation",
    "left": {
      "h": "R (base)",
      "body": "<pre><code>comm &lt;- as.matrix(dune[, -1])  # drop site col\n\nfor (i in 1:(n_sp-1)) for (j in (i+1):n_sp) {\n  ct &lt;- cor.test(comm[,i], comm[,j],\n                  method = &quot;spearman&quot;)\n  cor_mat[i,j] &lt;- ct$estimate\n  p_mat[i,j]   &lt;- ct$p.value\n}\n\nsig_pos &lt;- (p_mat &lt; 0.05) &amp; (cor_mat &gt; 0)\nsum(sig_pos) / 2\n#&gt; 43 significant positive pairs / 435</code></pre>"
    },
    "right": {
      "h": "Python (scipy)",
      "body": "<pre><code>from scipy.stats import spearmanr\n\nfor i in range(n_sp - 1):\n    for j in range(i + 1, n_sp):\n        r, p = spearmanr(comm[:, i],\n                          comm[:, j])\n        cor_mat[i, j] = cor_mat[j, i] = r\n        p_mat[i, j]   = p_mat[j, i]   = p\n\nsig_pos = (p_mat &lt; 0.05) &amp; (cor_mat &gt; 0)\nsig_pos.sum() // 2\n# 43 significant positive pairs / 435</code></pre>"
    }
  },
  {
    "type": "bullets",
    "eyebrow": "A Necessary Caveat",
    "title": "435 Tests Means False Positives Are Guaranteed",
    "items": [
      "Dune result: 43 of 435 pairs significant at uncorrected p < 0.05 (9.9%)",
      "Expected false positives under a true global null: 0.05 x 435 ~ 22",
      "So roughly half of the 43 'significant' pairs could be noise -- this is exactly why co-occurrence analysis moved toward formal null models instead of raw pairwise testing",
      "Options: Benjamini-Hochberg FDR correction on the p-values, OR replace pairwise testing entirely with a matrix-level null model (next section)"
    ]
  },
  {
    "type": "section",
    "tag": "Step 2",
    "title": "Null-Model Co-occurrence Testing",
    "sub": "The C-score: comparing observed co-occurrence to a randomized null distribution"
  },
  {
    "type": "bullets",
    "eyebrow": "The Methodological Reference",
    "title": "Gotelli (2000): Null Model Analysis of Species Co-occurrence Patterns",
    "items": [
      "Gotelli, N.J. (2000). \"Null model analysis of species co-occurrence patterns.\" Ecology, 81(9), 2606-2621.",
      "Formalized the C-score (checkerboard score) of Stone & Roberts (1990) as a test statistic and systematically compared randomization algorithms for generating the null distribution",
      "Key recommendation: the 'fixed-fixed' null model (preserve BOTH species occurrence totals AND site richness totals) is the most defensible default -- looser constraints inflate false positives",
      "This is the standard reference cited whenever ecologists report a null-model co-occurrence test -- know it, cite it"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "How It Works",
    "title": "The C-score and the Fixed-Fixed Randomization",
    "items": [
      "C-score for a species pair = (sites with species A only) x (sites with species B only) -- averaged across all pairs, it is the 'checkerboard units' statistic",
      "High C-score = species rarely share sites (segregation); low C-score = species share sites more than expected (aggregation)",
      "Null distribution: reshuffle the presence-absence matrix thousands of times, preserving each species' total occurrences AND each site's total richness exactly (checkerboard swaps: [[1,0],[0,1]] <-> [[0,1],[1,0]])",
      "Compare observed C-score to this null distribution -> standardized effect size (SES) and empirical p-value"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Null Model Code",
    "title": "C-score Null Model -- vegan::oecosimu()",
    "left": {
      "h": "R (vegan)",
      "body": "<pre><code>pa &lt;- (comm &gt; 0) * 1\n\nset.seed(42)\nnull_test &lt;- oecosimu(\n  pa, nestedchecker,\n  method = &quot;quasiswap&quot;, nsimul = 999)\n\nnull_test$statistic$statistic\n#&gt; checkerboards: 5274\nnull_test$oecosimu$z\n#&gt; SES: 6.18\nnull_test$oecosimu$pval\n#&gt; p = 0.001</code></pre>"
    },
    "right": {
      "h": "Interpretation",
      "body": "<p>SES = 6.18, p = 0.001: the observed checkerboard score is far higher than the fixed-fixed null distribution predicts.</p><p>Conclusion: the dune plant community shows significant <strong>segregation</strong> -- species pairs share fewer sites than random co-occurrence would produce, consistent with competitive exclusion or divergent niche/moisture requirements.</p><p><code>method=\"quasiswap\"</code> is vegan's fixed-fixed algorithm -- the Gotelli-recommended default.</p>"
    }
  },
  {
    "type": "twocol",
    "eyebrow": "Null Model Code",
    "title": "Hand-Rolled Fixed-Fixed Null Model (Python)",
    "left": {
      "h": "Python (hand-rolled swap algorithm)",
      "body": "<pre><code>def swap_null(pa, n_swaps, rng):\n    m = pa.copy()\n    done = 0\n    while done &lt; n_swaps:\n        r1, r2 = rng.choice(n_site, 2,\n                             replace=False)\n        c1, c2 = rng.choice(n_sp, 2,\n                             replace=False)\n        block = m[[r1,r2]][:,[c1,c2]]\n        if (block == [[1,0],[0,1]]).all():\n            m[r1,c1],m[r1,c2] = 0,1\n            m[r2,c1],m[r2,c2] = 1,0\n            done += 1\n        elif (block == [[0,1],[1,0]]).all():\n            m[r1,c1],m[r1,c2] = 1,0\n            m[r2,c1],m[r2,c2] = 0,1\n            done += 1\n    return m</code></pre>"
    },
    "right": {
      "h": "Result (cross-checks R)",
      "body": "<pre><code>obs_c = cscore(pa)\nnull_c = [cscore(swap_null(mat, 200, rng))\n          for _ in range(999)]\n\nz = (obs_c - mean(null_c)) / std(null_c)\np = (sum(null_c &gt;= obs_c)+1)/1000\n\n# Observed C-score:  12.124\n# Null mean C-score: 11.511\n# SES (z) = 5.96, p = 0.001\n# matches R vegan::oecosimu (SES=6.18)</code></pre>"
    }
  },
  {
    "type": "compare",
    "eyebrow": "Choosing a Null Model",
    "title": "Randomization Algorithms Are Not Interchangeable",
    "headers": [
      "Algorithm",
      "Row sums (site richness)",
      "Column sums (species freq.)",
      "False-positive behavior"
    ],
    "rows": [
      [
        "Fixed-fixed (quasiswap)",
        "Preserved exactly",
        "Preserved exactly",
        "Conservative -- Gotelli's recommended default"
      ],
      [
        "Fixed-equiprobable (r1)",
        "Preserved exactly",
        "Not preserved (equiprobable)",
        "Can inflate false positives"
      ],
      [
        "Equiprobable-equiprobable (r00)",
        "Not preserved",
        "Not preserved",
        "Anti-conservative -- generally avoid"
      ],
      [
        "Column shuffle only",
        "Not preserved",
        "Preserved exactly",
        "Ignores site richness gradient -- biased"
      ]
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Result",
    "title": "The Dune Community Is Significantly Segregated",
    "items": [
      "Observed C-score (checkerboard units): 5274; null mean: ~5004-5012 depending on the exact 999-permutation draw",
      "SES ~ 6, p = 0.001 in both R (vegan::oecosimu) and the hand-rolled Python swap algorithm -- strong agreement across independent implementations",
      "This single matrix-wide statistic is far more defensible than the 43 raw significant pairwise correlations from Step 1 -- it correctly accounts for how common each species is",
      "Next: convert the pairwise-correlation view (not the matrix-wide C-score) into a visual, interpretable NETWORK"
    ]
  },
  {
    "type": "section",
    "tag": "Step 3",
    "title": "The Co-occurrence Network",
    "sub": "Species as nodes, significant positive associations as edges"
  },
  {
    "type": "bullets",
    "eyebrow": "Construction",
    "title": "From a Correlation Matrix to a Graph",
    "items": [
      "Adjacency rule: connect species i and j with an edge if their pairwise Spearman correlation is positive AND significant at uncorrected p < 0.05 (from Step 1)",
      "This is a threshold network -- a deliberately simple, transparent choice; more sophisticated approaches threshold on the null-model z-score per pair instead of raw p-value",
      "Nodes with zero edges (no significant positive partner) are dropped from the plot for legibility, but noted in the summary stats",
      "Undirected, unweighted graph: an edge either exists or it doesn't"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Network Code",
    "title": "Building and Plotting the Network -- igraph",

// RENDER ENGINE

function esc(s){ return s; } // bullets allow inline <b> tags intentionally

function renderSlide(s, idx){
  let inner = "";
  switch(s.type){

    case "title":
      inner = `
        <div class="center-stage">
          <span class="tag">${s.eyebrow||""}</span>
          <div class="big-word">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
          <div class="footnote">${s.footnote||""}</div>
        </div>`;
      break;

    case "section":
      inner = `
        <div class="center-stage">
          <span class="tag gold">${s.tag||"Section"}</span>
          <div class="big-word" style="font-size:2.6rem;">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
        </div>`;
      break;

    case "bullets":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content"><ul class="bullets">
          ${s.items.map(i=>`<li>${i}</li>`).join("")}
        </ul></div>`;
      break;

    case "term":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <div class="term-box">
            <span class="term">${s.term}</span>
            <span class="def">${s.def}</span>
          </div>
          ${s.bullets ? `<ul class="bullets sub">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
        </div>`;
      break;

    case "twocol":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="two-col">
          <div class="col-box"><h3>${s.left.h}</h3><p>${s.left.body}</p></div>
          <div class="col-box"><h3>${s.right.h}</h3><p>${s.right.body}</p></div>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "compare":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <table class="compare">
            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Ecological Modelling · R / Python / Julia</span>
        <span>Lecture 15</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>

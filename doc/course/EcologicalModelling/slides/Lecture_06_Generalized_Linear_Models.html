// =====================================================================

const slides = [
  {
    "type": "title",
    "eyebrow": "Lecture 6",
    "title": "Generalized Linear Models",
    "sub": "What if the response is a count, not continuous? Poisson, negative-binomial, and logistic regression in R, Python, and Julia",
    "footnote": "Ecological Modelling with R, Python, and Julia"
  },
  {
    "type": "section",
    "tag": "Picking Up The Thread",
    "title": "\"What If The Response Is A Count?\"",
    "sub": "Lecture 5 ended with this question about linear models -- today we answer it"
  },
  {
    "type": "bullets",
    "eyebrow": "The Problem",
    "title": "Why Ordinary Linear Models Fail For Counts",
    "items": [
      "Counts are non-negative integers (0, 1, 2, ...) -- a linear model happily predicts -3.7 ticks",
      "Variance grows with the mean for count data -- linear models assume constant variance (homoscedasticity)",
      "Residuals from a linear fit to counts are typically right-skewed and heteroscedastic, violating the normal-errors assumption",
      "Bounding at zero plus a long right tail means the normal distribution is simply the wrong error model"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Meet The Data",
    "title": "TICKS: Highly Skewed, Full Of Zeros",
    "items": [
      "grouseticks.csv: TICKS = number of ticks counted on each red grouse chick (n = 403 chicks)",
      "About 31% of chicks have zero ticks -- a spike at zero no bell curve can produce",
      "Mean TICKS ~ 2 but variance ~ 60+ -- variance/mean ratio around 27, nowhere near the 1:1 that Poisson assumes",
      "A histogram of TICKS is a tall bar at zero with a long thin tail out past 30 -- the opposite of a bell curve"
    ]
  },
  {
    "type": "cards",
    "eyebrow": "Count Data Properties",
    "title": "Three Reasons Counts Need A Different Model",
    "cards": [
      {
        "h": "Non-negative integers",
        "p": "A linear model's predicted values are unbounded and continuous; counts can never be negative or fractional in reality."
      },
      {
        "h": "Mean-variance relationship",
        "p": "For Poisson-type processes, variance scales with the mean. Constant-variance assumptions break down immediately."
      },
      {
        "h": "Heteroscedasticity",
        "p": "Sites/chicks with higher expected counts show more absolute scatter -- residual spread is not constant across the predictor range."
      },
      {
        "h": "Skew and zero-inflation",
        "p": "Ecological count data is routinely right-skewed with many zeros, unlike the symmetric residuals a linear model needs."
      }
    ]
  },
  {
    "type": "section",
    "tag": "The Framework",
    "title": "Generalized Linear Models",
    "sub": "One framework, three pieces, many response types"
  },
  {
    "type": "term",
    "eyebrow": "Key Definition",
    "title": "The Link Function",
    "term": "Link function",
    "def": "A function g() that connects the mean of the response, mu, to the linear predictor: g(mu) = beta0 + beta1*x1 + ... In a Poisson GLM the canonical link is the log; in a binomial GLM it is the logit. The link lets a model with an unbounded linear predictor produce predictions that stay within the response's valid range (e.g. always positive for counts, always in [0,1] for probabilities).",
    "bullets": [
      "Log link: g(mu) = log(mu) -- keeps predicted counts/rates positive",
      "Logit link: g(mu) = log(mu / (1-mu)) -- keeps predicted probabilities in (0, 1)",
      "Identity link: g(mu) = mu -- the ordinary linear model is a GLM with an identity link and Gaussian errors"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Anatomy Of A GLM",
    "title": "Three Components, Every Time",
    "items": [
      "1. Random component -- the probability distribution assumed for the response (Gaussian, Poisson, Binomial, Negative Binomial, ...)",
      "2. Linear predictor -- the familiar beta0 + beta1*x1 + beta2*x2 + ... combination of covariates, still linear in the coefficients",
      "3. Link function -- maps the linear predictor onto the scale the random component needs (log for counts, logit for probabilities)",
      "Ordinary linear regression is the special case: Gaussian random component + identity link"
    ]
  },
  {
    "type": "compare",
    "eyebrow": "Choosing A Family",
    "title": "GLM Families At A Glance",
    "headers": [
      "Family",
      "Link",
      "Use case"
    ],
    "rows": [
      [
        "Gaussian",
        "identity",
        "Continuous, roughly symmetric response (ordinary linear model)"
      ],
      [
        "Poisson",
        "log",
        "Counts with variance approx. equal to the mean"
      ],
      [
        "Binomial",
        "logit",
        "Presence/absence, proportions, binary outcomes"
      ],
      [
        "Negative Binomial",
        "log",
        "Overdispersed counts -- variance exceeds the mean"
      ]
    ]
  },
  {
    "type": "section",
    "tag": "Model 1",
    "title": "The Poisson GLM",
    "sub": "The default starting point for count data"
  },
  {
    "type": "bullets",
    "eyebrow": "Model Specification",
    "title": "Poisson GLM: TICKS ~ YEAR + cHEIGHT",
    "items": [
      "Random component: TICKS_i ~ Poisson(mu_i)",
      "Linear predictor: log(mu_i) = beta0 + beta_YEAR96*I(YEAR=96) + beta_YEAR97*I(YEAR=97) + beta_cHEIGHT*cHEIGHT_i",
      "Log link guarantees mu_i > 0 no matter what the linear predictor evaluates to",
      "Poisson's defining assumption: Var(TICKS_i) = mu_i -- variance equals the mean, exactly, with no separate dispersion parameter to estimate"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "R Code",
    "title": "Fitting Poisson And Negative-Binomial GLMs in R",
    "left": {
      "h": "Poisson GLM -- glm()",
      "body": "<pre><code>ticks &lt;- read.csv(&quot;data/grouseticks.csv&quot;)\nticks$YEAR &lt;- factor(ticks$YEAR)\n\npois_fit &lt;- glm(\n  TICKS ~ YEAR + cHEIGHT,\n  family = poisson(link = &quot;log&quot;),\n  data = ticks\n)\nsummary(pois_fit)\n\n# overdispersion ratio\ndeviance(pois_fit) / df.residual(pois_fit)\n#&gt; 8.63  (&gt;&gt; 1: overdispersed)</code></pre>"
    },
    "right": {
      "h": "Negative-Binomial GLM -- MASS::glm.nb()",
      "body": "<pre><code>library(MASS)\n\nnb_fit &lt;- glm.nb(\n  TICKS ~ YEAR + cHEIGHT,\n  data = ticks\n)\nsummary(nb_fit)\nnb_fit$theta   #&gt; 0.78 (dispersion)\n\nAIC(pois_fit)  #&gt; 4382.8\nAIC(nb_fit)    #&gt; 1941.7 (much better)</code></pre>"
    }
  },
  {
    "type": "twocol",
    "eyebrow": "Python Code",
    "title": "Fitting Poisson And Negative-Binomial GLMs in Python",
    "left": {
      "h": "Poisson GLM -- statsmodels formula API",
      "body": "<pre><code>import statsmodels.api as sm\nimport statsmodels.formula.api as smf\n\nticks = pd.read_csv(&quot;data/grouseticks.csv&quot;)\nticks[&quot;YEAR&quot;] = ticks[&quot;YEAR&quot;].astype(str).astype(&quot;category&quot;)\n\npois_fit = smf.glm(\n    &quot;TICKS ~ YEAR + cHEIGHT&quot;, data=ticks,\n    family=sm.families.Poisson()\n).fit()\nprint(pois_fit.summary())\n\nratio = pois_fit.deviance / pois_fit.df_resid\n# ratio = 8.63  (&gt;&gt; 1: overdispersed)</code></pre>"
    },
    "right": {
      "h": "Negative-Binomial GLM -- sm.families.NegativeBinomial",
      "body": "<pre><code># statsmodels&#x27; GLM NegativeBinomial needs a fixed\n# alpha; profile over a grid and keep the best fit\nbest = max(\n    (smf.glm(&quot;TICKS ~ YEAR + cHEIGHT&quot;, ticks,\n             family=sm.families.NegativeBinomial(alpha=a)\n     ).fit() for a in np.linspace(0.05, 3, 60)),\n    key=lambda f: f.llf\n)\nprint(best.summary())\n\npois_fit.aic, best.aic\n#&gt; (4382.8, 1939.7)</code></pre>"
    }
  },
  {
    "type": "twocol",
    "eyebrow": "Julia Code",
    "title": "Fitting Poisson And Negative-Binomial GLMs in Julia",
    "left": {
      "h": "Poisson GLM -- GLM.jl glm()",
      "body": "<pre><code>using CSV, DataFrames, CategoricalArrays, GLM\n\nticks = CSV.read(&quot;data/grouseticks.csv&quot;, DataFrame)\nticks.YEAR = categorical(string.(ticks.YEAR))\n\npois_fit = glm(@formula(TICKS ~ YEAR + cHEIGHT),\n               ticks, Poisson(), LogLink())\n\nratio = deviance(pois_fit) / dof_residual(pois_fit)\n# ratio = 8.63  (&gt;&gt; 1: overdispersed)</code></pre>"
    },
    "right": {
      "h": "Negative-Binomial GLM -- GLM.jl negbin()",
      "body": "<pre><code># GLM.jl&#x27;s plain NegativeBinomial() distribution needs\n# a KNOWN theta -- unlike MASS::glm.nb() it does not\n# estimate theta by ML on its own. Use negbin(), which\n# alternates IRLS with ML re-estimation of theta:\nnb_fit = negbin(@formula(TICKS ~ YEAR + cHEIGHT),\n                 ticks, LogLink())\n\naic(pois_fit), aic(nb_fit)\n#&gt; (4382.8, 1941.7)</code></pre>"
    }
  },
  {
    "type": "bullets",
    "eyebrow": "Reading The Output",
    "title": "Interpreting Poisson Coefficients",
    "items": [
      "On the log-link scale, coefficients are additive: beta_cHEIGHT = -0.0215 means log(mu) drops by 0.0215 per metre of altitude",
      "Exponentiate to get rate ratios on the response scale: exp(-0.0215) = 0.979 -- each extra metre multiplies expected tick count by 0.979 (a 2.1% decrease)",
      "exp(beta_YEAR96) = 1.51 -- chicks in 1996 carry 51% more ticks than the 1995 reference year, holding altitude fixed",
      "exp(beta_YEAR97) = 0.185 -- chicks in 1997 carry only about 18.5% as many ticks as in 1995 -- a dramatic year effect"
    ]
  },
  {
    "type": "section",
    "tag": "A Critical Check",
    "title": "Checking For Overdispersion",
    "sub": "The single most important diagnostic after fitting any Poisson GLM"
  },
  {
    "type": "term",
    "eyebrow": "Key Definition",
    "title": "Overdispersion",
    "term": "Overdispersion",
    "def": "When the observed variance in the data exceeds what the assumed distribution predicts. For a Poisson GLM, overdispersion means Var(y) > mean(y) by more than sampling noise would explain -- common causes are unmodeled clustering/aggregation, missing covariates, and excess zeros.",
    "bullets": [
      "Diagnostic: residual deviance / residual degrees of freedom",
      "Ratio approx. 1 -- Poisson assumption looks reasonable",
      "Ratio >> 1 (rule of thumb: > 1.5-2) -- overdispersion is present; standard errors from Poisson will be too small and p-values too optimistic"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Computing The Ratio",
    "title": "Deviance / df For The Tick Poisson Model",
    "items": [
      "Residual deviance = 3443.8 on 399 residual degrees of freedom",
      "Dispersion ratio = 3443.8 / 399 = 8.63",
      "8.63 is roughly 8-9x higher than the 1.0 a well-specified Poisson model should show",
      "Every language in this course computes it the same way: deviance(fit) / df.residual(fit) (R), fit.deviance / fit.df_resid (Python), deviance(fit) / dof_residual(fit) (Julia)"
    ]
  },
  {
    "type": "cards",
    "eyebrow": "A Real Teaching Moment",
    "title": "The Tick Data ARE Overdispersed -- And That's Expected",
    "cards": [
      {
        "h": "It's in the title",
        "p": "Elston et al. (2001) called their paper 'Analysis of aggregation' -- tick burden is clumped by biology, not a data-cleaning mistake."
      },
      {
        "h": "Ticks aggregate",
        "p": "Ticks cluster on hosts through shared exposure (brood, location, timing), producing far more variance than independent Poisson counts allow."
      },
      {
        "h": "Not a bug to fix",
        "p": "A ratio of 8.63 is not evidence something went wrong in data entry -- it is a real ecological signature of clustered parasite burden."
      },
      {
        "h": "The fix is a better model",
        "p": "Rather than discard the Poisson fit, we swap in a distribution built to handle exactly this: the negative binomial."
      }
    ]
  },
  {
    "type": "section",
    "tag": "Model 2",
    "title": "The Negative-Binomial GLM",
    "sub": "Same log link, one extra parameter to absorb overdispersion"
  },
  {
    "type": "term",
    "eyebrow": "Key Definition",
    "title": "Negative-Binomial Regression",
    "term": "Negative binomial GLM",
    "def": "A count-data GLM that adds a dispersion parameter (theta, or its inverse alpha) to the Poisson mean-variance relationship: Var(y) = mu + mu^2/theta. As theta grows large the negative binomial converges to Poisson (Var = mu); smaller theta allows substantially more variance than the mean, exactly what overdispersed count data need.",

function esc(s){ return s; } // bullets allow inline <b> tags intentionally

function renderSlide(s, idx){
  let inner = "";
  switch(s.type){

    case "title":
      inner = `
        <div class="center-stage">
          <span class="tag">${s.eyebrow||""}</span>
          <div class="big-word">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
          <div class="footnote">${s.footnote||""}</div>
        </div>`;
      break;

    case "section":
      inner = `
        <div class="center-stage">
          <span class="tag gold">${s.tag||"Section"}</span>
          <div class="big-word" style="font-size:2.6rem;">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
        </div>`;
      break;

    case "bullets":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content"><ul class="bullets">
          ${s.items.map(i=>`<li>${i}</li>`).join("")}
        </ul></div>`;
      break;

    case "term":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <div class="term-box">
            <span class="term">${s.term}</span>
            <span class="def">${s.def}</span>
          </div>
          ${s.bullets ? `<ul class="bullets sub">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
        </div>`;
      break;

    case "twocol":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="two-col">
          <div class="col-box"><h3>${s.left.h}</h3><p>${s.left.body}</p></div>
          <div class="col-box"><h3>${s.right.h}</h3><p>${s.right.body}</p></div>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "compare":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <table class="compare">
            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Ecological Modelling · R / Python / Julia</span>
        <span>Lecture 6</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>

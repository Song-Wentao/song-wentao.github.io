<script>
// =====================================================================

// object with a `type` (layout) and layout-specific fields.
// =====================================================================
const slides = [
  {
    "type": "title",
    "eyebrow": "Lecture 4",
    "title": "Multivariate and Ordination Methods",
    "sub": "Reducing many correlated variables to interpretable patterns -- PCA, NMDS, PERMANOVA, and hierarchical clustering in R, Python, and Julia",
    "footnote": "Ecological Modelling with R, Python, and Julia"
  },
  {
    "type": "section",
    "tag": "Why Ordination",
    "title": "From Species Tables to Insight",
    "sub": "Turning a sites-by-species matrix into something you can actually look at"
  },
  {
    "type": "bullets",
    "eyebrow": "The Problem",
    "title": "Raw Community Data Is High-Dimensional",
    "items": [
      "A community survey with 30 species is a 30-dimensional dataset -- one axis per species",
      "Soil chemistry data with 14 variables (N, P, K, Ca, Mg, pH, ...) is 14-dimensional and heavily correlated",
      "You cannot plot 14 or 30 axes at once, and most of those axes carry redundant information",
      "Dimension reduction finds a small number of new axes that capture most of the pattern in the data",
      "Different questions call for different reduction methods -- that is the subject of this lecture"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "The Toolbox",
    "title": "Four Complementary Methods",
    "items": [
      "PCA (Principal Component Analysis) -- linear axes of maximum variance, for continuous environmental data",
      "NMDS (Non-metric Multidimensional Scaling) -- rank-based ordination for community abundance data",
      "PERMANOVA (adonis2) -- a formal permutation test of whether groups differ in multivariate space",
      "Hierarchical clustering -- an exploratory dendrogram of which sites resemble which",
      "All four are routinely applied together in a single analysis, each answering a different question"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Key Concept",
    "title": "Ordination",
    "term": "Ordination",
    "def": "Any technique that arranges samples (or variables) along a small number of axes so that their similarity in the original high-dimensional space is reflected as proximity in the reduced space.",
    "bullets": [
      "Goal: replace many correlated columns with a handful of interpretable axes",
      "\"Similar\" samples end up close together; \"different\" samples end up far apart",
      "PCA and NMDS are both ordination methods -- they differ in what kind of similarity they preserve"
    ]
  },
  {
    "type": "section",
    "tag": "Method 1 -- PCA",
    "title": "Principal Component Analysis",
    "sub": "Linear axes of maximum variance, applied to soil chemistry (varechem)"
  },
  {
    "type": "bullets",
    "eyebrow": "PCA",
    "title": "The Idea",
    "items": [
      "PCA finds new axes (principal components) that are linear combinations of the original variables",
      "PC1 is the direction of maximum variance in the data; PC2 is the next direction, orthogonal to PC1; and so on",
      "Mathematically: an eigen-decomposition of the covariance (or correlation) matrix of the variables",
      "Each site gets a score on each PC; each variable gets a loading describing how much it contributes to that PC",
      "Best suited to continuous, roughly linear, non-sparse data -- like soil chemistry, not raw species counts"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "PCA",
    "title": "Why Standardize First",
    "items": [
      "varechem variables span very different scales: Ca ranges to 500+ mg/kg, pH ranges from about 2.7 to 4.3",
      "Unstandardized (covariance) PCA would be dominated entirely by whichever variable has the largest variance -- almost always Ca or Al here",
      "Standardizing (z-scores: mean 0, sd 1) puts every variable on equal footing before extracting axes",
      "R: prcomp(chem, scale. = TRUE); Python: StandardScaler().fit_transform() before PCA; Julia: manual (x - mean) / std"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "PCA Code",
    "title": "Standardized PCA on Soil Chemistry",
    "left": {
      "h": "R (vegan / base)",
      "body": "<pre><code>varechem &lt;- read.csv(&quot;data/varechem.csv&quot;)\nchem &lt;- varechem[, setdiff(names(varechem), &quot;site&quot;)]\n\npca &lt;- prcomp(chem, scale. = TRUE)\n\nvar_explained &lt;- (pca$sdev^2) / sum(pca$sdev^2)\nround(var_explained[1:4] * 100, 1)\n#&gt; 37.1  22.8  12.0   7.6\n\nround(pca$rotation[, 1], 3)  # PC1 loadings</code></pre>"
    },
    "right": {
      "h": "Python (scikit-learn)",
      "body": "<pre><code>from sklearn.preprocessing import StandardScaler\nfrom sklearn.decomposition import PCA\n\nvarechem = pd.read_csv(&quot;data/varechem.csv&quot;)\nchem = varechem.drop(columns=[&quot;site&quot;])\n\nchem_scaled = StandardScaler().fit_transform(chem)\npca = PCA()\nscores = pca.fit_transform(chem_scaled)\n\nvar_explained = pca.explained_variance_ratio_ * 100\nprint(var_explained[:4].round(1))\n# [37.1 22.8 12.  7.6]\n\nloadings = pd.Series(pca.components_[0], index=chem.columns)</code></pre>"
    }
  },
  {
    "type": "twocol",
    "eyebrow": "PCA Code",
    "title": "Julia PCA, and Reading the Output",
    "left": {
      "h": "Julia (MultivariateStats.jl)",
      "body": "<pre><code>using MultivariateStats, Statistics\n\nvarechem = CSV.read(&quot;data/varechem.csv&quot;, DataFrame)\nchem_names = names(varechem)[names(varechem) .!= &quot;site&quot;]\nchem = Matrix{Float64}(varechem[:, chem_names])\n\nchem_std = (chem .- mean(chem, dims=1)) ./ std(chem, dims=1)\n\n# MultivariateStats expects variables-as-rows\npca_model = fit(PCA, permutedims(chem_std);\n                 maxoutdim = size(chem_std, 2))\n\nvar_explained = principalvars(pca_model) ./\n                sum(principalvars(pca_model)) .* 100\npc1_loadings = projection(pca_model)[:, 1]</code></pre>"
    },
    "right": {
      "h": "Reading a PCA Biplot",
      "body": "<p>Each site gets a score on PC1 and PC2 -- plot them and you have a biplot.</p><p>Loadings near +/-0.3 to 0.4 in magnitude (as here) indicate a variable contributes strongly to that axis; loadings near zero contribute little.</p><p>Variables with loadings of the same sign move together across sites; opposite signs mean they trade off.</p><p>A biplot overlays both the site scores (points) and variable loadings (arrows) on one plot.</p>"
    }
  },
  {
    "type": "bullets",
    "eyebrow": "PCA Results",
    "title": "Variance Explained on varechem",
    "items": [
      "PC1 explains 37.1% of total variance -- the single largest gradient in soil chemistry across the 24 sites",
      "PC2 explains an additional 22.8%; together PC1 + PC2 capture 59.9% of the total variance",
      "PC3 adds 12.0% and PC4 adds 7.6% -- each additional axis explains progressively less",
      "A 2-D plot of PC1 vs PC2 is a reasonable, honest summary of a 14-variable dataset, capturing roughly 60% of the total variation",
      "Rule of thumb: report the % variance explained by any axes you plot -- never present an ordination without it"
    ]
  },
  {
    "type": "cards",
    "eyebrow": "PCA Results",
    "title": "Interpreting PC1 Loadings",
    "cards": [
      {
        "h": "Fertile end (negative PC1)",
        "p": "K, Ca, P, Mg, Zn, S, Mn load negatively (-0.29 to -0.36) -- sites high on these nutrients score low on PC1."
      },
      {
        "h": "Rocky / acidic end (positive PC1)",
        "p": "Fe, Al, pH load positively (0.12 to 0.20) -- sites with more iron, aluminum, and higher pH score high on PC1."
      },
      {
        "h": "Ecological reading",
        "p": "PC1 behaves like a soil fertility gradient, running from nutrient-rich sites to iron/aluminum-dominated, more acidic sites."
      },
      {
        "h": "Near-zero loadings",
        "p": "N and Mo load close to zero on PC1 (0.10 and -0.04) -- they contribute little to this particular axis."
      }
    ]
  },
  {
    "type": "section",
    "tag": "Method 2 -- NMDS",
    "title": "Non-metric Multidimensional Scaling",
    "sub": "The standard community-ecology ordination, applied to the dune vegetation survey"
  },
  {
    "type": "bullets",
    "eyebrow": "NMDS",
    "title": "Why Not PCA for Community Data",
    "items": [
      "Species abundance matrices are sparse (many zeros) and species respond nonlinearly to underlying gradients",
      "Linear methods like PCA applied to raw community data produce artifacts such as the 'horseshoe effect' -- a curved distortion of a real gradient",
      "NMDS instead works on a dissimilarity matrix and only tries to preserve the *rank order* of dissimilarities, not their exact values",
      "This makes NMDS robust to the nonlinear, zero-inflated nature of species abundance data",
      "NMDS is the default ordination method in community ecology, almost always paired with Bray-Curtis dissimilarity"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Key Concept",
    "title": "Bray-Curtis Dissimilarity",
    "term": "Bray-Curtis Dissimilarity",
    "def": "A dissimilarity measure between two sites based on shared species abundances: 0 means identical composition, 1 means no species in common. It ignores joint absences and is not sensitive to the total scale of counts.",
    "bullets": [
      "Computed pairwise for every site, producing an n x n dissimilarity matrix",
      "The standard distance measure for community abundance data in ecology",
      "R: vegdist(mat, method='bray'); Python: scipy.spatial.distance.pdist(X, metric='braycurtis')"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "NMDS",
    "title": "How NMDS Works",
    "items": [
      "Start from a full dissimilarity matrix (here, Bray-Curtis distances between all pairs of the 20 dune sites)",
      "Place sites randomly in k dimensions (usually k = 2), then iteratively move them to better match the *rank order* of the original dissimilarities",
      "Convergence is measured by 'stress' -- the mismatch between ordination distances and dissimilarity ranks",
      "Because NMDS uses random starts and gradient descent, results can differ run-to-run -- always set a seed and consider multiple random starts",
      "R's metaMDS() automates multiple random starts and picks the best solution automatically"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "NMDS Code",
    "title": "NMDS on Dune Community Data",
    "left": {
      "h": "R (vegan::metaMDS)",
      "body": "<pre><code>library(vegan)\n\ndune_species &lt;- read.csv(&quot;data/dune_species.csv&quot;)\nsp_mat &lt;- as.matrix(\n  dune_species[, setdiff(names(dune_species), &quot;site&quot;)]\n)\n\nset.seed(42)\nnmds &lt;- metaMDS(sp_mat, distance = &quot;bray&quot;, k = 2,\n                trace = FALSE)\n\nnmds$stress\n#&gt; 0.1183\n\nplot(nmds, type = &quot;n&quot;)\npoints(nmds, display = &quot;sites&quot;, pch = 19)</code></pre>"
    },
    "right": {
      "h": "Python (scikit-learn MDS)",
      "body": "<pre><code>from scipy.spatial.distance import pdist, squareform\nfrom sklearn.manifold import MDS\n\ndune_species = pd.read_csv(&quot;data/dune_species.csv&quot;)\nsp_mat = dune_species.drop(columns=[&quot;site&quot;]).to_numpy(float)\n\nbc_square = squareform(pdist(sp_mat, metric=&quot;braycurtis&quot;))\n\nnmds = MDS(n_components=2, metric=False,\n           dissimilarity=&quot;precomputed&quot;, n_init=20,\n           max_iter=500, random_state=42,\n           normalized_stress=True, init=&quot;random&quot;)\nscores = nmds.fit_transform(bc_square)\n\nprint(nmds.stress_)\n# 0.1211</code></pre>"
    }
  },
  {
    "type": "twocol",
    "eyebrow": "NMDS Code",
    "title": "Julia NMDS, and a Cross-Language Check",
    "left": {
      "h": "Julia (hand-rolled gradient descent)",
      "body": "<pre><code># Hand-rolled NMDS (no maintained Julia package):\n# gradient descent on a rank-based stress criterion\nusing Distances\n\nbc_dist = pairwise(BrayCurtis(),\n                    permutedims(sp_mat); dims = 2)\n\nX, stress = nmds_gradient_descent(\n    bc_dist; k = 2, n_iter = 800, lr = 0.03, seed = 42\n)\nprintln(stress)\n# Julia has no turnkey NMDS package, so this lecture\n# implements it directly -- transparent, if less\n# polished than metaMDS&#x27;s isotonic regression.</code></pre>"
    },
    "right": {
      "h": "Consistency Across Languages",
      "body": "<p>All three languages recover essentially the same solution: stress around 0.12 for this 20-site, 30-species dataset.</p><p>That stress level is discussed on the next slide -- it falls in the 'usable' range, meaning the 2-D plot is a reasonably faithful, if imperfect, summary.</p>"
    }
  },
  {
    "type": "bullets",
    "eyebrow": "Interpreting Stress",
    "title": "Stress Rules of Thumb",
    "items": [
      "Stress quantifies how well the 2-D ordination distances match the rank order of the original Bray-Curtis dissimilarities",
      "Stress < 0.10: excellent representation, safe to interpret distances on the plot at face value",
      "Stress 0.10-0.20: usable, interpretable with some caution -- this is where our dune result falls (0.118 in R, 0.121 in Python)",
      "Stress > 0.20: risky -- the ordination may be distorting the true pattern; consider more dimensions or a different method",
      "Stress always decreases as you add dimensions -- it is not a p-value, just a goodness-of-fit diagnostic"
    ]

function esc(s){ return s; } // bullets allow inline <b> tags intentionally

function renderSlide(s, idx){
  let inner = "";
  switch(s.type){

    case "title":
      inner = `
        <div class="center-stage">
          <span class="tag">${s.eyebrow||""}</span>
          <div class="big-word">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
          <div class="footnote">${s.footnote||""}</div>
        </div>`;
      break;

    case "section":
      inner = `
        <div class="center-stage">
          <span class="tag gold">${s.tag||"Section"}</span>
          <div class="big-word" style="font-size:2.6rem;">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
        </div>`;
      break;

    case "bullets":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content"><ul class="bullets">
          ${s.items.map(i=>`<li>${i}</li>`).join("")}
        </ul></div>`;
      break;

    case "term":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <div class="term-box">
            <span class="term">${s.term}</span>
            <span class="def">${s.def}</span>
          </div>
          ${s.bullets ? `<ul class="bullets sub">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
        </div>`;
      break;

    case "twocol":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="two-col">
          <div class="col-box"><h3>${s.left.h}</h3><p>${s.left.body}</p></div>
          <div class="col-box"><h3>${s.right.h}</h3><p>${s.right.body}</p></div>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "compare":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <table class="compare">
            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Ecological Modelling · R / Python / Julia</span>
        <span>Lecture 4</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>

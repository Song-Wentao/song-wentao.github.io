const slides = [
  {
    "type": "title",
    "eyebrow": "Lecture 7",
    "title": "Mixed-Effects Models",
    "sub": "Ticks, broods, and locations: modelling non-independence in grouped ecological data",
    "footnote": "Ecological Modelling with R, Python, and Julia"
  },
  {
    "type": "section",
    "tag": "07.1",
    "title": "Picking Up the Thread",
    "sub": "\"Ticks come from the same brood and location -- those aren't independent observations.\""
  },
  {
    "type": "bullets",
    "eyebrow": "From Lecture 6",
    "title": "The GLM Assumed Something False",
    "items": [
      "Lecture 6 fit a Poisson GLM to grouse tick counts, one row per chick, as if every chick were an independent draw",
      "But chicks in the same BROOD share a nest, a mother, a hatch date, and a microhabitat",
      "Broods in the same LOCATION share climate, altitude, and regional tick exposure",
      "Two chicks from the same brood are more alike than two random chicks -- the model's independence assumption is false",
      "This lecture fixes it with mixed-effects models: random intercepts for BROOD and LOCATION"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Key Concept",
    "title": "Pseudoreplication",
    "term": "Pseudoreplication",
    "def": "Treating multiple, non-independent observations (e.g. chicks from the same brood) as if they were independent replicates, which inflates the effective sample size and understates true uncertainty.",
    "bullets": [
      "Coined by Hurlbert (1984) in a landmark critique of ecological study design",
      "403 chicks are not 403 independent pieces of evidence about the YEAR or HEIGHT effect -- they cluster into 118 broods and 63 locations",
      "Ignoring the clustering makes standard errors too small and p-values artificially significant"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Why It Matters",
    "title": "What Goes Wrong If You Ignore It",
    "items": [
      "Standard errors on fixed effects (YEAR, cHEIGHT) are too small -- confidence intervals are too narrow",
      "p-values are too small -- you find 'significant' effects that are really just brood-to-brood or location-to-location noise",
      "Point estimates of the fixed effects can still be roughly unbiased -- the danger is mainly in the uncertainty, not the average",
      "The fix is not to throw away the grouping structure -- it's to model it explicitly with random effects"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Tempting but Flawed",
    "title": "Two Naive 'Fixes' -- and Why They Fall Short",
    "items": [
      "Option A -- aggregate to one row per brood (average TICKS per brood): throws away within-brood information, and you still have LOCATION clustering among the 118 brood means",
      "Option B -- add BROOD as a FIXED effect (117 dummy variables): burns 117 degrees of freedom, can't generalize to new broods, and doesn't even solve LOCATION clustering",
      "Neither approach gives you a variance estimate for 'how much do broods differ' -- and that variance is often scientifically interesting in its own right",
      "A random effect gets you correct standard errors, a reusable variance estimate, AND predictions that generalize to unobserved broods -- for the cost of one variance parameter per grouping term"
    ]
  },
  {
    "type": "section",
    "tag": "07.2",
    "title": "Fixed vs. Random Effects",
    "sub": "Two very different kinds of \"explanatory variable\""
  },
  {
    "type": "bullets",
    "eyebrow": "The Conceptual Split",
    "title": "Which Levels Do You Actually Care About?",
    "items": [
      "Fixed effect: the specific levels you observe ARE the levels you want to estimate and compare -- e.g. YEAR (95 vs 96 vs 97), cHEIGHT",
      "Random effect: the levels you observe are a SAMPLE from a larger population of levels you don't individually care about -- e.g. these 118 broods are a sample of 'broods in general'",
      "You want to know the BROOD-level VARIANCE (how much do broods differ?), not each brood's exact coefficient",
      "Rule of thumb: if you'd be happy re-running the study with a different set of broods and locations, treat them as random"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Key Concept",
    "title": "Random Effect",
    "term": "Random Effect",
    "def": "A model term whose levels are treated as a random sample from a population of possible levels; instead of estimating one coefficient per level, the model estimates the VARIANCE across levels and shrinks each level's estimate toward the overall mean.",
    "bullets": [
      "Written (1|GROUP) in lme4/MixedModels.jl syntax -- a random intercept for GROUP",
      "Costs one variance parameter, not one coefficient per level -- 118 broods cost 1 parameter, not 118",
      "Automatically applies partial pooling / shrinkage (more on this later in the lecture)"
    ]
  },
  {
    "type": "compare",
    "eyebrow": "Method Comparison",
    "title": "Fixed Effect vs. Random Effect",
    "headers": [
      "",
      "Fixed Effect",
      "Random Effect"
    ],
    "rows": [
      [
        "What it represents",
        "Specific levels you want to estimate and compare directly",
        "Levels sampled from a larger population; you care about their spread, not each one"
      ],
      [
        "How many parameters",
        "One coefficient per level (minus a reference)",
        "One variance (and covariance) parameter per grouping term, regardless of level count"
      ],
      [
        "Example here",
        "YEAR (95/96/97), cHEIGHT",
        "BROOD, LOCATION"
      ],
      [
        "When to use",
        "Few levels, all of scientific interest, want per-level estimates",
        "Many levels, a 'nuisance' grouping structure, or you want to generalize beyond the observed levels"
      ],
      [
        "Estimate behavior",
        "No shrinkage -- each level estimated on its own data",
        "Shrinkage / partial pooling toward the grand mean"
      ]
    ]
  },
  {
    "type": "cards",
    "eyebrow": "Diagnosis",
    "title": "Signs You Need a Random Effect",
    "cards": [
      {
        "h": "Repeated measures",
        "p": "Multiple observations per subject, site, or brood over time or space"
      },
      {
        "h": "Many levels",
        "p": "Dozens or hundreds of grouping levels -- too many to sensibly estimate as fixed dummies"
      },
      {
        "h": "Generalization goal",
        "p": "You want predictions or inference to extend beyond the specific groups sampled"
      },
      {
        "h": "Nested sampling design",
        "p": "The study design itself is hierarchical -- chicks in broods in locations, plots in sites in regions"
      }
    ]
  },
  {
    "type": "section",
    "tag": "07.3",
    "title": "The Grouse Tick Data",
    "sub": "A textbook nested design: chicks in broods in locations"
  },
  {
    "type": "bullets",
    "eyebrow": "The Dataset",
    "title": "grouseticks.csv",
    "items": [
      "403 red grouse chicks; TICKS = number of ticks counted on each chick",
      "BROOD: 118 levels -- chicks are nested within broods (siblings share a nest)",
      "LOCATION: 63 levels -- broods are nested within locations (broods share a region)",
      "HEIGHT / cHEIGHT: altitude (centered) -- a fixed effect of ecological interest",
      "YEAR: 1995 / 1996 / 1997 -- a fixed effect, since we care about these specific years"
    ]
  },
  {
    "type": "pyramid",
    "eyebrow": "Nested Design",
    "title": "Three Levels of Grouping",
    "levels": [
      {
        "label": "63 LOCATIONs (region)",
        "color": "#2c5f7c",
        "width": 45
      },
      {
        "label": "118 BROODs (nest, within a location)",
        "color": "#3b7ea1",
        "width": 70
      },
      {
        "label": "403 chicks (within a brood)",
        "color": "#6fa8c9",
        "width": 100
      }
    ]
  },
  {
    "type": "quote",
    "eyebrow": "Provenance",
    "quote": "Elston, D.A., Moss, R., Boulinier, T., Arrowsmith, C. & Lambin, X. (2001). Analysis of aggregation, a worked example: numbers of ticks on red grouse chicks. Parasitology, 122, 563-569.",
    "attrib": "The grouseticks dataset -- the canonical worked example for GLMMs with crossed/nested random effects in ecology, later popularized as a teaching dataset by Zuur et al. (2009, Mixed Effects Models and Extensions in Ecology with R) and Bolker et al. (2009, TREE, \"Generalized linear mixed models: a practical guide for ecology and evolution\")"
  },
  {
    "type": "bullets",
    "eyebrow": "Look Before You Model",
    "title": "The Clustering Is Visible in the Raw Data",
    "items": [
      "Mean TICKS per brood ranges from 0 to about 69, with a standard deviation around 10.6 -- broods differ enormously",
      "figures/lecture_07_ticks_by_location_brood.png plots mean TICKS for a sample of 20 locations against the overall mean",
      "Some locations sit far above or below the dashed overall-mean line -- exactly the between-group variance a random intercept is built to capture",
      "This is the same visual check you should always run before fitting any mixed model: plot the response by group and look for spread"
    ]
  },
  {
    "type": "section",
    "tag": "07.4",
    "title": "Linear Mixed Models",
    "sub": "The Gaussian stepping stone before the Poisson GLMM"
  },
  {
    "type": "bullets",
    "eyebrow": "LMM Intuition",
    "title": "lmer(): An lm() With Grouping Structure",
    "items": [
      "lme4::lmer() fits a linear model where some intercepts (or slopes) are allowed to vary randomly by group",
      "Formula: response ~ fixed_effects + (1 | GROUP) -- the (1|GROUP) part is a random intercept",
      "Nested random effects use (1 | LOCATION/BROOD), read as: BROOD nested within LOCATION",
      "As a stepping stone, we first fit log1p(TICKS) as an approximately Gaussian response before moving to the Poisson GLMM"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "R Code",
    "title": "Fitting an LMM With lme4::lmer()",
    "left": {
      "h": "R (lme4)",
      "body": "<pre><code>library(lme4)\n\ndat$BROOD    &lt;- factor(dat$BROOD)\ndat$LOCATION &lt;- factor(dat$LOCATION)\ndat$YEAR     &lt;- factor(dat$YEAR)\ndat$logTICKS &lt;- log1p(dat$TICKS)\n\nfit_lmm &lt;- lmer(\n  logTICKS ~ YEAR + cHEIGHT + (1 | LOCATION/BROOD),\n  data = dat\n)\n\nsummary(fit_lmm)\n#&gt; Random effects:\n#&gt;  Groups         Name     Variance Std.Dev.\n#&gt;  BROOD:LOCATION Intcpt   0.285    0.534\n#&gt;  LOCATION       Intcpt   0.125    0.354\n#&gt;  Residual                0.314    0.561</code></pre>"

    "type": "bullets",
    "eyebrow": "Reading the Output",

    "eyebrow": "Putting It Together",
    "title": "Why Poisson GLMM Is the Right Model Here",
    "items": [
      "TICKS is a count -- Lecture 6 already established that a Poisson GLM (log link) fits counts far better than a Gaussian lm()",

    ]

    "type": "twocol",
    "eyebrow": "R Code",
    "title": "Poisson GLMM With Nested Random Effects",
    "left": {
      "h": "R (lme4::glmer)",
      "body": "<pre><code>fit_glmm &lt;- glmer(\n  TICKS ~ YEAR + cHEIGHT + (1 | LOCATION/BROOD),\n  data = dat, family = poisson\n)\n\nsummary(fit_glmm)\n#&gt; Random effects:\n#&gt;  Groups         Variance Std.Dev.\n#&gt;  BROOD:LOCATION 0.592    0.770\n#&gt;  LOCATION       0.330    0.574\n#&gt;\n#&gt; Fixed effects:\n#&gt;              Estimate Std.Error z value\n#&gt; (Intercept)   0.467    0.192    2.43\n#&gt; YEAR96        1.166    0.230    5.07\n#&gt; YEAR97       -0.978    0.255   -3.84\n#&gt; cHEIGHT      -0.0235   0.0035  -6.80</code></pre>"
    },

// RENDER ENGINE

function esc(s){ return s; } // bullets allow inline <b> tags intentionally

function renderSlide(s, idx){
  let inner = "";
  switch(s.type){

    case "title":
      inner = `
        <div class="center-stage">
          <span class="tag">${s.eyebrow||""}</span>
          <div class="big-word">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
          <div class="footnote">${s.footnote||""}</div>
        </div>`;
      break;

    case "section":
      inner = `
        <div class="center-stage">
          <span class="tag gold">${s.tag||"Section"}</span>
          <div class="big-word" style="font-size:2.6rem;">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
        </div>`;
      break;

    case "bullets":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content"><ul class="bullets">
          ${s.items.map(i=>`<li>${i}</li>`).join("")}
        </ul></div>`;
      break;

    case "term":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <div class="term-box">
            <span class="term">${s.term}</span>
            <span class="def">${s.def}</span>
          </div>
          ${s.bullets ? `<ul class="bullets sub">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
        </div>`;
      break;

    case "twocol":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="two-col">
          <div class="col-box"><h3>${s.left.h}</h3><p>${s.left.body}</p></div>
          <div class="col-box"><h3>${s.right.h}</h3><p>${s.right.body}</p></div>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "compare":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <table class="compare">
            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Ecological Modelling · R / Python / Julia</span>
        <span>Lecture 7</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>

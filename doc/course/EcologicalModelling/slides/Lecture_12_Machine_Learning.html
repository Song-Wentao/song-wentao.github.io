<script>
// =====================================================================
// SLIDE DATA — edit this array to change content. Each slide is one
// object with a `type` (layout) and layout-specific fields.
// =====================================================================
const slides = [
  {
    "type": "title",
    "eyebrow": "Lecture 12",
    "title": "Machine Learning",
    "sub": "Random forests and gradient boosting for prediction-focused ecology -- classifying dune meadow management regime from plant community composition",
    "footnote": "Ecological Modelling with R, Python, and Julia"
  },
  {
    "type": "section",
    "tag": "Picking Up the Thread",
    "title": "\"What If You Don't Know the Functional Form?\"",
    "sub": "Lectures 5-11 all asked you to specify a model structure -- this lecture asks a machine to find one"
  },
  {
    "type": "bullets",
    "eyebrow": "The Shift",
    "title": "Eleven Lectures of Specifying Structure",
    "items": [
      "Linear models (5), GLMs (6), mixed models (7), and GAMs (8) all require you to choose a linear predictor, a link function, a random-effects structure, or a smooth term -- you decide the shape",
      "Bayesian hierarchical models (9), state-space models (10), and occupancy models (11) go further still, encoding an explicit generative story about the ecological process",
      "That structure is exactly what buys you interpretable coefficients, confidence intervals, and causal-flavored inference statements",
      "But structure is also a strong assumption -- and when you have dozens or hundreds of correlated predictors and no strong prior idea of their functional form, hand-specifying it becomes a guessing game"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "When to Reach for ML",
    "title": "Prediction Over Inference, Interactions Over Hand-Specification",
    "items": [
      "Many predictors relative to sample size -- e.g. an entire species community matrix (20-300+ species) as predictors, where no GLM formula could sensibly include every species and its interactions",
      "Unknown or highly nonlinear functional forms -- thresholds, interactions, and context-dependent effects that would require an unmanageable number of hand-built terms in a GLM/GAM",
      "The goal is prediction accuracy on new data, not a p-value or an interpretable effect size for a specific covariate",
      "You are willing to trade some interpretability for the ability to automatically capture interactions and nonlinearities you did not think to specify"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "A Concrete Ecological Case",
    "title": "Predicting Site Type From Community Composition",
    "items": [
      "Dutch dune meadow survey (Jongman, ter Braak & van Tongeren): 20 sites, 30 plant species abundances, and a 4-class Management label (biological farming, hobby farming, nature conservation, standard farming)",
      "Question: can the plant community alone -- 30 correlated, non-normally distributed count predictors -- predict which management regime a site is under?",
      "A GLM would need you to pick a handful of species a priori; a random forest or boosted-tree model can use all 30 and let splits emerge from the data",
      "This is the running example for the rest of the lecture, in R, Python, and Julia"
    ]
  },
  {
    "type": "section",
    "tag": "Validation, Not Just Fit",
    "title": "Train/Test Splits and Cross-Validation",
    "sub": "Flexible learners can memorize your data -- you need a fair way to ask how they do on data they have never seen"
  },
  {
    "type": "bullets",
    "eyebrow": "Why This Matters More Here",
    "title": "Flexible Learners Overfit More Readily",
    "items": [
      "A linear model with 3 coefficients cannot memorize 20 data points; a decision tree with unlimited depth can fit every training point perfectly and generalize terribly",
      "Random forests and boosted trees are exactly this kind of high-flexibility learner -- their whole appeal (capturing interactions and nonlinearities automatically) is also their overfitting risk",
      "In Lectures 5-11, in-sample fit statistics (R-squared, AIC, deviance) were reasonably informative about generalization because the models were constrained by their structure",
      "For ML models that constraint is gone, so an honest performance estimate MUST come from data the model did not see during fitting"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "The Basic Recipe",
    "title": "Train/Test Split",
    "items": [
      "Randomly partition sites into a training set (fit the model) and a held-out test set (evaluate it) -- never let the model see test-set labels during fitting",
      "Report accuracy, confusion matrix, or error on the TEST set only -- training-set performance for a flexible model is close to meaningless on its own",
      "Works well with large sample sizes; with only 20 dune sites, a single train/test split would leave a test set of just a handful of points -- far too noisy to trust",
      "This is exactly why cross-validation, not a single split, is the standard tool in small ecological datasets"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Key Concept",
    "title": "k-Fold Cross-Validation",
    "term": "cross-validation",
    "def": "A resampling procedure that estimates out-of-sample performance by repeatedly holding out a different subset of the data as a test fold, fitting on the rest, and averaging performance across folds -- so every observation is used for both training and testing, just never in the same fold.",
    "bullets": [
      "Split the data into k roughly equal folds (commonly k = 5 or 10)",
      "For each fold i: fit the model on the other k-1 folds, predict on fold i, record the error",
      "Average the k error estimates -- this average is a much less noisy estimate of out-of-sample performance than a single train/test split, especially with small n",
      "With only 20 dune sites and k = 5, each test fold has ~4 sites -- still noisy, but far better than a one-shot 80/20 split"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Small-Sample Honesty",
    "title": "A Caveat Worth Stating Out Loud",
    "items": [
      "With 20 sites and 5-fold CV, per-fold accuracy in this lecture's dune example swings from 0.0 to 0.75 depending on which 4 sites land in the fold",
      "That variance is not a bug in the code -- it is the honest signal that 20 observations cannot pin down a 4-class classifier's accuracy precisely",
      "Report the mean AND the spread across folds; a single mean-accuracy number without its variability is misleading in small ecological datasets",
      "Larger community datasets (e.g. BCI's 50 plots x 225 species) still benefit from the same logic, just with somewhat less fold-to-fold noise"
    ]
  },
  {
    "type": "section",
    "tag": "The Workhorse",
    "title": "Random Forest",
    "sub": "Bagging many decorrelated decision trees -- the default ecological ML algorithm for good reason"
  },
  {
    "type": "term",
    "eyebrow": "Key Concept",
    "title": "Random Forest",
    "term": "random forest",
    "def": "An ensemble of many decision trees, each grown on a bootstrap resample of the data (bagging) and each considering only a random subset of predictors at every split, whose predictions are combined by majority vote (classification) or averaging (regression).",
    "bullets": [
      "Bagging (bootstrap aggregating): each tree sees a different bootstrap sample of the sites, which reduces variance relative to a single deep tree",
      "Random subset of predictors per split (mtry / max_features / n_subfeatures): decorrelates the trees from each other so averaging them helps more than averaging correlated trees would",
      "Out-of-bag (OOB) error: each tree's bootstrap leaves out ~1/3 of sites -- predicting those left-out sites gives a built-in cross-validation-like error estimate for free, no separate holdout needed",
      "Handles many correlated, non-normal predictors (like species counts) natively, with no need to transform or hand-select them"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Why Ecologists Reach For It First",
    "title": "Random Forest Is the Default ML Tool in Ecology",
    "items": [
      "Requires almost no tuning to get a reasonable result -- default mtry and a few hundred trees already perform well on most ecological tabular data",
      "Robust to irrelevant predictors, correlated predictors, and mixed variable types -- exactly the profile of a species-by-site matrix or an environmental covariate stack",
      "Built-in OOB error estimate and variable importance come essentially for free from the fitting procedure itself",
      "Widely used for species distribution models, community classification, and trait prediction throughout the ecological ML literature -- which is exactly why Lecture 13 reuses this toolkit"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "R",
    "title": "Random Forest with randomForest::randomForest()",
    "left": {
      "h": "Fit and inspect OOB error",
      "body": "<pre><code>library(randomForest)\n\ndat &lt;- merge(dune_env[, c(\"site\",\"Management\")],\n              dune_sp, by = \"site\")\ndat$Management &lt;- factor(dat$Management)\ndat$site &lt;- NULL\n\nrf_fit &lt;- randomForest(\n  Management ~ ., data = dat,\n  ntree = 500,\n  mtry = floor(sqrt(ncol(dat) - 1)),\n  importance = TRUE\n)\n\nprint(rf_fit)\nprint(rf_fit$confusion)\noob_acc &lt;- 1 - rf_fit$err.rate[\n  nrow(rf_fit$err.rate), \"OOB\"]</code></pre>"
    },
    "right": {
      "h": "5-fold CV accuracy (independent of OOB)",
      "body": "<pre><code>k &lt;- 5\nfolds &lt;- sample(rep(1:k, length.out = nrow(dat)))\ncv_acc &lt;- numeric(k)\n\nfor (i in 1:k) {\n  train_dat &lt;- dat[folds != i, ]\n  test_dat  &lt;- dat[folds == i, ]\n  fit_i &lt;- randomForest(Management ~ .,\n                         data = train_dat, ntree = 500)\n  pred_i &lt;- predict(fit_i, newdata = test_dat)\n  cv_acc[i] &lt;- mean(pred_i == test_dat$Management)\n}\n\nmean(cv_acc)  # out-of-sample accuracy estimate</code></pre>"
    }
  },
  {
    "type": "twocol",
    "eyebrow": "Python",
    "title": "Random Forest with sklearn.ensemble.RandomForestClassifier",
    "left": {
      "h": "Fit and inspect OOB score",
      "body": "<pre><code>from sklearn.ensemble import (\n    RandomForestClassifier)\n\ndat = dune_env[[\"site\",\"Management\"]].merge(\n    dune_sp, on=\"site\")\nX = dat.drop(columns=[\"site\",\"Management\"]).values\ny = dat[\"Management\"].values\n\nrf = RandomForestClassifier(\n    n_estimators=500,\n    max_features=\"sqrt\",\n    oob_score=True,\n    random_state=12,\n)\nrf.fit(X, y)\nprint(rf.oob_score_)</code></pre>"
    },
    "right": {
      "h": "5-fold CV with cross_val_score",
      "body": "<pre><code>from sklearn.model_selection import (\n    cross_val_score, KFold)\n\ncv = KFold(n_splits=5, shuffle=True,\n           random_state=12)\n\nscores = cross_val_score(\n    RandomForestClassifier(\n        n_estimators=500,\n        max_features=\"sqrt\",\n        random_state=12),\n    X, y, cv=cv, scoring=\"accuracy\",\n)\n\nprint(scores.mean(), scores.std())</code></pre>"
    }
  },
  {
    "type": "twocol",
    "eyebrow": "Julia",
    "title": "Random Forest with DecisionTree.jl",
    "left": {
      "h": "Fit a forest, get OOB-style CV error",
      "body": "<pre><code>using DecisionTree\n# broader Julia ML framework:\n# using MLJ\n\nX = Matrix{Float64}(dat[:, species_cols])\ny = String.(dat.Management)\n\nn_subfeat = round(Int, sqrt(size(X, 2)))\nn_trees = 500\n\nrf_model = build_forest(\n    y, X, n_subfeat, n_trees,\n    0.7,   # partial_sampling (bagging fraction)\n    -1,    # max_depth, -1 = unlimited\n)</code></pre>"
    },
    "right": {
      "h": "5-fold CV accuracy",
      "body": "<pre><code>acc_per_fold = nfoldCV_forest(\n    y, X, 5,\n    n_subfeat, n_trees, 0.7, -1;\n    verbose = false,\n)\n\nusing Statistics\nmean(acc_per_fold), std(acc_per_fold)\n\n# MLJ.jl wraps this and dozens of other\n# packages behind one fit!/predict API</code></pre>"
    }
  },
  {
    "type": "bullets",
    "eyebrow": "Reading the R Output",
    "title": "What the Dune Random Forest Actually Says",
    "items": [
      "500 trees, mtry = 5 (sqrt of 30 species) yields an OOB error rate around 40% on this 4-class, 20-site problem -- OOB accuracy roughly 0.60",
      "The OOB confusion matrix shows the model does best on NM (nature conservation) and worst on BF (biological farming, only 3 sites) -- class imbalance hurts small, rare classes hardest",
      "5-fold CV accuracy averages lower and noisier (around 0.45, SD ~0.33 across folds) than the OOB estimate -- OOB tends to be optimistic in very small samples because bootstrap resampling still shares information across nearly-overlapping trees",
      "Conclusion for this dataset: the model captures real signal (well above the 0.25 random-guessing baseline for 4 classes) but 20 sites is not enough to nail down a precise accuracy number"
    ]
  },
  {
    "type": "section",
    "tag": "A Complementary Ensemble",
    "title": "Gradient Boosted Trees",
    "sub": "Sequentially correcting mistakes instead of averaging independent trees -- often higher accuracy, more tuning"
  },
  {
    "type": "term",
    "eyebrow": "Key Concept",
    "title": "Gradient Boosting",
    "term": "gradient boosting",
    "def": "An ensemble method that builds decision trees sequentially, where each new tree is fit to the residual errors of the ensemble so far, so the model incrementally corrects its own mistakes rather than averaging independently-grown trees.",
    "bullets": [
      "Contrast with random forest: bagging grows trees independently and in parallel; boosting grows trees sequentially and each one depends on the trees before it",
      "Key tuning knobs: number of trees, learning rate/shrinkage (how much each tree corrects), and tree depth/interaction depth (how complex each individual tree is allowed to be)",
      "Because trees are shallow and sequential, boosting tends to need more careful tuning than random forest to avoid overfitting, but often reaches higher accuracy when tuned well",
      "Implementations: R's gbm and xgboost, Python's GradientBoostingClassifier/XGBoost/LightGBM, Julia has no native gradient booster in DecisionTree.jl -- AdaBoost stumps serve as the boosting comparator there"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "R",
    "title": "Gradient Boosting via caret::train(method = \"gbm\")",

// RENDER ENGINE

function esc(s){ return s; } // bullets allow inline <b> tags intentionally

function renderSlide(s, idx){
  let inner = "";
  switch(s.type){

    case "title":
      inner = `
        <div class="center-stage">
          <span class="tag">${s.eyebrow||""}</span>
          <div class="big-word">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
          <div class="footnote">${s.footnote||""}</div>
        </div>`;
      break;

    case "section":
      inner = `
        <div class="center-stage">
          <span class="tag gold">${s.tag||"Section"}</span>
          <div class="big-word" style="font-size:2.6rem;">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
        </div>`;
      break;

    case "bullets":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content"><ul class="bullets">
          ${s.items.map(i=>`<li>${i}</li>`).join("")}
        </ul></div>`;
      break;

    case "term":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <div class="term-box">
            <span class="term">${s.term}</span>
            <span class="def">${s.def}</span>
          </div>
          ${s.bullets ? `<ul class="bullets sub">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
        </div>`;
      break;

    case "twocol":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="two-col">
          <div class="col-box"><h3>${s.left.h}</h3><p>${s.left.body}</p></div>
          <div class="col-box"><h3>${s.right.h}</h3><p>${s.right.body}</p></div>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "compare":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <table class="compare">
            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Ecological Modelling · R / Python / Julia</span>
        <span>Lecture 12</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>

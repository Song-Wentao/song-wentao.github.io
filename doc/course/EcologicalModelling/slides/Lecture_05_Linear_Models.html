<script>
// =====================================================================

// object with a `type` (layout) and layout-specific fields.
// =====================================================================
const slides = [
  {
    "type": "title",
    "eyebrow": "Lecture 5",
    "title": "Linear Models",
    "sub": "The linear model as the foundation of regression -- formula notation, least squares, diagnostics, and what happens when the assumptions break",
    "footnote": "Ecological Modelling with R, Python, and Julia"
  },
  {
    "type": "section",
    "tag": "Why Linear Models",
    "title": "The Workhorse of Statistical Ecology",
    "sub": "Almost every model in this course is a linear model, or a generalization of one"
  },
  {
    "type": "bullets",
    "eyebrow": "The Big Picture",
    "title": "One Framework, Many Names",
    "items": [
      "Regression, ANOVA, ANCOVA, t-test -- all special cases of the same linear model",
      "GLMs (Lecture 6), mixed models (Lecture 7), and GAMs (Lecture 8) are all generalizations of what you learn today",
      "If you understand lm() deeply, you understand the backbone of the entire course",
      "Today's data: 70 peat moss sites from Lac Cromwell (Borcard & Legendre 1994) -- oribatid mite species richness as a function of water content, substrate density, and substrate type"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Definition",
    "title": "The Linear Model",
    "term": "linear model",
    "def": "A model in which the expected value of a response variable is a linear combination of predictors: E[y] = beta_0 + beta_1*x_1 + ... + beta_p*x_p, with errors assumed independent, normally distributed, and of constant variance.",
    "bullets": [
      "\"Linear\" refers to linearity in the parameters (the betas), not necessarily in the predictors -- x^2 or log(x) as a predictor is still a linear model",
      "Fit in R with lm(), in Python with statsmodels.OLS / smf.ols, in Julia with GLM.jl's lm()",
      "The single most common building block in ecological data analysis"
    ]
  },
  {
    "type": "section",
    "tag": "Simple Linear Regression",
    "title": "One Predictor: richness ~ WatrCont",
    "sub": "Does peat water content predict oribatid mite species richness?"
  },
  {
    "type": "bullets",
    "eyebrow": "Setting Up the Model",
    "title": "Formula Notation",
    "items": [
      "richness ~ WatrCont reads as \"richness modeled as a function of WatrCont\"",
      "Fits the equation richness_i = beta_0 + beta_1 * WatrCont_i + epsilon_i for site i",
      "beta_0 (intercept): expected richness when WatrCont = 0",
      "beta_1 (slope): expected change in richness for a one-unit increase in WatrCont",
      "epsilon_i: residual error, assumed epsilon_i ~ Normal(0, sigma^2), independent across sites"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Simple LM Code",
    "title": "Fitting richness ~ WatrCont in R",
    "left": {
      "h": "R (base)",
      "body": "<pre><code>species &lt;- read.csv(&quot;data/mite_species.csv&quot;)\nenv &lt;- read.csv(&quot;data/mite_env.csv&quot;)\n\nsp_cols &lt;- setdiff(names(species), &quot;site&quot;)\nrichness &lt;- rowSums(species[, sp_cols] &gt; 0)\n\ndat &lt;- merge(env, data.frame(site = species$site,\n                              richness = richness), by = &quot;site&quot;)\n\nfit_simple &lt;- lm(richness ~ WatrCont, data = dat)\nsummary(fit_simple)\n#&gt; (Intercept)  24.304025   1.249095  19.457  &lt;2e-16 ***\n#&gt; WatrCont     -0.022379   0.002876  -7.781  5.5e-11 ***\n#&gt; Multiple R-squared: 0.471, Adjusted R-squared: 0.463</code></pre>"
    },
    "right": {
      "h": "Reading the Output",
      "body": "<pre><code># Intercept: at WatrCont = 0, predicted richness\n# is ~24.3 species (extrapolation -- no site\n# actually has WatrCont near 0)\n\n# Slope: each 1-unit increase in water content\n# is associated with 0.0224 FEWER species\n# -- wetter peat, on average, has lower\n# oribatid richness at this site\n\n# t = -7.78, p &lt; 0.001: the slope is very\n# unlikely to be zero by chance\n\n# R-squared = 0.471: WatrCont alone explains\n# about 47% of the site-to-site variation\n# in richness</code></pre>"
    }
  },
  {
    "type": "twocol",
    "eyebrow": "Simple LM Code",
    "title": "The Same Model in Python",
    "left": {
      "h": "Python (statsmodels)",
      "body": "<pre><code>import pandas as pd\nimport statsmodels.formula.api as smf\n\nspecies = pd.read_csv(&quot;data/mite_species.csv&quot;)\nenv = pd.read_csv(&quot;data/mite_env.csv&quot;)\n\nsp_cols = [c for c in species.columns if c != &quot;site&quot;]\nrichness = (species[sp_cols] &gt; 0).sum(axis=1)\nrich_df = pd.DataFrame({&quot;site&quot;: species[&quot;site&quot;],\n                         &quot;richness&quot;: richness})\ndat = env.merge(rich_df, on=&quot;site&quot;)\n\nfit_simple = smf.ols(&quot;richness ~ WatrCont&quot;, data=dat).fit()\nprint(fit_simple.summary())\n#&gt; WatrCont   -0.0224   0.003   -7.781   0.000</code></pre>"
    },
    "right": {
      "h": "smf.ols vs sm.OLS",
      "body": "<pre><code># smf.ols() takes an R-style formula string and\n# a DataFrame -- closest match to R's lm()\n\n# sm.OLS() is the lower-level interface: you\n# build the design matrix yourself\nimport statsmodels.api as sm\nX = sm.add_constant(dat[&quot;WatrCont&quot;])\nfit_simple2 = sm.OLS(dat[&quot;richness&quot;], X).fit()\n\n# Both give identical coefficients, SEs, R2 --\n# smf.ols is usually more convenient once you\n# have categorical predictors to dummy-code</code></pre>"
    }
  },
  {
    "type": "bullets",
    "eyebrow": "Interpreting Coefficients",
    "title": "Slope, Significance, and Fit",
    "items": [
      "Slope estimate -0.0224: direction and magnitude of the WatrCont effect on richness",
      "Standard error 0.0029: precision of that estimate -- used to build the t-statistic and confidence interval",
      "p-value < 0.001: strong evidence against the null hypothesis beta_1 = 0",
      "R-squared = 0.471: proportion of variance in richness explained by WatrCont alone",
      "A single predictor already explains nearly half the variation -- water content is an ecologically important driver of this community"
    ]
  },
  {
    "type": "section",
    "tag": "Multiple Linear Regression",
    "title": "Adding More Predictors",
    "sub": "richness ~ WatrCont + SubsDens + Substrate"
  },
  {
    "type": "bullets",
    "eyebrow": "Why Add Predictors",
    "title": "Controlling for Confounders, Explaining More Variance",
    "items": [
      "SubsDens (substrate density) may independently affect richness, and may be correlated with WatrCont -- omitting it can bias the WatrCont estimate",
      "Substrate (a categorical variable: Sphagnum species, Litter, Peat, Interface, ...) captures habitat type not summarized by the two continuous variables",
      "Each coefficient in a multiple regression is interpreted holding the other predictors constant -- \"the effect of WatrCont, adjusting for SubsDens and Substrate\"",
      "Multiple regression formula: richness ~ WatrCont + SubsDens + Substrate"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Multiple LM Code",
    "title": "Fitting and Testing the Full Model in R",
    "left": {
      "h": "R (base)",
      "body": "<pre><code>dat$Substrate &lt;- factor(dat$Substrate)\n\nfit_multi &lt;- lm(richness ~ WatrCont + SubsDens +\n                   Substrate, data = dat)\nsummary(fit_multi)\n#&gt; WatrCont    -0.02299   0.00303  -7.585  &lt;.001\n#&gt; SubsDens     0.12672   0.03703   3.422   0.001\n#&gt; SubstrateLitter  8.054   3.178   2.534   0.014\n#&gt; ...\n#&gt; Multiple R-squared: 0.616, Adjusted R-squared: 0.565\n\nanova(fit_multi)\n#&gt;           Df Sum Sq Mean Sq F value   Pr(&gt;F)\n#&gt; WatrCont   1 700.39  700.39  74.79  3.4e-12\n#&gt; SubsDens   1  76.11   76.11   8.13  0.00594\n#&gt; Substrate  6 139.33   23.22   2.48  0.03271</code></pre>"
    },
    "right": {
      "h": "Categorical Predictors: Dummy Coding",
      "body": "<pre><code># factor(Substrate) is expanded into indicator\n# (0/1) columns, one per level except a\n# reference level (chosen alphabetically\n# by default, e.g. &quot;Interface&quot; here is\n# actually not the reference -- check\n# levels(dat$Substrate)[1])\n\n# Each SubstrateX coefficient is the difference\n# in mean richness between level X and the\n# reference level, holding WatrCont and\n# SubsDens fixed\n\n# anova() gives a SEQUENTIAL (Type I) table:\n# each row tests a term after the terms\n# above it are already in the model</code></pre>"
    }
  },
  {
    "type": "twocol",
    "eyebrow": "Multiple LM Code",
    "title": "Python and Julia Equivalents",
    "left": {
      "h": "Python (statsmodels)",
      "body": "<pre><code>fit_multi = smf.ols(\n    &quot;richness ~ WatrCont + SubsDens + C(Substrate)&quot;,\n    data=dat).fit()\nprint(fit_multi.summary())\n#&gt; R-squared: 0.616  Adj. R-squared: 0.565\n\nimport statsmodels.api as sm\nanova_tbl = sm.stats.anova_lm(fit_multi, typ=2)\nprint(anova_tbl)\n#&gt;               sum_sq  df      F     PR(&gt;F)\n#&gt; C(Substrate)  139.33   6   2.48   0.0327\n#&gt; WatrCont      538.71   1  57.53   2.3e-10\n#&gt; SubsDens      109.65   1  11.71   0.0011</code></pre>"
    },
    "right": {
      "h": "Julia (GLM.jl)",
      "body": "<pre><code>using GLM, StatsModels\n\nfit_multi = lm(@formula(richness ~ WatrCont +\n                   SubsDens + Substrate), dat)\nfit_multi\nr2(fit_multi)        # 0.616\nadjr2(fit_multi)      # 0.565\n\n# String columns are auto-detected as\n# categorical by @formula and dummy-coded\n# against a reference level, same as\n# factor() in R\n\nftest(fit_watr_only, fit_watr_subs, fit_multi)\n# nested-model F-test, GLM.jl's analogue\n# of R's anova(fit1, fit2, fit3)</code></pre>"
    }
  },
  {
    "type": "bullets",
    "eyebrow": "Type I vs Type II/III ANOVA",
    "title": "Sum of Squares Depends on Term Order",
    "items": [
      "Type I (sequential): R's default anova() -- each term tested after everything listed above it; result depends on the order terms are written in the formula",
      "Type II: sm.stats.anova_lm(fit, typ=2) in Python -- each term tested after all other terms except its own higher-order interactions; order-independent for main effects",
      "For this dataset, both approaches agree: WatrCont, SubsDens, and Substrate are all significant predictors of richness (p < 0.05)",
      "Rule of thumb: use Type II/III when predictors are correlated and term order is arbitrary -- which is the common case in observational ecological data"
    ]
  },
  {
    "type": "section",
    "tag": "Parameter Estimation",
    "title": "Where Do the Coefficients Come From?",
    "sub": "Least squares, and its connection to maximum likelihood"
  },
  {
    "type": "bullets",
    "eyebrow": "Ordinary Least Squares",
    "title": "Minimizing the Sum of Squared Residuals",
    "items": [
      "OLS chooses beta_hat to minimize sum_i (y_i - X_i * beta)^2 -- the sum of squared vertical distances between observed and fitted values",
      "Has a closed-form solution: beta_hat = (X'X)^-1 X'y, computed directly by lm(), OLS(), and GLM.jl's lm()",
      "No iteration needed for ordinary linear regression -- unlike the GLMs of Lecture 6, which require iterative optimization",
      "Residual standard error (sigma_hat) estimates the typical size of the leftover, unexplained variation"
    ]
  },
  {
    "type": "term",
    "eyebrow": "The Deeper Connection",
    "title": "Least Squares Is Maximum Likelihood",
    "term": "maximum likelihood (under normal errors)",
    "def": "If epsilon_i ~ Normal(0, sigma^2) independently, the beta that maximizes the likelihood of the observed data is exactly the beta that minimizes the sum of squared residuals -- OLS and ML give the identical point estimate.",
    "bullets": [
      "This equivalence is why lm() output includes t-tests and F-tests derived from likelihood theory, not just \"closest fit\" geometry",
      "It also explains why lm() is a special case of the GLM framework in Lecture 6: GLMs maximize likelihood under other error distributions (Poisson, binomial, ...) where no closed-form least-squares solution exists",
      "Understanding this link is what makes Lecture 6 feel like a small step rather than a new topic"
    ]
  },
  {
    "type": "section",
    "tag": "Model Diagnostics",
    "title": "Trust, But Verify",
    "sub": "A model that fits well on paper can still violate its own assumptions"
  },
  {
    "type": "cards",
    "eyebrow": "The Four Classic Diagnostic Plots",
    "title": "What Each Plot Reveals",
    "cards": [
      {

function esc(s){ return s; } // bullets allow inline <b> tags intentionally

function renderSlide(s, idx){
  let inner = "";
  switch(s.type){

    case "title":
      inner = `
        <div class="center-stage">
          <span class="tag">${s.eyebrow||""}</span>
          <div class="big-word">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
          <div class="footnote">${s.footnote||""}</div>
        </div>`;
      break;

    case "section":
      inner = `
        <div class="center-stage">
          <span class="tag gold">${s.tag||"Section"}</span>
          <div class="big-word" style="font-size:2.6rem;">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
        </div>`;
      break;

    case "bullets":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content"><ul class="bullets">
          ${s.items.map(i=>`<li>${i}</li>`).join("")}
        </ul></div>`;
      break;

    case "term":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <div class="term-box">
            <span class="term">${s.term}</span>
            <span class="def">${s.def}</span>
          </div>
          ${s.bullets ? `<ul class="bullets sub">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
        </div>`;
      break;

    case "twocol":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="two-col">
          <div class="col-box"><h3>${s.left.h}</h3><p>${s.left.body}</p></div>
          <div class="col-box"><h3>${s.right.h}</h3><p>${s.right.body}</p></div>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "compare":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <table class="compare">
            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Ecological Modelling · R / Python / Julia</span>
        <span>Lecture 5</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>

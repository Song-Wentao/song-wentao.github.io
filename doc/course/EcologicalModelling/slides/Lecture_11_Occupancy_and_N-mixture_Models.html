const slides = [
  {
    "type": "title",
    "eyebrow": "Lecture 11",
    "title": "Occupancy and N-mixture Models",
    "sub": "Separating true presence from imperfect detection in repeat-visit field surveys -- in R, Python, and Julia",
    "footnote": "Ecological Modelling with R, Python, and Julia"
  },
  {
    "type": "section",
    "tag": "Setting the Scene",
    "title": "Field Surveys Almost Never See Everything That Is Actually There",
    "sub": "A single negative survey visit is not proof of absence"
  },
  {
    "type": "bullets",
    "eyebrow": "The Detection Problem",
    "title": "False Absence Is the Default, Not the Exception",
    "items": [
      "A field crew visits a site, does not detect the target species, and records a zero -- but the species may simply have been present and undetected: silent, hidden, out of range on that day, or just missed",
      "This is called a false absence, and it is pervasive: cryptic amphibians, nocturnal carnivores, shy forest birds, and low-density populations of almost anything are routinely missed even when present",
      "Detection probability -- the chance of recording a species given that it is truly there -- is almost never 1.0 in real surveys, and it usually varies with weather, observer skill, time of day, season, and habitat",
      "Treating a zero count as certain absence silently converts a detection problem into a biology problem, and every downstream inference inherits the error",
      "Occupancy models exist to separate these two processes explicitly: whether a species is truly there (the state), and whether we happened to detect it given that it was there (the observation)"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Why It Matters",
    "title": "Imperfect Detection Is Not a Minor Technicality",
    "items": [
      "Naive occupancy (the raw proportion of surveyed sites with at least one detection) is a biased estimator of true occupancy -- it is biased low, and the size of the bias depends on detection probability and the number of visits",
      "Comparing naive occupancy across species, sites, or years is comparing different mixtures of true occupancy and detectability -- a declining trend in raw detections could reflect a real decline, a change in observer effort, or both, and you cannot tell which from the raw numbers alone",
      "Conservation decisions, protected-area designation, and IUCN status assessments increasingly rely on occupancy estimates precisely because they are meant to correct for this",
      "The fix does not require inventing new fieldwork: it requires repeat visits to at least some sites within a short enough window that true occupancy state does not change between visits (a closure assumption), which most standard monitoring protocols already do or can easily be adapted to do"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Consequences",
    "title": "What Goes Wrong If You Ignore Detection",
    "items": [
      "Occupancy is systematically underestimated -- every site with a real but undetected presence is misclassified as absent",
      "Covariate effects on occupancy can be biased or masked entirely if the covariate also happens to affect detectability (e.g. dense vegetation that both provides better habitat and makes animals harder to see)",
      "Apparent range contractions or population declines can be partly or wholly artifacts of reduced survey effort or changed detectability, not reduced true occupancy",
      "The single most important habit this lecture teaches: always report naive occupancy alongside the model-estimated occupancy, and explain the gap -- it is a diagnostic, not just a number"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Data Provenance -- Read This First",
    "title": "Where This Lecture's Data Actually Comes From",
    "term": "Simulated, Not Downloaded -- and Explicitly Labeled As Such",
    "def": "This sandbox has no general internet access (only pypi.org and the apt package mirror are reachable -- confirmed by a failed CRAN install and a failed fetch from raw.githubusercontent.com). The real repeat-visit crossbill survey data bundled with R's unmarked package (data(crossbill)) could not be downloaded.",
    "bullets": [
      "Instead, data/crossbill_occupancy_sim.csv is simulated with a fixed, documented random seed (11042004) using the exact survey design and parameter ranges reported for this system: Schmid, Zbinden & Keller (2004), Swiss Ornithological Institute breeding bird survey (MHB), and Royle & Kery (2007), Ecology 88(7):1813-1823",
      "Design matched: 200 sites, 3 repeat visits per season, a site-level elevation covariate on occupancy, a visit-level date covariate on detection",
      "Probabilities matched: occupancy probability psi in the 0.3-0.6 range depending on elevation; detection probability p in the 0.4-0.7 range depending on survey date -- exactly the ranges reported in the source studies",
      "The modeling code in this lecture is structurally identical to what you would run on the real data via data(crossbill) in unmarked, or via wildlifeR / camtrapR workflows on your own camera-trap or point-count data",
      "Mis-labeling simulated data as raw field data would be a worse error than being upfront about a sandboxing limitation -- so every script header repeats this note"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "The Case Study",
    "title": "The Crossbill / Willow Tit Survey Framework",
    "items": [
      "The Swiss breeding bird survey (Monitoring Haufige Brutvogel, MHB) has surveyed hundreds of 1-km2 quadrats across Switzerland since 1999, with 2-3 territory-mapping visits per quadrat per breeding season",
      "This design became one of the most widely taught occupancy-modeling case studies through Kery & Royle's textbook 'Applied Hierarchical Modeling in Ecology' (2016), which uses both the crossbill (Loxia curvirostra) and willow tit (Poecile montanus) data extensively",
      "Elevation is an ecologically meaningful covariate for both species: crossbills depend on conifer seed crops concentrated at particular elevation bands, so occupancy is expected to vary systematically with elevation rather than being constant across the landscape",
      "Survey date matters for detection because singing/calling activity (the primary cue for these species) declines as the breeding season progresses -- exactly the kind of nuisance parameter occupancy models are built to separate from the ecological signal of interest"
    ]
  },
  {
    "type": "section",
    "tag": "The Framework",
    "title": "Two Linked Sub-Models, One Data Point at a Time",
    "sub": "A true, fixed state, observed through an imperfect window"
  },
  {
    "type": "term",
    "eyebrow": "Key Concept",
    "title": "The Occupancy Model: State Process + Observation Process",
    "term": "z_i ~ Bernoulli(psi_i)      y_ij ~ Bernoulli(z_i * p_ij)",
    "def": "Two coupled equations for every site i and visit j. The STATE process says the site is truly occupied (z_i = 1) with probability psi_i, and this is fixed across the season (closure assumption) -- it is never observed directly. The OBSERVATION process says a detection at visit j happens only if the site is truly occupied AND the species is detected given that occupancy, with probability p_ij.",
    "bullets": [
      "z_i is latent (unobserved) -- it is the quantity we actually want to know, and it never appears directly in the data",
      "y_ij is the observed detection history: a 0/1 (or NA for a missed visit) at every site-visit combination",
      "Multiplying z_i * p_ij is the whole trick: if z_i = 0 (truly absent), detection probability collapses to zero no matter what p_ij is -- you cannot detect what is not there",
      "If z_i = 1 (truly present) but p_ij < 1, some visits will still come back as zeros purely by chance -- these are the false absences from the earlier slides"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Key Concept",
    "title": "The State Process: What We Actually Want to Estimate",
    "term": "psi_i = Pr(site i is truly occupied)",
    "def": "psi_i (psi, 'occupancy probability') is modeled as a function of site-level covariates on the logit scale, exactly like a logistic regression: logit(psi_i) = b0 + b1 * elevation_i. It answers the ecological question -- where does the species actually occur? -- independent of how easy it was to detect on any given visit.",
    "bullets": [
      "psi_i is a property of the SITE, constant across all visits within the season (this is the closure assumption: no colonization or local extinction between visits)",
      "Site-level covariates go here: elevation, habitat type, patch size, distance to forest edge -- anything that plausibly affects whether the species lives there at all"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Key Concept",
    "title": "The Observation Process: What Determines Whether We See It",
    "term": "p_ij = Pr(detect species at site i, visit j | z_i = 1)",
    "def": "p_ij ('detection probability') is modeled as a function of visit-level covariates on the logit scale: logit(p_ij) = a0 + a1 * date_ij. It is conditional on true occupancy -- it says nothing about whether the site is occupied, only about how good a given visit was at revealing that occupancy if it exists.",
    "bullets": [
      "p_ij can vary visit to visit, even within the same site: survey date, weather, observer, time of day, effort",
      "Confusing psi and p is the single most common conceptual error in occupancy modeling -- a covariate that changes detectability (like dense vegetation) is not automatically a covariate that changes true occupancy, and vice versa"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Why Repeat Visits Are Non-Negotiable",
    "title": "With One Visit, psi and p Are Not Separable",
    "items": [
      "With a single visit per site, the only data you have is a single 0/1 per site, and there is exactly one probability governing it: Pr(y_i = 1) = psi_i * p_i -- a product of two unknowns you cannot tell apart",
      "A low detection rate could mean low true occupancy with high detectability, or high true occupancy with low detectability, or any point in between -- these all produce identical single-visit data",
      "Repeat visits break this: because the same true state z_i governs multiple observations y_i1, y_i2, y_i3, the pattern of detections and non-detections across visits at the SAME site carries information that pins down psi_i and p_ij separately",
      "This is exactly analogous to why state-space models (Lecture 10) need more than one observation to separate process noise from observation noise -- repeated measurement of the same underlying state is what identifies the two variance/probability components"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Key Concept",
    "title": "Identifiability",
    "term": "Identifiability",
    "def": "A model is identifiable if, in principle, enough data of the right structure exist to distinguish between different parameter values that would otherwise produce the same likelihood. Single-visit occupancy data are NOT identifiable for psi and p separately; repeat-visit data ARE, provided detection probability is not exactly zero or one and covariates are not perfectly collinear between the two sub-models.",
    "bullets": [
      "Practical rule of thumb from the literature (MacKenzie et al. 2002, 2006): at least 2-3 repeat visits per site, and enough sites with variation in the covariates, to get stable, well-identified estimates",
      "You will explore what happens as you strip visits away in Exercise 3 -- watch the standard errors, not just the point estimates"
    ]
  },
  {
    "type": "compare",
    "eyebrow": "The Central Teaching Point",
    "title": "Naive Occupancy vs. Model-Estimated Occupancy",
    "headers": [
      "",
      "Naive Occupancy",
      "Model-Estimated Occupancy"
    ],
    "rows": [
      [
        "Formula",
        "Proportion of sites with >=1 detection across all visits",
        "Mean of predicted psi_i = plogis(b0 + b1 * elevation_i) across all sites"
      ],
      [
        "What it estimates",
        "Pr(detected at least once) -- a mixture of true occupancy AND detection",
        "Pr(truly occupied) -- the state process alone, with detection explicitly modeled out"
      ],
      [
        "Requires",
        "Any survey data, even a single visit",
        "Repeat-visit data, so psi and p can be separated (see Identifiability)"
      ],
      [
        "Typical bias direction",
        "Biased LOW relative to true occupancy, because sites with real-but-undetected presence are counted as absent",
        "Approximately unbiased if the model is correctly specified -- corrects for the false-absence problem"
      ],
      [
        "On the crossbill data (this lecture)",
        "0.355 (71 of 200 sites)",
        "0.370 (mean psi_hat) -- estimated occupancy is higher, correcting for imperfect detection, as theory predicts"
      ]
    ]
  },
  {
    "type": "section",
    "tag": "Fitting the Model",
    "title": "Maximum Likelihood Across Three Languages",
    "sub": "Same marginal likelihood, three implementations -- one mature package, two hand-rolled"
  },
  {
    "type": "term",
    "eyebrow": "The Math Behind occu()",
    "title": "The Marginal Likelihood: Integrating Out the Unknown State",
    "term": "L_i = psi_i * prod_j[ p_ij^y_ij (1-p_ij)^(1-y_ij) ]   if any y_ij = 1\nL_i = psi_i * prod_j(1-p_ij) + (1 - psi_i)             if all y_ij = 0",
    "def": "Because z_i is latent, we cannot write down a likelihood that conditions on it directly -- we sum (marginalize) over its two possible values, 0 and 1. If the species was detected on ANY visit, the site must be truly occupied (z_i = 1 is certain), so the likelihood is just psi_i times the probability of that exact detection pattern. If it was NEVER detected, the site could be truly occupied-but-missed on every visit, OR truly unoccupied -- so both possibilities are added together.",
    "bullets": [
      "This is exactly the likelihood that unmarked::occu() maximizes internally -- the code in this lecture computes it explicitly instead of relying on a package doing it silently",
      "Missing visits (NA, e.g. a site that could not be surveyed a third time) simply drop out of the product for that site -- no imputation needed, this is standard missing-completely-at-random handling"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Software Landscape",
    "title": "R Leads This Field by a Wide Margin -- Be Honest About It",
    "items": [
      "R's unmarked package (Fiske & Chandler 2011, Journal of Statistical Software) is the field standard for occupancy and N-mixture models, with mature, well-tested implementations of dozens of model variants",

    "type": "twocol",
    "eyebrow": "R Code",
    "title": "Loading the Data and Computing Naive Occupancy",

      "h": "Python -- the marginal likelihood, by hand",
      "body": "<pre><code>from scipy.special import expit as plogis\nfrom scipy.optimize import minimize\n\ndef neg_log_lik(par, Y, elev_z, date_z):\n    b0, b1, a0, a1 = par\n    psi = plogis(b0 + b1 * elev_z)\n    ll = 0.0\n    for i in range(len(Y)):\n        obs = ~np.isnan(Y[i, :])\n        if not np.any(obs):\n            continue\n        p_ij = plogis(a0 + a1 * date_z[i, obs])\n        y_ij = Y[i, obs]\n        if np.any(y_ij == 1):\n            lik = psi[i] * np.prod(\n                p_ij**y_ij * (1-p_ij)**(1-y_ij))\n        else:\n            lik = psi[i]*np.prod(1-p_ij) + (1-psi[i])\n        ll += np.log(max(lik, 1e-12))\n    return -ll</code></pre>"

        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Ecological Modelling · R / Python / Julia</span>
        <span>Lecture 11</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>
</body>
</html>

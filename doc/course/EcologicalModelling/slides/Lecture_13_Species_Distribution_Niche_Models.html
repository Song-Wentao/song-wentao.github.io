  {
    "type": "title",
    "eyebrow": "Lecture 13",
    "title": "Species Distribution / Niche Models",
    "sub": "Reusing Lecture 12's random-forest toolkit on spatial presence data -- from tree locations to a habitat-suitability map",
    "footnote": "Ecological Modelling with R, Python, and Julia"
  },
  {
    "type": "section",
    "tag": "Picking Up the Thread",
    "title": "\"We'll Reuse This Exact Toolkit on Spatial Presence Data\"",
    "sub": "Lecture 12 closed with that promise -- today we cash it in on 3604 mapped Beilschmiedia pendula trees"
  },
  {
    "type": "bullets",
    "eyebrow": "From Community Classification to Habitat Mapping",
    "title": "Same Algorithms, a New Kind of Question",
    "items": [
      "Lecture 12 asked: given a site's species composition, what management regime is it under? A classification problem with labeled sites and many predictors",
      "Lecture 13 asks: given where a species HAS been found, and the environment at those locations, where else might it occur? A classification problem too -- but the labels have to be built first",
      "Random forests need no new code to move from one question to the other -- the same randomForest() / RandomForestClassifier / build_forest() calls apply directly",
      "What is new is the DATA STRUCTURE: we have tree locations, not a table of sites each labeled present/absent"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "The Dataset",
    "title": "Barro Colorado Island: One of Ecology's Most-Cited Datasets",
    "items": [
      "3604 individually mapped Beilschmiedia pendula trees across a 1000m x 500m, 50-hectare forest plot on Barro Colorado Island, Panama",
      "A fine covariate grid (x, y, elevation, slope gradient) spans the same plot -- ~20,000 grid cells derived from a topographic survey",
      "Source: Condit, Hubbell & Foster (2002, Science); Hubbell et al. (1999, Science) -- the BCI forest census, and the standard teaching example for spatial point-pattern / SDM-style modeling (e.g. Baddeley, Rubak & Turner's Spatial Point Patterns)",
      "This is a genuinely important canopy tree species with real, checkable elevation preferences on BCI -- not a toy simulation"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "What Is an SDM?",
    "title": "Relating Occurrence to Environment, Then Predicting Elsewhere",
    "items": [
      "A species distribution model (SDM) -- also called a niche model -- relates where a species occurs to environmental covariates (climate, elevation, soil, land cover) at those locations",
      "The fitted relationship is then used to predict habitat suitability at OTHER locations, including places never surveyed",
      "Outputs are typically a continuous suitability surface or probability map across a landscape, used for reserve design, invasive species risk, climate-change range shift projections, and survey planning",
      "Today: elevation and slope gradient predict where Beilschmiedia pendula is likely to occur across the BCI plot"
    ]
  },
  {
    "type": "section",
    "tag": "A Fundamental Data Problem",
    "title": "We Have Locations, Not Surveys",
    "sub": "Every tree in bei_points.csv is a confirmed presence -- but nobody walked the plot recording where it was absent"
  },
  {
    "type": "term",
    "eyebrow": "Key Concept",
    "title": "Presence-Background Data",
    "term": "presence-background data",
    "def": "Occurrence data consisting only of confirmed presence locations, with no corresponding survey of true absences -- the standard data structure for museum records, citizen-science observations, and, here, a mapped-tree census, which fundamentally changes how an SDM must be built and interpreted.",
    "bullets": [
      "A tree census records where individuals WERE found -- it says nothing about locations that were searched and found empty",
      "Without true absences, you cannot directly fit presence/absence logistic regression or any other binary classifier",
      "The field's workaround is to sample 'background' points from across the study area and contrast presences against them, NOT against confirmed absences",
      "This distinction changes what a fitted SDM coefficient means: it describes presence vs. environmental AVAILABILITY, not presence vs. absence"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Why This Matters for Interpretation",
    "title": "Presence-Only Is Not Presence/Absence",
    "items": [
      "A logistic regression fit to presence vs. background estimates a quantity proportional to relative occurrence probability, not the true probability of presence at a site",
      "Predicted 'suitability' is best read as a relative index across the landscape (where is it MORE vs. LESS suitable), not a calibrated absolute probability",
      "This is true of essentially all classical presence-only SDM methods (MaxEnt, presence-background GLMs, presence-background random forests) -- it is a property of the data, not a flaw in any one algorithm",
      "Ecologists still find this workflow extremely useful -- reserve design and risk mapping need relative suitability, not a perfectly calibrated absolute probability"
    ]
  },
  {
    "type": "section",
    "tag": "The Standard Workaround",
    "title": "Generating Background Points",
    "sub": "Sample random locations across the study area to stand in for 'available but unobserved' environmental conditions"
  },
  {
    "type": "bullets",
    "eyebrow": "The Recipe",
    "title": "Presences vs. Random Background",
    "items": [
      "Sample random (x, y) locations across the full extent of the covariate grid -- here, uniformly across the 1000m x 500m BCI plot",
      "Extract elevation and gradient at each background point exactly as for the presence points, so both classes have identical predictors",
      "Label presence points 1 and background points 0, then treat the combined table as an ordinary binary classification dataset",
      "How many background points? More background points reduce sampling noise in the 'availability' estimate, but there is no single correct number -- we use 2x the number of presences here, with a fixed seed for reproducibility (Exercise 1 asks you to test sensitivity to this choice)"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Extracting Covariates at Point Locations",
    "title": "Nearest-Neighbour Lookup on a Regular Grid",
    "items": [
      "Tree and background coordinates are continuous; the covariate grid is a fine, regular lattice -- so each point needs the elevation/gradient of its NEAREST grid cell",
      "A KD-tree nearest-neighbour search does this efficiently for thousands of points against tens of thousands of grid cells: FNN::get.knnx() in R, scipy.spatial.cKDTree in Python, NearestNeighbors.jl in Julia",
      "This is the same join needed for presence points AND background points -- write it once, apply it to both",
      "Because the grid spacing is small (~5m) relative to the environmental gradients of interest, nearest-neighbour assignment is an adequate approximation to true bilinear interpolation"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "R",
    "title": "Nearest-Neighbour Join and Background Sampling",
    "left": {
      "h": "Extract elev/grad at tree locations (FNN)",
      "body": "<pre><code>library(FNN)\n\npts  &lt;- read.csv(\"data/bei_points.csv\")\ngrid &lt;- read.csv(\"data/bei_covariates_grid.csv\")\n\nnn &lt;- FNN::get.knnx(\n  data  = grid[, c(\"x\",\"y\")],\n  query = pts[, c(\"x\",\"y\")], k = 1)\n\npts$elev &lt;- grid$elev[nn$nn.index[, 1]]\npts$grad &lt;- grid$grad[nn$nn.index[, 1]]</code></pre>"
    },
    "right": {
      "h": "Sample and extract for background points",
      "body": "<pre><code>n_bg &lt;- 2 * nrow(pts)\nbg_x &lt;- runif(n_bg, min(grid$x), max(grid$x))\nbg_y &lt;- runif(n_bg, min(grid$y), max(grid$y))\n\nnn_bg &lt;- FNN::get.knnx(\n  data  = grid[, c(\"x\",\"y\")],\n  query = cbind(x = bg_x, y = bg_y), k = 1)\n\nbackground &lt;- data.frame(\n  x = bg_x, y = bg_y,\n  elev = grid$elev[nn_bg$nn.index[, 1]],\n  grad = grid$grad[nn_bg$nn.index[, 1]])</code></pre>"
    }
  },
  {
    "type": "twocol",
    "eyebrow": "Python",
    "title": "Nearest-Neighbour Join and Background Sampling",
    "left": {
      "h": "Extract elev/grad at tree locations (cKDTree)",
      "body": "<pre><code>from scipy.spatial import cKDTree\n\npts  = pd.read_csv(\"data/bei_points.csv\")\ngrid = pd.read_csv(\n    \"data/bei_covariates_grid.csv\")\n\ntree = cKDTree(grid[[\"x\",\"y\"]].values)\n_, idx = tree.query(\n    pts[[\"x\",\"y\"]].values, k=1)\n\npts[\"elev\"] = grid[\"elev\"].values[idx]\npts[\"grad\"] = grid[\"grad\"].values[idx]</code></pre>"
    },
    "right": {
      "h": "Sample and extract for background points",
      "body": "<pre><code>rng = np.random.RandomState(13)\nn_bg = 2 * len(pts)\nbg_x = rng.uniform(grid.x.min(),\n                    grid.x.max(), n_bg)\nbg_y = rng.uniform(grid.y.min(),\n                    grid.y.max(), n_bg)\n\n_, idx_bg = tree.query(\n    np.column_stack([bg_x, bg_y]), k=1)\n\nbackground = pd.DataFrame({\n    \"x\": bg_x, \"y\": bg_y,\n    \"elev\": grid[\"elev\"].values[idx_bg],\n    \"grad\": grid[\"grad\"].values[idx_bg]})</code></pre>"
    }
  },
  {
    "type": "twocol",
    "eyebrow": "Julia",
    "title": "Nearest-Neighbour Join and Background Sampling",
    "left": {
      "h": "Extract elev/grad at tree locations (KDTree)",
      "body": "<pre><code>using NearestNeighbors\n\npts  = CSV.read(\"data/bei_points.csv\", DataFrame)\ngrid = CSV.read(\n  \"data/bei_covariates_grid.csv\", DataFrame)\n\nkdtree = KDTree(\n  permutedims(Matrix(grid[:, [:x,:y]])))\nidx, _ = knn(kdtree,\n  permutedims(Matrix(pts[:, [:x,:y]])), 1)\nidx = first.(idx)\n\npts.elev = grid.elev[idx]\npts.grad = grid.grad[idx]</code></pre>"
    },
    "right": {
      "h": "Sample and extract for background points",
      "body": "<pre><code>n_bg = 2 * nrow(pts)\nbg_x = rand(n_bg) .* (maximum(grid.x) -\n  minimum(grid.x)) .+ minimum(grid.x)\nbg_y = rand(n_bg) .* (maximum(grid.y) -\n  minimum(grid.y)) .+ minimum(grid.y)\n\nidx_bg, _ = knn(kdtree,\n  permutedims(hcat(bg_x, bg_y)), 1)\nidx_bg = first.(idx_bg)\n\nbackground = DataFrame(x = bg_x, y = bg_y,\n  elev = grid.elev[idx_bg],\n  grad = grid.grad[idx_bg])</code></pre>"
    }
  },

    "eyebrow": "Assembling the Modeling Table",
    "title": "Building the Presence (1) / Background (0) Dataset",
    "items": [

    "type": "bullets",
    "eyebrow": "Why Start Here",

// RENDER ENGINE

function esc(s){ return s; } // bullets allow inline <b> tags intentionally

function renderSlide(s, idx){
  let inner = "";
  switch(s.type){

    case "title":
      inner = `
        <div class="center-stage">
          <span class="tag">${s.eyebrow||""}</span>
          <div class="big-word">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
          <div class="footnote">${s.footnote||""}</div>
        </div>`;
      break;

    case "section":
      inner = `
        <div class="center-stage">
          <span class="tag gold">${s.tag||"Section"}</span>
          <div class="big-word" style="font-size:2.6rem;">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
        </div>`;
      break;

    case "bullets":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content"><ul class="bullets">
          ${s.items.map(i=>`<li>${i}</li>`).join("")}
        </ul></div>`;
      break;

    case "term":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <div class="term-box">
            <span class="term">${s.term}</span>
            <span class="def">${s.def}</span>
          </div>
          ${s.bullets ? `<ul class="bullets sub">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
        </div>`;
      break;

    case "twocol":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="two-col">
          <div class="col-box"><h3>${s.left.h}</h3><p>${s.left.body}</p></div>
          <div class="col-box"><h3>${s.right.h}</h3><p>${s.right.body}</p></div>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "compare":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <table class="compare">
            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Ecological Modelling · R / Python / Julia</span>
        <span>Lecture 13</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>

const slides = [
  {
    "type": "title",
    "eyebrow": "Lecture 2",
    "title": "Data Structures and Management",
    "sub": "Tidy data, joins, missing values, and grouped summaries for ecological datasets",
    "footnote": "Ecological Modelling with R, Python, and Julia — worked examples: Dutch dune meadows & oribatid mites, Lac Cromwell"
  },
  {
    "type": "bullets",
    "eyebrow": "Roadmap",
    "title": "What this lecture covers",
    "items": [
      "Tidy-data principles: what makes a dataset analysis-ready",
      "Wide vs. long format, and why species-by-site matrices are naturally wide",
      "Joining a species matrix to an environmental covariate table by site ID",
      "A philosophy for missing data: when to drop, when to impute, when to flag",
      "Grouping and summarizing: the split-apply-combine pattern",

  },
  {
    "type": "section",
    "tag": "Part 1",
    "title": "Tidy Data Principles",
    "sub": "The grammar every downstream analysis in this course assumes"
  },
  {
    "type": "term",
    "eyebrow": "Definition",
    "title": "Tidy data",
    "term": "tidy data",
    "def": "A dataset in which every column is a variable, every row is an observation, and every cell is a single value. Tidy tables are the common currency that lets one function call feed the next.",
    "bullets": [
      "Each variable forms a column (e.g. site, species, count, pH)",
      "Each observation forms a row (e.g. one species record at one site)",
      "Each type of observational unit forms its own table (species records vs. site covariates)"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Why it matters",
    "title": "Tidy data is not a style preference",
    "items": [
      "Plotting libraries (ggplot2, matplotlib/seaborn, Plots.jl + StatsPlots) expect one row per observation",
      "Statistical model formulas (y ~ x) map directly onto tidy columns",
      "group_by/summarize, joins, and filters all assume a consistent row = observation contract",
      "Untidy data forces ad hoc indexing that is hard to read, debug, and reproduce",
      "Every lecture after this one assumes your inputs are already tidy — this is where that habit starts"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Wide vs. Long",
    "title": "Species community matrices are inherently wide",
    "left": {
      "h": "Wide format (site × species)",
      "body": "<p>The natural output of a field survey: one row per site, one column per species, cell = abundance.</p><pre><code>site  Achimill  Agrostol  Airaprae\n1     1         0         0\n2     3         0         0\n3     0         4         0</code></pre><p>Convenient for data entry and for ordination methods (Lecture 4), but violates tidy principles: species identity is spread across column names, not stored as a value.</p>"
    },
    "right": {
      "h": "Long format (tidy)",
      "body": "<p>One row per (site, species) observation — the tidy representation.</p><pre><code>site  species    count\n1     Achimill   1\n1     Agrostol   0\n1     Airaprae   0\n2     Achimill   3\n2     Agrostol   0</code></pre><p>Required for grouped summaries, tidyverse/pandas-style plotting, and joins where species is itself a grouping variable.</p>"
    }
  },
  {
    "type": "cards",
    "eyebrow": "Practical Guidance",
    "title": "When to use which layout",
    "cards": [
      {
        "h": "Store wide",
        "p": "Community matrices for ordination (vegan, scikit-bio) and diversity index functions typically expect sites × species wide input."
      },
      {
        "h": "Analyze long",
        "p": "Grouped summaries, per-species statistics, and tidy plotting pipelines are far simpler in long format."
      },
      {
        "h": "Reshape, don't duplicate",
        "p": "Keep one canonical wide CSV on disk; reshape to long in-memory as needed rather than maintaining two files."
      },
      {
        "h": "Round-trip both ways",
        "p": "pivot_longer/melt/stack go wide→long; pivot_wider/pivot/unstack go long→wide — you will use both directions constantly."
      }
    ]
  },
  {
    "type": "section",
    "tag": "Part 2",
    "title": "Joins and Merges",
    "sub": "Combining a species matrix with an environmental covariate table"
  },
  {
    "type": "bullets",
    "eyebrow": "Concepts",
    "title": "Joining on a shared key",
    "items": [
      "A join combines two tables using a common key column — here, site",
      "Left join: keep every row of the left table, attach matches from the right (most common in ecology: keep every survey site)",
      "Inner join: keep only rows whose key appears in both tables",
      "One-to-one here (one env record per site); one-to-many is common when joining traits tables to species lists",
      "Always check row counts before and after a join — an unexpected increase signals a duplicated key"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Worked Example",
    "title": "Joining mite_species.csv to mite_env.csv by site",
    "left": {
      "h": "R (base R)",
      "body": "<pre><code>mite_species &lt;- read.csv(\"data/mite_species.csv\")\nmite_env     &lt;- read.csv(\"data/mite_env.csv\")\n\nmite_joined &lt;- merge(\n  mite_species, mite_env,\n  by = \"site\"\n)\n\n# tidyverse:\n# mite_species |&gt;\n#   dplyr::left_join(mite_env, by = \"site\")</code></pre>"
    },
    "right": {
      "h": "Python (pandas)",
      "body": "<pre><code>import pandas as pd\n\nmite_species = pd.read_csv(\n    \"data/mite_species.csv\")\nmite_env = pd.read_csv(\n    \"data/mite_env.csv\")\n\nmite_joined = mite_species.merge(\n    mite_env, on=\"site\", how=\"left\"\n)</code></pre>"
    }
  },
  {
    "type": "compare",
    "eyebrow": "Three Languages, One Pattern",
    "title": "Core data-management verbs across R, Python, and Julia",
    "headers": [
      "Operation",
      "R",
      "Python",
      "Julia"
    ],
    "rows": [
      [
        "Read CSV",
        "read.csv(\"f.csv\")",
        "pd.read_csv(\"f.csv\")",
        "CSV.read(\"f.csv\", DataFrame)"
      ],
      [
        "Join / merge",
        "merge(a, b, by=\"site\")",
        "a.merge(b, on=\"site\")",
        "leftjoin(a, b, on=:site)"
      ],
      [
        "Group + summarize",
        "aggregate(y~g, a, mean)",
        "a.groupby(\"g\")[\"y\"].mean()",
        "combine(groupby(a,:g), :y=>mean)"
      ],

        "Reshape wide → long",
        "reshape(a, direction=\"long\", ...)",
        "a.melt(id_vars=\"site\")",
        "stack(a, Not(:site))"
      ]
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Common Pitfalls",
    "title": "Join gotchas in ecological data",
    "items": [
      "Key type mismatch: site stored as integer in one file and as a zero-padded string (\"01\") in another — the join silently drops everything",

      "Always compare nrow()/len(df) before and after a join as a sanity check"
    ]
  },
  {
    "type": "section",
    "tag": "Part 3",
    "title": "Handling Missing Data",
    "sub": "A philosophy, not just a function call"
  },
  {
    "type": "term",
    "eyebrow": "Definition",
    "title": "Missing data (NA / NaN / missing)",
    "term": "missingness",
    "def": "A placeholder marking that a value was not recorded, not measured, or not applicable — as opposed to a true zero. Ecological field data is rarely fully complete: instruments fail, plots are inaccessible, observers run out of time.",
    "bullets": [
      "R: NA (logical NA propagates; is.na() to test)",
      "Python/pandas: NaN or pd.NA (np.nan for numeric, None/NA for object columns)",
      "Julia: the `missing` singleton, propagates through arithmetic by design"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Decision Framework",
    "title": "Drop, impute, or flag?",
    "items": [
      "Drop (listwise deletion) when missingness is rare, random, and the sample is large enough to absorb the loss",
      "Impute (mean/median, model-based, or multiple imputation) when missingness is moderate and dropping would bias the covariate distribution",
      "Flag with an explicit indicator column when the fact of missingness may itself be informative (e.g. a sensor that fails in wet conditions)",
      "Never silently let NA propagate into a model fit — R, Python, and Julia all differ in default na-handling behavior",
      "Document every decision: it changes the effective sample size and can change scientific conclusions"
    ]
  },
  {
    "type": "cards",
    "eyebrow": "Toolkit",
    "title": "Four strategies you'll use throughout this course",
    "cards": [
      {
        "h": "Listwise deletion",
        "p": "na.omit() / dropna() / dropmissing(). Simple and unbiased only under MCAR (missing completely at random)."
      },
      {
        "h": "Simple imputation",
        "p": "Replace with column mean/median. Fast, but shrinks variance and can distort covariate relationships."
      },
      {
        "h": "Model-based imputation",
        "p": "Predict the missing value from other correlated variables (regression, kNN, mice/missForest). Preserves more structure."
      },
      {
        "h": "Missingness indicator",
        "p": "Add a binary was_missing column alongside an imputed value so models can learn from the pattern of missingness itself."
      }
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Always Check First",
    "title": "Explicit missing-data checks",
    "left": {
      "h": "R",
      "body": "<pre><code>sum(is.na(mite_species))\nsum(is.na(mite_env))\n\ncolSums(is.na(mite_env))\n# -&gt; per-column breakdown,\n#    even if the total is 0</code></pre><p>Run this before every join and every model fit — even on datasets you believe are complete.</p>"
    },
    "right": {
      "h": "Python",
      "body": "<pre><code>mite_species.isna().sum().sum()\nmite_env.isna().sum().sum()\n\nmite_env.isna().sum()\n# -&gt; per-column Series</code></pre><p>Watch for silent NA-sniffing traps: pandas reads a literal string \"None\" in a category column as NaN unless told otherwise.</p>"
    }
  },

    "type": "section",
    "tag": "Part 4",
    "title": "Grouping and Summarizing",
    "sub": "The split-apply-combine pattern"
  },
  {
    "type": "bullets",
    "eyebrow": "Concepts",
    "title": "Split → Apply → Combine",
    "items": [

    }

// RENDER ENGINE

function esc(s){ return s; } // bullets allow inline <b> tags intentionally

function renderSlide(s, idx){
  let inner = "";
  switch(s.type){

    case "title":
      inner = `
        <div class="center-stage">
          <span class="tag">${s.eyebrow||""}</span>
          <div class="big-word">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
          <div class="footnote">${s.footnote||""}</div>
        </div>`;
      break;

    case "section":
      inner = `
        <div class="center-stage">
          <span class="tag gold">${s.tag||"Section"}</span>
          <div class="big-word" style="font-size:2.6rem;">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
        </div>`;
      break;

    case "bullets":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content"><ul class="bullets">
          ${s.items.map(i=>`<li>${i}</li>`).join("")}
        </ul></div>`;
      break;

    case "term":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <div class="term-box">
            <span class="term">${s.term}</span>
            <span class="def">${s.def}</span>
          </div>
          ${s.bullets ? `<ul class="bullets sub">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
        </div>`;
      break;

    case "twocol":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="two-col">
          <div class="col-box"><h3>${s.left.h}</h3><p>${s.left.body}</p></div>
          <div class="col-box"><h3>${s.right.h}</h3><p>${s.right.body}</p></div>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "compare":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <table class="compare">
            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Ecological Modelling · R / Python / Julia</span>
        <span>Lecture 2</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>

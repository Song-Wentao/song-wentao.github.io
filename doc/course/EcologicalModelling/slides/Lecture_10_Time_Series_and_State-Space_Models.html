    "title": "Every Model So Far Assumed Independent Observations",

  },
  {
    "type": "bullets",
    "eyebrow": "The Problem",
    "title": "Independence Was Always Quietly Assumed",

      "Lectures 5-9 all rested on some version of the same assumption: residuals are independent and identically distributed (iid), or independent given the random effects/group structure",

      "For a population counted at the same location year after year, it usually is not -- this year's abundance is built directly out of last year's abundance via births, deaths, and movement",

  },
  {
    "type": "bullets",
    "eyebrow": "Ecological Motivation",
    "title": "Population Time Series Are Everywhere in Ecology",
    "items": [
      "Long-term monitoring programs -- fisheries stock assessments, breeding bird surveys, fur-trapping records, camera-trap indices -- exist precisely to track abundance through time",

  },

    "type": "bullets",
    "eyebrow": "The Data",
    "title": "The Canadian Lynx: One of the Most Famous Time Series in Science",

  },

    "type": "quote",
    "quote": "The fur-trade records represent one of the longest continuous indices of a wild vertebrate population anywhere in the world, and their cyclic dynamics have shaped a century of theory about what regulates populations in nature.",

        "y": "1821-1934",
        "t": "Hudson's Bay Company fur-trading ledgers record annual lynx pelts across Canada"

        "y": "1937",
        "t": "MacLulich compiles and first analyzes the ~10-year hare-lynx cycle"

        "y": "1953",
        "t": "Moran fits an AR(2) model by hand, showing two lagged terms reproduce the cyclic pattern"
      },
      {
        "y": "1977",
        "t": "Campbell & Walker popularize the series as a statistics teaching dataset (base R's built-in 'lynx')"
      },
      {
        "y": "1997-1999",
        "t": "Stenseth et al. (Science, PNAS) reanalyze the series for density dependence and predator-prey structure using nonlinear and state-space methods"
      }
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "First Look",
    "title": "Plotting the Series Reveals the Cycle Immediately",
    "left": {
      "h": "R -- load and plot",
      "body": "<pre><code>lynx &lt;- read.csv(&quot;data/lynx.csv&quot;)\nlynx_ts &lt;- ts(lynx$trappings, start = 1821)\n\nplot(lynx_ts, type = &quot;o&quot;, pch = 16, cex = 0.5,\n     xlab = &quot;Year&quot;, ylab = &quot;Pelts trapped&quot;,\n     main = &quot;Canadian lynx, Hudson's Bay Co.&quot;)</code></pre>"
    },
    "right": {
      "h": "What Jumps Out",
      "body": "<p>A striking, remarkably regular boom-and-bust cycle roughly every 10 years, with peaks that can exceed 60,000-80,000 pelts and troughs that fall below a few hundred.</p><p>The amplitude of the swings grows and shrinks across the century -- the raw series is far from a constant-variance, stationary process, and the swings span almost two orders of magnitude.</p><p>That last point is exactly why we move to the log scale next -- it stabilizes the variance and turns multiplicative swings into additive ones."

    "eyebrow": "Key Concept",
    "title": "Autocorrelation",
    "term": "Autocorrelation",

      "Oscillating autocorrelation that swings positive then negative and back: a signature of cyclical dynamics, like the lynx's ~10-year rhythm",

    "type": "twocol",

    "left": {
      "h": "R -- acf() and pacf()",
      "body": "<pre><code>log_lynx &lt;- log(lynx_ts)\n\nacf(log_lynx,  lag.max = 20, main = &quot;ACF&quot;)\npacf(log_lynx, lag.max = 20, main = &quot;PACF&quot;)</code></pre>"

          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Ecological Modelling · R / Python / Julia</span>
        <span>Lecture 10</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>
</body>
</html>

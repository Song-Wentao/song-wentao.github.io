      "Median: middle value when sorted -- robust to skew and outliers",
      "Standard deviation (sd): typical spread around the mean, same units as the data",
      "Coefficient of variation (CV = sd / mean x 100%): unitless spread, lets you compare variability across variables measured on different scales",

    ]
  },
  {
    "type": "term",
    "eyebrow": "Key term",
    "title": "Coefficient of variation",
    "term": "Coefficient of Variation (CV)",
    "def": "CV = (standard deviation / mean) x 100%. A scale-free measure of relative variability that lets you compare dispersion across variables with different units or magnitudes -- e.g. comparing variability in soil pH (units of 1-6) to variability in biomass (grams).",
    "bullets": [
      "CV < ~15%: low relative variability",
      "CV 15-50%: moderate -- typical for many continuous field measurements",
      "CV > 50-100%: high -- common for counts, cover, and biomass in ecology"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Distributional shape",
    "title": "Why ecological data is often skewed",
    "items": [

      "Biomass and other size measures: strictly positive, multiplicative processes (growth) produce log-normal-like skew",

      "Consequence: the normal distribution is often a poor default; choose a distribution that matches how the data were generated"

  },
  {
    "type": "twocol",
    "eyebrow": "Code: descriptive stats",
    "title": "Mean / median / sd / CV on WatrCont and SubsDens",
    "left": {
      "h": "R (base R)",
      "body": "<pre><code>mite &lt;- read.csv(\"data/mite_env.csv\")\n\ncv &lt;- function(x) sd(x) / mean(x) * 100\n\nfor (v in c(\"WatrCont\", \"SubsDens\")) {\n  x &lt;- mite[[v]]\n  cat(sprintf(\"%s: mean=%.2f median=%.2f sd=%.2f CV=%.1f%%\\n\",\n              v, mean(x), median(x), sd(x), cv(x)))\n}\n# WatrCont: mean=410.64 median=398.47 sd=142.36 CV=34.7%\n# SubsDens: mean=39.28  median=36.38  sd=11.94  CV=30.4%</code></pre>"

      "body": "<pre><code>import pandas as pd\n\nmite = pd.read_csv(\"data/mite_env.csv\")\n\ndef cv(x):\n    return x.std(ddof=1) / x.mean() * 100\n\nfor v in [\"WatrCont\", \"SubsDens\"]:\n    x = mite[v]\n    print(f\"{v}: mean={x.mean():.2f} median={x.median():.2f} \"\n          f\"sd={x.std(ddof=1):.2f} CV={cv(x):.1f}%\")\n# WatrCont: mean=410.64 median=398.47 sd=142.36 CV=34.7%\n# SubsDens: mean=39.28  median=36.38  sd=11.94  CV=30.4%</code></pre>"

  {
    "type": "term",
    "eyebrow": "Distribution",
    "title": "Counts with mean = variance",
    "term": "Poisson distribution",
    "def": "Models counts of discrete events (individuals, species, nests) in a fixed unit of effort, assuming events occur independently at a constant rate. Defining feature: variance equals the mean.",

  {
    "type": "term",
    "eyebrow": "Distribution",
    "title": "Counts with extra variability",
    "term": "Negative binomial distribution",
    "def": "A generalization of the Poisson that allows variance to exceed the mean (overdispersion) -- extremely common in real count data because of clustering, unmeasured heterogeneity, or patchy habitat.",
    "bullets": [
      "Typical use: abundance counts that are more 'clumpy' than Poisson predicts",
      "R: MASS::glm.nb(), rnbinom()",

  },

      ]

    "type": "section",

  {
    "type": "bullets",
    "eyebrow": "Framework",
    "title": "The logic of a hypothesis test",
    "items": [
      "Null hypothesis (H0): the 'no effect' or 'no difference' baseline (e.g. mean WatrCont is equal across substrates)",

// =====================================================================
// RENDER ENGINE
// =====================================================================
function esc(s){ return s; } // bullets allow inline <b> tags intentionally

function renderSlide(s, idx){
  let inner = "";
  switch(s.type){

    case "title":
      inner = `
        <div class="center-stage">
          <span class="tag">${s.eyebrow||""}</span>
          <div class="big-word">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
          <div class="footnote">${s.footnote||""}</div>
        </div>`;
      break;

    case "section":
      inner = `
        <div class="center-stage">
          <span class="tag gold">${s.tag||"Section"}</span>
          <div class="big-word" style="font-size:2.6rem;">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
        </div>`;
      break;

    case "bullets":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content"><ul class="bullets">
          ${s.items.map(i=>`<li>${i}</li>`).join("")}
        </ul></div>`;
      break;

    case "term":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <div class="term-box">
            <span class="term">${s.term}</span>
            <span class="def">${s.def}</span>
          </div>
          ${s.bullets ? `<ul class="bullets sub">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
        </div>`;
      break;

    case "twocol":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="two-col">
          <div class="col-box"><h3>${s.left.h}</h3><p>${s.left.body}</p></div>
          <div class="col-box"><h3>${s.right.h}</h3><p>${s.right.body}</p></div>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "compare":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <table class="compare">
            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Ecological Modelling · R / Python / Julia</span>
        <span>Lecture 3</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>

<script>
// =====================================================================
// SLIDE DATA — edit this array to change content. Each slide is one
// object with a `type` (layout) and layout-specific fields.
// =====================================================================
const slides = [
  {
    "type": "title",
    "eyebrow": "Lecture 8",
    "title": "Generalized Additive Models",
    "sub": "Letting the data choose the shape of the curve -- smooth terms, splines, and effective degrees of freedom, on the Lac Cromwell oribatid mite data",
    "footnote": "Ecological Modelling with R, Python, and Julia"
  },
  {
    "type": "section",
    "tag": "Picking Up the Thread",
    "title": "\"What If the Relationship Isn't Even Linear?\"",
    "sub": "Lecture 7 closed on that question about a height effect -- this lecture is the answer"
  },
  {
    "type": "bullets",
    "eyebrow": "The Problem",
    "title": "A Straight Line Is a Strong Assumption",
    "items": [
      "Every model since Lecture 5 has assumed the response changes at a constant rate per unit of x -- that is what a single coefficient beta means",
      "Many ecological relationships are not like that: growth rates saturate, performance peaks at an optimum, and abundance often rises then falls along a gradient",
      "A straight line forced through a curved relationship does not just fit poorly -- it can get the sign of the effect wrong in part of the range",
      "The question is not 'is there a relationship' but 'what shape is it' -- and a fixed linear term cannot answer that question, it can only assume the answer"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Ecological Motivation",
    "title": "Unimodal Responses Are the Norm, Not the Exception",
    "items": [
      "Classical niche theory (Hutchinson 1957) predicts a Gaussian-shaped, humped response of performance or abundance to an environmental gradient -- too little of a resource is limiting, too much is toxic or costly",
      "Temperature performance curves, nutrient response curves, and moisture tolerance curves are all textbook examples of this humped shape",
      "A plain linear model cannot represent a hump at all; it can only tilt up or down across the whole range",
      "Even adding a single quadratic term (x + x^2) only buys one specific parabola shape -- real curves are often more irregular than that"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Why Not Just Add x-squared?",
    "title": "The Limits of Polynomial Terms",
    "items": [
      "richness ~ WatrCont + WatrCont^2 can bend once, in one direction, over the whole range -- one global parabola shared by every part of the data",
      "Higher powers (x^3, x^4, ...) can wiggle more, but they become numerically unstable and tend to swing wildly near the edges of the data (Runge's phenomenon)",
      "A polynomial's shape at one end of the gradient is tied to its shape at the other end -- you cannot let the curve be flat in the middle and steep at the edges independently",
      "What is needed instead: a flexible function f(x) that can bend locally, controlled by how much bending the data actually support -- that is exactly what a spline gives you"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Key Concept",
    "title": "Smooth Term (Spline)",
    "term": "Smooth Term",
    "def": "A flexible function f(x), built from a basis of simple curved building-block functions (splines), that replaces a single linear coefficient beta*x. Instead of assuming one global slope, f(x) can bend differently in different parts of the range of x.",
    "bullets": [
      "Written s(x) in R's mgcv, s(0) in Python's pygam -- 's' for 'smooth'",
      "Built from a basis: a set of simple curved functions (typically cubic splines) added together with fitted weights",
      "The number of basis functions (k) sets an upper limit on how wiggly the smooth is allowed to get -- the fit itself is controlled by a penalty, covered next"
    ]
  },
  {
    "type": "section",
    "tag": "The GAM Framework",
    "title": "From beta*x to f(x)",
    "sub": "Generalized Additive Models: the same GLM machinery, with linear terms replaced by smooth terms"
  },
  {
    "type": "bullets",
    "eyebrow": "The GAM Idea",
    "title": "Additive, Generalized -- and Smooth",
    "items": [
      "A GLM: g(E[y]) = beta0 + beta1*x1 + beta2*x2 + ... -- a link function g() applied to a linear predictor",
      "A GAM: g(E[y]) = beta0 + f1(x1) + f2(x2) + ... -- the exact same structure, but each linear term beta_j*x_j is replaced by a smooth function f_j(x_j)",
      "'Additive' means the effects of different predictors still add together on the link scale -- no interaction is assumed unless you build one in (e.g. a 2-D smooth)",
      "'Generalized' carries over everything from Lecture 6: any exponential-family response (Gaussian, Poisson, binomial, ...) and its matching link function",
      "In short: a GAM is a GLM where you no longer have to decide in advance that each predictor's effect is a straight line"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Key Concept",
    "title": "Basis Dimension (k)",
    "term": "Basis Dimension k",
    "def": "The number of basis functions used to build a smooth term s(x). It sets the maximum flexibility the smooth is allowed -- a ceiling on how many bends the curve could have, not how many it will have.",
    "bullets": [
      "Larger k = a richer basis = the curve is permitted more independent wiggles if the data support them",
      "k is a upper bound, not a target -- mgcv's default (k = 10 per smooth) is deliberately generous, and the penalty (next slide) reels in unneeded flexibility",
      "Set k too small and a genuinely complex shape gets forced flat; set k absurdly large relative to the sample size and fitting becomes slow and unstable -- but rarely overfit, because of the penalty"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Avoiding Overfitting",
    "title": "The Smoothing Penalty",
    "items": [
      "Without a penalty, a flexible enough basis would simply interpolate every data point -- a wiggly curve that fits noise, not signal, and generalizes terribly",
      "GAM fitting adds a roughness penalty: it penalizes curvature (the wiggliness of f), not just poor fit to the data, trading off fit against smoothness",
      "The penalty's strength (lambda in mgcv, or the smoothing hyperparameter in pygam) is itself estimated from the data -- by REML, GCV, or a grid search, not chosen by hand",
      "A large penalty flattens the curve toward a straight line; a small penalty lets it bend freely up to the basis dimension k",
      "This is the central trick of a GAM: k sets the ceiling on flexibility, the penalty decides how much of that ceiling to actually use"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Key Concept",
    "title": "Effective Degrees of Freedom (EDF)",
    "term": "Effective Degrees of Freedom",
    "def": "A single number, reported for every smooth term, summarizing how much curvature the fitted penalty actually kept -- the realized flexibility of s(x), after the roughness penalty has done its shrinking.",
    "bullets": [
      "EDF = 1 means the smoothing penalty shrank the curve all the way down to a straight line -- a GAM with EDF = 1 IS, in effect, a linear model",
      "EDF close to k - 1 means almost no shrinkage happened -- the data support essentially all the flexibility the basis allows",
      "EDF is not an integer -- it is a continuous measure of 'effective' complexity, unlike the whole-number degrees of freedom of a linear model",
      "Because EDF can land anywhere from 1 up to k - 1, a linear model is mathematically the special case of a GAM where every smooth's EDF has been penalized down to 1"
    ]
  },
  {
    "type": "pyramid",
    "eyebrow": "Key Concept",
    "title": "GAM Generalizes GLM Generalizes LM",
    "levels": [
      {
        "label": "LM: y = beta0 + beta1*x -- one global straight line",
        "color": "#C0562B",
        "width": 42
      },
      {
        "label": "GLM: g(mu) = beta0 + beta1*x -- link + any exponential-family response",
        "color": "#2E6E8E",
        "width": 70
      },
      {
        "label": "GAM: g(mu) = beta0 + f(x) -- link + smooth term, EDF chosen by the data",
        "color": "#3F8F5C",
        "width": 100
      }
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Key Concept",
    "title": "Reading the Hierarchy",
    "items": [
      "Every LM is a GLM (Gaussian family, identity link) -- Lecture 5 was a special case of Lecture 6's framework all along",
      "Every GLM is a GAM (each smooth term's EDF penalized down to exactly 1) -- Lecture 6 is a special case of today's framework",
      "This is not just a mathematical curiosity: it means you never lose anything by starting with s(x) instead of beta*x -- if the data really do want a straight line, the penalty will find it and report EDF = 1",
      "The practical workflow: fit the GAM, look at the EDF. EDF near 1 -> a linear term would have done just as well. EDF well above 1 -> real, useful curvature was hiding under the straight-line assumption"
    ]
  },
  {
    "type": "section",
    "tag": "The Data",
    "title": "Oribatid Mite Richness and Water Content",
    "sub": "Borcard & Legendre (1994) -- 70 peat-moss sites, Lac Cromwell, Quebec"
  },
  {
    "type": "bullets",
    "eyebrow": "The Dataset",
    "title": "Species Richness Across a Water Content Gradient",
    "items": [
      "data/mite_species.csv: 70 sites x 35 oribatid mite species (abundance counts); data/mite_env.csv: WatrCont (substrate water content, %), SubsDens (substrate density), Substrate, Shrub, Topo, x, y",
      "Response for this lecture: richness = the number of species with nonzero abundance at each site (5 to 25 species per site, mean 15.1)",
      "WatrCont ranges from 134% to 827% across the 70 sites -- from drier hummocks to fully waterlogged pools, a classic peatland moisture gradient",
      "This is one of the most widely taught real community datasets in numerical ecology, used throughout Borcard, Gillet & Legendre's 'Numerical Ecology with R'"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "R Code",
    "title": "Building the Response and Fitting a Straight Line",
    "left": {
      "h": "R -- richness and the linear model",
      "body": "<pre><code>mite_sp  &lt;- read.csv(&quot;data/mite_species.csv&quot;)\nmite_env &lt;- read.csv(&quot;data/mite_env.csv&quot;)\n\nsp_mat   &lt;- as.matrix(mite_sp[, -1])\nrichness &lt;- rowSums(sp_mat &gt; 0)\n\nmite &lt;- data.frame(\n  richness = richness,\n  WatrCont = mite_env$WatrCont\n)\n\nlm_fit &lt;- lm(richness ~ WatrCont, data = mite)\nAIC(lm_fit)\n#&gt; 374.01</code></pre>"
    },
    "right": {
      "h": "What the Linear Fit Says",
      "body": "<p>richness = 24.30 - 0.0224 x WatrCont (p &lt; 0.001, R-squared = 0.47).</p><p>Richness falls by about 2.2 species per 100-unit rise in water content -- a real, strong, and statistically clear negative trend.</p><p>The question a GAM answers next: is that decline really a straight line across the whole 134-827% range, or does a smooth reveal something a single slope misses?</p>"
    }
  },
  {
    "type": "twocol",
    "eyebrow": "R Code -- mgcv",
    "title": "Fitting the Gaussian GAM",
    "left": {
      "h": "R (mgcv::gam)",
      "body": "<pre><code>library(mgcv)\n\ngam_fit &lt;- gam(richness ~ s(WatrCont),\n               data = mite)\nsummary(gam_fit)\n#&gt; Approximate significance of smooth terms:\n#&gt;               edf Ref.df   F p-value\n#&gt; s(WatrCont) 1.343  1.616  40.0  &lt;2e-16\n\nAIC(lm_fit); AIC(gam_fit)\n#&gt; 374.01        373.85</code></pre>"
    },
    "right": {
      "h": "Reading This Output",
      "body": "<p>EDF = 1.34 -- barely above 1. The default GCV-chosen penalty has decided this relationship is <em>almost</em> a straight line, with a small, real amount of extra curvature.</p><p>AIC favors the GAM by only 0.15 points -- a negligible improvement, consistent with an EDF so close to 1.</p><p>This is the EDF-near-1 case from two slides ago, playing out on real data: not every relationship hides dramatic curvature.</p>"
    }
  },
  {
    "type": "twocol",
    "eyebrow": "R Code -- mgcv",
    "title": "EDF Collapsing to Exactly 1: LM as a Special Case",
    "left": {
      "h": "R -- forcing heavier smoothing (method = \"ML\")",
      "body": "<pre><code>gam_fit_ml &lt;- gam(richness ~ s(WatrCont),\n                  data = mite, method = &quot;ML&quot;)\nsummary(gam_fit_ml)$edf\n#&gt; 1.00\n\nAIC(gam_fit_ml)\n#&gt; 374.01   -- identical to AIC(lm_fit)</code></pre>"
    },
    "right": {
      "h": "The Pyramid, Made Concrete",
      "body": "<p>Switching the smoothing-parameter criterion from GCV to ML penalizes wiggliness a bit more here, and the penalty shrinks s(WatrCont) exactly to EDF = 1.</p><p>At EDF = 1, the fitted GAM curve <em>is</em> the linear model -- same AIC to two decimal places. This is the LM-as-a-special-case-of-GAM slide from earlier, reproduced on real data rather than asserted in the abstract.</p>"
    }
  },
  {
    "type": "twocol",
    "eyebrow": "R Code -- mgcv",
    "title": "A Poisson GAM for a Count Response",
    "left": {
      "h": "R (family = poisson)",
      "body": "<pre><code>gam_pois &lt;- gam(richness ~ s(WatrCont),\n                data = mite,\n                family = poisson)\nsummary(gam_pois)\n#&gt; edf Ref.df Chi.sq p-value\n#&gt; s(WatrCont) 2.33   2.96   46.2  &lt;2e-16\n\nAIC(gam_pois)\n#&gt; 375.80</code></pre>"
    },

function esc(s){ return s; } // bullets allow inline <b> tags intentionally

function renderSlide(s, idx){
  let inner = "";
  switch(s.type){

    case "title":
      inner = `
        <div class="center-stage">
          <span class="tag">${s.eyebrow||""}</span>
          <div class="big-word">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
          <div class="footnote">${s.footnote||""}</div>
        </div>`;
      break;

    case "section":
      inner = `
        <div class="center-stage">
          <span class="tag gold">${s.tag||"Section"}</span>
          <div class="big-word" style="font-size:2.6rem;">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
        </div>`;
      break;

    case "bullets":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content"><ul class="bullets">
          ${s.items.map(i=>`<li>${i}</li>`).join("")}
        </ul></div>`;
      break;

    case "term":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <div class="term-box">
            <span class="term">${s.term}</span>
            <span class="def">${s.def}</span>
          </div>
          ${s.bullets ? `<ul class="bullets sub">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
        </div>`;
      break;

    case "twocol":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="two-col">
          <div class="col-box"><h3>${s.left.h}</h3><p>${s.left.body}</p></div>
          <div class="col-box"><h3>${s.right.h}</h3><p>${s.right.body}</p></div>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "compare":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <table class="compare">
            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Ecological Modelling · R / Python / Julia</span>
        <span>Lecture 8</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>

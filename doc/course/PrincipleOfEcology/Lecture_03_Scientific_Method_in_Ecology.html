      "Replicates must be independent — this is where things frequently go wrong"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Why It Matters",
    "title": "Why We Replicate",
    "items": [
      "A single treatment plot and a single control plot can never distinguish a true treatment effect from ordinary plot-to-plot variability",
      "Statistical tests estimate variance <b>within</b> groups to judge whether variance <b>between</b> groups is unusually large — this requires multiple independent replicates per group",
      "Sample size (n) directly affects statistical power: the ability to detect a real effect if one exists",
      "Ecologists must balance the desire for large n against the cost, logistics, and ethics of manipulating natural systems"
    ]
  },
  {
    "type": "term",
    "eyebrow": "A Classic Design Trap",
    "title": "When Replicates Aren't Really Independent",
    "term": "Pseudoreplication",
    "def": "Treating multiple, non-independent measurements as if they were independent replicates, thereby overstating the true sample size and inflating apparent statistical significance.",
    "bullets": [
      "Coined and formalized by Stuart Hurlbert (1984) in a landmark critique of ecological field experiments",
      "Occurs when treatments are not truly replicated (e.g., one treatment pond vs. one control pond, each sampled many times)"
    ]
  },
  {
    "type": "quote",
    "eyebrow": "The Landmark Critique",
    "quote": "Pseudoreplication is defined as the use of inferential statistics to test for treatment effects with data from experiments where either treatments are not replicated... or replicates are not statistically independent.",
    "attrib": "Stuart H. Hurlbert, \"Pseudoreplication and the Design of Ecological Field Experiments,\" Ecological Monographs (1984)"
  },
  {
    "type": "cards",
    "eyebrow": "Hurlbert's Taxonomy",
    "title": "Common Forms of Pseudoreplication",
    "cards": [
      {
        "h": "Simple pseudoreplication",
        "p": "One treatment unit and one control unit, each sampled repeatedly; repeated samples are treated as independent replicates"
      },
      {
        "h": "Temporal pseudoreplication",
        "p": "Repeated measurements over time on the same unit are analyzed as if each time point were a new independent replicate"
      },
      {
        "h": "Sacrificial pseudoreplication",
        "p": "True replicates exist but are pooled or averaged incorrectly, discarding the very information needed to test the treatment effect"
      },
      {
        "h": "Inadequate interspersion",
        "p": "Treatment and control units are not spatially interspersed (e.g., all treatments upstream, all controls downstream), confounding treatment with location"
      }
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Worked Example",
    "title": "Spotting Pseudoreplication",
    "left": {
      "h": "The Flawed Design",
      "body": "A researcher wants to test whether fish predation reduces zooplankton density. They stock fish in ONE pond, leave a second pond fishless as a control, and take 20 water samples from each pond over the summer. They then run a t-test comparing all 40 samples."
    },
    "right": {
      "h": "Why It Fails",
      "body": "The true replicate here is the POND, not the water sample — n = 1 per treatment, not 20. The 20 samples from one pond are pseudoreplicates: they share every unmeasured feature of that pond (depth, algae, oxygen). Any \"difference\" could be due to the ponds themselves, not fish."
    },
    "footnote": "Fix: use multiple independently stocked and fishless ponds, randomly assigned, and treat pond (not water sample) as the unit of replication in the analysis."
  },
  {
    "type": "section",
    "tag": "Statistics in Ecology",
    "title": "Turning Data into Inference",
    "sub": "How ecologists decide whether a pattern is real"
  },
  {
    "type": "term",
    "eyebrow": "The Standard Framework",

  {
    "type": "term",
    "eyebrow": "Interpret With Care",
    "title": "What a p-value Actually Means",
    "term": "p-value",
    "def": "The probability of obtaining a result at least as extreme as the observed one, if the null hypothesis were true. It is NOT the probability that the null hypothesis is true, and it is NOT the probability the effect is due to chance.",
    "bullets": [
      "p < 0.05 is a convention, not a law of nature — it does not mean \"5% chance of a fluke\" in the way it is commonly (mis)stated",
      "A tiny p-value can come from a trivially small, biologically unimportant effect if sample size is large enough"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Common Pitfalls",
    "title": "p-value Misconceptions to Avoid",
    "items": [
      "\"p = 0.03 means there's a 3% chance H0 is true\" — <b>false</b>; p is calculated assuming H0 is already true",
      "\"p > 0.05 proves there's no effect\" — <b>false</b>; it may just mean the study lacked statistical power",
      "\"A lower p-value means a bigger effect\" — <b>false</b>; p-values conflate effect size with sample size",
      "Multiple comparisons (testing many variables) inflate the chance of a false positive somewhere in the dataset",
      "Modern practice increasingly reports <b>effect sizes and confidence intervals</b> alongside or instead of bare p-values"
    ]
  },
  {
    "type": "compare",

    "title": "Statistical Significance vs. Biological Significance",
    "headers": [

    ],
    "rows": [
      [
        "Asks: is this difference unlikely under H0?",
        "Asks: does this difference matter for the organism/system?"
      ],
      [
        "Sensitive to sample size — large n can make trivial effects \"significant\"",
        "Depends on effect size, not sample size"
      ],
      [
        "A p-value alone cannot tell you effect magnitude",
        "Requires reporting means, effect sizes, confidence intervals"
      ],
      [
        "Can be \"significant\" yet ecologically meaningless",
        "Can be real and important yet statistically undetected with small n"
      ]
    ],
    "footnote": "A well-designed study reports both — and interprets neither in isolation."
  },
  {
    "type": "cards",
    "eyebrow": "The Toolkit",
    "title": "Common Statistical Tools in Ecology",
    "cards": [
      {
        "h": "ANOVA",
        "p": "Compares means across two or more groups (e.g., biomass across fertilizer treatments)"
      },
      {
        "h": "Regression",
        "p": "Models the relationship between a continuous predictor and a response variable"
      },
      {
        "h": "GLM",
        "p": "Generalized Linear Models extend regression to non-normal data (counts, presence/absence, proportions)"
      },
      {
        "h": "Mixed-effects models",
        "p": "Incorporate both fixed effects (treatments) and random effects (site, block, individual) to handle non-independence"
      }
    ]
  },
  {
    "type": "term",
    "eyebrow": "Toolkit Detail",
    "title": "Comparing Group Means",
    "term": "ANOVA (Analysis of Variance)",
    "def": "A statistical test that partitions total variance in a response variable into variance explained by treatment groups versus residual (within-group) variance, testing whether group means differ more than expected by chance.",
    "bullets": [
      "Requires replication within each group — the F-statistic compares between-group to within-group variance",
      "Extensions include two-way ANOVA (multiple factors) and repeated-measures ANOVA (same units measured over time)"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Toolkit Detail",
    "title": "Modeling Continuous Relationships",
    "term": "Regression",
    "def": "A statistical method that models how a response variable changes as a function of one or more continuous (or categorical) predictor variables, typically by fitting a line or curve that minimizes deviation from the data.",
    "bullets": [
      "Simple linear regression: one predictor, straight-line relationship",
      "Multiple regression: several predictors simultaneously — useful, but correlated predictors (collinearity) can obscure interpretation"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Toolkit Detail",
    "title": "Beyond Normal Data",
    "term": "Generalized Linear Model (GLM)",
    "def": "An extension of regression that allows the response variable to follow a non-normal distribution (e.g., Poisson for counts, binomial for proportions) via a link function connecting predictors to the expected response.",
    "bullets": [
      "Essential in ecology because count data (number of individuals, number of offspring) and presence/absence data violate the normality assumptions of standard regression/ANOVA"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Toolkit Detail",
    "title": "Handling Non-Independence",
    "term": "Mixed-Effects Model",
    "def": "A model that includes both fixed effects (the variables of interest, e.g., treatment) and random effects (grouping variables such as site, block, or individual) to properly account for non-independent data structures.",
    "bullets": [
      "Directly addresses many pseudoreplication problems: if you have repeated measures within ponds, \"pond\" can be included as a random effect",
      "Now the standard approach for hierarchical or repeated-measures ecological data"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "A Recurring Trap",
    "title": "Correlation Is Not Causation",
    "items": [
      "Two variables can be statistically associated without one causing the other",
      "Possible explanations for a correlation: (1) A causes B, (2) B causes A, (3) a third variable C causes both, (4) coincidence",

      "Observational correlations are still valuable — they generate the hypotheses that experiments go on to test"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Worked Example",
    "title": "A Classic Correlation Trap",
    "left": {
      "h": "The Observation",
      "body": "Across lake sites, researchers find that lakes with more docks and boat traffic have LOWER fish diversity. A naive conclusion: boat traffic reduces fish diversity, so we should ban docks."
    },
    "right": {
      "h": "The Confound",
      "body": "Docks and boats are concentrated on lakes with heavy human development, which also have more shoreline hardening, nutrient runoff, and habitat loss — any of which could independently reduce fish diversity. The correlation alone cannot separate these causes."
    },
    "footnote": "Only a manipulative or carefully controlled comparative design (matching lakes on confounding variables, or experimentally varying boat traffic) could isolate the true causal driver."

  {
    "type": "section",
    "tag": "Looking Ahead",

  },
  {
    "type": "twocol",

    },
    "right": {
      "h": "Why It's a Methods Classic",
      "body": "It is a textbook manipulative field experiment: a clear hypothesis (competitive exclusion sets the lower limit of Chthamalus), a manipulation (removal vs. unmanipulated control), and replication across the shore. It demonstrated that competition, not just physiology, sets species distributions."

      "Are treatments assigned by <b>randomization</b>, and are treatment/control units properly interspersed?",
      "Are there enough true, <b>independent replicates</b> per treatment — not just repeated measurements of the same unit?",

  },
  {
    "type": "compare",
    "eyebrow": "Putting It Together",

      ],
      [
        "Reports only p-values",
        "Reports effect sizes, confidence intervals, and p-values"
      ],
      [
        "Repeated measures analyzed as independent data",
        "Repeated measures modeled with mixed-effects models"
      ]
    ],
    "footnote": "Hurlbert's 1984 survey found pseudoreplication in a startling proportion of published ecological field experiments — design literacy matters."
  },
  {
    "type": "bullets",
    "eyebrow": "Key Takeaways",
    "title": "What to Remember From Today",
    "items": [
      "The <b>hypothetico-deductive method</b> advances by generating falsifiable predictions and trying to reject the null hypothesis, not by \"proving\" theories true",
      "<b>Observational</b> studies reveal patterns and generate hypotheses; <b>manipulative experiments</b> are needed to establish causation",
      "<b>Field</b> experiments offer realism, <b>lab</b> experiments offer control, and <b>mesocosms</b> occupy a useful middle ground",
      "<b>Controls, randomization, and true replication</b> are the non-negotiable foundations of a trustworthy experiment",
      "<b>Pseudoreplication</b> (Hurlbert 1984) silently inflates confidence when non-independent samples are treated as independent replicates",

    },
    "right": {

// =====================================================================
// RENDER ENGINE
// =====================================================================
function esc(s){ return s; } // bullets allow inline <b> tags intentionally

function renderSlide(s, idx){
  let inner = "";
  switch(s.type){

    case "title":
      inner = `
        <div class="center-stage">
          <span class="tag">${s.eyebrow||""}</span>
          <div class="big-word">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
          <div class="footnote">${s.footnote||""}</div>
        </div>`;
      break;

    case "section":
      inner = `
        <div class="center-stage">
          <span class="tag gold">${s.tag||"Section"}</span>
          <div class="big-word" style="font-size:2.6rem;">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
        </div>`;
      break;

    case "bullets":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content"><ul class="bullets">
          ${s.items.map(i=>`<li>${i}</li>`).join("")}
        </ul></div>`;
      break;

    case "term":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <div class="term-box">
            <span class="term">${s.term}</span>
            <span class="def">${s.def}</span>
          </div>
          ${s.bullets ? `<ul class="bullets sub">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
        </div>`;
      break;

    case "twocol":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="two-col">
          <div class="col-box"><h3>${s.left.h}</h3><p>${s.left.body}</p></div>
          <div class="col-box"><h3>${s.right.h}</h3><p>${s.right.body}</p></div>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "compare":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <table class="compare">
            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>BIOL 3XX · Principles of Ecology</span>
        <span>Lecture 3 · Scientific Method</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>

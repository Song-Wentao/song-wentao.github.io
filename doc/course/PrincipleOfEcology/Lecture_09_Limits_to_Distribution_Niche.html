      "Individuals from population A are moved to site B, and individuals from population B are moved to site A, with local 'home' controls at each site",
      "Tests for local adaptation: if 'home' individuals consistently outperform 'away' individuals, populations have diverged genetically (ecotypic differentiation)",

      "Complements range-edge transplants by testing within-range variation, not just presence/absence at the boundary"

    "type": "term",
    "eyebrow": "Related Concept",
    "title": "Ecotypes and Clinal Variation",

    "def": "A genetically distinct population within a species that is adapted to its local environmental conditions, often forming as a continuous gradient (cline) across an environmental gradient such as latitude or altitude.",
    "bullets": [
      "Explains why the 'same' species can show different fundamental niches in different parts of its range",
      "A caution when interpreting SDMs and climate envelopes built from range-wide occurrence data (next section) — the modeled niche may blur real intraspecific variation"

  {
    "type": "section",
    "tag": "Part 4",
    "title": "Species Distribution Models",
    "sub": "Scaling the niche concept up to predict maps"

  {
    "type": "term",
    "eyebrow": "Definition",
    "title": "Species Distribution Models (SDMs)",
    "term": "Species Distribution Model",
    "def": "A statistical or mechanistic model that relates known occurrence records of a species to environmental variables (climate, soil, land cover) at those locations, in order to predict the probability of occurrence across a broader geographic area — including places never surveyed.",

      "Also called habitat suitability models or (for climate-only versions) climate envelope models",

    "eyebrow": "How They Work",
    "title": "The Correlative Approach",
    "items": [
      "Compile occurrence records (museum specimens, surveys, citizen science) for the focal species",
      "Extract environmental variable values (mean temperature, precipitation, seasonality, soil type) at each occurrence point",
      "Fit a statistical relationship between occurrence and the environmental variables — the model effectively reconstructs an approximation of the realized niche in environmental space",
      "Project that relationship onto a map, or onto future/novel climate data, to predict suitability elsewhere or elsewhen",
      "Common algorithms: generalized linear/additive models, MaxEnt, random forests, and simple climate envelope (bioclimatic) approaches"

  },

// RENDER ENGINE
// =====================================================================
function esc(s){ return s; } // bullets allow inline <b> tags intentionally

function renderSlide(s, idx){
  let inner = "";
  switch(s.type){

    case "title":
      inner = `
        <div class="center-stage">
          <span class="tag">${s.eyebrow||""}</span>
          <div class="big-word">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
          <div class="footnote">${s.footnote||""}</div>
        </div>`;
      break;

    case "section":
      inner = `
        <div class="center-stage">
          <span class="tag gold">${s.tag||"Section"}</span>
          <div class="big-word" style="font-size:2.6rem;">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
        </div>`;
      break;

    case "bullets":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content"><ul class="bullets">
          ${s.items.map(i=>`<li>${i}</li>`).join("")}
        </ul></div>`;
      break;

    case "term":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <div class="term-box">
            <span class="term">${s.term}</span>
            <span class="def">${s.def}</span>
          </div>
          ${s.bullets ? `<ul class="bullets sub">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
        </div>`;
      break;

    case "twocol":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="two-col">
          <div class="col-box"><h3>${s.left.h}</h3><p>${s.left.body}</p></div>
          <div class="col-box"><h3>${s.right.h}</h3><p>${s.right.body}</p></div>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "compare":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <table class="compare">
            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>BIOL 3XX · Principles of Ecology</span>
        <span>Lecture 9 · The Niche</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>

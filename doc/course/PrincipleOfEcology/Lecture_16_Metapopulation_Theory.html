const slides = [
  {
    "type": "title",
    "eyebrow": "BIOL 3XX · Principles of Ecology · Lecture 16",
    "title": "Metapopulation Theory",
    "sub": "Populations of populations: colonization, extinction, and persistence across fragmented landscapes",
    "footnote": "Begon & Townsend, Ecology: From Individuals to Ecosystems, 5th ed., Ch. 6–7"
  },
  {
    "type": "section",
    "tag": "Recap · Lecture 15",
    "title": "Dispersal and Migration",
    "sub": "Why individuals leave, where they go, and what it costs them"
  },
  {
    "type": "bullets",
    "eyebrow": "Recap",
    "title": "Key Ideas from Lecture 15",
    "items": [
      "Dispersal: movement of individuals away from their origin, potentially altering spatial population structure",
      "Costs of dispersal: energetic expenditure, predation risk, mortality in transit, loss of local knowledge",
      "Benefits of dispersal: escape from kin competition, inbreeding avoidance, colonization of new habitat, tracking resources",
      "Dispersal kernels describe the probability distribution of dispersal distances — typically leptokurtic (fat-tailed)",
      "Case studies: wildebeest migration (resource tracking in the Serengeti) and monarch butterfly migration (multi-generational, photoperiod/temperature cued)"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Recap → Today",
    "title": "From Individual Movement to Population Networks",
    "items": [
      "Lecture 15 asked: why and how do individuals move between patches?",
      "Lecture 16 asks: what happens to a set of populations connected by that movement?",
      "Dispersal is the mechanistic link — without it, isolated patches simply blink out one by one",
      "With dispersal, a network of local populations can persist even though no single patch is permanently occupied",
      "This shift in scale — from individual to population of populations — is the foundation of metapopulation theory"
    ]
  },
  {
    "type": "section",
    "tag": "Part 1",
    "title": "The Metapopulation Concept",
    "sub": "A population of populations occupying discrete habitat patches"
  },
  {
    "type": "term",
    "eyebrow": "Core Definition",
    "title": "What Is a Metapopulation?",
    "term": "Metapopulation",
    "def": "A set of local populations, occupying discrete habitat patches, that are linked by the dispersal of individuals — such that local extinctions can be balanced by recolonization from other patches.",
    "bullets": [
      "Coined by Richard Levins (1969, 1970) in the context of pest control on agricultural patches",
      "Requires: (1) discrete, distinguishable habitat patches, (2) local populations subject to extinction, (3) dispersal connecting patches, (4) some asynchrony in local dynamics"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Why Patches Matter",
    "title": "Habitat as a Patchwork, Not a Continuum",
    "items": [
      "Real landscapes are rarely uniform — suitable habitat occurs as discrete, spatially separated patches embedded in a matrix of unsuitable habitat",
      "Each patch can support a local population with its own birth, death, immigration, and emigration rates",
      "Local populations can go extinct due to demographic stochasticity, environmental disturbance, or resource failure",
      "Empty patches can be recolonized by dispersers from occupied patches — the regional population persists even as local ones flicker on and off",
      "The unit of interest shifts from the individual patch to the network of patches as a whole"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Spatial Population Structures",
    "title": "Metapopulation vs. Mainland-Island Model",
    "left": {
      "h": "Classical (Levins) Metapopulation",
      "body": "All patches are similar in size and quality. Every patch is equally likely to go extinct and equally capable of contributing colonists. No single patch dominates dynamics — persistence is a property of the whole network."
    },
    "right": {
      "h": "Mainland-Island Model",
      "body": "One large, low-extinction-risk 'mainland' population continually supplies colonists to smaller, extinction-prone 'island' patches. Persistence of islands depends heavily on proximity to, and output from, the mainland."
    }
  },
  {
    "type": "cards",
    "eyebrow": "Patch Properties",
    "title": "What Defines a Habitat Patch?",
    "cards": [
      {
        "h": "Size",
        "p": "Larger patches support larger local populations with lower extinction risk"
      },
      {
        "h": "Isolation",
        "p": "Distance from other occupied patches determines colonization probability"
      },
      {
        "h": "Quality",
        "p": "Resource availability and microhabitat conditions affect local population growth"
      },
      {
        "h": "Connectivity",
        "p": "Corridors, stepping-stones, or matrix permeability shape realized dispersal"
      }
    ]
  },
  {
    "type": "section",
    "tag": "Part 2",
    "title": "Levins' Original Model",
    "sub": "A simple patch-occupancy formulation of metapopulation dynamics"
  },
  {
    "type": "term",
    "eyebrow": "The Levins Equation",
    "title": "Levins' Metapopulation Model (1969)",
    "term": "dP/dt = cP(1 − P) − eP",
    "def": "Describes the rate of change in the proportion of habitat patches occupied, P, as a balance between colonization of empty patches and extinction of occupied ones.",
    "bullets": [
      "P = proportion of habitat patches currently occupied (0 ≤ P ≤ 1)",
      "c = colonization rate coefficient — per-patch rate at which occupied patches generate successful colonists",
      "e = extinction rate coefficient — per-patch probability of local extinction per unit time",
      "(1 − P) = proportion of patches that are empty and therefore available for colonization",
      "cP(1−P) = colonization term; eP = extinction term"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Reading the Equation",
    "title": "Why the Terms Take This Form",
    "items": [
      "Colonization requires both a source of colonists (occupied patches, proportion P) and an available destination (empty patches, proportion 1−P) — hence the product P(1−P)",
      "This makes colonization a saturating process: it is fastest at intermediate occupancy and zero when all patches are occupied or all are empty",
      "Extinction is modeled as simply proportional to P — each occupied patch has an independent, constant per-time-step risk e of going locally extinct",
      "No explicit space: patches are treated as identical and equally accessible (a 'mean-field' assumption)",
      "Note the structural resemblance to logistic growth — but here P is patch occupancy, not population density"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Two Opposing Processes",
    "title": "Colonization vs. Extinction",
    "left": {
      "h": "Colonization (cP(1−P))",
      "body": "Driven by dispersal from occupied patches. Increases with more occupied source patches, higher per-capita dispersal success, shorter inter-patch distances, and more empty patches available to receive colonists."
    },
    "right": {
      "h": "Extinction (eP)",
      "body": "Driven by local population processes: demographic stochasticity, environmental variability, small patch size, poor patch quality, and catastrophes. Increases with more occupied patches at risk and higher per-patch vulnerability."
    }
  },
  {
    "type": "bullets",
    "eyebrow": "Model Assumptions",
    "title": "Simplifying Assumptions of the Basic Levins Model",
    "items": [
      "Infinite number of patches, all identical in size and quality",
      "No explicit spatial structure — all patches are equally accessible to colonists ('panmictic' patch network)",
      "Within-patch dynamics are ignored — patches are simply 'occupied' or 'empty'",
      "Colonization and extinction rates (c, e) are constant, not density- or distance-dependent",
      "No time lags in colonization or extinction processes"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Solving the Model",
    "title": "Equilibrium Patch Occupancy",
    "term": "P* = 1 − e/c",
    "def": "Setting dP/dt = 0 and solving for P gives the equilibrium proportion of occupied patches, representing a stable balance between colonization and extinction.",
    "bullets": [
      "Derived from cP(1−P) = eP → c(1−P) = e → P = 1 − e/c",
      "P* is a stable equilibrium: if P < P*, colonization exceeds extinction and P rises; if P > P*, extinction dominates and P falls",
      "Persistence of the metapopulation requires c > e (otherwise P* ≤ 0, and the network trends toward regional extinction)"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Interpreting Equilibrium",
    "title": "What Determines P*?",
    "items": [
      "Higher colonization rate (c) relative to extinction rate (e) → higher equilibrium occupancy",
      "As e approaches c, P* approaches zero — the metapopulation is on the brink of regional extinction even though no single event caused it",
      "Crucially, even at equilibrium, patches are constantly blinking on and off — turnover is a defining feature, not a failure of the system",
      "A 'healthy' metapopulation is not one where every patch is occupied, but one where colonization reliably outpaces extinction across the network",
      "This has direct implications for conservation: management should target c and e, not just current occupancy"
    ]
  },
  {
    "type": "compare",
    "eyebrow": "Managing the Balance",
    "title": "Factors Affecting Colonization vs. Extinction Rates",
    "headers": [
      "Factor",
      "Effect on Colonization (c)",
      "Effect on Extinction (e)"
    ],
    "rows": [
      [
        "Patch size",
        "Little direct effect",
        "Larger patches → lower e (larger local populations)"
      ],
      [
        "Inter-patch distance",
        "Shorter distances → higher c",
        "Little direct effect"
      ],
      [
        "Patch quality",
        "Little direct effect",
        "Higher quality → lower e"
      ],
      [
        "Number of occupied neighbors",
        "More neighbors → higher c",
        "Can lower e via rescue effect"
      ],
      [
        "Habitat fragmentation",
        "Reduces c (isolation)",
        "Increases e (smaller, lower-quality patches)"
      ]
    ]
  },
  {
    "type": "section",
    "tag": "Part 3",
    "title": "The Rescue Effect",
    "sub": "When immigration prevents local extinction, not just reverses it"
  },
  {
    "type": "term",
    "eyebrow": "Refining the Model",
    "title": "The Rescue Effect",
    "term": "Rescue Effect",
    "def": "The reduction in a local population's extinction probability caused by continued immigration from other occupied patches — immigrants supplement declining populations before they disappear entirely, not just recolonize empty ones.",
    "bullets": [
      "Proposed by Brown & Kodric-Brown (1977) as an extension to island biogeography and metapopulation theory",
      "Implies extinction rate e should itself depend on P: e effectively decreases as more patches are occupied (more potential rescuers)",
      "Modifies Levins' model to something like dP/dt = cP(1−P) − eP(1−P), coupling both terms to occupancy"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Consequences",
    "title": "Why the Rescue Effect Matters",
    "items": [
      "Without rescue, immigration only matters for empty patches (colonization); with rescue, it also matters for occupied patches",
      "Highly connected patch networks can be more resilient than the basic Levins model predicts, because near-extinct populations get topped up by immigrants",
      "Isolated patches lose this buffer — they experience the 'raw' extinction rate e with no rescue",
      "This is one reason habitat corridors and stepping-stone patches are valued in conservation planning — they don't just enable colonization, they prevent extinction",
      "The rescue effect blurs the sharp local-extinction/recolonization dynamic of the classical model into a more continuous process"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Model Comparison",
    "title": "Classical Levins vs. Rescue-Effect Model",
    "left": {
      "h": "Classical Levins Model",
      "body": "eP — extinction rate is constant per occupied patch, independent of the surrounding patch network. Isolation has no effect on a patch's own extinction risk."
    },
    "right": {
      "h": "Rescue-Effect Model",
      "body": "eP(1−P) — extinction rate declines as regional occupancy rises. Well-connected patches in a highly occupied network are effectively buffered against extinction by immigrant input."
    }
  },
  {
    "type": "section",
    "tag": "Part 4",
    "title": "Patch Quality and Habitat Fragmentation",
    "sub": "Real landscapes are neither infinite nor uniform"
  },
  {
    "type": "bullets",
    "eyebrow": "Beyond the Simple Model",
    "title": "Patch Quality Shapes Local Dynamics",
    "items": [
      "Real patches differ in size, resource availability, microclimate, and successional stage — not just 'occupied' or 'empty'",
      "Larger, higher-quality patches typically support larger local populations, which have lower demographic stochastic extinction risk",
      "Patch quality can change over time (succession, disturbance, management), making some patches transient habitat",
      "Hanski's incidence function models extended Levins' framework to account for patch area and isolation explicitly, predicting occupancy probability per patch rather than a single regional P"
    ]
  },
  {
    "type": "cards",
    "eyebrow": "Fragmentation Consequences",
    "title": "How Habitat Fragmentation Alters Metapopulations",
    "cards": [
      {
        "h": "Reduced Patch Size",
        "p": "Smaller remaining patches support smaller populations, raising local extinction probability"
      },
      {
        "h": "Increased Isolation",
        "p": "Greater distances between patches lower colonization rates and dispersal success"
      },
      {
        "h": "Matrix Hostility",
        "p": "Inhospitable surrounding land use increases dispersal mortality, effectively raising isolation"
      },
      {
        "h": "Reduced Total Habitat",

    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Extinction Thresholds",
    "title": "Fragmentation and Metapopulation Persistence",
    "items": [
      "As fragmentation reduces c and increases e, the equilibrium P* = 1 − e/c declines toward zero",
      "Below a critical threshold of habitat amount/connectivity, c falls below e and the entire metapopulation trends to extinction — even if suitable patches still exist",

  },
  {
    "type": "compare",
    "eyebrow": "Landscape Change",
    "title": "Effects of Habitat Fragmentation on Metapopulation Parameters",
    "headers": [

      "Before Fragmentation",
      "After Fragmentation"
    ],
    "rows": [

        "Patch number",
        "Few, large patches",
        "Many, small patches"
      ],
      [
        "Colonization rate (c)",
        "High (short distances)",
        "Low (long distances, hostile matrix)"

        "Low (large populations)",

// RENDER ENGINE

function esc(s){ return s; } // bullets allow inline <b> tags intentionally

function renderSlide(s, idx){
  let inner = "";
  switch(s.type){

    case "title":
      inner = `
        <div class="center-stage">
          <span class="tag">${s.eyebrow||""}</span>
          <div class="big-word">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
          <div class="footnote">${s.footnote||""}</div>
        </div>`;
      break;

    case "section":
      inner = `
        <div class="center-stage">
          <span class="tag gold">${s.tag||"Section"}</span>
          <div class="big-word" style="font-size:2.6rem;">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
        </div>`;
      break;

    case "bullets":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content"><ul class="bullets">
          ${s.items.map(i=>`<li>${i}</li>`).join("")}
        </ul></div>`;
      break;

    case "term":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <div class="term-box">
            <span class="term">${s.term}</span>
            <span class="def">${s.def}</span>
          </div>
          ${s.bullets ? `<ul class="bullets sub">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
        </div>`;
      break;

    case "twocol":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="two-col">
          <div class="col-box"><h3>${s.left.h}</h3><p>${s.left.body}</p></div>
          <div class="col-box"><h3>${s.right.h}</h3><p>${s.right.body}</p></div>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "compare":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <table class="compare">
            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>BIOL 3XX · Principles of Ecology</span>
        <span>Lecture 16 · Metapopulation Theory</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>

  },
  {
    "type": "bullets",
    "eyebrow": "Why Food Webs Matter",
    "title": "Beyond Single Interactions",
    "items": [
      "Most species interact, directly or indirectly, with dozens of others through feeding links",

    ]
  },
  {
    "type": "term",
    "eyebrow": "Core Definition",
    "title": "What Is a Food Web?",
    "term": "Food web",
    "def": "A graphical or matrix representation of the feeding relationships among the species (or trophic species) in a community — a set of nodes connected by directed links representing 'eats' or 'is eaten by' relationships.",
    "bullets": [
      "Nodes = species, or groups of species that share the same predators and prey ('trophic species')",
      "Links = feeding interactions, drawn from prey to predator (direction of energy/matter flow)",

  {

    },
    "right": {
      "h": "Food web",
      "body": "The full set of interlocking food chains in a community. Owls also eat mice and small birds; grasshoppers are eaten by spiders and birds as well as shrews. The web captures multiple pathways, alternative routes for energy flow, and indirect effects."

      "Solution — trophic species (trophospecies): lump taxa that share an identical set of predators and prey into a single node",

      "S(S-1) is the maximum possible number of directed links among S species (excluding self-links/cannibalism, which are sometimes included separately)",

      "Captures how 'busy' the average node is, independent of web size",

        "h": "Link density (LD)",

      },

        "h": "Vulnerability",

      },
      {
        "h": "Omnivory index",

    "term": "Weak interaction stability (McCann 1998, 2000)",

    "bullets": [
      "McCann, Hastings & Huxel (1998, Nature) showed in model omnivory modules that adding weak links stabilizes otherwise oscillatory strong-interaction cores",
      "Mechanism: weak-interacting consumers switch between resources, buffering any single prey population from overexploitation",
      "Reversed decades of intuition from May (1972) that more/stronger connections should destabilize communities"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Contrasting Effects",
    "title": "Why Weak Links Stabilize, Strong Links Destabilize",
    "left": {
      "h": "Strong interactions alone",

    },
    "right": {
      "h": "Weak interactions mixed in",
      "body": "Generalist consumers with many weak links can switch to alternative prey when one resource declines, damping oscillations. A food web dominated by many weak links and few strong ones behaves more like a well-buffered system than a chain of tightly coupled dominoes."
    },
    "footnote": "McCann's insight reframed 'complexity' — it is not just link number that matters, but the distribution of link strengths."
  },
  {
    "type": "section",
    "tag": "The Great Debate",
    "title": "The Complexity-Stability Paradox",
    "sub": "Why doesn't nature's complexity collapse under May's mathematics?"

    "eyebrow": "May's Result",
    "title": "What May (1972) Actually Showed",
    "items": [
      "Using random matrix theory, May modeled communities as randomly wired interaction matrices",
      "He derived a stability criterion: a randomly assembled web becomes almost certainly unstable once complexity — measured as species richness (S), connectance (C), and average interaction strength — exceeds a threshold, roughly when interaction-strength x sqrt(S x C) > 1",
      "This directly contradicted the earlier ecological orthodoxy (Elton, MacArthur) that more diverse, more connected communities should be more stable",

    ]

      "Compartmentalization: modularity confines destabilizing perturbations to a subset of the web rather than letting them propagate through the whole system (Pimm 1979)",
      "Nestedness and patterned connectance: food webs are not randomly wired — predators tend to feed on similar, predictable subsets of prey, reducing effective complexity",
      "Adaptive behavior: foraging switching and prey-refuge use act as real-time stabilizing feedbacks not captured in static random matrices",

    ]

  {

    "bullets": [
      "Distinguished from 'primary' extinction, the initial removal (e.g., by habitat loss, harvesting, climate change)",
      "Cascades can be short (one secondary loss) or propagate through several further rounds of extinction",
      "Simulation studies remove species from empirical web matrices and track how many further species lose all resource links"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Cascading Loss",
    "title": "Robustness",
    "term": "Robustness (of a food web)",

    "bullets": [
      "Dunne, Williams & Martinez (2002) pioneered systematic robustness analyses across many empirical webs",

    "title": "What Robustness Analyses Teach Us",
    "items": [

    ]

// =====================================================================
// RENDER ENGINE
// =====================================================================
function esc(s){ return s; } // bullets allow inline <b> tags intentionally

function renderSlide(s, idx){
  let inner = "";
  switch(s.type){

    case "title":
      inner = `
        <div class="center-stage">
          <span class="tag">${s.eyebrow||""}</span>
          <div class="big-word">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
          <div class="footnote">${s.footnote||""}</div>
        </div>`;
      break;

    case "section":
      inner = `
        <div class="center-stage">
          <span class="tag gold">${s.tag||"Section"}</span>
          <div class="big-word" style="font-size:2.6rem;">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
        </div>`;
      break;

    case "bullets":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content"><ul class="bullets">
          ${s.items.map(i=>`<li>${i}</li>`).join("")}
        </ul></div>`;
      break;

    case "term":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <div class="term-box">
            <span class="term">${s.term}</span>
            <span class="def">${s.def}</span>
          </div>
          ${s.bullets ? `<ul class="bullets sub">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
        </div>`;
      break;

    case "twocol":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="two-col">
          <div class="col-box"><h3>${s.left.h}</h3><p>${s.left.body}</p></div>
          <div class="col-box"><h3>${s.right.h}</h3><p>${s.right.body}</p></div>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "compare":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <table class="compare">
            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Principles of Ecology · BIOL 3XX</span>
        <span>Lecture 33 — Food Webs</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>

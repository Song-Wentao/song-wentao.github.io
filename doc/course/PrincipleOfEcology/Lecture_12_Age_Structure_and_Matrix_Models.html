    "items": [
      "The <b>intrinsic rate of increase, r</b>, and the finite rate <b>λ = e^r</b> summarize a population's per-capita growth under exponential dynamics: N_t = N_0·e^(rt)",
      "The <b>Euler-Lotka equation</b>, Σ e^(-rx) l_x m_x = 1, links r to the age-specific survivorship (l_x) and fecundity (m_x) schedule of a life table",
      "Our seedling cohort example gave <b>R0 = 1.48</b>, generation time <b>T ≈ 2.51 yr</b>, and solving Euler-Lotka gave <b>r ≈ 0.156/yr</b>, so <b>λ ≈ 1.169</b>"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Recap",
    "title": "The Gap in the Lecture 11 Model",
    "items": [
      "Euler-Lotka gives a single number, r, that describes <b>long-run</b> growth once the population has settled into a fixed age composition",
      "It does not tell us the <b>age composition itself</b>, nor how that composition changes year to year",
      "It also cannot easily project a real, structured population (e.g., 100 newborns, 30 yearlings, 20 adults) forward <b>step by step</b>",
      "Today: a bookkeeping tool — the <b>Leslie matrix</b> — that does both: tracks age structure through time AND recovers the same λ as a long-run outcome"
    ]
  },
  {
    "type": "quote",
    "eyebrow": "Setting the stage",
    "quote": "A life table describes a cohort born at the same instant. Most real populations are age-structured mixtures of many cohorts, all reproducing and dying at once.",
    "attrib": "Adapted from Begon & Townsend, Ch. 4"
  },
  {
    "type": "section",
    "tag": "Part 1",
    "title": "Age-Structured Populations",
    "sub": "Why age composition matters for population dynamics"
  },
  {
    "type": "bullets",
    "eyebrow": "Age structure",
    "title": "Why Not Just Use r?",
    "items": [
      "Two populations can have the <b>same total N</b> but very different fates if their age structures differ",
      "A population skewed toward <b>young, pre-reproductive</b> individuals will grow even if r is currently near zero (built-in 'population momentum')",
      "A population skewed toward <b>old, post-reproductive</b> individuals may decline even with favorable current conditions",
      "Vital rates (survival, fecundity) are almost always <b>age-dependent</b> — a newborn and a 10-year-old adult do not contribute equally to future growth"
    ]
  },
  {
    "type": "term",
    "eyebrow": "Key definition",
    "title": "Age Structure",
    "term": "Age structure",
    "def": "The distribution of individuals in a population among discrete age classes at a given point in time, typically represented as a population vector n = (n_0, n_1, n_2, ..., n_k).",
    "bullets": [
      "Each n_i is the number of individuals currently in age class i",
      "Age classes are usually defined by a convenient census interval (e.g., 1 year)",
      "The vector n changes shape as well as size as the population is projected forward"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Age structure",
    "title": "Two Populations, Same N, Different Futures",
    "left": {
      "h": "Population A (young-skewed)",
      "body": "n = (70, 20, 10)<br>Most individuals are pre-reproductive juveniles. Even if births per adult are modest, the large cohort entering reproductive age soon drives growth."
    },
    "right": {
      "h": "Population B (old-skewed)",
      "body": "n = (10, 20, 70)<br>Most individuals are past peak fecundity. Total N is identical to Population A, but near-term growth prospects are very different."
    },
    "footnote": "Total N alone is a poor predictor of near-term dynamics — structure matters"
  },
  {
    "type": "section",
    "tag": "Part 2",
    "title": "The Leslie Matrix",
    "sub": "A bookkeeping device for age-structured growth (Leslie 1945)"
  },
  {
    "type": "term",
    "eyebrow": "Key definition",
    "title": "The Leslie Matrix",
    "term": "Leslie matrix (L)",
    "def": "A square projection matrix that maps an age-structured population vector at time t to the population vector at time t+1: n(t+1) = L · n(t). Named for P. H. Leslie (1945).",
    "bullets": [
      "Rows and columns correspond to age classes, in order",
      "Age-specific fecundities occupy the <b>top row</b>",
      "Age-specific survival probabilities occupy the <b>subdiagonal</b>",
      "All other entries are zero (in the basic model)"
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Leslie matrix structure",
    "title": "Reading the Matrix, Row by Row",
    "items": [
      "<b>Top row (F_i):</b> the number of offspring (surviving to the next census) produced, on average, per individual currently in age class i",
      "<b>Subdiagonal (P_i):</b> the probability that an individual in age class i survives to enter age class i+1",
      "<b>Everything else = 0:</b> individuals cannot skip age classes, and (in the basic model) cannot become younger",
      "The last age class typically has no subdiagonal entry below it — either it does not survive further, or a self-loop is added if individuals can remain in that class"
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Leslie matrix structure",
    "title": "A 3-Age-Class Leslie Matrix, Symbolically",
    "left": {
      "h": "General form",
      "body": "L = <br>[ F0  F1  F2 ]<br>[ P0  0   0  ]<br>[ 0   P1  0  ]<br><br>Row 0 = fecundities<br>Subdiagonal = survivals"
    },
    "right": {
      "h": "Population vector",
      "body": "n(t) = (n0, n1, n2)<sup>T</sup><br><br>n0 = newborns/juveniles<br>n1 = yearlings<br>n2 = adults (2+ yr)"

    "type": "section",
    "tag": "Part 3",
    "title": "Projecting a Population Forward",
    "sub": "Matrix multiplication as a population projector"
  },
  {
    "type": "term",
    "eyebrow": "Key definition",
    "title": "Population Projection",
    "term": "Population projection",
    "def": "Repeated multiplication of the current population vector by the Leslie matrix, n(t+1) = L·n(t), to forecast future age structure and total population size.",

      "Each multiplication advances the population by one census interval (e.g., one year)",
      "Iterating gives n(t), n(t+1), n(t+2), ... — a full trajectory, not just a single growth rate",
      "This is the matrix analogue of N_t = N_0·e^(rt) from Lecture 11, but it tracks structure, not just total N"
    ]

    "type": "bullets",
    "eyebrow": "Mechanics",
    "title": "How the Multiplication Works",

      "Formally: n(t+1) = L n(t) is standard matrix–vector multiplication, row by row",

function esc(s){ return s; } // bullets allow inline <b> tags intentionally

function renderSlide(s, idx){
  let inner = "";
  switch(s.type){

    case "title":
      inner = `
        <div class="center-stage">
          <span class="tag">${s.eyebrow||""}</span>
          <div class="big-word">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
          <div class="footnote">${s.footnote||""}</div>
        </div>`;
      break;

    case "section":
      inner = `
        <div class="center-stage">
          <span class="tag gold">${s.tag||"Section"}</span>
          <div class="big-word" style="font-size:2.6rem;">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
        </div>`;
      break;

    case "bullets":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content"><ul class="bullets">
          ${s.items.map(i=>`<li>${i}</li>`).join("")}
        </ul></div>`;
      break;

    case "term":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <div class="term-box">
            <span class="term">${s.term}</span>
            <span class="def">${s.def}</span>
          </div>
          ${s.bullets ? `<ul class="bullets sub">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
        </div>`;
      break;

    case "twocol":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="two-col">
          <div class="col-box"><h3>${s.left.h}</h3><p>${s.left.body}</p></div>
          <div class="col-box"><h3>${s.right.h}</h3><p>${s.right.body}</p></div>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "compare":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <table class="compare">
            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>BIOL 3XX · Principles of Ecology</span>
        <span>Lecture 12 · Age Structure & Matrix Models</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>

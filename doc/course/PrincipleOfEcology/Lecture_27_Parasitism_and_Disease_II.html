    "type": "bullets",
    "eyebrow": "Today's bridge",

    "items": [

      "Disease dynamics depend on how infection spreads between hosts — this is fundamentally a <b>population ecology</b> problem, not just a physiological one.",

      "Key question for today: <b>under what conditions does a disease invade and persist in a host population, versus fade out?</b>",
      "This question matters enormously for public health, wildlife conservation, and agriculture — from measles to chytrid fungus to foot-and-mouth disease."
    ]
  },
  {
    "type": "section",
    "tag": "Part I",
    "title": "The SIR Model",
    "sub": "A compartmental framework for epidemic dynamics"
  },
  {
    "type": "bullets",
    "eyebrow": "Framework",
    "title": "Compartmental disease models",
    "items": [
      "Epidemiologists divide a host population into <b>compartments</b> based on disease status, then track the flow of individuals between them.",
      "The simplest and most widely used framework is the <b>SIR model</b>, developed by Kermack and McKendrick (1927).",
      "SIR stands for <b>Susceptible</b>, <b>Infected</b>, and <b>Recovered</b> — the three classes an individual can occupy.",
      "Individuals move through compartments in one direction: S → I → R, driven by transmission and recovery.",
      "This simple structure captures the essential dynamics of many acute, immunizing microparasite infections (measles, influenza, myxomatosis)."
    ]
  },
  {
    "type": "term",
    "eyebrow": "Key definitions",
    "title": "The three SIR compartments",
    "term": "S, I, R",
    "def": "The three mutually exclusive classes of hosts in the simplest epidemic model.",
    "bullets": [
      "<b>S (Susceptible)</b> — hosts who can become infected if exposed to the parasite.",
      "<b>I (Infected/Infectious)</b> — hosts currently infected and capable of transmitting the parasite to susceptibles.",
      "<b>R (Recovered/Removed)</b> — hosts who have recovered with immunity (or died), and no longer participate in transmission.",
      "Total population size N = S + I + R (assumed constant over the timescale of the epidemic in the simplest version)."
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "Assumptions",
    "title": "Simplifying assumptions of the basic SIR model",
    "items": [
      "The population is large and <b>well-mixed</b> — every susceptible has an equal chance of contacting every infected individual.",
      "Population size is <b>constant</b> over the epidemic timescale (births/deaths from other causes are ignored, or exactly balance).",
      "Recovery confers <b>permanent immunity</b> — recovered individuals cannot be reinfected.",
      "The disease has no incubation (latent) period — infected individuals are immediately infectious (this can be relaxed with an added 'Exposed' class → SEIR model).",
      "All individuals within a compartment are epidemiologically identical — no age, behavior, or spatial structure.",
      "These are strong simplifications, but they yield a tractable model that captures the core threshold behavior of real epidemics."
    ]
  },

    "type": "term",
    "eyebrow": "Notation",
    "title": "The transmission and recovery parameters",
    "term": "β and γ",
    "def": "The two rate parameters that govern SIR dynamics.",
    "bullets": [
      "<b>β (beta)</b> — the transmission coefficient: the rate at which contact between an S and an I individual results in a new infection.",
      "<b>γ (gamma)</b> — the recovery rate: the rate at which infected individuals recover (and move to R). Its reciprocal, 1/γ, is the average infectious period.",
      "Both are compound parameters — β reflects contact rate × probability of transmission per contact; γ reflects the biology of host immune clearance or parasite life cycle.",
      "These two parameters alone determine whether an epidemic takes off, how fast it spreads, and how large it grows."
    ]
  },
  {
    "type": "bullets",
    "eyebrow": "The equations",
    "title": "The SIR differential equations",
    "items": [
      "The rate of change in each compartment is described by a set of coupled differential equations:",
      "<b>dS/dt = −βSI</b> — susceptibles are lost at a rate proportional to contacts between S and I.",
      "<b>dI/dt = βSI − γI</b> — infecteds are gained from new infections and lost via recovery.",
      "<b>dR/dt = γI</b> — recovereds accumulate as infecteds recover.",
      "Notice the symmetry: the term βSI appears as a <b>loss</b> from S and a <b>gain</b> to I — it represents the flow of new infections.",
      "Because dS/dt + dI/dt + dR/dt = 0, total population size N stays constant, as assumed."
    ]
  },
  {
    "type": "twocol",
    "eyebrow": "Interpreting the equations",
    "title": "Reading the SIR equations biologically",
    "left": {
      "h": "dS/dt = −βSI",
      "body": "Susceptibles decline fastest when both S and I are large — i.e., early-to-mid epidemic, when there are still many susceptibles left to infect and many infected hosts doing the infecting. As S depletes, this term shrinks even if I stays high."
    },
    "right": {
      "h": "dI/dt = βSI − γI",
      "body": "Infecteds increase only when new infections (βSI) exceed recoveries (γI). This balance point is the key to the whole model: it determines whether the epidemic grows or shrinks at any given time, and it is where R₀ comes from."
    }
  },
  {
    "type": "bullets",
    "eyebrow": "Epidemic trajectory",
    "title": "What the SIR model predicts over time",

      "The epidemic ends not because the parasite runs out of susceptibles entirely, but because susceptible <b>density</b> drops below a critical threshold — the same logic underlying herd immunity, discussed shortly.",

    ]
  },
  {
    "type": "section",
    "tag": "Part II",
    "title": "The Basic Reproduction Number, R₀",
    "sub": "The single most important number in epidemiology"

  {
    "type": "term",
    "eyebrow": "Central concept",
    "title": "Basic reproduction number",
    "term": "R₀",
    "def": "The average number of new (secondary) infections produced by a single infected individual introduced into an entirely susceptible population.",

      "R₀ is dimensionless — it is a pure number, not a rate.",

  },

    "type": "bullets",
    "eyebrow": "Deriving R₀",

    "items": [

      "At the start of an epidemic, essentially the whole population is susceptible, so S ≈ N.",

      "In many textbook treatments this is simplified to <b>R₀ = β/γ</b> when population size is normalized to 1, or written generally as <b>R₀ = (transmission rate) × (duration of infectiousness)</b>.",

    ]
  },

    "type": "bullets",
    "eyebrow": "Threshold theorem",
    "title": "The R₀ threshold theorem",
    "items": [

      "Diseases with <b>higher R₀ require higher vaccination coverage</b> to achieve herd immunity.",

      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Principles of Ecology · BIOL 3XX</span>
        <span>Lecture 27 — Parasitism and Disease II</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>
</body>

  {
    "type": "term",
    "eyebrow": "Revisiting a core metric",
    "title": "Connectance in depth",
    "term": "Connectance (C)",
    "def": "The proportion of all possible links that are actually realized in a network: C = L / S² for a unipartite network of S species and L links (or L / (S₁S₂) for a bipartite network with S₁ and S₂ species per side).",
    "bullets": [
      "Ranges from 0 (no links) to 1 (fully connected, every possible interaction realized)",

    "type": "bullets",
    "eyebrow": "A scaling law",
    "title": "How connectance scales with network size",
    "items": [
      "Empirically, connectance tends to <b>decline</b> as species richness (S) increases across real food webs and mutualistic networks",
      "Early food-web literature proposed the <b>“constant connectance” hypothesis</b>: C stays roughly constant (~0.1) regardless of S, implying L scales as S²",
      "An earlier, competing idea was the <b>“link-species scaling law”</b>: the average number of links per species (L/S) is roughly constant, implying L scales linearly with S, so C = L/S² declines as ~1/S",
      "Better-resolved modern datasets tend to support declining connectance with richness, though the exact scaling relationship remains debated and may depend on network type and sampling effort",

    "eyebrow": "What values look like in nature",

      "Highly resolved, intensively sampled food webs (e.g., some marine and stream systems) can push connectance higher simply because more real, weak links are detected — connectance is partly a <b>sampling-effort artifact</b>",
      "Plant-pollinator and plant-frugivore mutualistic networks are frequently sparser in relative terms once matrix size is large, but can show locally dense modules within them",

  },
  {
    "type": "term",
    "eyebrow": "Beyond the single summary number",
    "title": "Degree distribution",
    "term": "Degree distribution",
    "def": "The frequency distribution of the number of links (the “degree,” k) per node across all species in the network — i.e., how many species have 1 link, how many have 2, how many have 20, and so on.",
    "bullets": [
      "Connectance tells you the average density of links; degree distribution tells you how that density is <b>partitioned among species</b>",

      "body": "Links assigned independently and with equal probability among all possible species pairs. Degree distribution would follow a <b>Poisson (binomial)</b> shape — most species cluster tightly around the mean degree, with a thin, rapidly-decaying tail. No species would be dramatically more connected than typical."
    },
    "right": {
      "h": "What real ecological networks show",
      "body": "Degree distributions are consistently <b>skewed / heavy-tailed</b> (often approximated by power-law or exponential forms). The vast majority of species have <b>few</b> interaction partners, while a small minority — “hub” or generalist species — have disproportionately <b>many</b>."

  },
  {
    "type": "bullets",
    "eyebrow": "The hub phenomenon",
    "title": "Hub species and skewed degree",
    "items": [
      "A <b>hub</b> (or highly generalized) species interacts with a large fraction of the other guild — e.g., a common, morphologically unspecialized flower visited by dozens of pollinator species, or a generalist predator eating from many prey species",
      "Skewed degree distributions are a hallmark of many real-world complex networks beyond ecology — the internet, social networks, protein interaction networks — suggesting shared generative processes (e.g., preferential attachment, abundance effects)",

  },
  {
    "type": "cards",
    "eyebrow": "Why hubs arise",
    "title": "Proposed mechanisms generating degree skew",
    "cards": [
      {
        "h": "Neutral / abundance-driven",
        "p": "Species that are locally abundant simply have more chance encounters with potential partners, generating more recorded links independent of any special traits."
      },
      {
        "h": "Trait-matching breadth",
        "p": "Some species have generalized traits (unspecialized flower morphology, broad diet, wide phenological window) that make them compatible with many partner species."
      },
      {
        "h": "Sampling / detection bias",
        "p": "Common species are more likely to be observed interacting at all — rare links involving rare species are easy to miss, artificially inflating apparent skew."
      },
      {
        "h": "Evolutionary history",
        "p": "Some lineages evolve toward generalization as a strategy, especially where reliable specialist partners are unpredictable in space or time."
      }
    ]
  },

    "type": "pyramid",

  {
    "type": "section",
    "tag": "PART 2",
    "title": "Nestedness",

  {
    "type": "term",
    "eyebrow": "A defining architecture of mutualistic networks",
    "title": "Nestedness",
    "term": "Nestedness",
    "def": "A structural pattern in which the set of interaction partners of specialist species is a nested subset of the partners of more generalist species — specialists tend to interact with a subset of the same, typically common, partners that generalists also use, rather than with idiosyncratic partners of their own.",
    "bullets": [
      "Picture a bipartite interaction matrix with rows and columns sorted from most- to least-connected: a perfectly nested matrix forms a triangular “staircase” of filled cells in the upper-left, with empty cells filling out the lower-right",

      "In a maximally nested network, the partner list of any given species is a subset of the partner list of every more-generalized species",
      "Generalist species interact with both other generalists AND specialists; specialist species interact almost exclusively with generalists, rarely with other specialists",
      "This creates a <b>core</b> of generalist-generalist interactions plus a periphery of specialist-generalist interactions, and very few specialist-specialist interactions"

function esc(s){ return s; } // bullets allow inline <b> tags intentionally

function renderSlide(s, idx){
  let inner = "";
  switch(s.type){

    case "title":
      inner = `
        <div class="center-stage">
          <span class="tag">${s.eyebrow||""}</span>
          <div class="big-word">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
          <div class="footnote">${s.footnote||""}</div>
        </div>`;
      break;

    case "section":
      inner = `
        <div class="center-stage">
          <span class="tag gold">${s.tag||"Section"}</span>
          <div class="big-word" style="font-size:2.6rem;">${s.title}</div>
          <h2 class="slide-sub">${s.sub||""}</h2>
        </div>`;
      break;

    case "bullets":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content"><ul class="bullets">
          ${s.items.map(i=>`<li>${i}</li>`).join("")}
        </ul></div>`;
      break;

    case "term":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <div class="term-box">
            <span class="term">${s.term}</span>
            <span class="def">${s.def}</span>
          </div>
          ${s.bullets ? `<ul class="bullets sub">${s.bullets.map(b=>`<li>${b}</li>`).join("")}</ul>` : ""}
        </div>`;
      break;

    case "twocol":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="two-col">
          <div class="col-box"><h3>${s.left.h}</h3><p>${s.left.body}</p></div>
          <div class="col-box"><h3>${s.right.h}</h3><p>${s.right.body}</p></div>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "compare":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="content">
          <table class="compare">
            <tr>${s.headers.map(h=>`<th>${h}</th>`).join("")}</tr>
            ${s.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}
          </table>
        </div>
        ${s.footnote?`<div class="footnote">${s.footnote}</div>`:""}`;
      break;

    case "quote":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <div class="quote-box">
          <p>"${s.quote}"</p>
          <div class="attrib">${s.attrib||""}</div>
        </div>`;
      break;

    case "cards":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="grid-cards">
          ${s.cards.map(c=>`<div class="card"><h4>${c.h}</h4><p>${c.p}</p></div>`).join("")}
        </div>`;
      break;

    case "timeline":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="timeline">
          ${s.items.map(it=>`<div class="tl-item"><div class="tl-year">${it.y}</div><div class="tl-text">${it.t}</div></div>`).join("")}
        </div>`;
      break;

    case "pyramid":
      inner = `
        <div class="eyebrow">${s.eyebrow||""}</div>
        <h1 class="slide-title">${s.title}</h1>
        <div class="pyramid-wrap">
          <div class="pyramid">
            ${s.levels.map(l=>`<div class="pyr-level" style="width:${l.width}; background:${l.color};">${l.label}</div>`).join("")}
          </div>
        </div>
        ${s.footnote?`<div class="footnote" style="text-align:center;">${s.footnote}</div>`:""}`;
      break;

    default:
      inner = `<h1 class="slide-title">${s.title||"Untitled"}</h1>`;
  }

  return `<div class="slide" data-idx="${idx}">
      ${inner}
      <footer class="slide-foot">
        <span>Community Ecology · BIOL 4XX</span>
        <span>Lecture 25</span>
      </footer>
    </div>`;
}

const deck = document.getElementById("deck");
deck.innerHTML = slides.map(renderSlide).join("");
const slideEls = Array.from(document.querySelectorAll(".slide"));
let current = 0;

function show(i){
  if(i<0) i=0;
  if(i>=slideEls.length) i=slideEls.length-1;
  slideEls[current].classList.remove("active");
  current = i;
  slideEls[current].classList.add("active");
  document.getElementById("counter").textContent = (current+1)+" / "+slideEls.length;
  document.getElementById("progress-bar").style.width = ((current+1)/slideEls.length*100)+"%";
}
show(0);

document.addEventListener("keydown", (e)=>{
  if(["ArrowRight","ArrowDown","PageDown"," "].includes(e.key)){ show(current+1); e.preventDefault(); }
  if(["ArrowLeft","ArrowUp","PageUp"].includes(e.key)){ show(current-1); e.preventDefault(); }
  if(e.key==="Home"){ show(0); }
  if(e.key==="End"){ show(slideEls.length-1); }
});
document.getElementById("navzone-left").addEventListener("click", ()=>show(current-1));
document.getElementById("navzone-right").addEventListener("click", ()=>show(current+1));
</script>
